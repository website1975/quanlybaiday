      "text": "Trong thí nghiệm xác định nhiệt nóng chảy riêng của nước đá (Hình 4.4 SGK Cánh diều), sơ đồ thí nghiệm gồm biến áp nguồn, oát kế, nhiệt lượng kế, cốc hứng nước đặt trên cân điện tử và được tiến hành theo các bước sau:\nBước 1: Cho nước đá vào nhiệt lượng kế và hứng nước chảy ra bằng một chiếc cốc. Khi nước từ nhiệt lượng kế chảy ra đều, cho nước chảy vào cốc (ở trên cân) trong thời gian $t$ phút, xác định khối lượng $m$ của nước trong cốc.\nBước 2: Bật biến áp nguồn. Đọc số chỉ $\\mathcal{P}$ của oát kế. Cho nước chảy thêm vào cốc trong thời gian $t$ phút. Xác định khối lượng $M$ của nước trong cốc lúc này. Biết Khối lượng của nước trong cốc (chưa bật biến áp nguồn) $m = 2,0.10^{-3}\\text{ kg}$; Khối lượng $M$ của nước trong cốc (đã bật biến áp nguồn) $M = 17,5.10^{-3}\\text{ kg}$; Thời gian đun $t = 180\\text{ s}$; Công suất $\\mathcal{P} = 24\\text{ W}$.",
      "subQuestions": [
        {
          "id": "4d4fbe3d-3c2e-424d-bba9-d1e355b49cc6",
          "text": "Nhiệt kế là thiết bị dùng để đo trực tiếp công suất của dòng điện trong thí nghiệm này.",
          "level": "VD",
          "correctAnswer": "False"
        },
        {
          "id": "168c910f-65f3-4afc-a27e-03720ad21420",
          "text": "Công thức tính nhiệt lượng để một vật rắn có khối lượng $m$ nóng chảy hoàn toàn ở nhiệt độ nóng chảy là $Q=m\\lambda$ với $\\lambda$ là nhiệt nóng chảy riêng của vật đó.",
          "level": "VD",

          "id": "739cd9e6-ed61-4797-80c2-6bf8249f8c84",

          "id": "041fd727-7d2e-4ec4-a105-990eb96650da",
          "text": "Khi thực hiện thí nghiệm đo nhiệt nóng chảy riêng theo các bước trên, số chỉ Oát kế là $24\\text{ W}$, thời gian đo ở mỗi bước là $180\\text{ giây}$, khối lượng cân được ở bước 1 là $2\\text{ gam}$, khối lượng cân được ở bước 2 là $17{,}5\\text{ gam}$ thì nhiệt nóng chảy riêng của nước đá đo được là $3{,}2.10^{2}\\text{ J/kg}$.",
          "level": "VD",
          "correctAnswer": "False"

      ],
      "solution": "a) Sai: Oát kế mới là thiết bị đo công suất của dòng điện. \nb) Đúng: Công thức nhiệt lượng nóng chảy hoàn toàn là $Q = m\\lambda$. \nc) Đúng: Sau bước 1 trong cốc đã có sẵn khối lượng nước $m$; ở bước 2 cốc hứng thêm một lượng nước do môi trường làm tan ($m$) và một lượng do dây nung làm tan ($\\Delta m$), nên tổng khối lượng nước trong cốc sau bước 2 là $M = m + m + \\Delta m \\Rightarrow \\Delta m = M - 2m$. \nd) Sai: Khối lượng nước đá nóng chảy do dây nung là $\\Delta m = (17{,}5 - 2 \\cdot 2{,}0) \\cdot 10^{-3} = 13{,}5 \\cdot 10^{-3}\\text{ kg}$. Nhiệt nóng chảy riêng $\\lambda = \\frac{\\mathcal{P} \\cdot t}{\\Delta m} = \\frac{24 \\cdot 180}{13{,}5 \\cdot 10^{-3}} = 3{,}2 \\cdot 10^5\\text{ J/kg}$ (không phải $3{,}2 \\cdot 10^2\\text{ J/kg}$).",

      "index": 23,
      "type": "short",
      "level": "VD",
      "text": "Giả thiết rằng trong một tia sét có một điện tích $q=25\\text{ C}$ được phóng từ đám mây dông xuống đất và khi đó hiệu điện thế giữa đám mây và mặt đất $U=1{,}4.10^{8}\\text{ V}$. Cho nhiệt hóa hơi riêng của nước bằng $2{,}3.10^{6}\\text{ J/kg}$. Hỏi năng lượng của tia sét đó có thể làm bao nhiêu kilôgam nước ở $100^{\\circ}\\text{C}$ biến thành hơi nước ở $100^{\\circ}\\text{C}$ (làm tròn kết quả đến chữ số hàng đơn vị)?",

      "text": "Một lượng chất rắn xác định đang ở nhiệt độ nóng chảy $20^{\\circ}\\text{C}$. Nếu ta cấp cho nó một nhiệt lượng $Q$ thì $\\frac{3}{4}$ khối lượng chất ở thể rắn bị nóng chảy. Nếu ta tiếp tục cung cấp một nhiệt lượng $Q$ nữa thì toàn bộ chất rắn chuyển thành lỏng ở $50^{\\circ}\\text{C}$. Xác định tỉ số giữa nhiệt nóng chảy riêng ($\\text{J/g}$) và nhiệt dung riêng của chất ở dạng lỏng ($\\text{J/g.}^{\\circ}\\text{C}$).",
      "correctAnswer": "60",

erName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Cho $20\\text{ g}$ một chất ở thể rắn có nhiệt độ $70^{\\circ}\\text{C}$ vào $100\\text{ g}$ một chất ở thể lỏng ở $20^{\\circ}\\text{C}$. Cân bằng nhiệt đạt được ở $30^{\\circ}\\text{C}$ (không có sự chuyển thể). Nhiệt dung riêng của chất rắn này","rawText":"Cho $20\\text{ g}$ một chất ở thể rắn có nhiệt độ $70^{\\circ}\\text{C}$ vào $100\\text{ g}$ một chất ở thể lỏng ở $20^{\\circ}\\text{C}$. Cân bằng nhiệt đạt được ở $30^{\\circ}\\text{C}$ (không có sự chuyển thể). Nhiệt dung riêng của chất rắn này","ownImageUrl":"","optionsHtml":["bằng nhiệt dung riêng của chất lỏng đã cho","nhỏ hơn nhiệt dung riêng của chất lỏng đã cho","lớn hơn nhiệt dung riêng của chất lỏng đã cho","có thể lớn hơn hoặc bằng nhiệt dung riêng của chất lỏng đã cho tuỳ thuộc vào chất liệu"],"optionsRaw":["bằng nhiệt dung riêng của chất lỏng đã cho","nhỏ hơn nhiệt dung riêng của chất lỏng đã cho","lớn hơn nhiệt dung riêng của chất lỏng đã cho","có thể lớn hơn hoặc bằng nhiệt dung riêng của chất lỏng đã cho tuỳ thuộc vào chất liệu"],"correctIndex":2,"correctAnswer":"lớn hơn nhiệt dung riêng của chất lỏng đã cho","subQuestions":[],"solutionHtml":"Theo phương trình cân bằng nhiệt: $m_r c_r (70 - 30) = m_l c_l (30 - 20) \\Rightarrow 20 \\cdot c_r \\cdot 40 = 100 \\cdot c_l \\cdot 10 \\Rightarrow 800 c_r = 1000 c_l \\Rightarrow c_r = 1{,}25 c_l &gt; c_l$.","rawSolution":"Theo phương trình cân bằng nhiệt: $m_r c_r (70 - 30) = m_l c_l (30 - 20) \\Rightarrow 20 \\cdot c_r \\cdot 40 = 100 \\cdot c_l \\cdot 10 \\Rightarrow 800 c_r = 1000 c_l \\Rightarrow c_r = 1{,}25 c_l > c_l$."}]},{"blockId":"single_93ab7e73-dcfc-4c8b-aad9-14e9c6c71656_8","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"93ab7e73-dcfc-4c8b-aad9-14e9c6c71656","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Phương thức nào sau đây làm tăng nội năng của một vật chủ yếu bằng cách thực hiện công?","rawText":"Phương questions":[{"id":"76c3116a-4e8d-41f6-8392-f1d075638576","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Trong hệ (SI), đơn vị đo nhiệt độ là","rawText":"Trong hệ (SI), đơn vị đo nhiệt độ là","ownImageUrl":"","optionsHtml":["Celsius ($^{\\circ}\\text{C}$)","Fahrenheit ($^{\\circ}\\text{F}$)","Kelvin (K)","Rankine ($^{\\circ}\\text{R}$)"],"optionsRaw":["Celsius ($^{\\circ}\\text{C}$)","Fahrenheit ($^{\\circ}\\text{F}$)","Kelvin (K)","Rankine ($^{\\circ}\\text{R}$)"],"correctIndex":2,"correctAnswer":"Kelvin (K)","subQuestions":[],"solutionHtml":"Đơn vị cơ bản đo nhiệt độ nhiệt động lực học trong hệ SI là Kelvin (kí hiệu: $\\text{K}$).","rawSolution":"Đơn vị cơ bản đo nhiệt độ nhiệt động lực học trong hệ SI là Kelvin (kí hiệu: $\\text{K}$)."}]},{"blockId":"single_7ca8691a-886f-40e8-91e0-a36aa98129f2_11","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"7ca8691a-886f-40e8-91e0-a36aa98129f2","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Sự truyền nhiệt tự nhiên giữa hai vật khi tiếp xúc với nhau xảy ra theo chiều nào?","rawText":"Sự truyền nhiệt tự nhiên giữa hai vật khi tiếp xúc với nhau xảy ra theo chiều nào?","ownImageUrl":"","optionsHtml":["Từ vật có khối lượng lớn hơn sang vật có khối lượng nhỏ hơn","Từ vật có nhiệt độ cao hơn sang vật có nhiệt độ thấp hơn","Từ vật có nội năng lớn hơn sang vật có nội năng nhỏ hơn","Từ vật có khối lượng riêng lớn hơn sang vật có khối lượng riêng nhỏ hơn"],"optionsRaw":["Từ vật có khối lượng lớn hơn sang vật có khối lượng nhỏ hơn","Từ vật có nhiệt độ cao hơn sang vật có nhiệt độ thấp hơn","Từ vật có nội năng lớn hơn sang vật có nội năng nhỏ hơn","Từ vật có khối lượng riêng lớn hơn sang vật có khối lượng riêng nhỏ hơn"],"correctIndex":1,"correctAnswer":"Từ vật có nhiệt độ cao hơn sang vật có nhiệt độ thấp hơn","subQuestions":[],"solutionHtml":"Nhiệt năng luôn tự truyền từ vật có nhiệt độ cao hơn sang vật có nhiệt độ thấp hơn cho đến khi đạt cân bằng nhiệt.","rawSolution":"Nhiệt năng luôn tự truyền từ vật có nhiệt độ cao hơn sang vật có nhiệt độ thấp hơn cho đến khi đạt cân bằng nhiệt."}]},{"blockId":"single_93fe7be4-becb-4b92-b4e0-68c6a71cc4cb_12","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"93fe7be4-becb-4b92-b4e0-68c6a71cc4cb","type":"mcq","level":"H","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Để xác định nhiệt hóa hơi riêng của nước bằng ấm đun siêu tốc và cân điện tử, học sinh cần thực hiện các thao tác sau:<br>(1) Đổ nước vào ấm, đặt lên cân và bật công tắc đun.<br>(2) Ghi lại độ giảm khối lượng của nước sau khoảng thời gian $\\Delta t$.<br>(3) Khi nước sôi mạnh, mở nắp ấm và bấm đồng hồ đo thời gian $\\Delta t$.<br>(4) Tính toán kết quả dựa trên công suất của ấm và số liệu đo được.<br>Trình tự thí nghiệm đúng là","rawText":"Để xác định nhiệt hóa hơi riêng của nước bằng ấm đun siêu tốc và cân điện tử, học sinh cần thực hiện các thao tác sau:\n(1) Đổ nước vào ấm, đặt lên cân và bật công tắc đun.\n(2) Ghi lại độ giảm khối lượng của nước sau khoảng thời gian $\\Delta t$.\n(3) Khi nước sôi mạnh, mở nắp ấm và bấm đồng hồ đo thời gian $\\Delta t$.\n(4) Tính toán kết quả dựa trên công suất của ấm và số liệu đo được.\nTrình tự thí nghiệm đúng là","ownImageUrl":"","optionsHtml":["(1)-(3)-(2)-(4)","(1)-(2)-(3)-(4)","(3)-(1)-(2)-(4)","(2)-(1)-(3)-(4)"],"optionsRaw":["(1)-(3)-(2)-(4)","(1)-(2)-(3)-(4)","(3)-(1)-(2)-(4)","(2)-(1)-(3)-(4)"],"correctIndex":0,"correctAnswer":"(1)-(3)-(2)-(4)","subQuestions":[],"solutionHtml":"Trình tự đúng: Đổ nước và bật ấm đun (1) $\\rightarrow$ Chờ nước sôi mạnh thì mở nắp và bắt đầu bấm giờ (3) $\\rightarrow$ Đọc độ giảm khối lượng sau thời gian $\\Delta t$ (2) $\\rightarrow$ Tính nhiệt hóa hơi riêng (4).","rawSolution":"Trình tự đúng: Đổ nước và bật ấm đun (1) $\\rightarrow$ Chờ nước sôi mạnh thì mở nắp và bắt đầu bấm giờ (3) $\\rightarrow$ Đọc độ giảm khối lượng sau thời gian $\\Delta t$ (2) $\\rightarrow$ Tính nhiệt hóa hơi riêng (4)."}]},{"blockId":"single_03275753-4f2b-454e-8a86-f123cd877343_13","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"03275753-4f2b-454e-8a86-f123cd877343","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Trong nhiệt động lực học, $Q$ là nhiệt lượng trao đổi và $A$ là công trao đổi của hệ. Theo quy ước về dấu, khi một hệ nhận nhiệt lượng và thực hiện công thì","rawText":"Trong nhiệt động lực học, $Q$ là nhiệt lượng trao đổi và $A$ là công trao đổi của hệ. Theo quy ước về dấu, khi một hệ nhận nhiệt lượng và thực hiện công thì","ownImageUrl":"","optionsHtml":["$Q&gt;0$ và $A&gt;0$","$Q&gt;0$ và $A&lt;0$","$Q&lt;0$ và $A&gt;0$","$Q&lt;0$ và $A&lt;0$"],"optionsRaw":["$Q>0$ và $A>0$","$Q>0$ và $A<0$","$Q<0$ và $A>0$","$Q<0$ và $A<0$"],"correctIndex":1,"correctAnswer":"$Q>0$ và $A<0$","subQuestions":[],"solutionHtml":"Theo quy ước dấu của định luật I nhiệt động lực học: hệ nhận nhiệt thì $Q &gt; 0$, hệ thực hiện công (sinh công) thì $A &lt; 0$.","rawSolution":"Theo quy ước dấu của định luật I nhiệt động lực học: hệ nhận nhiệt thì $Q > 0$, hệ thực hiện công (sinh công) thì $A < 0$."}]},{"blockId":"single_26e1252f-94a6-4c94-bd25-08a6a4395c2d_14","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"26e1252f-94a6-4c94-bd25-08a6a4395c2d","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Trong công thức tính nhiệt lượng $Q$ làm nóng chảy hoàn toàn một vật có khối lượng $m$: $Q=\\lambda m$, đại lượng $\\lambda$ được gọi là","rawText":"Trong công thức tính nhiệt lượng $Q$ làm nóng chảy hoàn toàn một vật có khối lượng $m$: $Q=\\lambda m$, đại lượng $\\lambda$ được gọi là","ownImageUrl":"","optionsHtml":["nhiệt nóng chảy riêng","nhiệt dung riêng","nhiệt hóa hơi riêng","năng suất tỏa nhiệt"],"optionsRaw":["nhiệt nóng chảy riêng","nhiệt dung riêng","nhiệt hóa hơi riêng","năng suất tỏa nhiệt"],"correctIndex":0,"correctAnswer":"nhiệt nóng chảy riêng","subQuestions":[],"solutionHtml":"Trong công thức $Q = \\lambda m$, $\\lambda$ là nhiệt nóng chảy riêng của chất rắn.","rawSolution":"Trong công thức $Q = \\lambda m$, $\\lambda$ là nhiệt nóng chảy riêng của chất rắn."}]},{"blockId":"single_a7c8f1f3-269a-4b6c-90ab-dde92af916f1_15","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"a7c8f1f3-269a-4b6c-90ab-dde92af916f1","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Mỗi độ chia trong thang Celsius ($1^{\\circ}\\text{C}$) có độ lớn bằng","rawText":"Mỗi độ chia trong thang Celsius ($1^{\\circ}\\text{C}$) có độ lớn bằng","ownImageUrl":"","optionsHtml":["$1/100$ khoảng từ độ không tuyệt đối đến điểm ba của nước","$1/180$ khoảng từ độ không tuyệt đối đến điểm ba của nước","$1/100$ khoảng từ điểm đông đặc đến điểm sôi của nước tinh khiết ở áp suất chuẩn","$1/373{,}15$ khoảng từ điểm đông đặc đến điểm sôi của nước tinh khiết ở áp suất chuẩn"],"optionsRaw":["$1/100$ khoảng từ độ không tuyệt đối đến điểm ba của nước","$1/180$ khoảng từ độ không tuyệt đối đến điểm ba của nước","$1/100$ khoảng từ điểm đông đặc đến điểm sôi của nước tinh khiết ở áp suất chuẩn","$1/373{,}15$ khoảng từ điểm đông đặc đến điểm sôi của nước tinh khiết ở áp suất chuẩn"],"correctIndex":2,"correctAnswer":"$1/100$ khoảng từ điểm đông đặc đến điểm sôi của nước tinh khiết ở áp suất chuẩn","subQuestions":[],"solutionHtml":"Khoảng cách giữa điểm đóng băng ($0^{\\circ}\\text{C}$) và điểm sôi ($100^{\\circ}\\text{C}$) của nước tinh khiết ở áp suất chuẩn được chia thành $100$ phần bằng nhau, mỗi phần ứng với $1^{\\circ}\\text{C}$.","rawSolution":"Khoảng cách giữa điểm đóng băng ($0^{\\circ}\\text{C}$) và điểm sôi ($100^{\\circ}\\text{C}$) của nước tinh khiết ở áp suất chuẩn được chia thành $100$ phần bằng nhau, mỗi phần ứng với $1^{\\circ}\\text{C}$."}]},{"blockId":"single_93cb0106-dfbd-426f-ad21-068fa121c5ea_16","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"93cb0106-dfbd-426f-ad21-068fa121c5ea","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Đặc điểm chuyển động nhiệt của các phân tử chất lỏng là","rawText":"Đặc điểm chuyển động nhiệt của các phân tử chất lỏng là","ownImageUrl":"","optionsHtml":["chỉ đứng yên tại một vị trí cố định","dao động quanh vị trí cân bằng có thể dịch chuyển","chuyển động hoàn toàn tự do và không có vị trí cân bằng","chỉ chuyển động theo một hướng xác định"],"optionsRaw":["chỉ đứng yên tại một vị trí cố định","dao động quanh vị trí cân bằng có thể dịch chuyển","chuyển động hoàn toàn tự do và không có vị trí cân bằng","chỉ chuyển động theo một hướng xác định"],"correctIndex":1,"correctAnswer":"dao động quanh vị trí cân bằng có thể dịch chuyển","subQuestions":[],"solutionHtml":"Các phân tử chất lỏng dao động quanh vị trí cân bằng không cố định (có thể dịch chuyển được).","rawSolution":"Các phân tử chất lỏng dao động quanh vị trí cân bằng không cố định (có thể dịch chuyển được)."}]},{"blockId":"single_9d96782c-541a-44ce-857e-8e1be3248fd0_17","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"9d96782c-541a-44ce-857e-8e1be3248fd0","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Trong thí nghiệm đo nhiệt dung riêng của nước sử dụng nhiệt lượng kế và dây nung điện, dụng cụ nào sau đây không cần thiết?","rawText":"Trong thí nghiệm đo nhiệt dung riêng của nước sử dụng nhiệt lượng kế và dây nung điện, dụng cụ nào sau đây không cần thiết?","ownImageUrl":"","optionsHtml":["Thước kẹp.","Đồng hồ bấm giây.","Cân điện tử.","Nhiệt kế."],"optionsRaw":["Thước kẹp.","Đồng hồ bấm giây.","Cân điện tử.","Nhiệt kế."],"correctIndex":0,"correctAnswer":"Thước kẹp.","subQuestions":[],"solutionHtml":"Để tính nhiệt dung riêng $c = \\frac{\\mathcal{P} \\cdot t}{m \\Delta T}$, ta cần cân điện tử (đo $m$), nhiệt kế (đo $\\Delta T$), đồng hồ bấm giây (đo $t$); không cần thước kẹp.","rawSolution":"Để tính nhiệt dung riêng $c = \\frac{\\mathcal{P} \\cdot t}{m \\Delta T}$, ta cần cân điện tử (đo $m$), nhiệt kế (đo $\\Delta T$), đồng hồ bấm giây (đo $t$); không cần thước kẹp."}]},{"blockId":"single_1dc05919-2625-4c3a-a752-d166e6180f1d_18","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"1dc05919-2625-4c3a-a752-d166e6180f1d","type":"group-tf","level":"B","chapterName":"chương 2: vật lý chất khí","points":1,"textHtml":"Từ các thí nghiệm và thực tế, người ta đưa ra mô hình động học phân tử chất khí. Xét các phát biểu sau:","rawText":"Từ các thí nghiệm và thực tế, người ta đưa ra mô hình động học phân tử chất khí. Xét các phát biểu sau:","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"7b52e07b-727b-43a3-8ce1-d022ed09cf11","level":"B","textHtml":"Lực liên kết giữa các phân tử ở thể khí lớn hơn so với ở thể lỏng và thể rắn.","rawText":"Lực liên kết giữa các phân tử ở thể khí lớn hơn so với ở thể lỏng và thể rắn.","correctAnswer":"False"},{"id":"a549cf1b-066d-40ee-bff5-b2d186e8a339","level":"B","textHtml":"Kích thước các phân tử khí rất lớn so với khoảng cách giữa chúng.","rawText":"Kích thước các phân tử khí rất lớn so với khoảng cách giữa chúng.","correctAnswer":"False"},{"id":"4e5a9566-ec0a-4173-aaea-f26a9de5cf8c","level":"B","textHtml":"Khi chuyển động hỗn loạn, các phân tử khí va chạm với thành bình gây áp suất lên thành bình theo mọi hướng.","rawText":"Khi chuyển động hỗn loạn, các phân tử khí va chạm với thành bình gây áp suất lên thành bình theo mọi hướng.","correctAnswer":"True"},{"id":"b2f142b1-db69-4445-a55e-2a57971760a0","level":"B","textHtml":"Nhiệt độ khí càng cao thì các phân tử khí chuyển động càng nhanh.","rawText":"Nhiệt độ khí càng cao thì các phân tử khí chuyển động càng nhanh.","correctAnswer":"True"}],"solutionHtml":"a) Sai: Lực liên kết giữa các phân tử chất khí rất yếu, nhỏ hơn nhiều so với thể lỏng và thể rắn. b) Sai: Kích thước các phân tử khí rất nhỏ so với khoảng cách giữa chúng. c) Đúng: Các phân tử khí chuyển động hỗn loạn va chạm vào thành bình tạo nên áp suất chất khí. d) Đúng: Nhiệt độ càng cao thì tốc độ chuyển động nhiệt trung bình của các phân tử khí càng lớn.","rawSolution":"a) Sai: Lực liên kết giữa các phân tử chất khí rất yếu, nhỏ hơn nhiều so với thể lỏng và thể rắn. b) Sai: Kích thước các phân tử khí rất nhỏ so với khoảng cách giữa chúng. c) Đúng: Các phân tử khí chuyển động hỗn loạn va chạm vào thành bình tạo nên áp suất chất khí. d) Đúng: Nhiệt độ càng cao thì tốc độ chuyển động nhiệt trung bình của các phân tử khí càng lớn."}]},{"blockId":"single_e485e386-2ec7-4ffe-9b9a-f94295c6877a_19","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"e485e386-2ec7-4ffe-9b9a-f94295c6877a","type":"group-tf","level":"H","chapterName":"Chương 1: vật lý nhiệt","points":1,"textHtml":"Nhiệt động lực học là lĩnh vực vật lí nghiên cứu về năng lượng nhiệt và sự truyền nhiệt. Xét các phát biểu sau:","rawText":"Nhiệt động lực học là lĩnh vực vật lí nghiên cứu về năng lượng nhiệt và sự truyền nhiệt. Xét các phát biểu sau:","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"8e91cefb-c92f-4aad-b027-fe855e03ef0d","level":"H","textHtml":"Có thể làm thay đổi nội năng của vật bằng cách thực hiện công, truyền nhiệt.","rawText":"Có thể làm thay đổi nội năng của vật bằng cách thực hiện công, truyền nhiệt.","correctAnswer":"True"},{"id":"494a02bc-a15e-4c88-b307-a3d2c546cc11","level":"H","textHtml":"Khi hai vật có nhiệt độ chênh lệch tiếp xúc nhau thì nhiệt năng truyền từ vật có nhiệt độ thấp sang vật có nhiệt độ cao.","rawText":"Khi hai vật có nhiệt độ chênh lệch tiếp xúc nhau thì nhiệt năng truyền từ vật có nhiệt độ thấp sang vật có nhiệt độ cao.","correctAnswer":"False"},{"id":"d30c5395-4971-48ba-b19e-09f616b4e537","level":"H","textHtml":"Công thức chuyển đổi gần đúng nhiệt độ từ thang Celsius sang thang Kelvin là $T(\\text{K}) = t(^{\\circ}\\text{C}) + 273$.","rawText":"Công thức chuyển đổi gần đúng nhiệt độ từ thang Celsius sang thang Kelvin là $T(\\text{K}) = t(^{\\circ}\\text{C}) + 273$.","correctAnswer":"True"},{"id":"482f394f-d701-4da6-a8d8-d4d26c5f5783","level":"H","textHtml":"Động cơ nhiệt là động cơ hoạt động dựa trên nguyên tắc biến cơ năng thành nội năng của nhiên liệu.","rawText":"Động cơ nhiệt là động cơ hoạt động dựa trên nguyên tắc biến cơ năng thành nội năng của nhiên liệu.","correctAnswer":"False"}],"solutionHtml":"a) Đúng: Hai cách làm thay đổi nội năng của một vật là thực hiện công và truyền nhiệt. b) Sai: Nhiệt năng tự truyền từ vật có nhiệt độ cao sang vật có nhiệt độ thấp. c) Đúng: Công thức chuyển đổi gần đúng là $T(\\text{K}) = t(^{\\circ}\\text{C}) + 273$. d) Sai: Động cơ nhiệt biến một phần nội năng (nhiệt lượng) của nhiên liệu bị đốt cháy thành cơ năng.","rawSolution":"a) Đúng: Hai cách làm thay đổi nội năng của một vật là thực hiện công và truyền nhiệt. b) Sai: Nhiệt năng tự truyền từ vật có nhiệt độ cao sang vật có nhiệt độ thấp. c) Đúng: Công thức chuyển đổi gần đúng là $T(\\text{K}) = t(^{\\circ}\\text{C}) + 273$. d) Sai: Động cơ nhiệt biến một phần nội năng (nhiệt lượng) của nhiên liệu bị đốt cháy thành cơ năng."}]},{"blockId":"single_f6c17d2d-1d95-46cb-a027-450d57fe7234_20","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"f6c17d2d-1d95-46cb-a027-450d57fe7234","type":"group-tf","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":1,"textHtml":"Một gia đình sử dụng ấm siêu tốc Philips HD9350/90 có công suất định mức $2200\\text{ W}$ để đun sôi $1{,}5\\text{ kg}$ nước từ nhiệt độ $24^{\\circ}\\text{C}$. Biết nhiệt dung riêng của nước là $c=4200\\text{ J/kg.K}$. Hiệu suất của ấm là $84\\%$.","rawText":"Một gia đình sử dụng ấm siêu tốc Philips HD9350/90 có công suất định mức $2200\\text{ W}$ để đun sôi $1{,}5\\text{ kg}$ nước từ nhiệt độ $24^{\\circ}\\text{C}$. Biết nhiệt dung riêng của nước là $c=4200\\text{ J/kg.K}$. Hiệu suất của ấm là $84\\%$.","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"7c6cc424-1168-46ec-965d-e47a1ac2aeb8","level":"VD","textHtml":"Nhiệt lượng cần cung cấp để nước tăng thêm $1\\text{ K}$ cũng bằng nhiệt lượng cần để nó tăng thêm $1^{\\circ}\\text{C}$.","rawText":"Nhiệt lượng cần cung cấp để nước tăng thêm $1\\text{ K}$ cũng bằng nhiệt lượng cần để nó tăng thêm $1^{\\circ}\\text{C}$.","correctAnswer":"True"},{"id":"a51a1fda-4685-4850-8d64-30890f207e2b","level":"VD","textHtml":"Nhiệt lượng mà ấm cung cấp chỉ dùng để làm nóng nước trong ấm.","rawText":"Nhiệt lượng mà ấm cung cấp chỉ dùng để làm nóng nước trong ấm.","correctAnswer":"False"},{"id":"8a20f7d1-0ffe-49b0-b4d6-6340d5f21a38","level":"VD","textHtml":"Nhiệt lượng thực tế mà nước cần hấp thụ để đạt đến nhiệt độ sôi ($100^{\\circ}\\text{C}$) là $478{,}8\\text{ kJ}$.","rawText":"Nhiệt lượng thực tế mà nước cần hấp thụ để đạt đến nhiệt độ sôi ($100^{\\circ}\\text{C}$) là $478{,}8\\text{ kJ}$.","correctAnswer":"True"},{"id":"66e8b60b-4e51-4b5e-a410-9c8d986091ac","level":"VD","textHtml":"Thời gian cần thiết để đun sôi lượng nước trên xấp xỉ là $218\\text{ giây}$.","rawText":"Thời gian cần thiết để đun sôi lượng nước trên xấp xỉ là $218\\text{ giây}$.","correctAnswer":"False"}],"solutionHtml":"a) Đúng: Độ biến thiên nhiệt độ $\\Delta T(\\text{K}) = \\Delta t(^{\\circ}\\text{C}) = 1$. b) Sai: Hiệu suất là $84\\%$, có một phần nhiệt lượng hao phí truyền cho vỏ ấm và môi trường. c) Đúng: $Q_{\\text{ích}} = m c \\Delta t = 1{,}5 \\cdot 4200 \\cdot (100 - 24) = 478800\\text{ J} = 478{,}8\\text{ kJ}$. d) Sai: Nhiệt lượng toàn phần ấm cung cấp là $Q_{\\text{tp}} = \\frac{Q_{\\text{ích}}}{H} = \\frac{478800}{0{,}84} = 570000\\text{ J}$, thời gian đun là $t = \\frac{Q_{\\text{tp}}}{\\mathcal{P}} = \\frac{570000}{2200} \\approx 259{,}1\\text{ s}$.","rawSolution":"a) Đúng: Độ biến thiên nhiệt độ $\\Delta T(\\text{K}) = \\Delta t(^{\\circ}\\text{C}) = 1$. b) Sai: Hiệu suất là $84\\%$, có một phần nhiệt lượng hao phí truyền cho vỏ ấm và môi trường. c) Đúng: $Q_{\\text{ích}} = m c \\Delta t = 1{,}5 \\cdot 4200 \\cdot (100 - 24) = 478800\\text{ J} = 478{,}8\\text{ kJ}$. d) Sai: Nhiệt lượng toàn phần ấm cung cấp là $Q_{\\text{tp}} = \\frac{Q_{\\text{ích}}}{H} = \\frac{478800}{0{,}84} = 570000\\text{ J}$, thời gian đun là $t = \\frac{Q_{\\text{tp}}}{\\mathcal{P}} = \\frac{570000}{2200} \\approx 259{,}1\\text{ s}$."}]},{"blockId":"single_9ab3b79f-88ae-43ad-91e0-dfdc4177c2d1_21","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"9ab3b79f-88ae-43ad-91e0-dfdc4177c2d1","type":"group-tf","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":1,"textHtml":"Trong thí nghiệm xác định nhiệt nóng chảy riêng của nước đá (Hình 4.4 SGK Cánh diều), sơ đồ thí nghiệm gồm biến áp nguồn, oát kế, nhiệt lượng kế, cốc hứng nước đặt trên cân điện tử và được tiến hành theo các bước sau:<br>Bước 1: Cho nước đá vào nhiệt lượng kế và hứng nước chảy ra bằng một chiếc cốc. Khi nước từ nhiệt lượng kế chảy ra đều, cho nước chảy vào cốc (ở trên cân) trong thời gian $t$ phút, xác định khối lượng $m$ của nước trong cốc.<br>Bước 2: Bật biến áp nguồn. Đọc số chỉ $\\mathcal{P}$ của oát kế. Cho nước chảy thêm vào cốc trong thời gian $t$ phút. Xác định khối lượng $M$ của nước trong cốc lúc này. Biết Khối lượng của nước trong cốc (chưa bật biến áp nguồn) $m = 2,0.10^{-3}\\text{ kg}$; Khối lượng $M$ của nước trong cốc (đã bật biến áp nguồn) $M = 17,5.10^{-3}\\text{ kg}$; Thời gian đun $t = 180\\text{ s}$; Công suất $\\mathcal{P} = 24\\text{ W}$.","rawText":"Trong thí nghiệm xác định nhiệt nóng chảy riêng của nước đá (Hình 4.4 SGK Cánh diều), sơ đồ thí nghiệm gồm biến áp nguồn, oát kế, nhiệt lượng kế, cốc hứng nước đặt trên cân điện tử và được tiến hành theo các bước sau:\nBước 1: Cho nước đá vào nhiệt lượng kế và hứng nước chảy ra bằng một chiếc cốc. Khi nước từ nhiệt lượng kế chảy ra đều, cho nước chảy vào cốc (ở trên cân) trong thời gian $t$ phút, xác định khối lượng $m$ của nước trong cốc.\nBước 2: Bật biến áp nguồn. Đọc số chỉ $\\mathcal{P}$ của oát kế. Cho nước chảy thêm vào cốc trong thời gian $t$ phút. Xác định khối lượng $M$ của nước trong cốc lúc này. Biết Khối lượng của nước trong cốc (chưa bật biến áp nguồn) $m = 2,0.10^{-3}\\text{ kg}$; Khối lượng $M$ của nước trong cốc (đã bật biến áp nguồn) $M = 17,5.10^{-3}\\text{ kg}$; Thời gian đun $t = 180\\text{ s}$; Công suất $\\mathcal{P} = 24\\text{ W}$.","ownImageUrl":"https://i.ibb.co/whZmtrqf/quiz-img-p3-790451.png","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"4d4fbe3d-3c2e-424d-bba9-d1e355b49cc6","level":"VD","textHtml":"Nhiệt kế là thiết bị dùng để đo trực tiếp công suất của dòng điện trong thí nghiệm này.","rawText":"Nhiệt kế là thiết bị dùng để đo trực tiếp công suất của dòng điện trong thí nghiệm này.","correctAnswer":"False"},{"id":"168c910f-65f3-4afc-a27e-03720ad21420","level":"VD","textHtml":"Công thức tính nhiệt lượng để một vật rắn có khối lượng $m$ nóng chảy hoàn toàn ở nhiệt độ nóng chảy là $Q=m\\lambda$ với $\\lambda$ là nhiệt nóng chảy riêng của vật đó.","rawText":"Công thức tính nhiệt lượng để một vật rắn có khối lượng $m$ nóng chảy hoàn toàn ở nhiệt độ nóng chảy là $Q=m\\lambda$ với $\\lambda$ là nhiệt nóng chảy riêng của vật đó.","correctAnswer":"True"},{"id":"739cd9e6-ed61-4797-80c2-6bf8249f8c84","level":"VD","textHtml":"Khối lượng nước đá nóng chảy do nhận nhiệt lượng từ dây điện trở được xác định là $(M - 2m)$ vì trong bước 2 của thí nghiệm, đá vẫn nhận nhiệt từ môi trường làm tan một lượng đá đúng bằng $m$ như ở bước 1.","rawText":"Khối lượng nước đá nóng chảy do nhận nhiệt lượng từ dây điện trở được xác định là $(M - 2m)$ vì trong bước 2 của thí nghiệm, đá vẫn nhận nhiệt từ môi trường làm tan một lượng đá đúng bằng $m$ như ở bước 1.","correctAnswer":"True"},{"id":"041fd727-7d2e-4ec4-a105-990eb96650da","level":"VD","textHtml":"Khi thực hiện thí nghiệm đo nhiệt nóng chảy riêng theo các bước trên, số chỉ Oát kế là $24\\text{ W}$, thời gian đo ở mỗi bước là $180\\text{ giây}$, khối lượng cân được ở bước 1 là $2\\text{ gam}$, khối lượng cân được ở bước 2 là $17{,}5\\text{ gam}$ thì nhiệt nóng chảy riêng của nước đá đo được là $3{,}2.10^{2}\\text{ J/kg}$.","rawText":"Khi thực hiện thí nghiệm đo nhiệt nóng chảy riêng theo các bước trên, số chỉ Oát kế là $24\\text{ W}$, thời gian đo ở mỗi bước là $180\\text{ giây}$, khối lượng cân được ở bước 1 là $2\\text{ gam}$, khối lượng cân được ở bước 2 là $17{,}5\\text{ gam}$ thì nhiệt nóng chảy riêng của nước đá đo được là $3{,}2.10^{2}\\text{ J/kg}$.","correctAnswer":"False"}],"solutionHtml":"a) Sai: Oát kế mới là thiết bị đo công suất của dòng điện. <br>b) Đúng: Công thức nhiệt lượng nóng chảy hoàn toàn là $Q = m\\lambda$. <br>c) Đúng: Sau bước 1 trong cốc đã có sẵn khối lượng nước $m$; ở bước 2 cốc hứng thêm một lượng nước do môi trường làm tan ($m$) và một lượng do dây nung làm tan ($\\Delta m$), nên tổng khối lượng nước trong cốc sau bước 2 là $M = m + m + \\Delta m \\Rightarrow \\Delta m = M - 2m$. <br>d) Sai: Khối lượng nước đá nóng chảy do dây nung là $\\Delta m = (17{,}5 - 2 \\cdot 2{,}0) \\cdot 10^{-3} = 13{,}5 \\cdot 10^{-3}\\text{ kg}$. Nhiệt nóng chảy riêng $\\lambda = \\frac{\\mathcal{P} \\cdot t}{\\Delta m} = \\frac{24 \\cdot 180}{13{,}5 \\cdot 10^{-3}} = 3{,}2 \\cdot 10^5\\text{ J/kg}$ (không phải $3{,}2 \\cdot 10^2\\text{ J/kg}$).","rawSolution":"a) Sai: Oát kế mới là thiết bị đo công suất của dòng điện. \nb) Đúng: Công thức nhiệt lượng nóng chảy hoàn toàn là $Q = m\\lambda$. \nc) Đúng: Sau bước 1 trong cốc đã có sẵn khối lượng nước $m$; ở bước 2 cốc hứng thêm một lượng nước do môi trường làm tan ($m$) và một lượng do dây nung làm tan ($\\Delta m$), nên tổng khối lượng nước trong cốc sau bước 2 là $M = m + m + \\Delta m \\Rightarrow \\Delta m = M - 2m$. \nd) Sai: Khối lượng nước đá nóng chảy do dây nung là $\\Delta m = (17{,}5 - 2 \\cdot 2{,}0) \\cdot 10^{-3} = 13{,}5 \\cdot 10^{-3}\\text{ kg}$. Nhiệt nóng chảy riêng $\\lambda = \\frac{\\mathcal{P} \\cdot t}{\\Delta m} = \\frac{24 \\cdot 180}{13{,}5 \\cdot 10^{-3}} = 3{,}2 \\cdot 10^5\\text{ J/kg}$ (không phải $3{,}2 \\cdot 10^2\\text{ J/kg}$)."}]},{"blockId":"single_72791552-5b5a-4cd5-9661-78cedeaf70e3_22","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"72791552-5b5a-4cd5-9661-78cedeaf70e3","type":"short","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Giả thiết rằng trong một tia sét có một điện tích $q=25\\text{ C}$ được phóng từ đám mây dông xuống đất và khi đó hiệu điện thế giữa đám mây và mặt đất $U=1{,}4.10^{8}\\text{ V}$. Cho nhiệt hóa hơi riêng của nước bằng $2{,}3.10^{6}\\text{ J/kg}$. Hỏi năng lượng của tia sét đó có thể làm bao nhiêu kilôgam nước ở $100^{\\circ}\\text{C}$ biến thành hơi nước ở $100^{\\circ}\\text{C}$ (làm tròn kết quả đến chữ số hàng đơn vị)?","rawText":"Giả thiết rằng trong một tia sét có một điện tích $q=25\\text{ C}$ được phóng từ đám mây dông xuống đất và khi đó hiệu điện thế giữa đám mây và mặt đất $U=1{,}4.10^{8}\\text{ V}$. Cho nhiệt hóa hơi riêng của nước bằng $2{,}3.10^{6}\\text{ J/kg}$. Hỏi năng lượng của tia sét đó có thể làm bao nhiêu kilôgam nước ở $100^{\\circ}\\text{C}$ biến thành hơi nước ở $100^{\\circ}\\text{C}$ (làm tròn kết quả đến chữ số hàng đơn vị)?","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"1522","subQuestions":[],"solutionHtml":"Năng lượng của tia sét: $Q = A = q \\cdot U = 25 \\cdot 1{,}4 \\cdot 10^8 = 3{,}5 \\cdot 10^9\\text{ J}$. Khối lượng nước hóa hơi: $m = \\frac{Q}{L} = \\frac{3{,}5 \\cdot 10^9}{2{,}3 \\cdot 10^6} \\approx 1521{,}74\\text{ kg} \\approx 1522\\text{ kg}$.","rawSolution":"Năng lượng của tia sét: $Q = A = q \\cdot U = 25 \\cdot 1{,}4 \\cdot 10^8 = 3{,}5 \\cdot 10^9\\text{ J}$. Khối lượng nước hóa hơi: $m = \\frac{Q}{L} = \\frac{3{,}5 \\cdot 10^9}{2{,}3 \\cdot 10^6} \\approx 1521{,}74\\text{ kg} \\approx 1522\\text{ kg}$."}]},{"blockId":"single_1a188668-62ad-45f9-af70-cfde30b11ca5_23","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"1a188668-62ad-45f9-af70-cfde30b11ca5","type":"short","level":"VDC","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Một lượng chất rắn xác định đang ở nhiệt độ nóng chảy $20^{\\circ}\\text{C}$. Nếu ta cấp cho nó một nhiệt lượng $Q$ thì $\\frac{3}{4}$ khối lượng chất ở thể rắn bị nóng chảy. Nếu ta tiếp tục cung cấp một nhiệt lượng $Q$ nữa thì toàn bộ chất rắn chuyển thành lỏng ở $50^{\\circ}\\text{C}$. Xác định tỉ số giữa nhiệt nóng chảy riêng ($\\text{J/g}$) và nhiệt dung riêng của chất ở dạng lỏng ($\\text{J/g.}^{\\circ}\\text{C}$).","rawText":"Một lượng chất rắn xác định đang ở nhiệt độ nóng chảy $20^{\\circ}\\text{C}$. Nếu ta cấp cho nó một nhiệt lượng $Q$ thì $\\frac{3}{4}$ khối lượng chất ở thể rắn bị nóng chảy. Nếu ta tiếp tục cung cấp một nhiệt lượng $Q$ nữa thì toàn bộ chất rắn chuyển thành lỏng ở $50^{\\circ}\\text{C}$. Xác định tỉ số giữa nhiệt nóng chảy riêng ($\\text{J/g}$) và nhiệt dung riêng của chất ở dạng lỏng ($\\text{J/g.}^{\\circ}\\text{C}$).","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"60","subQuestions":[],"solutionHtml":"Gọi $m$ là khối lượng toàn bộ chất rắn. Ở giai đoạn 1: $Q = \\frac{3}{4} m \\lambda \\Rightarrow m \\lambda = \\frac{4}{3} Q$. Ở giai đoạn 2, nhiệt lượng $Q$ làm nóng chảy nốt $\\frac{1}{4} m$ còn lại và làm tăng nhiệt độ toàn bộ $m$ chất lỏng từ $20^{\\circ}\\text{C}$ lên $50^{\\circ}\\text{C}$: $Q = \\frac{1}{4} m \\lambda + m c (50 - 20) = \\frac{1}{4} \\cdot \\frac{4}{3} Q + 30 m c = \\frac{1}{3} Q + 30 m c \\Rightarrow 30 m c = \\frac{2}{3} Q \\Rightarrow m c = \\frac{1}{45} Q$. Tỉ số $\\frac{\\lambda}{c} = \\frac{m \\lambda}{m c} = \\frac{\\frac{4}{3} Q}{\\frac{1}{45} Q} = 60$.","rawSolution":"Gọi $m$ là khối lượng toàn bộ chất rắn. Ở giai đoạn 1: $Q = \\frac{3}{4} m \\lambda \\Rightarrow m \\lambda = \\frac{4}{3} Q$. Ở giai đoạn 2, nhiệt lượng $Q$ làm nóng chảy nốt $\\frac{1}{4} m$ còn lại và làm tăng nhiệt độ toàn bộ $m$ chất lỏng từ $20^{\\circ}\\text{C}$ lên $50^{\\circ}\\text{C}$: $Q = \\frac{1}{4} m \\lambda + m c (50 - 20) = \\frac{1}{4} \\cdot \\frac{4}{3} Q + 30 m c = \\frac{1}{3} Q + 30 m c \\Rightarrow 30 m c = \\frac{2}{3} Q \\Rightarrow m c = \\frac{1}{45} Q$. Tỉ số $\\frac{\\lambda}{c} = \\frac{m \\lambda}{m c} = \\frac{\\frac{4}{3} Q}{\\frac{1}{45} Q} = 60$."}]},{"blockId":"group_27443b2a-9732-4c27-bcb9-79336390f884_24","isSharedGroup":true,"contextHtml":"Sông Petermann Glacier là con sông băng dài nhất ở Green Land, diện tích bề mặt sông băng nhận bức xạ Mặt Trời là khoảng $1200\\text{ km}^{2}$. Mùa hè ở đây mặt trời không lặn, nó nhận được năng lượng mặt trời với cường độ trung bình trong $24\\text{ giờ}$ là $300\\text{ W/m}^{2}$. Do bề mặt băng phản xạ ánh sáng, nó chỉ hấp thụ được khoảng $40\\%$ tổng năng lượng này. Toàn bộ năng lượng hấp thụ này được dùng để làm tan lớp băng đang có nhiệt độ $0^{\\circ}\\text{C}$. Biết nhiệt nóng chảy riêng của băng là $3{,}34.10^{5}\\text{ J/kg}$ và khối lượng riêng của nước lỏng là $1000\\text{ kg/m}^{3}$.","sharedImageUrl":"","questions":[{"id":"27443b2a-9732-4c27-bcb9-79336390f884","type":"short","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Nhiệt lượng mà sông băng hấp thụ trung bình trong một ngày có giá trị $a.10^{16}\\text{ (J)}$. Xác định giá trị của $a$ (làm tròn đến phần nguyên).","rawText":"Nhiệt lượng mà sông băng hấp thụ trung bình trong một ngày có giá trị $a.10^{16}\\text{ (J)}$. Xác định giá trị của $a$ (làm tròn đến phần nguyên).","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"1","subQuestions":[],"solutionHtml":"Diện tích bề mặt: $S = 1200\\text{ km}^2 = 1{,}2 \\cdot 10^9\\text{ m}^2$. Thời gian một ngày: $t = 24 \\cdot 3600 = 86400\\text{ s}$. Nhiệt lượng sông băng hấp thụ trong một ngày: $Q = 0{,}4 \\cdot I \\cdot S \\cdot t = 0{,}4 \\cdot 300 \\cdot (1{,}2 \\cdot 10^9) \\cdot 86400 = 1{,}24416 \\cdot 10^{16}\\text{ J}$. Làm tròn đến phần nguyên được $a = 1$.","rawSolution":"Diện tích bề mặt: $S = 1200\\text{ km}^2 = 1{,}2 \\cdot 10^9\\text{ m}^2$. Thời gian một ngày: $t = 24 \\cdot 3600 = 86400\\text{ s}$. Nhiệt lượng sông băng hấp thụ trong một ngày: $Q = 0{,}4 \\cdot I \\cdot S \\cdot t = 0{,}4 \\cdot 300 \\cdot (1{,}2 \\cdot 10^9) \\cdot 86400 = 1{,}24416 \\cdot 10^{16}\\text{ J}$. Làm tròn đến phần nguyên được $a = 1$."},{"id":"77507b1a-b4c4-42ac-9d25-abb91624f492","type":"short","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Thể tích nước mà sông băng tạo ra trung bình trong một ngày ở đây bằng $x.10^{7}\\text{ m}^{3}$. Xác định $x$ (làm tròn đến hàng phần trăm)?","rawText":"Thể tích nước mà sông băng tạo ra trung bình trong một ngày ở đây bằng $x.10^{7}\\text{ m}^{3}$. Xác định $x$ (làm tròn đến hàng phần trăm)?","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"3.73","subQuestions":[],"solutionHtml":"Không làm tròn trung gian: $Q = 1{,}24416 \\cdot 10^{16}\\text{ J}$. Khối lượng băng tan: $m = \\frac{Q}{\\lambda} = \\frac{1{,}24416 \\cdot 10^{16}}{3{,}34 \\cdot 10^5} \\approx 3{,}72503 \\cdot 10^{10}\\text{ kg}$. Thể tích nước tạo ra: $V = \\frac{m}{\\rho} = \\frac{3{,}72503 \\cdot 10^{10}}{1000} \\approx 3{,}72503 \\cdot 10^7\\text{ m}^3$. Làm tròn đến hàng phần trăm được $x = 3{,}73$.","rawSolution":"Không làm tròn trung gian: $Q = 1{,}24416 \\cdot 10^{16}\\text{ J}$. Khối lượng băng tan: $m = \\frac{Q}{\\lambda} = \\frac{1{,}24416 \\cdot 10^{16}}{3{,}34 \\cdot 10^5} \\approx 3{,}72503 \\cdot 10^{10}\\text{ kg}$. Thể tích nước tạo ra: $V = \\frac{m}{\\rho} = \\frac{3{,}72503 \\cdot 10^{10}}{1000} \\approx 3{,}72503 \\cdot 10^7\\text{ m}^3$. Làm tròn đến hàng phần trăm được $x = 3{,}73$."}]},{"blockId":"single_3e8d1f95-a18c-40ef-813b-7b0dbd5d1eff_26","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"3e8d1f95-a18c-40ef-813b-7b0dbd5d1eff","type":"short","level":"VD","chapterName":"chương 2: vật lý chất khí","points":0.25,"textHtml":"Ta thấy các hạt khói chuyển động chậm lửng trong không khí với tốc độ khoảng $2\\text{ cm/s}$. Khối lượng của hạt khói gấp $x.10^{6}$ lần khối lượng của phân tử không khí có cùng động năng nhưng có tốc độ $300\\text{ m/s}$. Giá trị của $x$ bằng bao nhiêu?","rawText":"Ta thấy các hạt khói chuyển động chậm lửng trong không khí với tốc độ khoảng $2\\text{ cm/s}$. Khối lượng của hạt khói gấp $x.10^{6}$ lần khối lượng của phân tử không khí có cùng động năng nhưng có tốc độ $300\\text{ m/s}$. Giá trị của $x$ bằng bao nhiêu?","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"225","subQuestions":[],"solutionHtml":"Vì hạt khói và phân tử không khí có cùng động năng: $\\frac{1}{2} m_1 v_1^2 = \\frac{1}{2} m_2 v_2^2 \\Rightarrow \\frac{m_1}{m_2} = \\left(\\frac{v_2}{v_1}\\right)^2 = \\left(\\frac{300}{0{,}02}\\right)^2 = (15000)^2 = 2{,}25 \\cdot 10^8 = 225 \\cdot 10^6$. Vậy $x = 225$.","rawSolution":"Vì hạt khói và phân tử không khí có cùng động năng: $\\frac{1}{2} m_1 v_1^2 = \\frac{1}{2} m_2 v_2^2 \\Rightarrow \\frac{m_1}{m_2} = \\left(\\frac{v_2}{v_1}\\right)^2 = \\left(\\frac{300}{0{,}02}\\right)^2 = (15000)^2 = 2{,}25 \\cdot 10^8 = 225 \\cdot 10^6$. Vậy $x = 225$."}]},{"blockId":"single_a53571a3-aa79-4d73-90d3-7444f9bc8514_27","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"a53571a3-aa79-4d73-90d3-7444f9bc8514","type":"short","level":"H","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Một lượng khí trong một xilanh nhận một nhiệt lượng $350\\text{ kJ}$ và thực hiện công $130\\text{ kJ}$ đẩy pít-tông đi ra. Độ biến thiên nội năng của lượng khí trong quá trình này là bao nhiêu kJ?","rawText":"Một lượng khí trong một xilanh nhận một nhiệt lượng $350\\text{ kJ}$ và thực hiện công $130\\text{ kJ}$ đẩy pít-tông đi ra. Độ biến thiên nội năng của lượng khí trong quá trình này là bao nhiêu kJ?","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"220","subQuestions":[],"solutionHtml":"Khí nhận nhiệt $Q = 350\\text{ kJ}$ và sinh công nên $A = -130\\text{ kJ}$. Độ biến thiên nội năng: $\\Delta U = A + Q = -130 + 350 = 220\\text{ kJ}$.","rawSolution":"Khí nhận nhiệt $Q = 350\\text{ kJ}$ và sinh công nên $A = -130\\text{ kJ}$. Độ biến thiên nội năng: $\\Delta U = A + Q = -130 + 350 = 220\\text{ kJ}$."}]}]}</script>
  <script>
    (function() {
      var dataEl = document.getElementById('edusync-runtime-data');
      var EXAM = JSON.parse(dataEl.textContent || '{}');
      var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      var TF_LABELS = ['a', 'b', 'c', 'd', 'e', 'f'];

      function shuffle(arr) {
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      var blocks = EXAM.shuffleQuestions ? shuffle(EXAM.blocks || []) : (EXAM.blocks || []);
      var flatQuestions = [];
      blocks.forEach(function(block) {
        block.questions.forEach(function(q) {
          if (q.type === 'mcq' && EXAM.shuffleOptions && Array.isArray(q.optionsHtml)) {
            var tagged = q.optionsHtml.map(function(html, idx) {
              return { html: html, raw: q.optionsRaw[idx], isCorrect: idx === q.correctIndex };
            });
            var mixed = shuffle(tagged);
            q.optionsHtml = mixed.map(function(m) { return m.html; });
            q.optionsRaw = mixed.map(function(m) { return m.raw; });
            q.correctIndex = Math.max(0, mixed.findIndex(function(m) { return m.isCorrect; }));
          }
          q.displayNumber = flatQuestions.length + 1;
          flatQuestions.push(q);
        });
      });

      var userAnswers = {};
      var submitted = false;
      var durationLimit = (EXAM.durationMinutes || 0) > 0 ? EXAM.durationMinutes * 60 : 0;
      var startTime = Date.now();
      var timerHandle = null;

      function fmtTime(sec) {
        var s = Math.max(0, Math.floor(sec));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function isQuestionAnswered(q) {
        var ans = userAnswers[q.id];
        if (q.type === 'mcq') return typeof ans === 'number';
        if (q.type === 'short') return typeof ans === 'string' && ans.trim().length > 0;
        if (q.type === 'group-tf') {
          if (!ans || typeof ans !== 'object') return false;
          return q.subQuestions.some(function(sq) { return ans[sq.id] === 'True' || ans[sq.id] === 'False'; });
        }
        return false;
      }

      function updateProgress() {
        var done = flatQuestions.filter(isQuestionAnswered).length;
        document.getElementById('progressLabel').textContent = done + '/' + flatQuestions.length;
        document.getElementById('sidebarCount').textContent = 'Đã làm ' + done + '/' + flatQuestions.length;
        flatQuestions.forEach(function(q) {
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          if (!pBtn || submitted) return;
          pBtn.className = 'p-btn mono' + (isQuestionAnswered(q) ? ' done' : '');
        });
      }

      function buildQuestionEl(q) {
        var card = document.createElement('article');
        card.className = 'q-card';
        card.id = 'qcard_' + q.displayNumber;

        var header = document.createElement('div');
        header.className = 'q-header';
        var leftMeta = '<span class="q-num">Câu ' + q.displayNumber + '</span>';
        var tags = [q.level ? ('Mức ' + q.level) : '', q.points + ' đ', q.chapterName || ''].filter(Boolean).join(' · ');
        header.innerHTML = leftMeta + '<span id="qstatus_' + q.displayNumber + '" class="q-status">' + tags + '</span>';
        card.appendChild(header);

        var qTextEl = document.createElement('div');
        qTextEl.className = 'q-text';
        qTextEl.innerHTML = q.textHtml;
        card.appendChild(qTextEl);

        if (q.ownImageUrl) {
          var fig = document.createElement('div');
          fig.className = 'q-figure';
          var img = document.createElement('img');
          img.src = q.ownImageUrl;
          img.alt = 'Hình minh họa câu ' + q.displayNumber;
          fig.appendChild(img);
          card.appendChild(fig);
        }

        if (q.type === 'mcq') {
          var grid = document.createElement('div');
          grid.className = 'options-grid';
          q.optionsHtml.forEach(function(optHtml, optIdx) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.id = 'opt_' + q.id + '_' + optIdx;
            btn.innerHTML = '<span class="opt-letter mono">' + (LETTERS[optIdx] || optIdx + 1) + '</span><span style="flex:1;">' + optHtml + '</span>';
            btn.addEventListener('click', function() {
              if (submitted) return;
              userAnswers[q.id] = optIdx;
              q.optionsHtml.forEach(function(_, i2) {
                var el = document.getElementById('opt_' + q.id + '_' + i2);
                if (el) el.classList.toggle('selected', i2 === optIdx);
              });
              updateProgress();
            });
            grid.appendChild(btn);
          });
          card.appendChild(grid);
        } else if (q.type === 'group-tf') {
          var list = document.createElement('div');
          list.className = 'tf-list';
          q.subQuestions.forEach(function(sq, sIdx) {
            var row = document.createElement('div');
            row.className = 'tf-row';
            row.id = 'tfrow_' + sq.id;

            var txt = document.createElement('div');
            txt.className = 'tf-text';
            txt.innerHTML = '<strong>' + (TF_LABELS[sIdx] || (sIdx + 1)) + ')</strong> ' + sq.textHtml;
            row.appendChild(txt);

            var actions = document.createElement('div');
            actions.className = 'tf-actions';
            ['True', 'False'].forEach(function(val) {
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'tf-choice';
              b.id = 'tfbtn_' + sq.id + '_' + val;
              b.textContent = val === 'True' ? 'Đúng' : 'Sai';
              b.addEventListener('click', function() {
                if (submitted) return;
                if (!userAnswers[q.id] || typeof userAnswers[q.id] !== 'object') userAnswers[q.id] = {};
                userAnswers[q.id][sq.id] = val;
                var bt = document.getElementById('tfbtn_' + sq.id + '_True');
                var bf = document.getElementById('tfbtn_' + sq.id + '_False');
                if (bt) bt.classList.toggle('active', val === 'True');
                if (bf) bf.classList.toggle('active', val === 'False');
                updateProgress();
              });
              actions.appendChild(b);
            });
            row.appendChild(actions);
            list.appendChild(row);
          });
          card.appendChild(list);
        } else {
          var sBox = document.createElement('div');
          sBox.className = 'short-box';
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'short-input';
          inp.id = 'short_' + q.id;
          inp.placeholder = 'Nhập đáp số (vd: 2.6 hoặc 36)';
          inp.addEventListener('input', function() {
            if (submitted) return;
            userAnswers[q.id] = inp.value;
            updateProgress();
          });
          var fb = document.createElement('span');
          fb.id = 'shortfb_' + q.id;
          fb.className = 'short-feedback';
          sBox.appendChild(inp);
          sBox.appendChild(fb);
          card.appendChild(sBox);
        }

        if (q.solutionHtml) {
          var sol = document.createElement('div');
          sol.className = 'solution-box';
          sol.id = 'sol_' + q.id;
          sol.innerHTML = '<strong>Lời giải chi tiết:</strong><div style="margin-top:4px;">' + q.solutionHtml + '</div>';
          card.appendChild(sol);
        }

        return card;
      }

      function renderExam() {
        var root = document.getElementById('questionsRoot');
        var pal = document.getElementById('paletteRoot');
        root.innerHTML = '';
        pal.innerHTML = '';

        blocks.forEach(function(block) {
          if (block.contextHtml || block.sharedImageUrl) {
            var groupEl = document.createElement('section');
            groupEl.className = 'context-group';

            var head = document.createElement('div');
            head.className = 'context-header';
            var firstNum = block.questions[0].displayNumber;
            var lastNum = block.questions[block.questions.length - 1].displayNumber;
            var labelText = block.questions.length > 1
              ? 'Dữ liệu dùng chung cho Câu ' + firstNum + ' – Câu ' + lastNum
              : 'Dữ liệu đề bài (Câu ' + firstNum + ')';
            var html = '<div class="context-label">' + labelText + '</div>';
            if (block.contextHtml) {
              html += '<div class="context-body">' + block.contextHtml + '</div>';
            }
            head.innerHTML = html;
            if (block.sharedImageUrl) {
              var fig = document.createElement('div');
              fig.className = 'q-figure';
              var img = document.createElement('img');
              img.src = block.sharedImageUrl;
              img.alt = labelText;
              fig.appendChild(img);
              head.appendChild(fig);
            }
            groupEl.appendChild(head);

            var inner = document.createElement('div');
            inner.className = 'context-questions';
            block.questions.forEach(function(q) {
              inner.appendChild(buildQuestionEl(q));
            });
            groupEl.appendChild(inner);
            root.appendChild(groupEl);
          } else {
            block.questions.forEach(function(q) {
              root.appendChild(buildQuestionEl(q));
            });
          }
        });

        flatQuestions.forEach(function(q) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'p-btn mono';
          b.id = 'pbtn_' + q.displayNumber;
          b.textContent = String(q.displayNumber);
          b.addEventListener('click', function() {
            var target = document.getElementById('qcard_' + q.displayNumber);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          pal.appendChild(b);
        });

        updateProgress();
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }
      }

      function normalizeShort(val) {
        return String(val || '').trim().replace(/,/g, '.').replace(/\s+/g, '').toLowerCase();
      }

      function isShortMatch(userVal, expectedVal) {
        var u = normalizeShort(userVal);
        var e = normalizeShort(expectedVal);
        if (!u) return false;
        if (u === e) return true;
        var nu = parseFloat(u);
        var ne = parseFloat(e);
        if (!isNaN(nu) && !isNaN(ne) && String(nu) === u || !isNaN(nu) && !isNaN(ne)) {
          if (/^-?\d+(?:\.\d+)?$/.test(u) && /^-?\d+(?:\.\d+)?$/.test(e)) {
            return Math.abs(nu - ne) < 1e-6;
          }
        }
        return false;
      }

      function gradeAndSubmit(force) {
        if (submitted) return;
        var answered = flatQuestions.filter(isQuestionAnswered).length;
        if (!force && answered < flatQuestions.length) {
          document.getElementById('confirmMsg').textContent =
            'Bạn mới làm ' + answered + '/' + flatQuestions.length + ' câu. Bạn có chắc muốn nộp bài ngay?';
          document.getElementById('confirmBar').classList.add('visible');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        document.getElementById('confirmBar').classList.remove('visible');
        submitted = true;
        if (timerHandle) clearInterval(timerHandle);

        var totalScore = 0;
        var maxScore = EXAM.maxScore || 10;
        var correctQuestions = 0;
        var answerDetails = [];

        flatQuestions.forEach(function(q) {
          var qCorrect = false;
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          var stEl = document.getElementById('qstatus_' + q.displayNumber);
          var solEl = document.getElementById('sol_' + q.id);
          if (solEl) solEl.classList.add('visible');

          if (q.type === 'mcq') {
            var chosen = typeof userAnswers[q.id] === 'number' ? userAnswers[q.id] : -1;
            qCorrect = chosen === q.correctIndex;
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            q.optionsHtml.forEach(function(_, i) {
              var ob = document.getElementById('opt_' + q.id + '_' + i);
              if (!ob) return;
              ob.disabled = true;
              ob.classList.remove('selected');
              if (i === q.correctIndex) ob.classList.add('correct');
              else if (i === chosen) ob.classList.add('wrong');
            });
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: q.optionsRaw,
              selectedIndex: chosen,
              correctIndex: q.correctIndex,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          } else if (q.type === 'group-tf') {
            var tfMap = (userAnswers[q.id] && typeof userAnswers[q.id] === 'object') ? userAnswers[q.id] : {};
            var rightSubs = 0;
            q.subQuestions.forEach(function(sq, sIdx) {
              var picked = tfMap[sq.id] || '';
              var subOk = picked === sq.correctAnswer;
              if (subOk) rightSubs++;
              var row = document.getElementById('tfrow_' + sq.id);
              if (row) row.classList.add(subOk ? 'ok' : 'bad');
              ['True', 'False'].forEach(function(v) {
                var btn = document.getElementById('tfbtn_' + sq.id + '_' + v);
                if (!btn) return;
                btn.disabled = true;
                if (v === sq.correctAnswer) btn.classList.add('right-ans');
              });
              answerDetails.push({
                orderIndex: answerDetails.length,
                questionText: 'Câu ' + q.displayNumber + (TF_LABELS[sIdx] || '') + ': ' + sq.rawText,
                options: ['Đúng', 'Sai'],
                selectedIndex: picked === 'True' ? 0 : (picked === 'False' ? 1 : -1),
                correctIndex: sq.correctAnswer === 'True' ? 0 : 1,
                isCorrect: subOk,
                explanation: sIdx === q.subQuestions.length - 1 ? q.rawSolution : ''
              });
            });
            var earnedRatio = 0;
            if (q.subQuestions.length === 4) {
              earnedRatio = rightSubs === 1 ? 0.1 : rightSubs === 2 ? 0.25 : rightSubs === 3 ? 0.5 : rightSubs === 4 ? 1 : 0;
            } else if (q.subQuestions.length > 0) {
              earnedRatio = rightSubs / q.subQuestions.length;
            }
            var earned = Math.round(q.points * earnedRatio * 100) / 100;
            totalScore += earned;
            qCorrect = rightSubs === q.subQuestions.length;
            if (qCorrect) correctQuestions++;
            if (stEl) {
              stEl.textContent = 'Đúng ' + rightSubs + '/' + q.subQuestions.length + ' ý (+' + earned + 'đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
          } else {
            var rawInput = document.getElementById('short_' + q.id);
            var typed = rawInput ? rawInput.value.trim() : '';
            if (rawInput) rawInput.disabled = true;
            qCorrect = isShortMatch(typed, q.correctAnswer);
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            var fbEl = document.getElementById('shortfb_' + q.id);
            if (fbEl) {
              fbEl.textContent = qCorrect
                ? ('Chính xác (+' + q.points + 'đ)')
                : ('Đáp án đúng: ' + q.correctAnswer);
              fbEl.style.color = qCorrect ? 'var(--ok)' : 'var(--bad)';
            }
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: ['Bài làm: ' + (typed || '(bỏ trống)'), 'Đáp án chuẩn: ' + q.correctAnswer],
              selectedIndex: qCorrect ? 1 : 0,
              correctIndex: 1,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          }

          if (pBtn) {
            pBtn.className = 'p-btn mono ' + (qCorrect ? 'ok' : 'bad');
          }
        });

        totalScore = Math.round(totalScore * 100) / 100;
        var pct = maxScore > 0 ? Math.round((totalScore / maxScore) * 1000) / 10 : 0;

        document.getElementById('scoreText').textContent = totalScore + ' / ' + maxScore + ' điểm';
        document.getElementById('correctText').textContent =
          'Đúng hoàn toàn ' + correctQuestions + ' / ' + flatQuestions.length + ' câu (' + pct + '%)';
        document.getElementById('resultScreen').classList.add('visible');
        document.getElementById('topSubmitBtn').style.display = 'none';
        document.getElementById('sideSubmitBtn').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }

        if (typeof window.EduSyncSubmitScore === 'function') {
          window.EduSyncSubmitScore(totalScore, maxScore, correctQuestions, flatQuestions.length, answerDetails);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'QUIZ_RESULT',
            score: totalScore,
            maxScore: maxScore,
            correctCount: correctQuestions,
            totalQuestions: flatQuestions.length,
            answerDetails: answerDetails
          }, '*');
        }
      }

      document.getElementById('topSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('sideSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('confirmYesBtn').addEventListener('click', function() { gradeAndSubmit(true); });
      document.getElementById('confirmCancelBtn').addEventListener('click', function() {
        document.getElementById('confirmBar').classList.remove('visible');
      });

      function tickTimer() {
        if (submitted) return;
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var box = document.getElementById('timerBox');
        if (durationLimit > 0) {
          var rem = Math.max(0, durationLimit - elapsed);
          box.textContent = fmtTime(rem);
          box.classList.toggle('urgent', rem <= 60);
          if (rem <= 0) gradeAndSubmit(true);
        } else {
          box.textContent = fmtTime(elapsed);
        }
      }

      renderExam();
      tickTimer();
      timerHandle = setInterval(tickTimer, 1000);
    })();
  </script>
</body>
</html>
