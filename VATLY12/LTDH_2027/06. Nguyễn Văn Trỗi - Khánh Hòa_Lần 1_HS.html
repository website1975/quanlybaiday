      "text": "Một học sinh thực hiện thí nghiệm khảo sát quá trình nóng chảy của một chậu nước đá. Cho nước đá và nước lạnh $0^{\\circ}$ C vào bình nhiệt lượng kế, sao cho toàn bộ điện trở chìm trong hỗn hợp nước và nước đá, tiến hành bật nguồn điện, ghi kết quả đo và vẽ đồ thị biểu diễn nhiệt độ của chậu nước đá theo thời gian như hình (đoạn nằm ngang ở $0^{\\circ}$ C đến điểm $M$ tại $\\tau = 600$ s, sau đó tăng lên). Biết khối lượng nước đá $m = 0,025$ kg và bỏ qua sự truyền nhiệt giữa nhiệt lượng kế với môi trường. Công suất trung bình tiêu thụ được xác định bằng oát kế là $14,25$ W.",
      "subQuestions": [
        {
          "id": "18939b67-c523-434c-81d6-fb85eb04ed75",
          "text": "Thời gian để nước đá nóng chảy hoàn toàn là $10 phút$.",
          "level": "VD",
          "correctAnswer": "True"
        },
        {
          "id": "5f987a78-a3b6-4fce-966a-2db720e430a0",
          "text": "Nước đá nóng chảy ở nhiệt độ $0^{\\circ}$ C.",
          "level": "VD",
          "correctAnswer": "True"
        },
        {
          "id": "eda1ba5f-5aec-4bec-84e3-1d3da2122e5d",
          "text": "Dựa vào đồ thị, nhiệt nóng chảy riêng của nước đá là $3,42.10^{5} J/kg.$",
          "level": "VD",
          "correctAnswer": "True"
        },
        {
          "id": "19802fe3-f8ec-445e-ac77-736c0508ca37",
          "text": "Dựa vào nhiệt nóng chảy riêng của nước đá tính được trong thí nghiệm trên. Nếu người ta cung cấp nhiệt lượng $10^{5}$ J và hiệu suất quá trình $80\\%$ thì khối lượng nước đá có thể làm nóng chảy hoàn toàn là $2,3$ kg.",
          "level": "VD",
          "correctAnswer": "False"
        }
      ],
      "solution": "a) Đúng: $\\tau = 600 s = 10 phút $. <br>\nb) Đúng: Quá trình nóng chảy xảy ra ở $0^{\\circ}$ C. <br>\nc) Đúng: $\\lambda = \\frac{Pt}{m} = \\frac{14,25 \\cdot 600}{0,025} = \\frac{8550}{0,025} = 3,42 \\cdot 10^5$ J/kg. <br>\nd) Sai: Nhiệt lượng có ích $Q_i = 0,8 \\cdot 10^5 = 80000$ J, khối lượng đá nóng chảy $m' = \\frac{80000}{3,42 \\cdot 10^5} \\approx 0,234$ kg (không phải $2,3$ kg).",
      "points": 1,
      "imageUrl": "https://kosgiekqtutjegalbxyq.supabase.co/storage/v1/object/public/quiz-images/f18fbd29-9247-4b13-bef8-3c2a13e49e6c.png",
      "chapterName": "Đề thi ĐH 2027"
    },
    {
      "id": "d7fe2b5e-c745-4ef4-93fb-fd93cfb26933",
      "index": 23,
      "type": "short",
      "level": "VD",
      "text": "Lò vi sóng hiện nay được sử dụng phổ biến trong nhà bếp để làm nóng nhanh thực phẩm. Nó bức xạ vi sóng có tần số $2500$ MHz được các phân tử nước hấp thụ. Các phân tử nước có sự phân bố điện tích không đối xứng nên bị điện trường trong bức xạ lò vi sóng làm cho dao động mạnh lên, nhiệt độ thực phẩm tăng lên. Chùm vi sóng có công suất $750$ W rã đông hoàn toàn $0,25$ kg súp đông ở nhiệt độ $-10^{\\circ}$ C. Coi rằng súp làm hoàn toàn bằng nước và toàn bộ năng lượng của chùm vi sóng dùng để rã đông súp. Nhiệt dung riêng của nước đá là $2100$ J/kg.K, nhiệt lượng cần thiết để làm nóng chảy $1$ kg nước đá ở $0^{\\circ}$ C thành nước ở $0^{\\circ}$ C là $334$ kJ. Thời gian để rã đông hoàn toàn súp là bao nhiêu giây? (kết quả làm tròn đến hàng đơn vị)",
      "correctAnswer": "118",
      "solution": "Nhiệt lượng cần cung cấp: $Q = m c_{đá} (0 - (-10)) + m \\lambda =  88750$ J. Thời gian cần thiết: $t = \\frac{Q}{P} = \\frac{88750}{750} \\approx 118,33 s \\approx 118$ s.",
      "points": 0.25,
      "chapterName": "Đề thi ĐH 2027"
    },
    {
      "id": "758c0e0c-a1d9-4c05-9c14-3e296a4e4eee",
      "index": 24,
      "type": "short",
      "level": "VD",
      "text": "Trong máy nước nóng năng lượng Mặt Trời, năng lượng từ Mặt Trời được thu thập bằng nước lưu thông qua các ống trong bộ thu trên mái nhà. Bức xạ Mặt Trời đi vào bộ thu qua lớp vỏ trong suốt và làm nóng nước trong ống. Hiệu suất của toàn bộ hệ thống là $20\\%$. Để tăng nhiệt độ của $100 lít$ nước trong bể từ $20^{\\circ}$ C đến $50^{\\circ}$ C trong $1 giờ$ khi cường độ ánh sáng Mặt Trời tới là $700 W/m^{2}$ cần diện tích tiếp xúc trực tiếp với ánh sáng Mặt Trời là bao nhiêu $m^{2}$. Biết khối lượng riêng của nước là $1000 kg/m^{3}$, nhiệt dung riêng của nước là $4190$ J/kg.K. (kết quả làm tròn đến hàng đơn vị)",
      "correctAnswer": "25",
      "solution": "$H.P.t = m.c\\Delta t \\Rightarrow H. I.S.t = m.c\\Delta t$ <br>\n$\\Rightarrow S=\\frac{m.c\\Delta t }{H.I.t} \\approx 25 m^2$",
      "points": 0.25,
      "chapterName": "Đề thi ĐH 2027"
    },
    {
      "id": "571c315b-28a5-4d19-a618-6df3f2a8ccb5",
      "index": 25,
      "type": "short",
      "level": "H",
      "text": "Hình bên mô tả mực chất lỏng trong một nhiệt kế đặt nằm ngang chưa được chia vạch. Trên nhiệt kế chỉ đánh dấu điểm đóng băng ($0^{\\circ}$ C tại mốc $64$ mm) và điểm sôi của nước tinh khiết ở áp suất chuẩn ($100^{\\circ}$ C tại mốc $88$ mm). Nhiệt kế đang chỉ bao nhiêu độ C?",
      "correctAnswer": "80",
      "solution": "$l = l_0+\\alpha.t\\Rightarrow \\alpha = \\frac{\\Delta l}{\\Delta t}$ <br>\n$\\alpha = \\frac{88-8}{100-0}=\\frac{64}{t-0}\\Rightarrow t = 80^0 C$",
      "points": 0.25,
      "imageUrl": "https://kosgiekqtutjegalbxyq.supabase.co/storage/v1/object/public/quiz-images/4e626f30-38f8-43c2-b0fd-59924a5d2f91.png",
      "chapterName": "Đề thi ĐH 2027"
    },
    {
      "id": "92b87599-9fa1-4327-9348-24e79567f668",
      "index": 26,
      "type": "short",
      "level": "VDC",
      "text": "Một viên đạn chì đang bay với tốc độ $v_{0}=180$ km/h đến tấm thép. Sau khi xuyên qua tấm thép, tốc độ viên đạn giảm còn $v=36$ km/h Nếu $65\\%$ lượng nội năng tăng lên đã chuyển hóa thành nhiệt lượng làm nóng viên đạn thì độ tăng nhiệt độ của viên đạn là bao nhiêu Kelvin (K)? (làm tròn đến hàng đơn vị). Cho nhiệt dung riêng của chì là $130$ J/kg.K.",
      "correctAnswer": "6",
      "solution": "Đổi tốc độ: $v_0 = 180 km/h = 50$ m/s, $v = 36 km/h = 10$ m/s. Độ giảm động năng chuyển hóa thành nội năng: $\\Delta U = \\frac{1}{2} m (v_0^2 - v^2) = 0,5 m (2500 - 100) = 1200 m (J)$. Nhiệt lượng làm nóng viên đạn: $Q = 0,65 \\cdot 1200 m = 780 m (J)$. Độ tăng nhiệt độ: $\\Delta T = \\frac{Q}{m c} = \\frac{780 m}{m \\cdot 130} = 6$ K.",
      "points": 0.25,
      "chapterName": "Đề thi ĐH 2027"
    },
    {
      "id": "70234813-b03e-4798-87dc-d09e231e04bb",
      "index": 27,
      "type": "short",
      "level": "B",
      "text": "Đồ thị bên là đường biểu diễn sự thay đổi nhiệt độ theo thời gian của một chất rắn kết tinh (từ $25^{\\circ}$ C tăng tuyến tính đến $1085^{\\circ}$ C tại $\\tau = 30$ phút, sau đó nằm ngang ở $1085^{\\circ}$ C từ $\\tau = 30$ phút đến $\\tau = 43,4$ phút, rồi tăng tiếp). Nhiệt độ nóng chảy của chất đó là bao nhiêu độ C?",
      "correctAnswer": "1085",
      "solution": "Trên đồ thị, quá trình nóng chảy diễn ra ở đoạn nằm ngang $BC$ tại nhiệt độ $1085^{\\circ}$ C (từ phút thứ $30$ đến phút thứ $43,4$).",
      "points": 0.25,
      "imageUrl": "https://kosgiekqtutjegalbxyq.supabase.co/storage/v1/object/public/quiz-images/ae4ed6c4-4c59-4913-b6f9-d7c427370e66.png",
      "chapterName": "Đề thi ĐH 2027"
    },
    {
      "id": "4335335a-597a-469c-8db4-d4bbdb00790e",
      "index": 28,
      "type": "short",
      "level": "VDC",
      "text": "Dùng bếp điện để đun một ấm nhôm có khối lượng $600$ gram đựng $1,5 lít$ nước ở nhiệt độ $20^{\\circ}$ C. Sau khi đun $15 phút  27 giây$ đã có $20\\%$ lượng nước trong ấm hóa hơi ở nhiệt độ $100^{\\circ}$ C. Biết chỉ có $75\\%$ nhiệt lượng mà bếp điện tỏa ra được dùng vào việc đun ấm nước. Cho nhiệt dung riêng của nhôm là $880$ J/kg.K, của nước là $4200$ J/kg.K, nhiệt hóa hơi riêng của nước ở nhiệt độ sôi $100^{\\circ}$ C là $2,26.10^{6}$ J/kg, khối lượng riêng của nước là $1 kg/lít$. Nhiệt lượng trung bình mà bếp điện tỏa ra trong mỗi giây là $x.10^3$ J/s. Tìm $x$. (làm tròn kết quả đến chữ số hàng phần trăm).",
      "correctAnswer": "1.76",
      "solution": "Thời gian đun: $t = 927$ s. Khối lượng nước $m_n = 1,5$ kg, ấm nhôm $m_{nl} = 0,6$ kg. Nhiệt lượng làm ấm và nước tăng từ $20^{\\circ}$ C lên $100^{\\circ}$ C: $Q_1 = (m_n \\cdot 4200 + m_{nl} \\cdot 880) \\cdot 80 = 546240$ J. <br>\nNhiệt lượng làm $20\\%$ nước (=$0,3$ kg) hóa hơi ở $100^{\\circ}$ C: $Q_2 = 0,3 \\cdot L = 678000$ J. <br>\nNhiệt lượng trung bình tỏa ra mỗi giây: $\\mathcal{P} = \\frac{Q_1+Q_2}{H.t} \\approx 1760,86 J/s \\approx 1,76 \\cdot 10^3$ J/s, suy ra $x \\approx 1,76$.",
      "points": 0.25,
      "chapterName": "Đề thi ĐH 2027"
    }
  ]

; Đồ thị (2) đường cong đi lên; Đồ thị (3) đường thẳng đi xuống; Đồ thị (4) đường nằm ngang)?","ownImageUrl":"https://kosgiekqtutjegalbxyq.supabase.co/storage/v1/object/public/quiz-images/d4bb6f14-c5c6-47f8-a603-9934a7ac7442.png","optionsHtml":["Đồ thị (1).","Đồ thị (4).","Đồ thị (2)","Đồ thị (3)."],"optionsRaw":["Đồ thị (1).","Đồ thị (4).","Đồ thị (2)","Đồ thị (3)."],"correctIndex":3,"correctAnswer":"Đồ thị (3).","subQuestions":[],"solutionHtml":"Trong quá trình hóa hơi, khối lượng nước còn lại trong bình giảm dần theo thời gian nên đồ thị $m$ theo $\\tau$ là đường đi xuống (Đồ thị (3)).","rawSolution":"Trong quá trình hóa hơi, khối lượng nước còn lại trong bình giảm dần theo thời gian nên đồ thị $m$ theo $\\tau$ là đường đi xuống (Đồ thị (3))."}]},{"blockId":"single_9864ca09-745b-4d68-8330-c75039d0b58d_5","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"9864ca09-745b-4d68-8330-c75039d0b58d","type":"mcq","level":"H","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Khi bắt đầu đun, nhiệt độ của vật rắn kết tinh tăng dần. Đến nhiệt độ xác định, sự nóng chảy diễn ra, vật chuyển từ thể rắn sang thể lỏng và nhiệt độ...(1)... dù tiếp tục đun. Sau khi toàn bộ vật chuyển sang thể lỏng, nhiệt độ của chất lỏng...(2)... khi tiếp tục đun. Chỗ trống (1) và (2) lần lượt là","rawText":"Khi bắt đầu đun, nhiệt độ của vật rắn kết tinh tăng dần. Đến nhiệt độ xác định, sự nóng chảy diễn ra, vật chuyển từ thể rắn sang thể lỏng và nhiệt độ...(1)... dù tiếp tục đun. Sau khi toàn bộ vật chuyển sang thể lỏng, nhiệt độ của chất lỏng...(2)... khi tiếp tục đun. Chỗ trống (1) và (2) lần lượt là","ownImageUrl":"","optionsHtml":["(1) không tăng và (2) tiếp tục tăng lên.","(1) không tăng và (2) giảm xuống.","(1) tăng lên và (2) tiếp tục tăng lên.","(1) giảm xuống và (2) không tăng."],"optionsRaw":["(1) không tăng và (2) tiếp tục tăng lên.","(1) không tăng và (2) giảm xuống.","(1) tăng lên và (2) tiếp tục tăng lên.","(1) giảm xuống và (2) không tăng."],"correctIndex":0,"correctAnswer":"(1) không tăng và (2) tiếp tục tăng lên.","subQuestions":[],"solutionHtml":"Trong suốt quá trình nóng chảy của chất rắn kết tinh, nhiệt độ không đổi (không tăng); sau khi nóng chảy hoàn toàn, nhiệt độ của chất lỏng tiếp tục tăng lên khi tiếp tục đun.","rawSolution":"Trong suốt quá trình nóng chảy của chất rắn kết tinh, nhiệt độ không đổi (không tăng); sau khi nóng chảy hoàn toàn, nhiệt độ của chất lỏng tiếp tục tăng lên khi tiếp tục đun."}]},{"blockId":"single_ce4ca9ec-0044-479c-b603-5ca0588ecc6e_6","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"ce4ca9ec-0044-479c-b603-5ca0588ecc6e","type":"mcq","level":"H","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Dùng tay nén pit-tông đồng thời nung nóng khí trong một xilanh. Dấu quy ước của $A$ và $Q$ trong biểu thức của nguyên lí I Nhiệt động lực học là","rawText":"Dùng tay nén pit-tông đồng thời nung nóng khí trong một xilanh. Dấu quy ước của $A$ và $Q$ trong biểu thức của nguyên lí I Nhiệt động lực học là","ownImageUrl":"","optionsHtml":["$A&gt;0$ $Q&gt;0$","$A&lt;0;$ $Q&lt;0$","$A&lt;0$ $Q&gt;0$","$A&gt;0;$ $Q&lt;0$"],"optionsRaw":["$A>0$ $Q>0$","$A<0;$ $Q<0$","$A<0$ $Q>0$","$A>0;$ $Q<0$"],"correctIndex":0,"correctAnswer":"$A>0$ $Q>0$","subQuestions":[],"solutionHtml":"Khí bị nén nên nhận công ($A &gt; 0$) và được nung nóng nên nhận nhiệt lượng ($Q &gt; 0$).","rawSolution":"Khí bị nén nên nhận công ($A > 0$) và được nung nóng nên nhận nhiệt lượng ($Q > 0$)."}]},{"blockId":"single_63b450d2-cd04-4084-89e9-b9368b6485f5_7","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"63b450d2-cd04-4084-89e9-b9368b6485f5","type":"mcq","level":"B","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Nhiệt dung riêng của đồng là $380$ J/kg.K, điều này cho biết","rawText":"Nhiệt dung riêng của đồng là $380$ J/kg.K, điều này cho biết","ownImageUrl":"","optionsHtml":["Nhiệt lượng cần thiết để làm cho $1$ kg đồng nóng lên thêm $1^{\\circ}$ C l ủa nhiệt hóa hơi riêng $L$ của chất lỏng ở một nhiệt độ xác định."}]},{"blockId":"single_9ad4f769-3a7b-48a5-a3e4-2e15036e477a_9","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"9ad4f769-3a7b-48a5-a3e4-2e15036e477a","type":"mcq","level":"B","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Trong công nghệ sản xuất nhôm, người ta làm cho quặng nhôm chuyển từ dạng rắn sang dạng lỏng trước khi điện phân. Quá trình chuyển thể này gọi là","rawText":"Trong công nghệ sản xuất nhôm, người ta làm cho quặng nhôm chuyển từ dạng rắn sang dạng lỏng trước khi điện phân. Quá trình chuyển thể này gọi là","ownImageUrl":"","optionsHtml":["hóa hơi.","nóng chảy.","ngưng tụ.","đông đặc."],"optionsRaw":["hóa hơi.","nóng chảy.","ngưng tụ.","đông đặc."],"correctIndex":1,"correctAnswer":"nóng chảy.","subQuestions":[],"solutionHtml":"Quá trình chuyển từ thể rắn sang thể lỏng là sự nóng chảy.","rawSolution":"Quá trình chuyển từ thể rắn sang thể lỏng là sự nóng chảy."}]},{"blockId":"single_934da305-ff29-4e1e-bcc5-621dd6c269cc_10","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"934da305-ff29-4e1e-bcc5-621dd6c269cc","type":"mcq","level":"H","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Với cùng một chất, quá trình chuyển thể nào sẽ làm giảm lực tương tác giữa các phân tử nhiều nhất?","rawText":"Với cùng một chất, quá trình chuyển thể nào sẽ làm giảm lực tương tác giữa các phân tử nhiều nhất?","ownImageUrl":"","optionsHtml":["Đông đặc.","Nóng chảy.","Hóa hơi.","Thăng hoa."],"optionsRaw":["Đông đặc.","Nóng chảy.","Hóa hơi.","Thăng hoa."],"correctIndex":3,"correctAnswer":"Thăng hoa.","subQuestions":[],"solutionHtml":"Quá trình hóa hơi làm khoảng cách phân tử tăng mạnh nhất, khiến lực tương tác giữa các phân tử giảm nhiều nhất khi chuyển Rắn - Khí","rawSolution":"Quá trình hóa hơi làm khoảng cách phân tử tăng mạnh nhất, khiến lực tương tác giữa các phân tử giảm nhiều nhất khi chuyển Rắn - Khí"}]},{"blockId":"single_4aebe5a0-4c74-45b7-8c7f-5db951beef86_11","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"4aebe5a0-4c74-45b7-8c7f-5db951beef86","type":"mcq","level":"H","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Khi một chất lỏng đang sôi mà ta tiếp tục cung cấp năng lượng ở áp suất không đổi thì năng lượng mà các phân tử chất lỏng nhận được lúc này dùng để","rawText":"Khi một chất lỏng đang sôi mà ta tiếp tục cung cấp năng lượng ở áp suất không đổi thì năng lượng mà các phân tử chất lỏng nhận được lúc này dùng để","ownImageUrl":"","optionsHtml":["giảm nhiệt độ của chất lỏng.","phá vỡ các liên kết với các phân tử xung quanh.","tạo ra lực liên kết với các phân tử xung quanh.","tăng nhiệt độ của chất lỏng."],"optionsRaw":["giảm nhiệt độ của chất lỏng.","phá vỡ các liên kết với các phân tử xung quanh.","tạo ra lực liên kết với các phân tử xung quanh.","tăng nhiệt độ của chất lỏng."],"correctIndex":1,"correctAnswer":"phá vỡ các liên kết với các phân tử xung quanh.","subQuestions":[],"solutionHtml":"Khi chất lỏng đang sôi ở áp suất không đổi, nhiệt độ không đổi; nhiệt lượng cung cấp dùng để thắng lực hút/phá vỡ liên kết giữa các phân tử chuyển sang thể khí.","rawSolution":"Khi chất lỏng đang sôi ở áp suất không đổi, nhiệt độ không đổi; nhiệt lượng cung cấp dùng để thắng lực hút/phá vỡ liên kết giữa các phân tử chuyển sang thể khí."}]},{"blockId":"single_db5836be-63b4-4794-9e74-6460d8e39848_12","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"db5836be-63b4-4794-9e74-6460d8e39848","type":"mcq","level":"H","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Khoảng $70\\%$ bề mặt của Trái Đất được bao phủ bởi nước. Vì có...(1)... nên lượng nước này có thể hấp thụ năng lượng nhiệt khổng lồ của năng lượng Mặt Trời mà vẫn giữ cho...(2)... của bề mặt Trái Đất tăng không nhanh và không nhiều, tạo điều kiện thuận lợi cho sự sống con người và các sinh vật khác. Khoảng trống (1) và (2) lần lượt là","rawText":"Khoảng $70\\%$ bề mặt của Trái Đất được bao phủ bởi nước. Vì có...(1)... nên lượng nước này có thể hấp thụ năng lượng nhiệt khổng lồ của năng lượng Mặt Trời mà vẫn giữ cho...(2)... của bề mặt Trái Đất tăng không nhanh và không nhiều, tạo điều kiện thuận lợi cho sự sống con người và các sinh vật khác. Khoảng trống (1) và (2) lần lượt là","ownImageUrl":"","optionsHtml":["&quot;nhiệt dung riêng lớn&quot;; &quot;áp suất&quot;.","&quot;nhiệt độ sôi lớn&quot;; &quot;nhiệt độ&quot;.","&quot;nhiệt dung riêng nhỏ&quot;; &quot;nhiệt độ&quot;.","&quot;nhiệt dung riêng lớn&quot;; &quot;nhiệt độ&quot;."],"optionsRaw":["\"nhiệt dung riêng lớn\"; \"áp suất\".","\"nhiệt độ sôi lớn\"; \"nhiệt độ\".","\"nhiệt dung riêng nhỏ\"; \"nhiệt độ\".","\"nhiệt dung riêng lớn\"; \"nhiệt độ\"."],"correctIndex":3,"correctAnswer":"\"nhiệt dung riêng lớn\"; \"nhiệt độ\".","subQuestions":[],"solutionHtml":"Nước có nhiệt dung riêng lớn nên hấp thụ nhiệt nhiều nhưng nhiệt độ tăng chậm, giúp điều hòa nhiệt độ bề mặt Trái Đất.","rawSolution":"Nước có nhiệt dung riêng lớn nên hấp thụ nhiệt nhiều nhưng nhiệt độ tăng chậm, giúp điều hòa nhiệt độ bề mặt Trái Đất."}]},{"blockId":"single_fedcdaf1-db50-47b3-ba5a-b35e0bb828cb_13","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"fedcdaf1-db50-47b3-ba5a-b35e0bb828cb","type":"mcq","level":"H","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Vào những ngày mùa đông lạnh, một học sinh thực hiện việc xoa nhanh hai lòng bàn tay vào nhau trong một khoảng thời gian ngắn và cảm thấy tay ấm lên. Chọn kết luận đúng?","rawText":"Vào những ngày mùa đông lạnh, một học sinh thực hiện việc xoa nhanh hai lòng bàn tay vào nhau trong một khoảng thời gian ngắn và cảm thấy tay ấm lên. Chọn kết luận đúng?","ownImageUrl":"","optionsHtml":["Bàn tay đã nhận nhiệt lượng từ cơ thể và ấm lên.","Nội năng của bàn tay tăng lên do nhận công.","Khi áp lòng bàn tay vào mặt, có sự truyền nhiệt lượng từ mặt vào bàn tay.","Nội năng của bàn tay tăng lên do thực hiện công."],"optionsRaw":["Bàn tay đã nhận nhiệt lượng từ cơ thể và ấm lên.","Nội năng của bàn tay tăng lên do nhận công.","Khi áp lòng bàn tay vào mặt, có sự truyền nhiệt lượng từ mặt vào bàn tay.","Nội năng của bàn tay tăng lên do thực hiện công."],"correctIndex":1,"correctAnswer":"Nội năng của bàn tay tăng lên do nhận công.","subQuestions":[],"solutionHtml":"Khi xoa hai lòng bàn tay vào nhau, lực ma sát thực hiện công làm tăng nội năng của bàn tay (bàn tay nhận công).","rawSolution":"Khi xoa hai lòng bàn tay vào nhau, lực ma sát thực hiện công làm tăng nội năng của bàn tay (bàn tay nhận công)."}]},{"blockId":"single_520ab099-2a38-45f7-a71c-28c49b61dcaa_14","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"520ab099-2a38-45f7-a71c-28c49b61dcaa","type":"mcq","level":"B","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Biểu thức chuyển đổi giữa thang nhiệt độ Celsius và thang nhiệt độ Kelvin (khi làm tròn số) là","rawText":"Biểu thức chuyển đổi giữa thang nhiệt độ Celsius và thang nhiệt độ Kelvin (khi làm tròn số) là","ownImageUrl":"","optionsHtml":["$T(K)=t(^{\\circ}C)+273.$","$T(K)=t(^{\\circ}C)+237.$","$T(K)=t(^{\\circ}C)+327$","$T(K)=t(^{\\circ}C)+372.$"],"optionsRaw":["$T(K)=t(^{\\circ}C)+273.$","$T(K)=t(^{\\circ}C)+237.$","$T(K)=t(^{\\circ}C)+327$","$T(K)=t(^{\\circ}C)+372.$"],"correctIndex":0,"correctAnswer":"$T(K)=t(^{\\circ}C)+273.$","subQuestions":[],"solutionHtml":"Công thức chuyển đổi làm tròn từ Celsius sang Kelvin là $T(K) = t(^{\\circ}C) + 273$.","rawSolution":"Công thức chuyển đổi làm tròn từ Celsius sang Kelvin là $T(K) = t(^{\\circ}C) + 273$."}]},{"blockId":"single_3a53c89f-906c-42cc-ba77-a4687cefd625_15","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"3a53c89f-906c-42cc-ba77-a4687cefd625","type":"mcq","level":"H","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Nhiệt lượng được truyền vào hỗn hợp nước đá để làm tan chảy một phần nước đá. Trong quá trình này, hỗn hợp nước đá","rawText":"Nhiệt lượng được truyền vào hỗn hợp nước đá để làm tan chảy một phần nước đá. Trong quá trình này, hỗn hợp nước đá","ownImageUrl":"","optionsHtml":["có nhiệt độ tăng và nội năng cũng tăng.","có nội năng tăng lên.","có nhiệt độ tăng lên.","thực hiện công."],"optionsRaw":["có nhiệt độ tăng và nội năng cũng tăng.","có nội năng tăng lên.","có nhiệt độ tăng lên.","thực hiện công."],"correctIndex":1,"correctAnswer":"có nội năng tăng lên.","subQuestions":[],"solutionHtml":"Hỗn hợp nhận nhiệt lượng nên nội năng tăng lên, còn nhiệt độ giữ không đổi ở $0^{\\circ}$ C trong khi nước đá đang tan.","rawSolution":"Hỗn hợp nhận nhiệt lượng nên nội năng tăng lên, còn nhiệt độ giữ không đổi ở $0^{\\circ}$ C trong khi nước đá đang tan."}]},{"blockId":"single_95fe4cc7-1d41-41f9-bef7-a7f982a035dc_16","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"95fe4cc7-1d41-41f9-bef7-a7f982a035dc","type":"mcq","level":"B","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Nội năng của một vật là","rawText":"Nội năng của một vật là","ownImageUrl":"","optionsHtml":["tổng động năng và thế năng của các phân tử cấu tạo nên vật.","nhiệt lượng vật nhận được trong quá trình truyền nhiệt.","tổng động năng và thế năng của vật.","tổng nhiệt lượng và cơ năng mà vật nhận được trong quá trình truyền nhiệt và thực hiện công."],"optionsRaw":["tổng động năng và thế năng của các phân tử cấu tạo nên vật.","nhiệt lượng vật nhận được trong quá trình truyền nhiệt.","tổng động năng và thế năng của vật.","tổng nhiệt lượng và cơ năng mà vật nhận được trong quá trình truyền nhiệt và thực hiện công."],"correctIndex":0,"correctAnswer":"tổng động năng và thế năng của các phân tử cấu tạo nên vật.","subQuestions":[],"solutionHtml":"Nội năng là tổng động năng chuyển động nhiệt và thế năng tương tác của các phân tử cấu tạo nên vật.","rawSolution":"Nội năng là tổng động năng chuyển động nhiệt và thế năng tương tác của các phân tử cấu tạo nên vật."}]},{"blockId":"single_35b47aa4-f1fb-40e8-896a-d083716ff4d7_17","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"35b47aa4-f1fb-40e8-896a-d083716ff4d7","type":"mcq","level":"B","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Nhiệt kế nào sau đây hoạt động dựa trên hiện tượng giãn nở vì nhiệt của chất lỏng?","rawText":"Nhiệt kế nào sau đây hoạt động dựa trên hiện tượng giãn nở vì nhiệt của chất lỏng?","ownImageUrl":"","optionsHtml":["Nhiệt kế điện tử.","Nhiệt kế kim loại.","Nhiệt kế thủy ngân.","Nhiệt kế hồng ngoại."],"optionsRaw":["Nhiệt kế điện tử.","Nhiệt kế kim loại.","Nhiệt kế thủy ngân.","Nhiệt kế hồng ngoại."],"correctIndex":2,"correctAnswer":"Nhiệt kế thủy ngân.","subQuestions":[],"solutionHtml":"Nhiệt kế thủy ngân sử dụng sự giãn nở vì nhiệt của chất lỏng (thủy ngân) để đo nhiệt độ.","rawSolution":"Nhiệt kế thủy ngân sử dụng sự giãn nở vì nhiệt của chất lỏng (thủy ngân) để đo nhiệt độ."}]},{"blockId":"single_019b4255-0fa6-49ae-b99a-19690bcc268b_18","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"019b4255-0fa6-49ae-b99a-19690bcc268b","type":"group-tf","level":"VD","chapterName":"Đề thi ĐH 2027","points":1,"textHtml":"Một lượng khí chứa trong một xilanh có pít-tông di chuyển được. Ở trạng thái cân bằng, chất khí chiếm thể tích $V$ ($m^{3}$) và tác dụng lên pít-tông một áp suất $4.10^{5} N/m^{2}$. Truyền cho khí nhiệt lượng $1000$ J, khí giãn nở đẩy pít-tông lên làm thể tích khí tăng thêm $0,0015 m^3$. Coi rằng áp suất chất khí không đổi.","rawText":"Một lượng khí chứa trong một xilanh có pít-tông di chuyển được. Ở trạng thái cân bằng, chất khí chiếm thể tích $V$ ($m^{3}$) và tác dụng lên pít-tông một áp suất $4.10^{5} N/m^{2}$. Truyền cho khí nhiệt lượng $1000$ J, khí giãn nở đẩy pít-tông lên làm thể tích khí tăng thêm $0,0015 m^3$. Coi rằng áp suất chất khí không đổi.","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"af33f673-4e2b-42ad-8263-b53af3b24aab","level":"VD","textHtml":"Theo quy ước dấu trong hệ thức định luật I nhiệt động lực học, khối khí nhận nhiệt và sinh công thì $Q&gt;0$ $A&gt;0$.","rawText":"Theo quy ước dấu trong hệ thức định luật I nhiệt động lực học, khối khí nhận nhiệt và sinh công thì $Q>0$ $A>0$.","correctAnswer":"False"},{"id":"1f799ba9-2b77-4d1f-82d0-7927f08c9234","level":"VD","textHtml":"Lượng khí bên trong xilanh nhận nhiệt và sinh công làm biến đổi nội năng.","rawText":"Lượng khí bên trong xilanh nhận nhiệt và sinh công làm biến đổi nội năng.","correctAnswer":"True"},{"id":"4a1da213-37a8-476b-87a3-635947a93433","level":"VD","textHtml":"Công mà khối khí thực hiện có độ lớn bằng $600$ J.","rawText":"Công mà khối khí thực hiện có độ lớn bằng $600$ J.","correctAnswer":"True"},{"id":"2a5cbf12-e6a6-49a1-9459-a6dc80257783","level":"VD","textHtml":"Độ biến thiên nội năng của khối khí $1600$ J.","rawText":"Độ biến thiên nội năng của khối khí $1600$ J.","correctAnswer":"False"}],"solutionHtml":"a) Sai: Khí nhận nhiệt thì $Q &gt; 0$, nhưng khí sinh công thì công hệ nhận là $A &lt; 0$. b) Đúng: Khí nhận nhiệt và giãn nở sinh công làm nội năng biến đổi. c) Đúng: Độ lớn công khí thực hiện là $|A| = p \\cdot \\Delta V = 4 \\cdot 10^5 \\cdot 0,0015 = 600$ J. d) Sai: Độ biến thiên nội năng $\\Delta U = A + Q = -600 + 1000 = 400$ J (không phải $1600$ J).","rawSolution":"a) Sai: Khí nhận nhiệt thì $Q > 0$, nhưng khí sinh công thì công hệ nhận là $A < 0$. b) Đúng: Khí nhận nhiệt và giãn nở sinh công làm nội năng biến đổi. c) Đúng: Độ lớn công khí thực hiện là $|A| = p \\cdot \\Delta V = 4 \\cdot 10^5 \\cdot 0,0015 = 600$ J. d) Sai: Độ biến thiên nội năng $\\Delta U = A + Q = -600 + 1000 = 400$ J (không phải $1600$ J)."}]},{"blockId":"single_688c2a35-d748-4263-be11-78bd154454ec_19","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"688c2a35-d748-4263-be11-78bd154454ec","type":"group-tf","level":"VD","chapterName":"Đề thi ĐH 2027","points":1,"textHtml":"Một nhóm học sinh thực hiện thí nghiệm thực hành đo nhiệt hóa hơi riêng của nước ở nhiệt độ sôi. Họ lựa chọn phương án sử dụng ấm siêu tốc công suất $P=1200$ W có vỏ cách nhiệt tốt để đun sôi nước. Họ tiến hành các bước như sau: Lấy một lượng nước vào ấm, đặt ấm lên cân điện tử và bắt đầu đun. Khi nước trong ấm sôi, thấy cân chỉ khối lượng $m_{0}=528$ g thì bắt đầu dùng đồng hồ đo thời gian. Sau thời gian $6 phút$, ghi nhận số chỉ của cân điện tử là $m=358$ g. Coi toàn bộ năng lượng cung cấp bởi dây đun đều dẫn đến sự bay hơi của nước.","rawText":"Một nhóm học sinh thực hiện thí nghiệm thực hành đo nhiệt hóa hơi riêng của nước ở nhiệt độ sôi. Họ lựa chọn phương án sử dụng ấm siêu tốc công suất $P=1200$ W có vỏ cách nhiệt tốt để đun sôi nước. Họ tiến hành các bước như sau: Lấy một lượng nước vào ấm, đặt ấm lên cân điện tử và bắt đầu đun. Khi nước trong ấm sôi, thấy cân chỉ khối lượng $m_{0}=528$ g thì bắt đầu dùng đồng hồ đo thời gian. Sau thời gian $6 phút$, ghi nhận số chỉ của cân điện tử là $m=358$ g. Coi toàn bộ năng lượng cung cấp bởi dây đun đều dẫn đến sự bay hơi của nước.","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"4875d51d-0447-4617-848d-b7873c7132c3","level":"VD","textHtml":"Nhiệt hóa hơi riêng của nước được xác định bằng công thức: $L=\\frac{P.\\tau}{\\Delta m}$ , $\\Delta m$ là khối lượng nước bị bay hơi sau thời gian $\\tau$.","rawText":"Nhiệt hóa hơi riêng của nước được xác định bằng công thức: $L=\\frac{P.\\tau}{\\Delta m}$ , $\\Delta m$ là khối lượng nước bị bay hơi sau thời gian $\\tau$.","correctAnswer":"True"},{"id":"cf559098-fd60-4f64-abda-503e8fde7d12","level":"VD","textHtml":"Khi nước trong ấm sôi, nhóm học sinh phải đóng kín nắp ấm để giảm hao phí ra môi trường.","rawText":"Khi nước trong ấm sôi, nhóm học sinh phải đóng kín nắp ấm để giảm hao phí ra môi trường.","correctAnswer":"False"},{"id":"ce55a549-6ab9-4847-af61-75ccc584435c","level":"VD","textHtml":"Giá trị nhiệt hóa hơi riêng $L$ của nước xấp xỉ là $2,54.10^{6} J/kg.$","rawText":"Giá trị nhiệt hóa hơi riêng $L$ của nước xấp xỉ là $2,54.10^{6} J/kg.$","correctAnswer":"True"},{"id":"b7c5519b-a112-4515-9dfe-d417079f699c","level":"VD","textHtml":"Nếu một phần năng lượng từ dây đun bị thất thoát ra ngoài môi trường xung quanh và không góp phần làm nước bốc hơi thì giá trị nhiệt hóa hơi riêng của nước thu được theo công thức ở ý a lớn hơn giá trị nhiệt hóa hơi riêng thực tế của nước.","rawText":"Nếu một phần năng lượng từ dây đun bị thất thoát ra ngoài môi trường xung quanh và không góp phần làm nước bốc hơi thì giá trị nhiệt hóa hơi riêng của nước thu được theo công thức ở ý a lớn hơn giá trị nhiệt hóa hơi riêng thực tế của nước.","correctAnswer":"True"}],"solutionHtml":"a) Đúng: $Q = P\\tau = \\Delta m \\cdot L \\Rightarrow L = \\frac{P\\tau}{\\Delta m}$. b) Sai: Khi đo hóa hơi cần mở nắp để hơi nước thoát ra dễ dàng và an toàn (tránh tăng áp suất trong ấm kín). c) Đúng: $\\tau = 6 \\cdot 60 = 360$ s, $\\Delta m = (528 - 358) \\cdot 10^{-3} = 0,17$ kg, suy ra $L = \\frac{1200 \\cdot 360}{0,17} = \\frac{432000}{0,17} \\approx 2,541 \\cdot 10^6 J/kg \\approx 2,54 \\cdot 10^6$ J/kg. d) Đúng: $\\Delta m$ thực tế nhỏ hơn nên tính theo $L = \\frac{P\\tau}{\\Delta m}$ sẽ cho giá trị lớn hơn giá trị thực.","rawSolution":"a) Đúng: $Q = P\\tau = \\Delta m \\cdot L \\Rightarrow L = \\frac{P\\tau}{\\Delta m}$. b) Sai: Khi đo hóa hơi cần mở nắp để hơi nước thoát ra dễ dàng và an toàn (tránh tăng áp suất trong ấm kín). c) Đúng: $\\tau = 6 \\cdot 60 = 360$ s, $\\Delta m = (528 - 358) \\cdot 10^{-3} = 0,17$ kg, suy ra $L = \\frac{1200 \\cdot 360}{0,17} = \\frac{432000}{0,17} \\approx 2,541 \\cdot 10^6 J/kg \\approx 2,54 \\cdot 10^6$ J/kg. d) Đúng: $\\Delta m$ thực tế nhỏ hơn nên tính theo $L = \\frac{P\\tau}{\\Delta m}$ sẽ cho giá trị lớn hơn giá trị thực."}]},{"blockId":"single_604ccd16-42b3-4f6d-bf61-45596655d14e_20","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"604ccd16-42b3-4f6d-bf61-45596655d14e","type":"group-tf","level":"VD","chapterName":"Đề thi ĐH 2027","points":1,"textHtml":"Để xác định nhiệt dung riêng của nước, một học sinh tiến hành thí nghiệm theo sơ đồ nguyên lí như hình vẽ bên (gồm biến thế nguồn, Watt kế, nhiệt lượng kế, dây điện trở). Đổ một lượng nước vào bình nhiệt lượng kế, sao cho toàn bộ dây điện trở chìm trong nước. Dòng điện làm nóng dây điện trở trong một nhiệt lượng kế và làm nóng nước, bình nhiệt lượng kế cách nhiệt. Công suất tiêu thụ điện đo bằng Oát kế có chức năng đo thời gian. Bỏ qua sự trao đổi nhiệt với môi trường xung quanh.","rawText":"Để xác định nhiệt dung riêng của nước, một học sinh tiến hành thí nghiệm theo sơ đồ nguyên lí như hình vẽ bên (gồm biến thế nguồn, Watt kế, nhiệt lượng kế, dây điện trở). Đổ một lượng nước vào bình nhiệt lượng kế, sao cho toàn bộ dây điện trở chìm trong nước. Dòng điện làm nóng dây điện trở trong một nhiệt lượng kế và làm nóng nước, bình nhiệt lượng kế cách nhiệt. Công suất tiêu thụ điện đo bằng Oát kế có chức năng đo thời gian. Bỏ qua sự trao đổi nhiệt với môi trường xung quanh.","ownImageUrl":"https://kosgiekqtutjegalbxyq.supabase.co/storage/v1/object/public/quiz-images/cef4647e-bfcf-46a5-b7dc-d399ab169680.png","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"8b92a0e0-2fd1-4fc5-b49e-83e44710f2cf","level":"VD","textHtml":"Độ lớn của nhiệt lượng cần cung cấp cho nước để làm tăng nhiệt độ của nước chỉ phụ thuộc vào khối lượng của nước, nhiệt dung riêng của nước.","rawText":"Độ lớn của nhiệt lượng cần cung cấp cho nước để làm tăng nhiệt độ của nước chỉ phụ thuộc vào khối lượng của nước, nhiệt dung riêng của nước.","correctAnswer":"False"},{"id":"c1923f4d-0428-4346-8793-e8bdbae80ed1","level":"VD","textHtml":"Theo phương án này, để đo nhiệt dung riêng của nước cần đo công suất, thời gian, khối lượng nước và độ tăng nhiệt độ của nước.","rawText":"Theo phương án này, để đo nhiệt dung riêng của nước cần đo công suất, thời gian, khối lượng nước và độ tăng nhiệt độ của nước.","correctAnswer":"True"},{"id":"466cf41d-09c0-4f20-853c-7e0891ee0520","level":"VD","textHtml":"Nhiệt dung riêng của nước là nhiệt lượng cần cung cấp để $1$ kg nước tăng thêm $1$ K.","rawText":"Nhiệt dung riêng của nước là nhiệt lượng cần cung cấp để $1$ kg nước tăng thêm $1$ K.","correctAnswer":"True"},{"id":"48d63c05-146a-48f0-91e3-b11b32e62fd2","level":"VD","textHtml":"Biết nhiệt lượng kế chứa $0,2$ kg nước, oát kế chỉ $18,5$ W sau thời gian $3 phút$ thì nhiệt độ của nước tăng thêm $4^{\\circ}$ C. Nhiệt dung riêng của nước đo được trong thí nghiệm này là $4262$ J/kg.K.","rawText":"Biết nhiệt lượng kế chứa $0,2$ kg nước, oát kế chỉ $18,5$ W sau thời gian $3 phút$ thì nhiệt độ của nước tăng thêm $4^{\\circ}$ C. Nhiệt dung riêng của nước đo được trong thí nghiệm này là $4262$ J/kg.K.","correctAnswer":"False"}],"solutionHtml":"a) Sai: $Q = mc\\Delta T$ còn phụ thuộc vào độ tăng nhiệt độ $\\Delta T$. b) Đúng: $c = \\frac{Pt}{m\\Delta T}$. c) Đúng: Định nghĩa nhiệt dung riêng. d) Sai: $c = \\frac{18,5 \\cdot 180}{0,2 \\cdot 4} = \\frac{3330}{0,8} = 4162,5 J/(kg.K)$ (làm tròn $4163 J/(kg.K)$, không phải $4262$ J/kg.K).","rawSolution":"a) Sai: $Q = mc\\Delta T$ còn phụ thuộc vào độ tăng nhiệt độ $\\Delta T$. b) Đúng: $c = \\frac{Pt}{m\\Delta T}$. c) Đúng: Định nghĩa nhiệt dung riêng. d) Sai: $c = \\frac{18,5 \\cdot 180}{0,2 \\cdot 4} = \\frac{3330}{0,8} = 4162,5 J/(kg.K)$ (làm tròn $4163 J/(kg.K)$, không phải $4262$ J/kg.K)."}]},{"blockId":"single_70e827de-a5d9-4356-8372-2da6d2bab618_21","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"70e827de-a5d9-4356-8372-2da6d2bab618","type":"group-tf","level":"VD","chapterName":"Đề thi ĐH 2027","points":1,"textHtml":"Một học sinh thực hiện thí nghiệm khảo sát quá trình nóng chảy của một chậu nước đá. Cho nước đá và nước lạnh $0^{\\circ}$ C vào bình nhiệt lượng kế, sao cho toàn bộ điện trở chìm trong hỗn hợp nước và nước đá, tiến hành bật nguồn điện, ghi kết quả đo và vẽ đồ thị biểu diễn nhiệt độ của chậu nước đá theo thời gian như hình (đoạn nằm ngang ở $0^{\\circ}$ C đến điểm $M$ tại $\\tau = 600$ s, sau đó tăng lên). Biết khối lượng nước đá $m = 0,025$ kg và bỏ qua sự truyền nhiệt giữa nhiệt lượng kế với môi trường. Công suất trung bình tiêu thụ được xác định bằng oát kế là $14,25$ W.","rawText":"Một học sinh thực hiện thí nghiệm khảo sát quá trình nóng chảy của một chậu nước đá. Cho nước đá và nước lạnh $0^{\\circ}$ C vào bình nhiệt lượng kế, sao cho toàn bộ điện trở chìm trong hỗn hợp nước và nước đá, tiến hành bật nguồn điện, ghi kết quả đo và vẽ đồ thị biểu diễn nhiệt độ của chậu nước đá theo thời gian như hình (đoạn nằm ngang ở $0^{\\circ}$ C đến điểm $M$ tại $\\tau = 600$ s, sau đó tăng lên). Biết khối lượng nước đá $m = 0,025$ kg và bỏ qua sự truyền nhiệt giữa nhiệt lượng kế với môi trường. Công suất trung bình tiêu thụ được xác định bằng oát kế là $14,25$ W.","ownImageUrl":"https://kosgiekqtutjegalbxyq.supabase.co/storage/v1/object/public/quiz-images/f18fbd29-9247-4b13-bef8-3c2a13e49e6c.png","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"18939b67-c523-434c-81d6-fb85eb04ed75","level":"VD","textHtml":"Thời gian để nước đá nóng chảy hoàn toàn là $10 phút$.","rawText":"Thời gian để nước đá nóng chảy hoàn toàn là $10 phút$.","correctAnswer":"True"},{"id":"5f987a78-a3b6-4fce-966a-2db720e430a0","level":"VD","textHtml":"Nước đá nóng chảy ở nhiệt độ $0^{\\circ}$ C.","rawText":"Nước đá nóng chảy ở nhiệt độ $0^{\\circ}$ C.","correctAnswer":"True"},{"id":"eda1ba5f-5aec-4bec-84e3-1d3da2122e5d","level":"VD","textHtml":"Dựa vào đồ thị, nhiệt nóng chảy riêng của nước đá là $3,42.10^{5} J/kg.$","rawText":"Dựa vào đồ thị, nhiệt nóng chảy riêng của nước đá là $3,42.10^{5} J/kg.$","correctAnswer":"True"},{"id":"19802fe3-f8ec-445e-ac77-736c0508ca37","level":"VD","textHtml":"Dựa vào nhiệt nóng chảy riêng của nước đá tính được trong thí nghiệm trên. Nếu người ta cung cấp nhiệt lượng $10^{5}$ J và hiệu suất quá trình $80\\%$ thì khối lượng nước đá có thể làm nóng chảy hoàn toàn là $2,3$ kg.","rawText":"Dựa vào nhiệt nóng chảy riêng của nước đá tính được trong thí nghiệm trên. Nếu người ta cung cấp nhiệt lượng $10^{5}$ J và hiệu suất quá trình $80\\%$ thì khối lượng nước đá có thể làm nóng chảy hoàn toàn là $2,3$ kg.","correctAnswer":"False"}],"solutionHtml":"a) Đúng: $\\tau = 600 s = 10 phút $. <br><br>b) Đúng: Quá trình nóng chảy xảy ra ở $0^{\\circ}$ C. <br><br>c) Đúng: $\\lambda = \\frac{Pt}{m} = \\frac{14,25 \\cdot 600}{0,025} = \\frac{8550}{0,025} = 3,42 \\cdot 10^5$ J/kg. <br><br>d) Sai: Nhiệt lượng có ích $Q_i = 0,8 \\cdot 10^5 = 80000$ J, khối lượng đá nóng chảy $m&#39; = \\frac{80000}{3,42 \\cdot 10^5} \\approx 0,234$ kg (không phải $2,3$ kg).","rawSolution":"a) Đúng: $\\tau = 600 s = 10 phút $. <br>\nb) Đúng: Quá trình nóng chảy xảy ra ở $0^{\\circ}$ C. <br>\nc) Đúng: $\\lambda = \\frac{Pt}{m} = \\frac{14,25 \\cdot 600}{0,025} = \\frac{8550}{0,025} = 3,42 \\cdot 10^5$ J/kg. <br>\nd) Sai: Nhiệt lượng có ích $Q_i = 0,8 \\cdot 10^5 = 80000$ J, khối lượng đá nóng chảy $m' = \\frac{80000}{3,42 \\cdot 10^5} \\approx 0,234$ kg (không phải $2,3$ kg)."}]},{"blockId":"single_d7fe2b5e-c745-4ef4-93fb-fd93cfb26933_22","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"d7fe2b5e-c745-4ef4-93fb-fd93cfb26933","type":"short","level":"VD","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Lò vi sóng hiện nay được sử dụng phổ biến trong nhà bếp để làm nóng nhanh thực phẩm. Nó bức xạ vi sóng có tần số $2500$ MHz được các phân tử nước hấp thụ. Các phân tử nước có sự phân bố điện tích không đối xứng nên bị điện trường trong bức xạ lò vi sóng làm cho dao động mạnh lên, nhiệt độ thực phẩm tăng lên. Chùm vi sóng có công suất $750$ W rã đông hoàn toàn $0,25$ kg súp đông ở nhiệt độ $-10^{\\circ}$ C. Coi rằng súp làm hoàn toàn bằng nước và toàn bộ năng lượng của chùm vi sóng dùng để rã đông súp. Nhiệt dung riêng của nước đá là $2100$ J/kg.K, nhiệt lượng cần thiết để làm nóng chảy $1$ kg nước đá ở $0^{\\circ}$ C thành nước ở $0^{\\circ}$ C là $334$ kJ. Thời gian để rã đông hoàn toàn súp là bao nhiêu giây? (kết quả làm tròn đến hàng đơn vị)","rawText":"Lò vi sóng hiện nay được sử dụng phổ biến trong nhà bếp để làm nóng nhanh thực phẩm. Nó bức xạ vi sóng có tần số $2500$ MHz được các phân tử nước hấp thụ. Các phân tử nước có sự phân bố điện tích không đối xứng nên bị điện trường trong bức xạ lò vi sóng làm cho dao động mạnh lên, nhiệt độ thực phẩm tăng lên. Chùm vi sóng có công suất $750$ W rã đông hoàn toàn $0,25$ kg súp đông ở nhiệt độ $-10^{\\circ}$ C. Coi rằng súp làm hoàn toàn bằng nước và toàn bộ năng lượng của chùm vi sóng dùng để rã đông súp. Nhiệt dung riêng của nước đá là $2100$ J/kg.K, nhiệt lượng cần thiết để làm nóng chảy $1$ kg nước đá ở $0^{\\circ}$ C thành nước ở $0^{\\circ}$ C là $334$ kJ. Thời gian để rã đông hoàn toàn súp là bao nhiêu giây? (kết quả làm tròn đến hàng đơn vị)","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"118","subQuestions":[],"solutionHtml":"Nhiệt lượng cần cung cấp: $Q = m c_{đá} (0 - (-10)) + m \\lambda =  88750$ J. Thời gian cần thiết: $t = \\frac{Q}{P} = \\frac{88750}{750} \\approx 118,33 s \\approx 118$ s.","rawSolution":"Nhiệt lượng cần cung cấp: $Q = m c_{đá} (0 - (-10)) + m \\lambda =  88750$ J. Thời gian cần thiết: $t = \\frac{Q}{P} = \\frac{88750}{750} \\approx 118,33 s \\approx 118$ s."}]},{"blockId":"single_758c0e0c-a1d9-4c05-9c14-3e296a4e4eee_23","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"758c0e0c-a1d9-4c05-9c14-3e296a4e4eee","type":"short","level":"VD","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Trong máy nước nóng năng lượng Mặt Trời, năng lượng từ Mặt Trời được thu thập bằng nước lưu thông qua các ống trong bộ thu trên mái nhà. Bức xạ Mặt Trời đi vào bộ thu qua lớp vỏ trong suốt và làm nóng nước trong ống. Hiệu suất của toàn bộ hệ thống là $20\\%$. Để tăng nhiệt độ của $100 lít$ nước trong bể từ $20^{\\circ}$ C đến $50^{\\circ}$ C trong $1 giờ$ khi cường độ ánh sáng Mặt Trời tới là $700 W/m^{2}$ cần diện tích tiếp xúc trực tiếp với ánh sáng Mặt Trời là bao nhiêu $m^{2}$. Biết khối lượng riêng của nước là $1000 kg/m^{3}$, nhiệt dung riêng của nước là $4190$ J/kg.K. (kết quả làm tròn đến hàng đơn vị)","rawText":"Trong máy nước nóng năng lượng Mặt Trời, năng lượng từ Mặt Trời được thu thập bằng nước lưu thông qua các ống trong bộ thu trên mái nhà. Bức xạ Mặt Trời đi vào bộ thu qua lớp vỏ trong suốt và làm nóng nước trong ống. Hiệu suất của toàn bộ hệ thống là $20\\%$. Để tăng nhiệt độ của $100 lít$ nước trong bể từ $20^{\\circ}$ C đến $50^{\\circ}$ C trong $1 giờ$ khi cường độ ánh sáng Mặt Trời tới là $700 W/m^{2}$ cần diện tích tiếp xúc trực tiếp với ánh sáng Mặt Trời là bao nhiêu $m^{2}$. Biết khối lượng riêng của nước là $1000 kg/m^{3}$, nhiệt dung riêng của nước là $4190$ J/kg.K. (kết quả làm tròn đến hàng đơn vị)","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"25","subQuestions":[],"solutionHtml":"$H.P.t = m.c\\Delta t \\Rightarrow H. I.S.t = m.c\\Delta t$ <br><br>$\\Rightarrow S=\\frac{m.c\\Delta t }{H.I.t} \\approx 25 m^2$","rawSolution":"$H.P.t = m.c\\Delta t \\Rightarrow H. I.S.t = m.c\\Delta t$ <br>\n$\\Rightarrow S=\\frac{m.c\\Delta t }{H.I.t} \\approx 25 m^2$"}]},{"blockId":"single_571c315b-28a5-4d19-a618-6df3f2a8ccb5_24","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"571c315b-28a5-4d19-a618-6df3f2a8ccb5","type":"short","level":"H","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Hình bên mô tả mực chất lỏng trong một nhiệt kế đặt nằm ngang chưa được chia vạch. Trên nhiệt kế chỉ đánh dấu điểm đóng băng ($0^{\\circ}$ C tại mốc $64$ mm) và điểm sôi của nước tinh khiết ở áp suất chuẩn ($100^{\\circ}$ C tại mốc $88$ mm). Nhiệt kế đang chỉ bao nhiêu độ C?","rawText":"Hình bên mô tả mực chất lỏng trong một nhiệt kế đặt nằm ngang chưa được chia vạch. Trên nhiệt kế chỉ đánh dấu điểm đóng băng ($0^{\\circ}$ C tại mốc $64$ mm) và điểm sôi của nước tinh khiết ở áp suất chuẩn ($100^{\\circ}$ C tại mốc $88$ mm). Nhiệt kế đang chỉ bao nhiêu độ C?","ownImageUrl":"https://kosgiekqtutjegalbxyq.supabase.co/storage/v1/object/public/quiz-images/4e626f30-38f8-43c2-b0fd-59924a5d2f91.png","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"80","subQuestions":[],"solutionHtml":"$l = l_0+\\alpha.t\\Rightarrow \\alpha = \\frac{\\Delta l}{\\Delta t}$ <br><br>$\\alpha = \\frac{88-8}{100-0}=\\frac{64}{t-0}\\Rightarrow t = 80^0 C$","rawSolution":"$l = l_0+\\alpha.t\\Rightarrow \\alpha = \\frac{\\Delta l}{\\Delta t}$ <br>\n$\\alpha = \\frac{88-8}{100-0}=\\frac{64}{t-0}\\Rightarrow t = 80^0 C$"}]},{"blockId":"single_92b87599-9fa1-4327-9348-24e79567f668_25","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"92b87599-9fa1-4327-9348-24e79567f668","type":"short","level":"VDC","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Một viên đạn chì đang bay với tốc độ $v_{0}=180$ km/h đến tấm thép. Sau khi xuyên qua tấm thép, tốc độ viên đạn giảm còn $v=36$ km/h Nếu $65\\%$ lượng nội năng tăng lên đã chuyển hóa thành nhiệt lượng làm nóng viên đạn thì độ tăng nhiệt độ của viên đạn là bao nhiêu Kelvin (K)? (làm tròn đến hàng đơn vị). Cho nhiệt dung riêng của chì là $130$ J/kg.K.","rawText":"Một viên đạn chì đang bay với tốc độ $v_{0}=180$ km/h đến tấm thép. Sau khi xuyên qua tấm thép, tốc độ viên đạn giảm còn $v=36$ km/h Nếu $65\\%$ lượng nội năng tăng lên đã chuyển hóa thành nhiệt lượng làm nóng viên đạn thì độ tăng nhiệt độ của viên đạn là bao nhiêu Kelvin (K)? (làm tròn đến hàng đơn vị). Cho nhiệt dung riêng của chì là $130$ J/kg.K.","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"6","subQuestions":[],"solutionHtml":"Đổi tốc độ: $v_0 = 180 km/h = 50$ m/s, $v = 36 km/h = 10$ m/s. Độ giảm động năng chuyển hóa thành nội năng: $\\Delta U = \\frac{1}{2} m (v_0^2 - v^2) = 0,5 m (2500 - 100) = 1200 m (J)$. Nhiệt lượng làm nóng viên đạn: $Q = 0,65 \\cdot 1200 m = 780 m (J)$. Độ tăng nhiệt độ: $\\Delta T = \\frac{Q}{m c} = \\frac{780 m}{m \\cdot 130} = 6$ K.","rawSolution":"Đổi tốc độ: $v_0 = 180 km/h = 50$ m/s, $v = 36 km/h = 10$ m/s. Độ giảm động năng chuyển hóa thành nội năng: $\\Delta U = \\frac{1}{2} m (v_0^2 - v^2) = 0,5 m (2500 - 100) = 1200 m (J)$. Nhiệt lượng làm nóng viên đạn: $Q = 0,65 \\cdot 1200 m = 780 m (J)$. Độ tăng nhiệt độ: $\\Delta T = \\frac{Q}{m c} = \\frac{780 m}{m \\cdot 130} = 6$ K."}]},{"blockId":"single_70234813-b03e-4798-87dc-d09e231e04bb_26","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"70234813-b03e-4798-87dc-d09e231e04bb","type":"short","level":"B","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Đồ thị bên là đường biểu diễn sự thay đổi nhiệt độ theo thời gian của một chất rắn kết tinh (từ $25^{\\circ}$ C tăng tuyến tính đến $1085^{\\circ}$ C tại $\\tau = 30$ phút, sau đó nằm ngang ở $1085^{\\circ}$ C từ $\\tau = 30$ phút đến $\\tau = 43,4$ phút, rồi tăng tiếp). Nhiệt độ nóng chảy của chất đó là bao nhiêu độ C?","rawText":"Đồ thị bên là đường biểu diễn sự thay đổi nhiệt độ theo thời gian của một chất rắn kết tinh (từ $25^{\\circ}$ C tăng tuyến tính đến $1085^{\\circ}$ C tại $\\tau = 30$ phút, sau đó nằm ngang ở $1085^{\\circ}$ C từ $\\tau = 30$ phút đến $\\tau = 43,4$ phút, rồi tăng tiếp). Nhiệt độ nóng chảy của chất đó là bao nhiêu độ C?","ownImageUrl":"https://kosgiekqtutjegalbxyq.supabase.co/storage/v1/object/public/quiz-images/ae4ed6c4-4c59-4913-b6f9-d7c427370e66.png","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"1085","subQuestions":[],"solutionHtml":"Trên đồ thị, quá trình nóng chảy diễn ra ở đoạn nằm ngang $BC$ tại nhiệt độ $1085^{\\circ}$ C (từ phút thứ $30$ đến phút thứ $43,4$).","rawSolution":"Trên đồ thị, quá trình nóng chảy diễn ra ở đoạn nằm ngang $BC$ tại nhiệt độ $1085^{\\circ}$ C (từ phút thứ $30$ đến phút thứ $43,4$)."}]},{"blockId":"single_4335335a-597a-469c-8db4-d4bbdb00790e_27","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"4335335a-597a-469c-8db4-d4bbdb00790e","type":"short","level":"VDC","chapterName":"Đề thi ĐH 2027","points":0.25,"textHtml":"Dùng bếp điện để đun một ấm nhôm có khối lượng $600$ gram đựng $1,5 lít$ nước ở nhiệt độ $20^{\\circ}$ C. Sau khi đun $15 phút  27 giây$ đã có $20\\%$ lượng nước trong ấm hóa hơi ở nhiệt độ $100^{\\circ}$ C. Biết chỉ có $75\\%$ nhiệt lượng mà bếp điện tỏa ra được dùng vào việc đun ấm nước. Cho nhiệt dung riêng của nhôm là $880$ J/kg.K, của nước là $4200$ J/kg.K, nhiệt hóa hơi riêng của nước ở nhiệt độ sôi $100^{\\circ}$ C là $2,26.10^{6}$ J/kg, khối lượng riêng của nước là $1 kg/lít$. Nhiệt lượng trung bình mà bếp điện tỏa ra trong mỗi giây là $x.10^3$ J/s. Tìm $x$. (làm tròn kết quả đến chữ số hàng phần trăm).","rawText":"Dùng bếp điện để đun một ấm nhôm có khối lượng $600$ gram đựng $1,5 lít$ nước ở nhiệt độ $20^{\\circ}$ C. Sau khi đun $15 phút  27 giây$ đã có $20\\%$ lượng nước trong ấm hóa hơi ở nhiệt độ $100^{\\circ}$ C. Biết chỉ có $75\\%$ nhiệt lượng mà bếp điện tỏa ra được dùng vào việc đun ấm nước. Cho nhiệt dung riêng của nhôm là $880$ J/kg.K, của nước là $4200$ J/kg.K, nhiệt hóa hơi riêng của nước ở nhiệt độ sôi $100^{\\circ}$ C là $2,26.10^{6}$ J/kg, khối lượng riêng của nước là $1 kg/lít$. Nhiệt lượng trung bình mà bếp điện tỏa ra trong mỗi giây là $x.10^3$ J/s. Tìm $x$. (làm tròn kết quả đến chữ số hàng phần trăm).","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"1.76","subQuestions":[],"solutionHtml":"Thời gian đun: $t = 927$ s. Khối lượng nước $m_n = 1,5$ kg, ấm nhôm $m_{nl} = 0,6$ kg. Nhiệt lượng làm ấm và nước tăng từ $20^{\\circ}$ C lên $100^{\\circ}$ C: $Q_1 = (m_n \\cdot 4200 + m_{nl} \\cdot 880) \\cdot 80 = 546240$ J. <br><br>Nhiệt lượng làm $20\\%$ nước (=$0,3$ kg) hóa hơi ở $100^{\\circ}$ C: $Q_2 = 0,3 \\cdot L = 678000$ J. <br><br>Nhiệt lượng trung bình tỏa ra mỗi giây: $\\mathcal{P} = \\frac{Q_1+Q_2}{H.t} \\approx 1760,86 J/s \\approx 1,76 \\cdot 10^3$ J/s, suy ra $x \\approx 1,76$.","rawSolution":"Thời gian đun: $t = 927$ s. Khối lượng nước $m_n = 1,5$ kg, ấm nhôm $m_{nl} = 0,6$ kg. Nhiệt lượng làm ấm và nước tăng từ $20^{\\circ}$ C lên $100^{\\circ}$ C: $Q_1 = (m_n \\cdot 4200 + m_{nl} \\cdot 880) \\cdot 80 = 546240$ J. <br>\nNhiệt lượng làm $20\\%$ nước (=$0,3$ kg) hóa hơi ở $100^{\\circ}$ C: $Q_2 = 0,3 \\cdot L = 678000$ J. <br>\nNhiệt lượng trung bình tỏa ra mỗi giây: $\\mathcal{P} = \\frac{Q_1+Q_2}{H.t} \\approx 1760,86 J/s \\approx 1,76 \\cdot 10^3$ J/s, suy ra $x \\approx 1,76$."}]}]}</script>
  <script>
    (function() {
      var dataEl = document.getElementById('edusync-runtime-data');
      var EXAM = JSON.parse(dataEl.textContent || '{}');
      var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      var TF_LABELS = ['a', 'b', 'c', 'd', 'e', 'f'];

      function shuffle(arr) {
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      var blocks = EXAM.shuffleQuestions ? shuffle(EXAM.blocks || []) : (EXAM.blocks || []);
      var flatQuestions = [];
      blocks.forEach(function(block) {
        block.questions.forEach(function(q) {
          if (q.type === 'mcq' && EXAM.shuffleOptions && Array.isArray(q.optionsHtml)) {
            var tagged = q.optionsHtml.map(function(html, idx) {
              return { html: html, raw: q.optionsRaw[idx], isCorrect: idx === q.correctIndex };
            });
            var mixed = shuffle(tagged);
            q.optionsHtml = mixed.map(function(m) { return m.html; });
            q.optionsRaw = mixed.map(function(m) { return m.raw; });
            q.correctIndex = Math.max(0, mixed.findIndex(function(m) { return m.isCorrect; }));
          }
          q.displayNumber = flatQuestions.length + 1;
          flatQuestions.push(q);
        });
      });

      var userAnswers = {};
      var submitted = false;
      var durationLimit = (EXAM.durationMinutes || 0) > 0 ? EXAM.durationMinutes * 60 : 0;
      var startTime = Date.now();
      var timerHandle = null;

      function fmtTime(sec) {
        var s = Math.max(0, Math.floor(sec));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function isQuestionAnswered(q) {
        var ans = userAnswers[q.id];
        if (q.type === 'mcq') return typeof ans === 'number';
        if (q.type === 'short') return typeof ans === 'string' && ans.trim().length > 0;
        if (q.type === 'group-tf') {
          if (!ans || typeof ans !== 'object') return false;
          return q.subQuestions.some(function(sq) { return ans[sq.id] === 'True' || ans[sq.id] === 'False'; });
        }
        return false;
      }

      function updateProgress() {
        var done = flatQuestions.filter(isQuestionAnswered).length;
        document.getElementById('progressLabel').textContent = done + '/' + flatQuestions.length;
        document.getElementById('sidebarCount').textContent = 'Đã làm ' + done + '/' + flatQuestions.length;
        flatQuestions.forEach(function(q) {
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          if (!pBtn || submitted) return;
          pBtn.className = 'p-btn mono' + (isQuestionAnswered(q) ? ' done' : '');
        });
      }

      function buildQuestionEl(q) {
        var card = document.createElement('article');
        card.className = 'q-card';
        card.id = 'qcard_' + q.displayNumber;

        var header = document.createElement('div');
        header.className = 'q-header';
        var leftMeta = '<span class="q-num">Câu ' + q.displayNumber + '</span>';
        var tags = [q.level ? ('Mức ' + q.level) : '', q.points + ' đ', q.chapterName || ''].filter(Boolean).join(' · ');
        header.innerHTML = leftMeta + '<span id="qstatus_' + q.displayNumber + '" class="q-status">' + tags + '</span>';
        card.appendChild(header);

        var qTextEl = document.createElement('div');
        qTextEl.className = 'q-text';
        qTextEl.innerHTML = q.textHtml;
        card.appendChild(qTextEl);

        if (q.ownImageUrl) {
          var fig = document.createElement('div');
          fig.className = 'q-figure';
          var img = document.createElement('img');
          img.src = q.ownImageUrl;
          img.alt = 'Hình minh họa câu ' + q.displayNumber;
          fig.appendChild(img);
          card.appendChild(fig);
        }

        if (q.type === 'mcq') {
          var grid = document.createElement('div');
          grid.className = 'options-grid';
          q.optionsHtml.forEach(function(optHtml, optIdx) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.id = 'opt_' + q.id + '_' + optIdx;
            btn.innerHTML = '<span class="opt-letter mono">' + (LETTERS[optIdx] || optIdx + 1) + '</span><span style="flex:1;">' + optHtml + '</span>';
            btn.addEventListener('click', function() {
              if (submitted) return;
              userAnswers[q.id] = optIdx;
              q.optionsHtml.forEach(function(_, i2) {
                var el = document.getElementById('opt_' + q.id + '_' + i2);
                if (el) el.classList.toggle('selected', i2 === optIdx);
              });
              updateProgress();
            });
            grid.appendChild(btn);
          });
          card.appendChild(grid);
        } else if (q.type === 'group-tf') {
          var list = document.createElement('div');
          list.className = 'tf-list';
          q.subQuestions.forEach(function(sq, sIdx) {
            var row = document.createElement('div');
            row.className = 'tf-row';
            row.id = 'tfrow_' + sq.id;

            var txt = document.createElement('div');
            txt.className = 'tf-text';
            txt.innerHTML = '<strong>' + (TF_LABELS[sIdx] || (sIdx + 1)) + ')</strong> ' + sq.textHtml;
            row.appendChild(txt);

            var actions = document.createElement('div');
            actions.className = 'tf-actions';
            ['True', 'False'].forEach(function(val) {
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'tf-choice';
              b.id = 'tfbtn_' + sq.id + '_' + val;
              b.textContent = val === 'True' ? 'Đúng' : 'Sai';
              b.addEventListener('click', function() {
                if (submitted) return;
                if (!userAnswers[q.id] || typeof userAnswers[q.id] !== 'object') userAnswers[q.id] = {};
                userAnswers[q.id][sq.id] = val;
                var bt = document.getElementById('tfbtn_' + sq.id + '_True');
                var bf = document.getElementById('tfbtn_' + sq.id + '_False');
                if (bt) bt.classList.toggle('active', val === 'True');
                if (bf) bf.classList.toggle('active', val === 'False');
                updateProgress();
              });
              actions.appendChild(b);
            });
            row.appendChild(actions);
            list.appendChild(row);
          });
          card.appendChild(list);
        } else {
          var sBox = document.createElement('div');
          sBox.className = 'short-box';
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'short-input';
          inp.id = 'short_' + q.id;
          inp.placeholder = 'Nhập đáp số (vd: 2.6 hoặc 36)';
          inp.addEventListener('input', function() {
            if (submitted) return;
            userAnswers[q.id] = inp.value;
            updateProgress();
          });
          var fb = document.createElement('span');
          fb.id = 'shortfb_' + q.id;
          fb.className = 'short-feedback';
          sBox.appendChild(inp);
          sBox.appendChild(fb);
          card.appendChild(sBox);
        }

        if (q.solutionHtml) {
          var sol = document.createElement('div');
          sol.className = 'solution-box';
          sol.id = 'sol_' + q.id;
          sol.innerHTML = '<strong>Lời giải chi tiết:</strong><div style="margin-top:4px;">' + q.solutionHtml + '</div>';
          card.appendChild(sol);
        }

        return card;
      }

      function renderExam() {
        var root = document.getElementById('questionsRoot');
        var pal = document.getElementById('paletteRoot');
        root.innerHTML = '';
        pal.innerHTML = '';

        blocks.forEach(function(block) {
          if (block.contextHtml || block.sharedImageUrl) {
            var groupEl = document.createElement('section');
            groupEl.className = 'context-group';

            var head = document.createElement('div');
            head.className = 'context-header';
            var firstNum = block.questions[0].displayNumber;
            var lastNum = block.questions[block.questions.length - 1].displayNumber;
            var labelText = block.questions.length > 1
              ? 'Dữ liệu dùng chung cho Câu ' + firstNum + ' – Câu ' + lastNum
              : 'Dữ liệu đề bài (Câu ' + firstNum + ')';
            var html = '<div class="context-label">' + labelText + '</div>';
            if (block.contextHtml) {
              html += '<div class="context-body">' + block.contextHtml + '</div>';
            }
            head.innerHTML = html;
            if (block.sharedImageUrl) {
              var fig = document.createElement('div');
              fig.className = 'q-figure';
              var img = document.createElement('img');
              img.src = block.sharedImageUrl;
              img.alt = labelText;
              fig.appendChild(img);
              head.appendChild(fig);
            }
            groupEl.appendChild(head);

            var inner = document.createElement('div');
            inner.className = 'context-questions';
            block.questions.forEach(function(q) {
              inner.appendChild(buildQuestionEl(q));
            });
            groupEl.appendChild(inner);
            root.appendChild(groupEl);
          } else {
            block.questions.forEach(function(q) {
              root.appendChild(buildQuestionEl(q));
            });
          }
        });

        flatQuestions.forEach(function(q) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'p-btn mono';
          b.id = 'pbtn_' + q.displayNumber;
          b.textContent = String(q.displayNumber);
          b.addEventListener('click', function() {
            var target = document.getElementById('qcard_' + q.displayNumber);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          pal.appendChild(b);
        });

        updateProgress();
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }
      }

      function normalizeShort(val) {
        return String(val || '').trim().replace(/,/g, '.').replace(/\s+/g, '').toLowerCase();
      }

      function isShortMatch(userVal, expectedVal) {
        var u = normalizeShort(userVal);
        var e = normalizeShort(expectedVal);
        if (!u) return false;
        if (u === e) return true;
        var nu = parseFloat(u);
        var ne = parseFloat(e);
        if (!isNaN(nu) && !isNaN(ne) && String(nu) === u || !isNaN(nu) && !isNaN(ne)) {
          if (/^-?\d+(?:\.\d+)?$/.test(u) && /^-?\d+(?:\.\d+)?$/.test(e)) {
            return Math.abs(nu - ne) < 1e-6;
          }
        }
        return false;
      }

      function gradeAndSubmit(force) {
        if (submitted) return;
        var answered = flatQuestions.filter(isQuestionAnswered).length;
        if (!force && answered < flatQuestions.length) {
          document.getElementById('confirmMsg').textContent =
            'Bạn mới làm ' + answered + '/' + flatQuestions.length + ' câu. Bạn có chắc muốn nộp bài ngay?';
          document.getElementById('confirmBar').classList.add('visible');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        document.getElementById('confirmBar').classList.remove('visible');
        submitted = true;
        if (timerHandle) clearInterval(timerHandle);

        var totalScore = 0;
        var maxScore = EXAM.maxScore || 10;
        var correctQuestions = 0;
        var answerDetails = [];

        flatQuestions.forEach(function(q) {
          var qCorrect = false;
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          var stEl = document.getElementById('qstatus_' + q.displayNumber);
          var solEl = document.getElementById('sol_' + q.id);
          if (solEl) solEl.classList.add('visible');

          if (q.type === 'mcq') {
            var chosen = typeof userAnswers[q.id] === 'number' ? userAnswers[q.id] : -1;
            qCorrect = chosen === q.correctIndex;
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            q.optionsHtml.forEach(function(_, i) {
              var ob = document.getElementById('opt_' + q.id + '_' + i);
              if (!ob) return;
              ob.disabled = true;
              ob.classList.remove('selected');
              if (i === q.correctIndex) ob.classList.add('correct');
              else if (i === chosen) ob.classList.add('wrong');
            });
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: q.optionsRaw,
              selectedIndex: chosen,
              correctIndex: q.correctIndex,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          } else if (q.type === 'group-tf') {
            var tfMap = (userAnswers[q.id] && typeof userAnswers[q.id] === 'object') ? userAnswers[q.id] : {};
            var rightSubs = 0;
            q.subQuestions.forEach(function(sq, sIdx) {
              var picked = tfMap[sq.id] || '';
              var subOk = picked === sq.correctAnswer;
              if (subOk) rightSubs++;
              var row = document.getElementById('tfrow_' + sq.id);
              if (row) row.classList.add(subOk ? 'ok' : 'bad');
              ['True', 'False'].forEach(function(v) {
                var btn = document.getElementById('tfbtn_' + sq.id + '_' + v);
                if (!btn) return;
                btn.disabled = true;
                if (v === sq.correctAnswer) btn.classList.add('right-ans');
              });
              answerDetails.push({
                orderIndex: answerDetails.length,
                questionText: 'Câu ' + q.displayNumber + (TF_LABELS[sIdx] || '') + ': ' + sq.rawText,
                options: ['Đúng', 'Sai'],
                selectedIndex: picked === 'True' ? 0 : (picked === 'False' ? 1 : -1),
                correctIndex: sq.correctAnswer === 'True' ? 0 : 1,
                isCorrect: subOk,
                explanation: sIdx === q.subQuestions.length - 1 ? q.rawSolution : ''
              });
            });
            var earnedRatio = 0;
            if (q.subQuestions.length === 4) {
              earnedRatio = rightSubs === 1 ? 0.1 : rightSubs === 2 ? 0.25 : rightSubs === 3 ? 0.5 : rightSubs === 4 ? 1 : 0;
            } else if (q.subQuestions.length > 0) {
              earnedRatio = rightSubs / q.subQuestions.length;
            }
            var earned = Math.round(q.points * earnedRatio * 100) / 100;
            totalScore += earned;
            qCorrect = rightSubs === q.subQuestions.length;
            if (qCorrect) correctQuestions++;
            if (stEl) {
              stEl.textContent = 'Đúng ' + rightSubs + '/' + q.subQuestions.length + ' ý (+' + earned + 'đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
          } else {
            var rawInput = document.getElementById('short_' + q.id);
            var typed = rawInput ? rawInput.value.trim() : '';
            if (rawInput) rawInput.disabled = true;
            qCorrect = isShortMatch(typed, q.correctAnswer);
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            var fbEl = document.getElementById('shortfb_' + q.id);
            if (fbEl) {
              fbEl.textContent = qCorrect
                ? ('Chính xác (+' + q.points + 'đ)')
                : ('Đáp án đúng: ' + q.correctAnswer);
              fbEl.style.color = qCorrect ? 'var(--ok)' : 'var(--bad)';
            }
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: ['Bài làm: ' + (typed || '(bỏ trống)'), 'Đáp án chuẩn: ' + q.correctAnswer],
              selectedIndex: qCorrect ? 1 : 0,
              correctIndex: 1,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          }

          if (pBtn) {
            pBtn.className = 'p-btn mono ' + (qCorrect ? 'ok' : 'bad');
          }
        });

        totalScore = Math.round(totalScore * 100) / 100;
        var pct = maxScore > 0 ? Math.round((totalScore / maxScore) * 1000) / 10 : 0;

        document.getElementById('scoreText').textContent = totalScore + ' / ' + maxScore + ' điểm';
        document.getElementById('correctText').textContent =
          'Đúng hoàn toàn ' + correctQuestions + ' / ' + flatQuestions.length + ' câu (' + pct + '%)';
        document.getElementById('resultScreen').classList.add('visible');
        document.getElementById('topSubmitBtn').style.display = 'none';
        document.getElementById('sideSubmitBtn').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }

        if (typeof window.EduSyncSubmitScore === 'function') {
          window.EduSyncSubmitScore(totalScore, maxScore, correctQuestions, flatQuestions.length, answerDetails);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'QUIZ_RESULT',
            score: totalScore,
            maxScore: maxScore,
            correctCount: correctQuestions,
            totalQuestions: flatQuestions.length,
            answerDetails: answerDetails
          }, '*');
        }
      }

      document.getElementById('topSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('sideSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('confirmYesBtn').addEventListener('click', function() { gradeAndSubmit(true); });
      document.getElementById('confirmCancelBtn').addEventListener('click', function() {
        document.getElementById('confirmBar').classList.remove('visible');
      });

      function tickTimer() {
        if (submitted) return;
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var box = document.getElementById('timerBox');
        if (durationLimit > 0) {
          var rem = Math.max(0, durationLimit - elapsed);
          box.textContent = fmtTime(rem);
          box.classList.toggle('urgent', rem <= 60);
          if (rem <= 0) gradeAndSubmit(true);
        } else {
          box.textContent = fmtTime(elapsed);
        }
      }

      renderExam();
      tickTimer();
      timerHandle = setInterval(tickTimer, 1000);
    })();
  </script>
</body>
</html>
