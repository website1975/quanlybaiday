    :root {

      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-soft: #eff6ff;
      --ok: #047857;
      --ok-bg: #ecfdf5;
      --ok-border: #6ee7b7;
      --bad: #dc2626;
      --bad-bg: #fef2f2;
      --bad-border: #fca5a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .exam-title { font-size: 16px; font-weight: 700; margin: 0; color: var(--text); }
    .exam-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .timer-box {
      padding: 6px 12px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .timer-box.urgent {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid var(--bad-border);
    }
    .btn {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #fff; border-color: #cbd5e1; color: #334155; }
    .btn-secondary:hover { background: #f8fafc; }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }
    .main-col { display: flex; flex-direction: column; gap: 18px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .result-card {
      background: var(--ok-bg);
      border: 1px solid var(--ok-border);
      border-radius: 12px;
      padding: 20px;
      display: none;
    }
    .result-card.visible { display: block; }
    .result-score { font-size: 26px; font-weight: 700; color: var(--ok); margin: 4px 0; }
    .result-sub { font-size: 13px; color: #065f46; }
    .confirm-bar {
      display: none;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 4px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #92400e;
    }
    .confirm-bar.visible { display: flex; }
    .context-group {
      background: var(--surface);
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
    }
    .context-header {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }
    .context-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .context-body { font-size: 14px; color: #1e293b; }
    .context-questions {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #f8fafc;
    }
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      scroll-margin-top: 84px;
    }
    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 12px;
      color: var(--muted);
    }
    .q-num { font-size: 14px; font-weight: 700; color: var(--text); }
    .q-status { font-weight: 600; }
    .q-status.ok { color: var(--ok); }
    .q-status.bad { color: var(--bad); }
    .q-text { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
    .q-figure {
      margin: 12px 0;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .q-figure img { max-width: 100%; max-height: 360px; height: auto; border-radius: 4px; }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 640px) {
      .options-grid { grid-template-columns: 1fr; }
    }
    .opt-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
      color: #1e293b;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .opt-btn:hover:not(:disabled) { border-color: #94a3b8; background: #f8fafc; }
    .opt-btn.selected { border-color: var(--accent); background: var(--accent-soft); color: #1e3a8a; font-weight: 500; }

    .opt-letter {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .opt-btn.selected .opt-letter { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tf-list { display: flex; flex-direction: column; gap: 10px; }
    .tf-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    .tf-row.ok { border-color: var(--ok-border); background: var(--ok-bg); }
    .tf-row.bad { border-color: var(--bad-border); background: var(--bad-bg); }
    .tf-text { font-size: 14px; flex: 1; }
    .tf-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .tf-choice {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tf-choice.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tf-choice.right-ans { border-color: var(--ok); color: var(--ok); }

      width: 240px;
      max-width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
    }
    .short-input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .short-feedback { font-size: 13px; font-weight: 600; }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--border);
      font-size: 13px;
      color: #334155;
    }
    .solution-box.visible { display: block; }
    .sidebar {
      position: sticky;
      top: 76px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      margin: 12px 0 16px;
    }
    .p-btn {
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .p-btn.done { background: var(--accent); color: #fff; border-color: var(--accent); }
    .p-btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
    .p-btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }

</head>

      "id": "44142f14-958c-400c-9690-74aba9ac9871",
      "index": 23,
      "type": "short",
      "level": "VD",
      "text": "Một thỏi nhôm có khối lượng $1{,}0\\text{ kg}$ ở $8^{\\circ}\\text{C}$. Nhôm nóng chảy ở $658^{\\circ}\\text{C}$, nhiệt nóng chảy riêng của nhôm là $3{,}9.10^{5}\\text{ J/kg}$ và nhiệt dung riêng của nhôm là $880\\text{ J/kg.K}$. Nhiệt lượng cần cung cấp để làm nóng chảy hoàn toàn thỏi nhôm là $a.10^{5}\\text{ J}$. Giá trị $a$ là bao nhiêu (kết quả làm tròn ở hàng phần trăm)?",
      "correctAnswer": "9.62",
      "solution": "Nhiệt lượng cần cung cấp: $Q = m c (t_{nc} - t_1) + m \\lambda = 1{,}0 \\cdot 880 \\cdot (658 - 8) + 1{,}0 \\cdot 3{,}9 \\cdot 10^5 = 572000 + 390000 = 962000\\text{ J} = 9{,}62 \\cdot 10^5\\text{ J}$. Vậy $a = 9{,}62$.",
      "points": 0.25,
      "chapterName": "Chương 1: vật lý nhiệt"
    },
    {
      "id": "6ffab202-9cb5-4f1f-93bb-c648bb051785",
      "index": 24,
      "type": "short",
      "level": "VD",
      "text": "Một bếp đun nước có công suất $500\\text{ W}$ đun một lượng nước $300\\text{ g}$ ở $20^{\\circ}\\text{C}$ (áp suất $1\\text{ atm}$). Cho biết nhiệt dung riêng của nước là $4200\\text{ J/kg.K}$. Biết hiệu suất của bếp là $70\\%$. Thời gian cần thiết để đun nước trong ấm đạt đến nhiệt độ sôi là bao nhiêu giây (s)?",
      "correctAnswer": "288",
      "solution": "Ở áp suất $1\\text{ atm}$, nước sôi ở $100^{\\circ}\\text{C}$.\nNhiệt lượng có ích: $Q_i = m c \\Delta t  = 100800\\text{ J}$.\nThời gian đun: $t = \\frac{Q_i}{H \\cdot P} = \\frac{100800}{0{,}7 \\cdot 500} = 288 s$",
      "points": 0.25,
      "chapterName": "Chương 1: vật lý nhiệt"
    },
    {
      "id": "a26caf63-1919-44b3-ae5e-f481418a04b2",
      "index": 25,
      "type": "short",
      "level": "B",
      "text": "Nhiệt độ của vật ở $10^{\\circ}\\text{C}$ sẽ tương ứng với nhiệt độ tuyệt đối là bao nhiêu kelvin (K) (kết quả làm tròn ở phần nguyên)?",
      "correctAnswer": "283",
      "solution": "$T(\\text{K}) = 10 + 273{,}15 = 283{,}15\\text{ K}$, làm tròn đến phần nguyên được $283$.",
      "points": 0.25,
      "chapterName": "Chương 1: vật lý nhiệt"
    },
    {
      "id": "18a206fc-e1b4-4582-a4f7-bd25e800f54c",
      "index": 26,
      "type": "short",
      "level": "VD",
      "text": "Một mol khí lí tưởng đơn nguyên tử chứa trong xilanh ngăn với bên ngoài bởi pítông cách nhiệt có nội năng được tính theo công thức $U=3nRT/2$ (với $n$ là số mol khí, $R=8{,}31\\text{ J/molK}$). Ban đầu nhiệt độ khí $300\\text{ K}$, sau đó khí được nung nóng đến nhiệt độ $500\\text{ K}$ làm khí nở ra và thực hiện công $35\\text{ J}$. Nhiệt lượng mà khối khí nhận được là bao nhiêu jun?",
      "correctAnswer": "2528",
      "solution": "Độ biến thiên nội năng: $\\Delta U = \\frac{3}{2} n R (T_2 - T_1) = \\frac{3}{2} \\cdot 1 \\cdot 8{,}31 \\cdot (500 - 300) = 1{,}5 \\cdot 8{,}31 \\cdot 200 = 2493\\text{ J}$. Khí thực hiện công $35\\text{ J}$ nên $A = -35\\text{ J}$. Từ $\\Delta U = A + Q \\Rightarrow Q = \\Delta U - A = 2493 - (-35) = 2528\\text{ J}$.",
      "points": 0.25,
      "chapterName": "chương 2: vật lý chất khí"
    },
    {
      "id": "6bd7d817-09ae-4963-9e1f-e2f4a62d56b5",
      "index": 27,
      "type": "short",
      "level": "VD",
      "text": "Một vật đồng chất khối lượng $300\\text{ g}$ khi thu vào nhiệt lượng $6900\\text{ J}$ đã làm nhiệt độ của vật tăng thêm $50^{\\circ}\\text{C}$. Nhiệt dung riêng của chất làm vật là bao nhiêu J/kgK?",
      "correctAnswer": "460",
      "solution": "$c = \\frac{Q}{m \\Delta T} = \\frac{6900}{0{,}3 \\cdot 50} = \\frac{6900}{15} = 460\\text{ J/(kg.K)}$.",
      "points": 0.25,
      "chapterName": "Chương 1: vật lý nhiệt"
    },
    {
      "id": "1c232e3e-9d96-456d-b857-235ecc6b7395",
      "index": 28,
      "type": "short",
      "level": "VD",
      "text": "Người ta cung cấp nhiệt lượng $20{,}6\\text{ J}$ cho một lượng khí, khí nở ra và thực hiện công là $0{,}6\\text{ J}$. Độ biến thiên nội năng của khí là bao nhiêu jun?",
      "correctAnswer": "20",
      "solution": "Khí nhận nhiệt $Q = 20{,}6\\text{ J}$ và sinh công nên $A = -0{,}6\\text{ J}$. Độ biến thiên nội năng: $\\Delta U = A + Q = -0{,}6 + 20{,}6 = 20\\text{ J}$.",
      "points": 0.25,
      "chapterName": "Chương 1: vật lý nhiệt"
    }

ng, quá trình gì xảy ra?","ownImageUrl":"","optionsHtml":["Ngưng tụ","Bay hơi","Sôi","Đông đặc"],"optionsRaw":["Ngưng tụ","Bay hơi","Sôi","Đông đặc"],"correctIndex":1,"correctAnswer":"Bay hơi","subQuestions":[],"solutionHtml":"Quá trình các phân tử chất lỏng thoát ra khỏi mặt thoáng tạo thành hơi gọi là sự bay hơi.","rawSolution":"Quá trình các phân tử chất lỏng thoát ra khỏi mặt thoáng tạo thành hơi gọi là sự bay hơi."}]},{"blockId":"single_c8392b3b-5c37-4684-8883-9aaf3122b3e2_16","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"c8392b3b-5c37-4684-8883-9aaf3122b3e2","type":"mcq","level":"H","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Nội năng của một vật phụ thuộc vào những yếu tố nào?","rawText":"Nội năng của một vật phụ thuộc vào những yếu tố nào?","ownImageUrl":"","optionsHtml":["Nhiệt độ và áp suất","Công và nhiệt lượng","Nhiệt lượng và thể tích","Nhiệt độ và thể tích"],"optionsRaw":["Nhiệt độ và áp suất","Công và nhiệt lượng","Nhiệt lượng và thể tích","Nhiệt độ và thể tích"],"correctIndex":3,"correctAnswer":"Nhiệt độ và thể tích","subQuestions":[],"solutionHtml":"Nội năng gồm động năng phân tử (phụ thuộc nhiệt độ) và thế năng tương tác phân tử (phụ thuộc khoảng cách phân tử, liên quan đến thể tích).","rawSolution":"Nội năng gồm động năng phân tử (phụ thuộc nhiệt độ) và thế năng tương tác phân tử (phụ thuộc khoảng cách phân tử, liên quan đến thể tích)."}]},{"blockId":"single_a8b47669-e426-4a8c-8738-a491394ee23e_17","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"a8b47669-e426-4a8c-8738-a491394ee23e","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Nhiệt kế chất lỏng được chế tạo dựa trên nguyên tắc nào?","rawText":"Nhiệt kế chất lỏng được chế tạo dựa trên nguyên tắc nào?","ownImageUrl":"","optionsHtml":["Sự nở của chất lỏng không phụ thuộc vào nhiệt độ","Sự co lại của chất lỏng khi nhiệt độ tăng","Sự nở vì nhiệt của chất lỏng","Sự nở ra của chất lỏng khi nhiệt độ giảm"],"optionsRaw":["Sự nở của chất lỏng không phụ thuộc vào nhiệt độ","Sự co lại của chất lỏng khi nhiệt độ tăng","Sự nở vì nhiệt của chất lỏng","Sự nở ra của chất lỏng khi nhiệt độ giảm"],"correctIndex":2,"correctAnswer":"Sự nở vì nhiệt của chất lỏng","subQuestions":[],"solutionHtml":"Nhiệt kế chất lỏng (như nhiệt kế thủy ngân, rượu) hoạt động dựa trên hiện tượng giãn nở vì nhiệt của chất lỏng.","rawSolution":"Nhiệt kế chất lỏng (như nhiệt kế thủy ngân, rượu) hoạt động dựa trên hiện tượng giãn nở vì nhiệt của chất lỏng."}]},{"blockId":"single_7ba5b249-2e4a-457c-9fb9-e575ccbcf24e_18","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"7ba5b249-2e4a-457c-9fb9-e575ccbcf24e","type":"group-tf","level":"H","chapterName":"Chương 1: vật lý nhiệt","points":1,"textHtml":"Hình bên là đồ thị biểu diễn sự phụ thuộc của nhiệt độ theo thời gian của một khối nước đá (trục tung là Nhiệt độ (°C) đi qua mốc $0^{\\circ}\\text{C}$ tại trục hoành, trục hoành là Thời gian (phút) với các mốc $5$ và $10$ phút, đoạn từ $5$ đến $10$ phút nằm ngang ở $0^{\\circ}\\text{C}$).","rawText":"Hình bên là đồ thị biểu diễn sự phụ thuộc của nhiệt độ theo thời gian của một khối nước đá (trục tung là Nhiệt độ (°C) đi qua mốc $0^{\\circ}\\text{C}$ tại trục hoành, trục hoành là Thời gian (phút) với các mốc $5$ và $10$ phút, đoạn từ $5$ đến $10$ phút nằm ngang ở $0^{\\circ}\\text{C}$).","ownImageUrl":"https://buelyuxsztnhrwinrldp.supabase.co/storage/v1/object/public/quiz-images/9e93f3cc-b03e-4eda-9e2a-9800f05c339c.png","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"1f766e00-0bed-4fe2-8f3c-072218a1ffd6","level":"H","textHtml":"Tại thời điểm từ 0 đến 5 phút các phân tử nước chuyển động quanh vị trí cân bằng không cố định.","rawText":"Tại thời điểm từ 0 đến 5 phút các phân tử nước chuyển động quanh vị trí cân bằng không cố định.","correctAnswer":"False"},{"id":"ce0bb09e-36f9-46a5-aed2-85b2f7864f8a","level":"H","textHtml":"Thời gian nóng chảy của chất rắn trên là 10 phút.","rawText":"Thời gian nóng chảy của chất rắn trên là 10 phút.","correctAnswer":"False"},{"id":"e508c30d-881f-47d9-af60-090a6b8a6829","level":"H","textHtml":"Đồ thị có quá trình nóng chảy của chất rắn kết tinh.","rawText":"Đồ thị có quá trình nóng chảy của chất rắn kết tinh.","correctAnswer":"True"},{"id":"fb7645cb-f833-4368-be0a-60e12e462b3a","level":"H","textHtml":"Trong suốt quá trình chuyển thể nhiệt độ của nước không tăng.","rawText":"Trong suốt quá trình chuyển thể nhiệt độ của nước không tăng.","correctAnswer":"True"}],"solutionHtml":"a) Sai: Từ $0$ đến $5$ phút nước đá đang ở thể rắn, các phân tử dao động quanh vị trí cân bằng cố định. b) Sai: Quá trình nóng chảy diễn ra từ phút thứ $5$ đến phút thứ $10$, kéo dài $5$ phút. c) Đúng: Nước đá là chất rắn kết tinh, nóng chảy ở nhiệt độ không đổi $0^{\\circ}\\text{C}$. d) Đúng: Trong quá trình nóng chảy ở $0^{\\circ}\\text{C}$, nhiệt độ không tăng.","rawSolution":"a) Sai: Từ $0$ đến $5$ phút nước đá đang ở thể rắn, các phân tử dao động quanh vị trí cân bằng cố định. b) Sai: Quá trình nóng chảy diễn ra từ phút thứ $5$ đến phút thứ $10$, kéo dài $5$ phút. c) Đúng: Nước đá là chất rắn kết tinh, nóng chảy ở nhiệt độ không đổi $0^{\\circ}\\text{C}$. d) Đúng: Trong quá trình nóng chảy ở $0^{\\circ}\\text{C}$, nhiệt độ không tăng."}]},{"blockId":"single_64f1d8d8-a68d-4962-a5db-eddcaa525391_19","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"64f1d8d8-a68d-4962-a5db-eddcaa525391","type":"group-tf","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":1,"textHtml":"Khi tiến hành nung nóng một chất rắn kết tinh bằng một bếp có công suất không đổi. Bỏ qua mất mát nhiệt lượng ra môi trường. Kể từ lúc bắt đầu đun $(t=0)$ người ta ghi nhận được đồ thị sự phụ thuộc của nhiệt độ khối chất và thời gian đun như hình bên (điểm $A$ ở $\\tau = 0$, $t = 127^{\\circ}\\text{C}$; đoạn $AB$ tăng lên $327^{\\circ}\\text{C}$ tại $\\tau = 26$ phút; đoạn $BC$ nằm ngang ở $327^{\\circ}\\text{C}$ từ $\\tau = 26$ phút đến $\\tau = 51$ phút; đoạn $CD$ tăng tiếp). Trong đề có ghi giá trị nhiệt nóng chảy riêng tương ứng $25.10^3\\text{ J/kg}$.","rawText":"Khi tiến hành nung nóng một chất rắn kết tinh bằng một bếp có công suất không đổi. Bỏ qua mất mát nhiệt lượng ra môi trường. Kể từ lúc bắt đầu đun $(t=0)$ người ta ghi nhận được đồ thị sự phụ thuộc của nhiệt độ khối chất và thời gian đun như hình bên (điểm $A$ ở $\\tau = 0$, $t = 127^{\\circ}\\text{C}$; đoạn $AB$ tăng lên $327^{\\circ}\\text{C}$ tại $\\tau = 26$ phút; đoạn $BC$ nằm ngang ở $327^{\\circ}\\text{C}$ từ $\\tau = 26$ phút đến $\\tau = 51$ phút; đoạn $CD$ tăng tiếp). Trong đề có ghi giá trị nhiệt nóng chảy riêng tương ứng $25.10^3\\text{ J/kg}$.","ownImageUrl":"https://i.ibb.co/m5mGkd8Y/quiz-img-p2-370623.png","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"17317076-1ef2-4b70-8b0d-49d64086491e","level":"H","textHtml":"Nhiệt độ nóng chảy của khối chất rắn trên là $327^{\\circ}\\text{C}$.","rawText":"Nhiệt độ nóng chảy của khối chất rắn trên là $327^{\\circ}\\text{C}$.","correctAnswer":"True"},{"id":"48560fce-dc9f-41ba-a449-b0ca2065dbb2","level":"H","textHtml":"Tại phút thứ 40 chất rắn đã nóng chảy hoàn toàn.","rawText":"Tại phút thứ 40 chất rắn đã nóng chảy hoàn toàn.","correctAnswer":"False"},{"id":"1349f258-fcec-429b-bb96-6b983b2feb1c","level":"H","textHtml":"Đoạn CD trên đồ thị thể hiện chất rắn đang tăng nhiệt độ.","rawText":"Đoạn CD trên đồ thị thể hiện chất rắn đang tăng nhiệt độ.","correctAnswer":"False"},{"id":"47444247-efa4-40d3-b5a6-4ef445e9a88e","level":"VD","textHtml":"Nếu nhiệt dung riêng của chất rắn này là $130\\text{ J/kgK}$ thì nhiệt nóng chảy riêng của nó là $25.10^3\\text{ J/kg}$.","rawText":"Nếu nhiệt dung riêng của chất rắn này là $130\\text{ J/kgK}$ thì nhiệt nóng chảy riêng của nó là $25.10^3\\text{ J/kg}$.","correctAnswer":"True"}],"solutionHtml":"a) Đúng: Đoạn nằm ngang $BC$ ở $327^{\\circ}\\text{C}$ là quá trình nóng chảy. b) Sai: Quá trình nóng chảy kéo dài từ phút $26$ đến phút $51$, nên tại phút thứ $40$ chất rắn vẫn đang nóng chảy (chưa hoàn toàn). c) Sai: Sau phút thứ $51$ (đoạn $CD$), chất đã nóng chảy hoàn toàn sang thể lỏng và đang tăng nhiệt độ của chất lỏng. d) Đúng: Ta có $\\frac{Q_{BC}}{Q_{AB}} = \\frac{\\Delta \\tau_{BC}}{\\Delta \\tau_{AB}} \\Rightarrow \\frac{m \\lambda}{m c \\Delta t} = \\frac{51 - 26}{26 - 0} = \\frac{25}{26}$. Với $c = 130\\text{ J/(kg.K)}$ và $\\Delta t = 327 - 127 = 200\\text{ K}$, suy ra $\\lambda = \\frac{25}{26} \\cdot 130 \\cdot 200 = 25000\\text{ J/kg} = 25 \\cdot 10^3\\text{ J/kg}$.","rawSolution":"a) Đúng: Đoạn nằm ngang $BC$ ở $327^{\\circ}\\text{C}$ là quá trình nóng chảy. b) Sai: Quá trình nóng chảy kéo dài từ phút $26$ đến phút $51$, nên tại phút thứ $40$ chất rắn vẫn đang nóng chảy (chưa hoàn toàn). c) Sai: Sau phút thứ $51$ (đoạn $CD$), chất đã nóng chảy hoàn toàn sang thể lỏng và đang tăng nhiệt độ của chất lỏng. d) Đúng: Ta có $\\frac{Q_{BC}}{Q_{AB}} = \\frac{\\Delta \\tau_{BC}}{\\Delta \\tau_{AB}} \\Rightarrow \\frac{m \\lambda}{m c \\Delta t} = \\frac{51 - 26}{26 - 0} = \\frac{25}{26}$. Với $c = 130\\text{ J/(kg.K)}$ và $\\Delta t = 327 - 127 = 200\\text{ K}$, suy ra $\\lambda = \\frac{25}{26} \\cdot 130 \\cdot 200 = 25000\\text{ J/kg} = 25 \\cdot 10^3\\text{ J/kg}$."}]},{"blockId":"single_3b160d73-2eea-4c1a-86c5-f7dbb70aa07d_20","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"3b160d73-2eea-4c1a-86c5-f7dbb70aa07d","type":"group-tf","level":"H","chapterName":"Chương 1: vật lý nhiệt","points":1,"textHtml":"Một nhóm học sinh tìm hiểu về mối liên hệ giữa sự thay đổi nội năng của một khối khí xác định và nhiệt độ của nó. Họ đã thực hiện các nội dung sau:<br>(I) Chuẩn bị các dụng cụ: xilanh có pit-tông và cảm biến nhiệt độ như hình vẽ.<br>(II) Họ cho rằng khi làm thay đổi nội năng của khối khí trong xilanh bằng cách tăng, giảm thể tích thì nhiệt độ của khối khí thay đổi.<br>(III) Họ đã làm thí nghiệm nén khối khí trong xilanh và thu được kết quả là nhiệt độ khối khí tăng lên.<br>(IV) Họ kết luận rằng thí nghiệm này đã chứng minh được nội dung ở (II).","rawText":"Một nhóm học sinh tìm hiểu về mối liên hệ giữa sự thay đổi nội năng của một khối khí xác định và nhiệt độ của nó. Họ đã thực hiện các nội dung sau:\n(I) Chuẩn bị các dụng cụ: xilanh có pit-tông và cảm biến nhiệt độ như hình vẽ.\n(II) Họ cho rằng khi làm thay đổi nội năng của khối khí trong xilanh bằng cách tăng, giảm thể tích thì nhiệt độ của khối khí thay đổi.\n(III) Họ đã làm thí nghiệm nén khối khí trong xilanh và thu được kết quả là nhiệt độ khối khí tăng lên.\n(IV) Họ kết luận rằng thí nghiệm này đã chứng minh được nội dung ở (II).","ownImageUrl":"https://i.ibb.co/Gv6ZqRMM/quiz-img-p3-370756.png","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"9e251aeb-3a47-40d6-982e-812eb0031027","level":"H","textHtml":"Nội dung (II) thể hiện việc thực hiện một phần kế hoạch nghiên cứu.","rawText":"Nội dung (II) thể hiện việc thực hiện một phần kế hoạch nghiên cứu.","correctAnswer":"False"},{"id":"3949e1bd-d8be-4f2f-a39d-09a366fb49e6","level":"H","textHtml":"Nội dung (II) là giả thuyết của nhóm học sinh.","rawText":"Nội dung (II) là giả thuyết của nhóm học sinh.","correctAnswer":"True"},{"id":"9c405d27-b799-4eec-8262-e79a00f61ba5","level":"H","textHtml":"Nội dung (III) là đủ để đưa ra kết luận (IV).","rawText":"Nội dung (III) là đủ để đưa ra kết luận (IV).","correctAnswer":"False"},{"id":"cb078f19-38a9-4e97-84ac-513ee67c0d5e","level":"H","textHtml":"Trong thí nghiệm ở nội dung (III), nội năng của khối khí tăng lên là do khối khí đã nhận công.","rawText":"Trong thí nghiệm ở nội dung (III), nội năng của khối khí tăng lên là do khối khí đã nhận công.","correctAnswer":"True"}],"solutionHtml":"a) Sai: (II) là dự đoán/giả thuyết khoa học, không phải bước thực hiện kế hoạch. b) Đúng: (II) nêu dự đoán mối liên hệ giữa thay đổi thể tích/nội năng và c học $U=A+Q$.","rawText":"Biểu thức biểu diễn định luật I nhiệt động lực học $U=A+Q$.","correctAnswer":"False"},{"id":"0ca51f01-30e3-49f8-8bf5-1237d4bada77","level":"VD","textHtml":"Độ biến thiên nội năng của chất khí là $1{,}8\\text{ J}$.","rawText":"Độ biến thiên nội năng của chất khí là $1{,}8\\text{ J}$.","correctAnswer":"True"},{"id":"470f0220-9dbd-4395-af68-37e0bfae0c79","level":"H","textHtml":"Chất khí nhận nhiệt, sinh công làm tăng nội năng của hệ.","rawText":"Chất khí nhận nhiệt, sinh công làm tăng nội năng của hệ.","correctAnswer":"True"}],"solutionHtml":"a) Sai: Vì pít-tông chuyển động đều, lực đẩy của khí cân bằng với lực ma sát nên độ lớn công khí thực hiện (sinh công) là $|A| = F_{ms} \\cdot s = 15 \\cdot 0{,}08 = 1{,}2\\text{ J}$, do đó công mà khí nhận là $A = -1{,}2\\text{ J}$. b) Sai: Biểu thức đúng của nguyên lí I nhiệt động lực học là $\\Delta U = A + Q$. c) Đúng: $\\Delta U = A + Q = -1{,}2 + 3{,}0 = 1{,}8\\text{ J}$. d) Đúng: Khí nhận nhiệt ($Q = 3{,}0\\text{ J} &gt; 0$) và sinh công ($|A| = 1{,}2\\text{ J}$), kết quả $\\Delta U = +1{,}8\\text{ J} &gt; 0$ nên nội năng tăng.","rawSolution":"a) Sai: Vì pít-tông chuyển động đều, lực đẩy của khí cân bằng với lực ma sát nên độ lớn công khí thực hiện (sinh công) là $|A| = F_{ms} \\cdot s = 15 \\cdot 0{,}08 = 1{,}2\\text{ J}$, do đó công mà khí nhận là $A = -1{,}2\\text{ J}$. b) Sai: Biểu thức đúng của nguyên lí I nhiệt động lực học là $\\Delta U = A + Q$. c) Đúng: $\\Delta U = A + Q = -1{,}2 + 3{,}0 = 1{,}8\\text{ J}$. d) Đúng: Khí nhận nhiệt ($Q = 3{,}0\\text{ J} > 0$) và sinh công ($|A| = 1{,}2\\text{ J}$), kết quả $\\Delta U = +1{,}8\\text{ J} > 0$ nên nội năng tăng."}]},{"blockId":"single_44142f14-958c-400c-9690-74aba9ac9871_22","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"44142f14-958c-400c-9690-74aba9ac9871","type":"short","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Một thỏi nhôm có khối lượng $1{,}0\\text{ kg}$ ở $8^{\\circ}\\text{C}$. Nhôm nóng chảy ở $658^{\\circ}\\text{C}$, nhiệt nóng chảy riêng của nhôm là $3{,}9.10^{5}\\text{ J/kg}$ và nhiệt dung riêng của nhôm là $880\\text{ J/kg.K}$. Nhiệt lượng cần cung cấp để làm nóng chảy hoàn toàn thỏi nhôm là $a.10^{5}\\text{ J}$. Giá trị $a$ là bao nhiêu (kết quả làm tròn ở hàng phần trăm)?","rawText":"Một thỏi nhôm có khối lượng $1{,}0\\text{ kg}$ ở $8^{\\circ}\\text{C}$. Nhôm nóng chảy ở $658^{\\circ}\\text{C}$, nhiệt nóng chảy riêng của nhôm là $3{,}9.10^{5}\\text{ J/kg}$ và nhiệt dung riêng của nhôm là $880\\text{ J/kg.K}$. Nhiệt lượng cần cung cấp để làm nóng chảy hoàn toàn thỏi nhôm là $a.10^{5}\\text{ J}$. Giá trị $a$ là bao nhiêu (kết quả làm tròn ở hàng phần trăm)?","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"9.62","subQuestions":[],"solutionHtml":"Nhiệt lượng cần cung cấp: $Q = m c (t_{nc} - t_1) + m \\lambda = 1{,}0 \\cdot 880 \\cdot (658 - 8) + 1{,}0 \\cdot 3{,}9 \\cdot 10^5 = 572000 + 390000 = 962000\\text{ J} = 9{,}62 \\cdot 10^5\\text{ J}$. Vậy $a = 9{,}62$.","rawSolution":"Nhiệt lượng cần cung cấp: $Q = m c (t_{nc} - t_1) + m \\lambda = 1{,}0 \\cdot 880 \\cdot (658 - 8) + 1{,}0 \\cdot 3{,}9 \\cdot 10^5 = 572000 + 390000 = 962000\\text{ J} = 9{,}62 \\cdot 10^5\\text{ J}$. Vậy $a = 9{,}62$."}]},{"blockId":"single_6ffab202-9cb5-4f1f-93bb-c648bb051785_23","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"6ffab202-9cb5-4f1f-93bb-c648bb051785","type":"short","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Một bếp đun nước có công suất $500\\text{ W}$ đun một lượng nước $300\\text{ g}$ ở $20^{\\circ}\\text{C}$ (áp suất $1\\text{ atm}$). Cho biết nhiệt dung riêng của nước là $4200\\text{ J/kg.K}$. Biết hiệu suất của bếp là $70\\%$. Thời gian cần thiết để đun nước trong ấm đạt đến nhiệt độ sôi là bao nhiêu giây (s)?","rawText":"Một bếp đun nước có công suất $500\\text{ W}$ đun một lượng nước $300\\text{ g}$ ở $20^{\\circ}\\text{C}$ (áp     (function() {
      var dataEl = document.getElementById('edusync-runtime-data');
      var EXAM = JSON.parse(dataEl.textContent || '{}');
      var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      var TF_LABELS = ['a', 'b', 'c', 'd', 'e', 'f'];

      function shuffle(arr) {
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      var blocks = EXAM.shuffleQuestions ? shuffle(EXAM.blocks || []) : (EXAM.blocks || []);
      var flatQuestions = [];
      blocks.forEach(function(block) {
        block.questions.forEach(function(q) {
          if (q.type === 'mcq' && EXAM.shuffleOptions && Array.isArray(q.optionsHtml)) {
            var tagged = q.optionsHtml.map(function(html, idx) {
              return { html: html, raw: q.optionsRaw[idx], isCorrect: idx === q.correctIndex };
            });
            var mixed = shuffle(tagged);
            q.optionsHtml = mixed.map(function(m) { return m.html; });
            q.optionsRaw = mixed.map(function(m) { return m.raw; });
            q.correctIndex = Math.max(0, mixed.findIndex(function(m) { return m.isCorrect; }));
          }
          q.displayNumber = flatQuestions.length + 1;
          flatQuestions.push(q);
        });
      });

      var userAnswers = {};
      var submitted = false;
      var durationLimit = (EXAM.durationMinutes || 0) > 0 ? EXAM.durationMinutes * 60 : 0;
      var startTime = Date.now();
      var timerHandle = null;

      function fmtTime(sec) {
        var s = Math.max(0, Math.floor(sec));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function isQuestionAnswered(q) {
        var ans = userAnswers[q.id];
        if (q.type === 'mcq') return typeof ans === 'number';
        if (q.type === 'short') return typeof ans === 'string' && ans.trim().length > 0;
        if (q.type === 'group-tf') {
          if (!ans || typeof ans !== 'object') return false;
          return q.subQuestions.some(function(sq) { return ans[sq.id] === 'True' || ans[sq.id] === 'False'; });
        }
        return false;
      }

      function updateProgress() {
        var done = flatQuestions.filter(isQuestionAnswered).length;
        document.getElementById('progressLabel').textContent = done + '/' + flatQuestions.length;
        document.getElementById('sidebarCount').textContent = 'Đã làm ' + done + '/' + flatQuestions.length;
        flatQuestions.forEach(function(q) {
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          if (!pBtn || submitted) return;
          pBtn.className = 'p-btn mono' + (isQuestionAnswered(q) ? ' done' : '');
        });
      }

      function buildQuestionEl(q) {
        var card = document.createElement('article');
        card.className = 'q-card';
        card.id = 'qcard_' + q.displayNumber;

        var header = document.createElement('div');
        header.className = 'q-header';
        var leftMeta = '<span class="q-num">Câu ' + q.displayNumber + '</span>';
        var tags = [q.level ? ('Mức ' + q.level) : '', q.points + ' đ', q.chapterName || ''].filter(Boolean).join(' · ');
        header.innerHTML = leftMeta + '<span id="qstatus_' + q.displayNumber + '" class="q-status">' + tags + '</span>';
        card.appendChild(header);

        var qTextEl = document.createElement('div');
        qTextEl.className = 'q-text';
        qTextEl.innerHTML = q.textHtml;
        card.appendChild(qTextEl);

        if (q.ownImageUrl) {
          var fig = document.createElement('div');
          fig.className = 'q-figure';
          var img = document.createElement('img');
          img.src = q.ownImageUrl;
          img.alt = 'Hình minh họa câu ' + q.displayNumber;
          fig.appendChild(img);
          card.appendChild(fig);
        }

        if (q.type === 'mcq') {
          var grid = document.createElement('div');
          grid.className = 'options-grid';
          q.optionsHtml.forEach(function(optHtml, optIdx) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.id = 'opt_' + q.id + '_' + optIdx;
            btn.innerHTML = '<span class="opt-letter mono">' + (LETTERS[optIdx] || optIdx + 1) + '</span><span style="flex:1;">' + optHtml + '</span>';
            btn.addEventListener('click', function() {
              if (submitted) return;
              userAnswers[q.id] = optIdx;
              q.optionsHtml.forEach(function(_, i2) {
                var el = document.getElementById('opt_' + q.id + '_' + i2);
                if (el) el.classList.toggle('selected', i2 === optIdx);
              });
              updateProgress();
            });
            grid.appendChild(btn);
          });
          card.appendChild(grid);
        } else if (q.type === 'group-tf') {
          var list = document.createElement('div');
          list.className = 'tf-list';
          q.subQuestions.forEach(function(sq, sIdx) {
            var row = document.createElement('div');
            row.className = 'tf-row';
            row.id = 'tfrow_' + sq.id;

            var txt = document.createElement('div');
            txt.className = 'tf-text';
            txt.innerHTML = '<strong>' + (TF_LABELS[sIdx] || (sIdx + 1)) + ')</strong> ' + sq.textHtml;
            row.appendChild(txt);

            var actions = document.createElement('div');
            actions.className = 'tf-actions';
            ['True', 'False'].forEach(function(val) {
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'tf-choice';
              b.id = 'tfbtn_' + sq.id + '_' + val;
              b.textContent = val === 'True' ? 'Đúng' : 'Sai';
              b.addEventListener('click', function() {
                if (submitted) return;
                if (!userAnswers[q.id] || typeof userAnswers[q.id] !== 'object') userAnswers[q.id] = {};
                userAnswers[q.id][sq.id] = val;
                var bt = document.getElementById('tfbtn_' + sq.id + '_True');
                var bf = document.getElementById('tfbtn_' + sq.id + '_False');
                if (bt) bt.classList.toggle('active', val === 'True');
                if (bf) bf.classList.toggle('active', val === 'False');
                updateProgress();
              });
              actions.appendChild(b);
            });
            row.appendChild(actions);
            list.appendChild(row);
          });
          card.appendChild(list);
        } else {
          var sBox = document.createElement('div');
          sBox.className = 'short-box';
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'short-input';
          inp.id = 'short_' + q.id;
          inp.placeholder = 'Nhập đáp số (vd: 2.6 hoặc 36)';
          inp.addEventListener('input', function() {
            if (submitted) return;
            userAnswers[q.id] = inp.value;
            updateProgress();
          });
          var fb = document.createElement('span');
          fb.id = 'shortfb_' + q.id;
          fb.className = 'short-feedback';
          sBox.appendChild(inp);
          sBox.appendChild(fb);
          card.appendChild(sBox);
        }

        if (q.solutionHtml) {
          var sol = document.createElement('div');
          sol.className = 'solution-box';
          sol.id = 'sol_' + q.id;
          sol.innerHTML = '<strong>Lời giải chi tiết:</strong><div style="margin-top:4px;">' + q.solutionHtml + '</div>';
          card.appendChild(sol);
        }

        return card;
      }

      function renderExam() {
        var root = document.getElementById('questionsRoot');
        var pal = document.getElementById('paletteRoot');
        root.innerHTML = '';
        pal.innerHTML = '';

        blocks.forEach(function(block) {
          if (block.contextHtml || block.sharedImageUrl) {
            var groupEl = document.createElement('section');
            groupEl.className = 'context-group';

            var head = document.createElement('div');
            head.className = 'context-header';
            var firstNum = block.questions[0].displayNumber;
            var lastNum = block.questions[block.questions.length - 1].displayNumber;
            var labelText = block.questions.length > 1
              ? 'Dữ liệu dùng chung cho Câu ' + firstNum + ' – Câu ' + lastNum
              : 'Dữ liệu đề bài (Câu ' + firstNum + ')';
            var html = '<div class="context-label">' + labelText + '</div>';
            if (block.contextHtml) {
              html += '<div class="context-body">' + block.contextHtml + '</div>';
            }
            head.innerHTML = html;
            if (block.sharedImageUrl) {
              var fig = document.createElement('div');
              fig.className = 'q-figure';
              var img = document.createElement('img');
              img.src = block.sharedImageUrl;
              img.alt = labelText;
              fig.appendChild(img);
              head.appendChild(fig);
            }
            groupEl.appendChild(head);

            var inner = document.createElement('div');
            inner.className = 'context-questions';
            block.questions.forEach(function(q) {
              inner.appendChild(buildQuestionEl(q));
            });
            groupEl.appendChild(inner);
            root.appendChild(groupEl);
          } else {
            block.questions.forEach(function(q) {
              root.appendChild(buildQuestionEl(q));
            });
          }
        });

        flatQuestions.forEach(function(q) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'p-btn mono';
          b.id = 'pbtn_' + q.displayNumber;
          b.textContent = String(q.displayNumber);
          b.addEventListener('click', function() {
            var target = document.getElementById('qcard_' + q.displayNumber);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          pal.appendChild(b);
        });

        updateProgress();
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }
      }

      function normalizeShort(val) {
        return String(val || '').trim().replace(/,/g, '.').replace(/\s+/g, '').toLowerCase();
      }

      function isShortMatch(userVal, expectedVal) {
        var u = normalizeShort(userVal);
        var e = normalizeShort(expectedVal);
        if (!u) return false;
        if (u === e) return true;
        var nu = parseFloat(u);
        var ne = parseFloat(e);
        if (!isNaN(nu) && !isNaN(ne) && String(nu) === u || !isNaN(nu) && !isNaN(ne)) {
          if (/^-?\d+(?:\.\d+)?$/.test(u) && /^-?\d+(?:\.\d+)?$/.test(e)) {
            return Math.abs(nu - ne) < 1e-6;
          }
        }
        return false;
      }

      function gradeAndSubmit(force) {
        if (submitted) return;
        var answered = flatQuestions.filter(isQuestionAnswered).length;
        if (!force && answered < flatQuestions.length) {
          document.getElementById('confirmMsg').textContent =
            'Bạn mới làm ' + answered + '/' + flatQuestions.length + ' câu. Bạn có chắc muốn nộp bài ngay?';
          document.getElementById('confirmBar').classList.add('visible');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        document.getElementById('confirmBar').classList.remove('visible');
        submitted = true;
        if (timerHandle) clearInterval(timerHandle);

        var totalScore = 0;
        var maxScore = EXAM.maxScore || 10;
        var correctQuestions = 0;
        var answerDetails = [];

        flatQuestions.forEach(function(q) {
          var qCorrect = false;
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          var stEl = document.getElementById('qstatus_' + q.displayNumber);
          var solEl = document.getElementById('sol_' + q.id);
          if (solEl) solEl.classList.add('visible');

          if (q.type === 'mcq') {
            var chosen = typeof userAnswers[q.id] === 'number' ? userAnswers[q.id] : -1;
            qCorrect = chosen === q.correctIndex;
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            q.optionsHtml.forEach(function(_, i) {
              var ob = document.getElementById('opt_' + q.id + '_' + i);
              if (!ob) return;
              ob.disabled = true;
              ob.classList.remove('selected');
              if (i === q.correctIndex) ob.classList.add('correct');
              else if (i === chosen) ob.classList.add('wrong');
            });
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: q.optionsRaw,
              selectedIndex: chosen,
              correctIndex: q.correctIndex,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          } else if (q.type === 'group-tf') {
            var tfMap = (userAnswers[q.id] && typeof userAnswers[q.id] === 'object') ? userAnswers[q.id] : {};
            var rightSubs = 0;
            q.subQuestions.forEach(function(sq, sIdx) {
              var picked = tfMap[sq.id] || '';
              var subOk = picked === sq.correctAnswer;
              if (subOk) rightSubs++;
              var row = document.getElementById('tfrow_' + sq.id);
              if (row) row.classList.add(subOk ? 'ok' : 'bad');
              ['True', 'False'].forEach(function(v) {
                var btn = document.getElementById('tfbtn_' + sq.id + '_' + v);
                if (!btn) return;
                btn.disabled = true;
                if (v === sq.correctAnswer) btn.classList.add('right-ans');
              });
              answerDetails.push({
                orderIndex: answerDetails.length,
                questionText: 'Câu ' + q.displayNumber + (TF_LABELS[sIdx] || '') + ': ' + sq.rawText,
                options: ['Đúng', 'Sai'],
                selectedIndex: picked === 'True' ? 0 : (picked === 'False' ? 1 : -1),
                correctIndex: sq.correctAnswer === 'True' ? 0 : 1,
                isCorrect: subOk,
                explanation: sIdx === q.subQuestions.length - 1 ? q.rawSolution : ''
              });
            });
            var earnedRatio = 0;
            if (q.subQuestions.length === 4) {
              earnedRatio = rightSubs === 1 ? 0.1 : rightSubs === 2 ? 0.25 : rightSubs === 3 ? 0.5 : rightSubs === 4 ? 1 : 0;
            } else if (q.subQuestions.length > 0) {
              earnedRatio = rightSubs / q.subQuestions.length;
            }
            var earned = Math.round(q.points * earnedRatio * 100) / 100;
            totalScore += earned;
            qCorrect = rightSubs === q.subQuestions.length;
            if (qCorrect) correctQuestions++;
            if (stEl) {
              stEl.textContent = 'Đúng ' + rightSubs + '/' + q.subQuestions.length + ' ý (+' + earned + 'đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
          } else {
            var rawInput = document.getElementById('short_' + q.id);
            var typed = rawInput ? rawInput.value.trim() : '';
            if (rawInput) rawInput.disabled = true;
            qCorrect = isShortMatch(typed, q.correctAnswer);
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            var fbEl = document.getElementById('shortfb_' + q.id);
            if (fbEl) {
              fbEl.textContent = qCorrect
                ? ('Chính xác (+' + q.points + 'đ)')
                : ('Đáp án đúng: ' + q.correctAnswer);
              fbEl.style.color = qCorrect ? 'var(--ok)' : 'var(--bad)';
            }
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: ['Bài làm: ' + (typed || '(bỏ trống)'), 'Đáp án chuẩn: ' + q.correctAnswer],
              selectedIndex: qCorrect ? 1 : 0,
              correctIndex: 1,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          }

          if (pBtn) {
            pBtn.className = 'p-btn mono ' + (qCorrect ? 'ok' : 'bad');
          }
        });

        totalScore = Math.round(totalScore * 100) / 100;
        var pct = maxScore > 0 ? Math.round((totalScore / maxScore) * 1000) / 10 : 0;

        document.getElementById('scoreText').textContent = totalScore + ' / ' + maxScore + ' điểm';
        document.getElementById('correctText').textContent =
          'Đúng hoàn toàn ' + correctQuestions + ' / ' + flatQuestions.length + ' câu (' + pct + '%)';
        document.getElementById('resultScreen').classList.add('visible');
        document.getElementById('topSubmitBtn').style.display = 'none';
        document.getElementById('sideSubmitBtn').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }

        if (typeof window.EduSyncSubmitScore === 'function') {
          window.EduSyncSubmitScore(totalScore, maxScore, correctQuestions, flatQuestions.length, answerDetails);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'QUIZ_RESULT',
            score: totalScore,
            maxScore: maxScore,
            correctCount: correctQuestions,
            totalQuestions: flatQuestions.length,
            answerDetails: answerDetails
          }, '*');
        }
      }

      document.getElementById('topSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('sideSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('confirmYesBtn').addEventListener('click', function() { gradeAndSubmit(true); });
      document.getElementById('confirmCancelBtn').addEventListener('click', function() {
        document.getElementById('confirmBar').classList.remove('visible');
      });

      function tickTimer() {
        if (submitted) return;
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var box = document.getElementById('timerBox');
        if (durationLimit > 0) {
          var rem = Math.max(0, durationLimit - elapsed);
          box.textContent = fmtTime(rem);
          box.classList.toggle('urgent', rem <= 60);
          if (rem <= 0) gradeAndSubmit(true);
        } else {
          box.textContent = fmtTime(elapsed);
        }
      }

      renderExam();
      tickTimer();
      timerHandle = setInterval(tickTimer, 1000);
    })();
  </script>
</body>
</html>
