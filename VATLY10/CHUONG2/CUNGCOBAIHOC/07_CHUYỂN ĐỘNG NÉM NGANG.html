      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;

    .btn-primary { background: var(--accent); color: #fff; }

      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 20px;
      align-items: start;

    }

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .result-card {
      background: var(--ok-bg);
      border: 1px solid var(--ok-border);
      border-radius: 12px;
      padding: 20px;

    .result-card.visible { display: block; }

      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 4px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #92400e;

    .confirm-bar.visible { display: flex; }
    .context-group {
      background: var(--surface);
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      overflow: hidden;

      border-bottom: 1px solid var(--border);
      padding: 16px 20px;

      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;

    .context-body { font-size: 14px; color: #1e293b; }

      padding: 18px;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      background: #fff;

      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--border);

      background: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      color: #334155;

      "index": 17,

      "text": "Một vận động viên nhảy xa dậm nhảy với vận tốc ban đầu $v_0 = 7,5$ m/s theo phương xiên $30^\\circ$ so với phương nằm ngang. Lấy $g = 9,8 m/s^2$. Thời gian từ lúc bắt đầu nhảy lên tới lúc rơi xuống hố nhảy xấp xỉ bằng:",

      "index": 19,

      "level": "VDC",
      "text": "Một máy bay chở hàng đang bay ngang ở độ cao $490$ m với vận tốc $100$ m/s thì thả một gói hàng cứu trợ xuống vùng lũ lụt. Lấy $g = 9,8 m/s^2$ và bỏ qua sức cản không khí. Độ lớn vận tốc của gói hàng ngay khi chạm đất xấp xỉ bằng:",

ng $v_{0y} = v_0 \\sin \\alpha$."}]},{"blockId":"single_e0d34974-cd75-41f0-8351-7566cb6c35c0_8","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"e0d34974-cd75-41f0-8351-7566cb6c35c0","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Từ thí nghiệm dùng búa đập nhẹ thanh thép thả bi B rơi tự do đồng thời đẩy bi A theo phương ngang từ cùng một độ cao (Hình 12.1 SGK), kết quả cho thấy:","rawText":"Từ thí nghiệm dùng búa đập nhẹ thanh thép thả bi B rơi tự do đồng thời đẩy bi A theo phương ngang từ cùng một độ cao (Hình 12.1 SGK), kết quả cho thấy:","ownImageUrl":"","optionsHtml":["Viên bi A bị ném ngang sẽ chạm đất sau viên bi B.","Viên bi B rơi tự do sẽ chạm đất sau viên bi A.","Hai viên bi A và B chạm đất cùng một lúc.","Viên bi nào có khối lượng lớn hơn sẽ chạm đất trước."],"optionsRaw":["Viên bi A bị ném ngang sẽ chạm đất sau viên bi B.","Viên bi B rơi tự do sẽ chạm đất sau viên bi A.","Hai viên bi A và B chạm đất cùng một lúc.","Viên bi nào có khối lượng lớn hơn sẽ chạm đất trước."],"correctIndex":2,"correctAnswer":"Hai viên bi A và B chạm đất cùng một lúc.","subQuestions":[],"solutionHtml":"Thí nghiệm và ảnh chụp hoạt nghiệm (Hình 12.2 SGK) chứng minh hai viên bi chạm đất cùng một lúc vì chuyển động thành phần theo phương thẳng đứng của hai bi là hoàn toàn giống nhau.","rawSolution":"Thí nghiệm và ảnh chụp hoạt nghiệm (Hình 12.2 SGK) chứng minh hai viên bi chạm đất cùng một lúc vì chuyển động thành phần theo phương thẳng đứng của hai bi là hoàn toàn giống nhau."}]},{"blockId":"single_57ee275d-f18d-4f8a-9777-cf5de7af654c_9","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"57ee275d-f18d-4f8a-9777-cf5de7af654c","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Thời gian rơi từ lúc ném cho đến khi chạm đất của một vật bị ném ngang phụ thuộc vào những đại lượng nào?","rawText":"Thời gian rơi từ lúc ném cho đến khi chạm đất của một vật bị ném ngang phụ thuộc vào những đại lượng nào?","ownImageUrl":"","optionsHtml":["Chỉ phụ thuộc vào độ cao $H$ từ vị trí ném và gia tốc trọng trường $g$.","Phụ thuộc vào vận tốc ban đầu $v_0$ và khối lượng của vật.","Phụ thuộc vào vận tốc ban đầu $v_0$ và độ cao $H$.","Chỉ phụ thuộc vào khối lượng của vật ném."],"optionsRaw":["Chỉ phụ thuộc vào độ cao $H$ từ vị trí ném và gia tốc trọng trường $g$.","Phụ thuộc vào vận tốc ban đầu $v_0$ và khối lượng của vật.","Phụ thuộc vào vận tốc ban đầu $v_0$ và độ cao $H$.","Chỉ phụ thuộc vào khối lượng của vật ném."],"correctIndex":0,"correctAnswer":"Chỉ phụ thuộc vào độ cao $H$ từ vị trí ném và gia tốc trọng trường $g$.","subQuestions":[],"solutionHtml":"Công thức $t = \\sqrt{\\frac{2H}{g}}$. Thời gian rơi chỉ phụ thuộc độ cao $H$ và gia tốc trọng trường $g$, không phụ thuộc vào vận tốc ném hay khối lượng vật.","rawSolution":"Công thức $t = \\sqrt{\\frac{2H}{g}}$. Thời gian rơi chỉ phụ thuộc độ cao $H$ và gia tốc trọng trường $g$, không phụ thuộc vào vận tốc ném hay khối lượng vật."}]},{"blockId":"single_49052a3e-8d20-4eda-b00c-42915d39019c_10","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"49052a3e-8d20-4eda-b00c-42915d39019c","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Nếu từ cùng một độ cao, đồng thời ném ngang hai vật khác nhau với các vận tốc ban đầu $v_{01} &lt; v_{02}$ (bỏ qua sức cản không khí) thì:","rawText":"Nếu từ cùng một độ cao, đồng thời ném ngang hai vật khác nhau với các vận tốc ban đầu $v_{01} < v_{02}$ (bỏ qua sức cản không khí) thì:","ownImageUrl":"","optionsHtml":["Vật 1 chạm đất trước vật 2.","Vật 2 có tầm xa lớn hơn vật 1 và cả hai chạm đất cùng một lúc.","Vật 1 có tầm xa lớn hơn vật 2.","Vật 2 chạm đất trước vật 1."],"optionsRaw":["Vật 1 chạm đất trước vật 2.","Vật 2 có tầm xa lớn hơn vật 1 và cả hai chạm đất cùng một lúc.","Vật 1 có tầm xa lớn hơn vật 2.","Vật 2 chạm đất trước vật 1."],"correctIndex":1,"correctAnswer":"Vật 2 có tầm xa lớn hơn vật 1 và cả hai chạm đất cùng một lúc.","subQuestions":[],"solutionHtml":"Do ném từ cùng độ cao $H$ nên thời gian rơi $t$ là như nhau (chạm đất cùng lúc). Tầm xa $L = v_0 t$, vật nào có $v_0$ lớn hơn sẽ có tầm xa lớn hơn.","rawSolution":"Do ném từ cùng độ cao $H$ nên thời gian rơi $t$ là như nhau (chạm đất cùng lúc). Tầm xa $L = v_0 t$, vật nào có $v_0$ lớn hơn sẽ có tầm xa lớn hơn."}]},{"blockId":"single_15aae893-d9ab-4271-81f8-97078d129752_11","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"15aae893-d9ab-4271-81f8-97078d129752","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Trong chuyển động ném xiên, tại vị trí cao nhất trên quỹ đạo (đạt tầm cao $H$), gia tốc của vật có giá trị bằng bao nhiêu?","rawText":"Trong chuyển động ném xiên, tại vị trí cao nhất trên quỹ đạo (đạt tầm cao $H$), gia tốc của vật có giá trị bằng bao nhiêu?","ownImageUrl":"","optionsHtml":["Bằng 0.","Bằng gia tốc trọng trường $g$ và hướng thẳng đứng xuống dưới.","Bằng gia tốc trọng trường $g$ và hướng theo phương nằm ngang.","Bằng $g \\cdot \\sin \\alpha$."],"optionsRaw":["Bằng 0.","Bằng gia tốc trọng trường $g$ và hướng thẳng đứng xuống dưới.","Bằng gia tốc trọng trường $g$ và hướng theo phương nằm ngang.","Bằng $g \\cdot \\sin \\alpha$."],"correctIndex":1,"correctAnswer":"Bằng gia tốc trọng trường $g$ và hướng thẳng đứng xuống dưới.","subQuestions":[],"solutionHtml":"Bỏ qua sức cản không khí, vật luôn chịu duy nhất lực hấp dẫn (trọng lực), nên gia tốc của vật ở mọi vị trí trên quỹ đạo (kể cả đỉnh $H$) luôn bằng gia tốc trọng trường $g$ hướng thẳng đứng xuống.","rawSolution":"Bỏ qua sức cản không khí, vật luôn chịu duy nhất lực hấp dẫn (trọng lực), nên gia tốc của vật ở mọi vị trí trên quỹ đạo (kể cả đỉnh $H$) luôn bằng gia tốc trọng trường $g$ hướng thẳng đứng xuống."}]},{"blockId":"single_0a990630-706b-4933-bf91-16f8c1ef5bca_12","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"0a990630-706b-4933-bf91-16f8c1ef5bca","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Trong chuyển động ném xiên, độ lớn vận tốc tổng hợp của vật đạt giá trị cực tiểu tại vị trí nào trên quỹ đạo?","rawText":"Trong chuyển động ném xiên, độ lớn vận tốc tổng hợp của vật đạt giá trị cực tiểu tại vị trí nào trên quỹ đạo?","ownImageUrl":"","optionsHtml":["Tại vị trí bắt đầu ném.","Tại vị trí chạm đất.","Tại vị trí đạt tầm cao $H$ (đỉnh quỹ đạo).","Độ lớn vận tốc không đổi suốt quá trình chuyển động."],"optionsRaw":["Tại vị trí bắt đầu ném.","Tại vị trí chạm đất.","Tại vị trí đạt tầm cao $H$ (đỉnh quỹ đạo).","Độ lớn vận tốc không đổi suốt quá trình chuyển động."],"correctIndex":2,"correctAnswer":"Tại vị trí đạt tầm cao $H$ (đỉnh quỹ đạo).","subQuestions":[],"solutionHtml":"Vận tốc tổng hợp $v = \\sqrt{v_x^2 + v_y^2}$. Vì $v_x = v_0 \\cos \\alpha$ không đổi, còn tại đỉnh tầm cao $H$ thì $v_y = 0$, do đó $v_{min} = v_x = v_0 \\cos \\alpha$.","rawSolution":"Vận tốc tổng hợp $v = \\sqrt{v_x^2 + v_y^2}$. Vì $v_x = v_0 \\cos \\alpha$ không đổi, còn tại đỉnh tầm cao $H$ thì $v_y = 0$, do đó $v_{min} = v_x = v_0 \\cos \\alpha$."}]},{"blockId":"single_4e27a6be-20b5-4a20-a2a5-b42347a72e2b_13","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"4e27a6be-20b5-4a20-a2a5-b42347a72e2b","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Nếu ném hai quả bóng giống nhau với cùng vận tốc ban đầu $v_0$ theo phương nằm ngang từ hai độ cao $h_1 &lt; h_2$ khác nhau thì:","rawText":"Nếu ném hai quả bóng giống nhau với cùng vận tốc ban đầu $v_0$ theo phương nằm ngang từ hai độ cao $h_1 < h_2$ khác nhau thì:","ownImageUrl":"","optionsHtml":["Quả bóng ném ở độ cao $h_2$ sẽ chạm đất trước.","Quả bóng ném ở độ cao $h_1$ sẽ có tầm xa lớn hơn.","Quả bóng ném ở độ cao $h_1$ sẽ chạm đất trước và quả bóng ở độ cao $h_2$ sẽ có tầm xa lớn hơn.","Cả hai quả bóng chạm đất cùng lúc và có cùng tầm xa."],"optionsRaw":["Quả bóng ném ở độ cao $h_2$ sẽ chạm đất trước.","Quả bóng ném ở độ cao $h_1$ sẽ có tầm xa lớn hơn.","Quả bóng ném ở độ cao $h_1$ sẽ chạm đất trước và quả bóng ở độ cao $h_2$ sẽ có tầm xa lớn hơn.","Cả hai quả bóng chạm đất cùng lúc và có cùng tầm xa."],"correctIndex":2,"correctAnswer":"Quả bóng ném ở độ cao $h_1$ sẽ chạm đất trước và quả bóng ở độ cao $h_2$ sẽ có tầm xa lớn hơn.","subQuestions":[],"solutionHtml":"Vì $h_1 &lt; h_2$ nên $t_1 = \\sqrt{\\frac{2h_1}{g}} &lt; t_2 = \\sqrt{\\frac{2h_2}{g}}$, suy ra quả bóng ở $h_1$ chạm đất trước. Tầm xa $L = v_0 t$, do $t_2 &gt; t_1$ nên quả bóng ở $h_2$ có tầm xa lớn hơn.","rawSolution":"Vì $h_1 < h_2$ nên $t_1 = \\sqrt{\\frac{2h_1}{g}} < t_2 = \\sqrt{\\frac{2h_2}{g}}$, suy ra quả bóng ở $h_1$ chạm đất trước. Tầm xa $L = v_0 t$, do $t_2 > t_1$ nên quả bóng ở $h_2$ có tầm xa lớn hơn."}]},{"blockId":"single_19fea29d-9080-42cb-82e7-58a3f6102de6_14","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"19fea29d-9080-42cb-82e7-58a3f6102de6","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Trong bộ môn nhảy xa, chuyển động của vận động viên là một ví dụ về chuyển động ném xiên. Để đạt thành tích nhảy xa nhất (tầm xa $L$ lớn nhất), yếu tố quyết định là:","rawText":"Trong bộ môn nhảy xa, chuyển động của vận động viên là một ví dụ về chuyển động ném xiên. Để đạt thành tích nhảy xa nhất (tầm xa $L$ lớn nhất), yếu tố quyết định là:","ownImageUrl":"","optionsHtml":["Vận tốc giậm nhảy ban đầu $v_0$ càng lớn và góc giậm nhảy $\\alpha$ thích hợp.","Chỉ cần khối lượng cơ thể thật nặng.","Giậm nhảy theo phương thẳng đứng góc $90^\\circ$.","Thời gian chạy đà ngắn nhất có thể."],"optionsRaw":["Vận tốc giậm nhảy ban đầu $v_0$ càng lớn và góc giậm nhảy $\\alpha$ thích hợp.","Chỉ cần khối lượng cơ thể thật nặng.","Giậm nhảy theo phương thẳng đứng góc $90^\\circ$.","Thời gian chạy đà ngắn nhất có thể."],"correctIndex":0,"correctAnswer":"Vận tốc giậm nhảy ban đầu $v_0$ càng lớn và góc giậm nhảy $\\alpha$ thích hợp.","subQuestions":[],"solutionHtml":"Tầm xa $L = \\frac{v_0^2 \\sin 2\\alpha}{g}$ phụ thuộc trực tiếp vào vận tốc giậm nhảy ban đầu $v_0$ và góc nhảy $\\alpha$.","rawSolution":"Tầm xa $L = \\frac{v_0^2 \\sin 2\\alpha}{g}$ phụ thuộc trực tiếp vào vận tốc giậm nhảy ban đầu $v_0$ và góc nhảy $\\alpha$."}]},{"blockId":"single_72b4138d-ecd8-4d88-ad81-3e2fe7023a99_15","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"72b4138d-ecd8-4d88-ad81-3e2fe7023a99","type":"mcq","level":"B","chapterName":"","points":0.5,"textHtml":"Một người đứng từ đài quan sát ven biển ném một hòn đá theo phương nằm ngang với vận tốc $12$ m/s. Biết độ cao từ vị trí ném so với mặt biển là $40$ m, lấy $g = 9,8 m/s^2$. Bỏ qua sức cản không khí. Tầm xa $L$ của hòn đá đạt được là:","rawText":"Một người đứng từ đài quan sát ven biển ném một hòn đá theo phương nằm ngang với vận tốc $12$ m/s. Biết độ cao từ vị trí ném so với mặt biển là $40$ m, lấy $g = 9,8 m/s^2$. Bỏ qua sức cản không khí. Tầm xa $L$ của hòn đá đạt được là:","ownImageUrl":"","optionsHtml":["$28,6$ m","$34,3$ m","$48,0$ m","$12,0$ m"],"optionsRaw":["$28,6$ m","$34,3$ m","$48,0$ m","$12,0$ m"],"correctIndex":1,"correctAnswer":"$34,3$ m","subQuestions":[],"solutionHtml":"Thời gian rơi: $t = \\sqrt{\\frac{2H}{g}} = \\sqrt{\\frac{2 \\cdot 40}{9,8}} \\approx 2,86$ s. Tầm xa: $L = v_0 \\cdot t = 12 \\cdot 2,86 \\approx 34,3$ m.","rawSolution":"Thời gian rơi: $t = \\sqrt{\\frac{2H}{g}} = \\sqrt{\\frac{2 \\cdot 40}{9,8}} \\approx 2,86$ s. Tầm xa: $L = v_0 \\cdot t = 12 \\cdot 2,86 \\approx 34,3$ m."}]},{"blockId":"single_c8b4d295-984b-41d1-b883-6b9805d518f6_16","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"c8b4d295-984b-41d1-b883-6b9805d518f6","type":"mcq","level":"B","chapterName":"","points":0.5,"textHtml":"Một vận động viên nhảy xa dậm nhảy với vận tốc ban đầu $v_0 = 7,5$ m/s theo phương xiên $30^\\circ$ so với phương nằm ngang. Lấy $g = 9,8 m/s^2$. Thời gian từ lúc bắt đầu nhảy lên tới lúc rơi xuống hố nhảy xấp xỉ bằng:","rawText":"Một vận động viên nhảy xa dậm nhảy với vận tốc ban đầu $v_0 = 7,5$ m/s theo phương xiên $30^\\circ$ so với phương nằm ngang. Lấy $g = 9,8 m/s^2$. Thời gian từ lúc bắt đầu nhảy lên tới lúc rơi xuống hố nhảy xấp xỉ bằng:","ownImageUrl":"","optionsHtml":["$0,383$ s","$0,766$ s","$1,250$ s","$0,500$ s"],"optionsRaw":["$0,383$ s","$0,766$ s","$1,250$ s","$0,500$ s"],"correctIndex":1,"correctAnswer":"$0,766$ s","subQuestions":[],"solutionHtml":"Vận tốc ban đầu theo phương thẳng đứng: $v_{0y} = v_0 \\sin 30^\\circ = 7,5 \\cdot 0,5 = 3,75$ m/s. Thời gian đạt tầm cao: $t = \\frac{v_{0y}}{g} = \\frac{3,75}{9,8} \\approx 0,383$ s. Thời gian từ lúc nhảy tới lúc rơi xuống hố nhảy: $t&#39; = 2t = 2 \\cdot 0,383 = 0,766$ s.","rawSolution":"Vận tốc ban đầu theo phương thẳng đứng: $v_{0y} = v_0 \\sin 30^\\circ = 7,5 \\cdot 0,5 = 3,75$ m/s. Thời gian đạt tầm cao: $t = \\frac{v_{0y}}{g} = \\frac{3,75}{9,8} \\approx 0,383$ s. Thời gian từ lúc nhảy tới lúc rơi xuống hố nhảy: $t' = 2t = 2 \\cdot 0,383 = 0,766$ s."}]},{"blockId":"single_3e59cfb6-9bb7-43f3-8cb9-9c2ff741c0a6_17","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"3e59cfb6-9bb7-43f3-8cb9-9c2ff741c0a6","type":"mcq","level":"B","chapterName":"","points":0.5,"textHtml":"Bắn một viên bi với vận tốc ban đầu $4$ m/s hướng lên theo phương xiên $45^\\circ$ so với phương nằm ngang. Bỏ qua sức cản không khí, lấy $g = 9,8 m/s^2$. Tầm cao $H$ viên bi đạt được xấp xỉ bằng:","rawText":"Bắn một viên bi với vận tốc ban đầu $4$ m/s hướng lên theo phương xiên $45^\\circ$ so với phương nằm ngang. Bỏ qua sức cản không khí, lấy $g = 9,8 m/s^2$. Tầm cao $H$ viên bi đạt được xấp xỉ bằng:","ownImageUrl":"","optionsHtml":["$0,408$ m","$0,816$ m","$0,204$ m","$1,200$ m"],"optionsRaw":["$0,408$ m","$0,816$ m","$0,204$ m","$1,200$ m"],"correctIndex":0,"correctAnswer":"$0,408$ m","subQuestions":[],"solutionHtml":"$H = \\frac{v_0^2 \\sin^2 \\alpha}{2g} = \\frac{4^2 \\cdot (\\sin 45^\\circ)^2}{2 \\cdot 9,8} = \\frac{16 \\cdot 0,5}{19,6} = \\frac{8}{19,6} \\approx 0,408$ m.","rawSolution":"$H = \\frac{v_0^2 \\sin^2 \\alpha}{2g} = \\frac{4^2 \\cdot (\\sin 45^\\circ)^2}{2 \\cdot 9,8} = \\frac{16 \\cdot 0,5}{19,6} = \\frac{8}{19,6} \\approx 0,408$ m."}]},{"blockId":"single_80b5688e-8d45-472b-bc8c-8dce6a25bb87_18","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"80b5688e-8d45-472b-bc8c-8dce6a25bb87","type":"mcq","level":"VDC","chapterName":"","points":0.4,"textHtml":"Một máy bay chở hàng đang bay ngang ở độ cao $490$ m với vận tốc $100$ m/s thì thả một gói hàng cứu trợ xuống vùng lũ lụt. Lấy $g = 9,8 m/s^2$ và bỏ qua sức cản không khí. Độ lớn vận tốc của gói hàng ngay khi chạm đất xấp xỉ bằng:","rawText":"Một máy bay chở hàng đang bay ngang ở độ cao $490$ m với vận tốc $100$ m/s thì thả một gói hàng cứu trợ xuống vùng lũ lụt. Lấy $g = 9,8 m/s^2$ và bỏ qua sức cản không khí. Độ lớn vận tốc của gói hàng ngay khi chạm đất xấp xỉ bằng:","ownImageUrl":"","optionsHtml":["$98$ m/s","$100$ m/s","$140$ m/s","$198$ m/s"],"optionsRaw":["$98$ m/s","$100$ m/s","$140$ m/s","$198$ m/s"],"correctIndex":2,"correctAnswer":"$140$ m/s","subQuestions":[],"solutionHtml":"Thời gian rơi: $t = \\sqrt{\\frac{2H}{g}} = \\sqrt{\\frac{2 \\cdot 490}{9,8}} = 10$ s.<br>Khi chạm đất:<br>- Thành phần nằm ngang: $v_x = v_0 = 100$ m/s.<br>- Thành phần thẳng đứng: $v_y = g \\cdot t = 9,8 \\cdot 10 = 98$ m/s.<br>- Vận tốc tổng hợp khi chạm đất: $v = \\sqrt{v_x^2 + v_y^2} = \\sqrt{100^2 + 98^2} = \\sqrt{10000 + 9604} = \\sqrt{19604} \\approx 140$ m/s.","rawSolution":"Thời gian rơi: $t = \\sqrt{\\frac{2H}{g}} = \\sqrt{\\frac{2 \\cdot 490}{9,8}} = 10$ s.\nKhi chạm đất:\n- Thành phần nằm ngang: $v_x = v_0 = 100$ m/s.\n- Thành phần thẳng đứng: $v_y = g \\cdot t = 9,8 \\cdot 10 = 98$ m/s.\n- Vận tốc tổng hợp khi chạm đất: $v = \\sqrt{v_x^2 + v_y^2} = \\sqrt{100^2 + 98^2} = \\sqrt{10000 + 9604} = \\sqrt{19604} \\approx 140$ m/s."}]},{"blockId":"single_1ee4196d-0782-4162-86fc-795a57dd3551_19","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"1ee4196d-0782-4162-86fc-795a57dd3551","type":"mcq","level":"VDC","chapterName":"","points":0.5,"textHtml":"Bắn một viên bi với vận tốc ban đầu $4$ m/s hướng lên theo phương xiên $45^\\circ$ so với phương nằm ngang. Lấy $g = 9,8 m/s^2$. Độ lớn vận tốc tổng hợp của viên bi sau thời điểm bắn $t = 0,2$ s là bao nhiêu?","rawText":"Bắn một viên bi với vận tốc ban đầu $4$ m/s hướng lên theo phương xiên $45^\\circ$ so với phương nằm ngang. Lấy $g = 9,8 m/s^2$. Độ lớn vận tốc tổng hợp của viên bi sau thời điểm bắn $t = 0,2$ s là bao nhiêu?","ownImageUrl":"","optionsHtml":["$2,96$ m/s","$2,83$ m/s","$0,87$ m/s","$3,52$ m/s"],"optionsRaw":["$2,96$ m/s","$2,83$ m/s","$0,87$ m/s","$3,52$ m/s"],"correctIndex":0,"correctAnswer":"$2,96$ m/s","subQuestions":[],"solutionHtml":"Vận tốc ban đầu:<br>$v_{0x} = v_0 \\cos 45^\\circ = 4 \\cdot \\frac{\\sqrt{2}}{2} \\approx 2,828$ m/s.<br>$v_{0y} = v_0 \\sin 45^\\circ = 4 \\cdot \\frac{\\sqrt{2}}{2} \\approx 2,828$ m/s.<br><br>Sau $t = 0,2$ s:<br>- Thành phần ngang: $v_x = v_{0x} = 2,828$ m/s.<br>- Thành phần thẳng đứng: $v_y = v_{0y} - g \\cdot t = 2,828 - 9,8 \\cdot 0,2 = 2,828 - 1,96 = 0,868$ m/s.<br><br>Độ lớn vận tốc tổng hợp:<br>$v = \\sqrt{v_x^2 + v_y^2} = \\sqrt{2,828^2 + 0,868^2} = \\sqrt{8,00 + 0,753} = \\sqrt{8,753} \\approx 2,96$ m/s.","rawSolution":"Vận tốc ban đầu:\n$v_{0x} = v_0 \\cos 45^\\circ = 4 \\cdot \\frac{\\sqrt{2}}{2} \\approx 2,828$ m/s.\n$v_{0y} = v_0 \\sin 45^\\circ = 4 \\cdot \\frac{\\sqrt{2}}{2} \\approx 2,828$ m/s.\n\nSau $t = 0,2$ s:\n- Thành phần ngang: $v_x = v_{0x} = 2,828$ m/s.\n- Thành phần thẳng đứng: $v_y = v_{0y} - g \\cdot t = 2,828 - 9,8 \\cdot 0,2 = 2,828 - 1,96 = 0,868$ m/s.\n\nĐộ lớn vận tốc tổng hợp:\n$v = \\sqrt{v_x^2 + v_y^2} = \\sqrt{2,828^2 + 0,868^2} = \\sqrt{8,00 + 0,753} = \\sqrt{8,753} \\approx 2,96$ m/s."}]}]}</script>
  <script>
    (function() {
      var dataEl = document.getElementById('edusync-runtime-data');
      var EXAM = JSON.parse(dataEl.textContent || '{}');
      var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      var TF_LABELS = ['a', 'b', 'c', 'd', 'e', 'f'];

      function shuffle(arr) {
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      var blocks = EXAM.shuffleQuestions ? shuffle(EXAM.blocks || []) : (EXAM.blocks || []);
      var flatQuestions = [];
      blocks.forEach(function(block) {
        block.questions.forEach(function(q) {
          if (q.type === 'mcq' && EXAM.shuffleOptions && Array.isArray(q.optionsHtml)) {
            var tagged = q.optionsHtml.map(function(html, idx) {
              return { html: html, raw: q.optionsRaw[idx], isCorrect: idx === q.correctIndex };
            });
            var mixed = shuffle(tagged);
            q.optionsHtml = mixed.map(function(m) { return m.html; });
            q.optionsRaw = mixed.map(function(m) { return m.raw; });
            q.correctIndex = Math.max(0, mixed.findIndex(function(m) { return m.isCorrect; }));
          }
          q.displayNumber = flatQuestions.length + 1;
          flatQuestions.push(q);
        });
      });

      var userAnswers = {};
      var submitted = false;
      var durationLimit = (EXAM.durationMinutes || 0) > 0 ? EXAM.durationMinutes * 60 : 0;
      var startTime = Date.now();
      var timerHandle = null;

      function fmtTime(sec) {
        var s = Math.max(0, Math.floor(sec));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function isQuestionAnswered(q) {
        var ans = userAnswers[q.id];
        if (q.type === 'mcq') return typeof ans === 'number';
        if (q.type === 'short') return typeof ans === 'string' && ans.trim().length > 0;
        if (q.type === 'group-tf') {
          if (!ans || typeof ans !== 'object') return false;
          return q.subQuestions.some(function(sq) { return ans[sq.id] === 'True' || ans[sq.id] === 'False'; });
        }
        return false;
      }

      function updateProgress() {
        var done = flatQuestions.filter(isQuestionAnswered).length;
        document.getElementById('progressLabel').textContent = done + '/' + flatQuestions.length;
        document.getElementById('sidebarCount').textContent = 'Đã làm ' + done + '/' + flatQuestions.length;
        flatQuestions.forEach(function(q) {
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          if (!pBtn || submitted) return;
          pBtn.className = 'p-btn mono' + (isQuestionAnswered(q) ? ' done' : '');
        });
      }

      function buildQuestionEl(q) {
        var card = document.createElement('article');
        card.className = 'q-card';
        card.id = 'qcard_' + q.displayNumber;

        var header = document.createElement('div');
        header.className = 'q-header';
        var leftMeta = '<span class="q-num">Câu ' + q.displayNumber + '</span>';
        var tags = [q.level ? ('Mức ' + q.level) : '', q.points + ' đ', q.chapterName || ''].filter(Boolean).join(' · ');
        header.innerHTML = leftMeta + '<span id="qstatus_' + q.displayNumber + '" class="q-status">' + tags + '</span>';
        card.appendChild(header);

        var qTextEl = document.createElement('div');
        qTextEl.className = 'q-text';
        qTextEl.innerHTML = q.textHtml;
        card.appendChild(qTextEl);

        if (q.ownImageUrl) {
          var fig = document.createElement('div');
          fig.className = 'q-figure';
          var img = document.createElement('img');
          img.src = q.ownImageUrl;
          img.alt = 'Hình minh họa câu ' + q.displayNumber;
          fig.appendChild(img);
          card.appendChild(fig);
        }

        if (q.type === 'mcq') {
          var grid = document.createElement('div');
          grid.className = 'options-grid';
          q.optionsHtml.forEach(function(optHtml, optIdx) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.id = 'opt_' + q.id + '_' + optIdx;
            btn.innerHTML = '<span class="opt-letter mono">' + (LETTERS[optIdx] || optIdx + 1) + '</span><span style="flex:1;">' + optHtml + '</span>';
            btn.addEventListener('click', function() {
              if (submitted) return;
              userAnswers[q.id] = optIdx;
              q.optionsHtml.forEach(function(_, i2) {
                var el = document.getElementById('opt_' + q.id + '_' + i2);
                if (el) el.classList.toggle('selected', i2 === optIdx);
              });
              updateProgress();
            });
            grid.appendChild(btn);
          });
          card.appendChild(grid);
        } else if (q.type === 'group-tf') {
          var list = document.createElement('div');
          list.className = 'tf-list';
          q.subQuestions.forEach(function(sq, sIdx) {
            var row = document.createElement('div');
            row.className = 'tf-row';
            row.id = 'tfrow_' + sq.id;

            var txt = document.createElement('div');
            txt.className = 'tf-text';
            txt.innerHTML = '<strong>' + (TF_LABELS[sIdx] || (sIdx + 1)) + ')</strong> ' + sq.textHtml;
            row.appendChild(txt);

            var actions = document.createElement('div');
            actions.className = 'tf-actions';
            ['True', 'False'].forEach(function(val) {
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'tf-choice';
              b.id = 'tfbtn_' + sq.id + '_' + val;
              b.textContent = val === 'True' ? 'Đúng' : 'Sai';
              b.addEventListener('click', function() {
                if (submitted) return;
                if (!userAnswers[q.id] || typeof userAnswers[q.id] !== 'object') userAnswers[q.id] = {};
                userAnswers[q.id][sq.id] = val;
                var bt = document.getElementById('tfbtn_' + sq.id + '_True');
                var bf = document.getElementById('tfbtn_' + sq.id + '_False');
                if (bt) bt.classList.toggle('active', val === 'True');
                if (bf) bf.classList.toggle('active', val === 'False');
                updateProgress();
              });
              actions.appendChild(b);
            });
            row.appendChild(actions);
            list.appendChild(row);
          });
          card.appendChild(list);
        } else {
          var sBox = document.createElement('div');
          sBox.className = 'short-box';
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'short-input';
          inp.id = 'short_' + q.id;
          inp.placeholder = 'Nhập đáp số (vd: 2.6 hoặc 36)';
          inp.addEventListener('input', function() {
            if (submitted) return;
            userAnswers[q.id] = inp.value;
            updateProgress();
          });
          var fb = document.createElement('span');
          fb.id = 'shortfb_' + q.id;
          fb.className = 'short-feedback';
          sBox.appendChild(inp);
          sBox.appendChild(fb);
          card.appendChild(sBox);
        }

        if (q.solutionHtml) {
          var sol = document.createElement('div');
          sol.className = 'solution-box';
          sol.id = 'sol_' + q.id;
          sol.innerHTML = '<strong>Lời giải chi tiết:</strong><div style="margin-top:4px;">' + q.solutionHtml + '</div>';
          card.appendChild(sol);
        }

        return card;
      }

      function renderExam() {
        var root = document.getElementById('questionsRoot');
        var pal = document.getElementById('paletteRoot');
        root.innerHTML = '';
        pal.innerHTML = '';

        blocks.forEach(function(block) {
          if (block.contextHtml || block.sharedImageUrl) {
            var groupEl = document.createElement('section');
            groupEl.className = 'context-group';

            var head = document.createElement('div');
            head.className = 'context-header';
            var firstNum = block.questions[0].displayNumber;
            var lastNum = block.questions[block.questions.length - 1].displayNumber;
            var labelText = block.questions.length > 1
              ? 'Dữ liệu dùng chung cho Câu ' + firstNum + ' – Câu ' + lastNum
              : 'Dữ liệu đề bài (Câu ' + firstNum + ')';
            var html = '<div class="context-label">' + labelText + '</div>';
            if (block.contextHtml) {
              html += '<div class="context-body">' + block.contextHtml + '</div>';
            }
            head.innerHTML = html;
            if (block.sharedImageUrl) {
              var fig = document.createElement('div');
              fig.className = 'q-figure';
              var img = document.createElement('img');
              img.src = block.sharedImageUrl;
              img.alt = labelText;
              fig.appendChild(img);
              head.appendChild(fig);
            }
            groupEl.appendChild(head);

            var inner = document.createElement('div');
            inner.className = 'context-questions';
            block.questions.forEach(function(q) {
              inner.appendChild(buildQuestionEl(q));
            });
            groupEl.appendChild(inner);
            root.appendChild(groupEl);
          } else {
            block.questions.forEach(function(q) {
              root.appendChild(buildQuestionEl(q));
            });
          }
        });

        flatQuestions.forEach(function(q) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'p-btn mono';
          b.id = 'pbtn_' + q.displayNumber;
          b.textContent = String(q.displayNumber);
          b.addEventListener('click', function() {
            var target = document.getElementById('qcard_' + q.displayNumber);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          pal.appendChild(b);
        });

        updateProgress();
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }
      }

      function normalizeShort(val) {
        return String(val || '').trim().replace(/,/g, '.').replace(/\s+/g, '').toLowerCase();
      }

      function isShortMatch(userVal, expectedVal) {
        var u = normalizeShort(userVal);
        var e = normalizeShort(expectedVal);
        if (!u) return false;
        if (u === e) return true;
        var nu = parseFloat(u);
        var ne = parseFloat(e);
        if (!isNaN(nu) && !isNaN(ne) && String(nu) === u || !isNaN(nu) && !isNaN(ne)) {
          if (/^-?\d+(?:\.\d+)?$/.test(u) && /^-?\d+(?:\.\d+)?$/.test(e)) {
            return Math.abs(nu - ne) < 1e-6;
          }
        }
        return false;
      }

      function gradeAndSubmit(force) {
        if (submitted) return;
        var answered = flatQuestions.filter(isQuestionAnswered).length;
        if (!force && answered < flatQuestions.length) {
          document.getElementById('confirmMsg').textContent =
            'Bạn mới làm ' + answered + '/' + flatQuestions.length + ' câu. Bạn có chắc muốn nộp bài ngay?';
          document.getElementById('confirmBar').classList.add('visible');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        document.getElementById('confirmBar').classList.remove('visible');
        submitted = true;
        if (timerHandle) clearInterval(timerHandle);

        var totalScore = 0;
        var maxScore = EXAM.maxScore || 10;
        var correctQuestions = 0;
        var answerDetails = [];

        flatQuestions.forEach(function(q) {
          var qCorrect = false;
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          var stEl = document.getElementById('qstatus_' + q.displayNumber);
          var solEl = document.getElementById('sol_' + q.id);
          if (solEl) solEl.classList.add('visible');

          if (q.type === 'mcq') {
            var chosen = typeof userAnswers[q.id] === 'number' ? userAnswers[q.id] : -1;
            qCorrect = chosen === q.correctIndex;
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            q.optionsHtml.forEach(function(_, i) {
              var ob = document.getElementById('opt_' + q.id + '_' + i);
              if (!ob) return;
              ob.disabled = true;
              ob.classList.remove('selected');
              if (i === q.correctIndex) ob.classList.add('correct');
              else if (i === chosen) ob.classList.add('wrong');
            });
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: q.optionsRaw,
              selectedIndex: chosen,
              correctIndex: q.correctIndex,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          } else if (q.type === 'group-tf') {
            var tfMap = (userAnswers[q.id] && typeof userAnswers[q.id] === 'object') ? userAnswers[q.id] : {};
            var rightSubs = 0;
            q.subQuestions.forEach(function(sq, sIdx) {
              var picked = tfMap[sq.id] || '';
              var subOk = picked === sq.correctAnswer;
              if (subOk) rightSubs++;
              var row = document.getElementById('tfrow_' + sq.id);
              if (row) row.classList.add(subOk ? 'ok' : 'bad');
              ['True', 'False'].forEach(function(v) {
                var btn = document.getElementById('tfbtn_' + sq.id + '_' + v);
                if (!btn) return;
                btn.disabled = true;
                if (v === sq.correctAnswer) btn.classList.add('right-ans');
              });
              answerDetails.push({
                orderIndex: answerDetails.length,
                questionText: 'Câu ' + q.displayNumber + (TF_LABELS[sIdx] || '') + ': ' + sq.rawText,
                options: ['Đúng', 'Sai'],
                selectedIndex: picked === 'True' ? 0 : (picked === 'False' ? 1 : -1),
                correctIndex: sq.correctAnswer === 'True' ? 0 : 1,
                isCorrect: subOk,
                explanation: sIdx === q.subQuestions.length - 1 ? q.rawSolution : ''
              });
            });
            var earnedRatio = 0;
            if (q.subQuestions.length === 4) {
              earnedRatio = rightSubs === 1 ? 0.1 : rightSubs === 2 ? 0.25 : rightSubs === 3 ? 0.5 : rightSubs === 4 ? 1 : 0;
            } else if (q.subQuestions.length > 0) {
              earnedRatio = rightSubs / q.subQuestions.length;
            }
            var earned = Math.round(q.points * earnedRatio * 100) / 100;
            totalScore += earned;
            qCorrect = rightSubs === q.subQuestions.length;
            if (qCorrect) correctQuestions++;
            if (stEl) {
              stEl.textContent = 'Đúng ' + rightSubs + '/' + q.subQuestions.length + ' ý (+' + earned + 'đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
          } else {
            var rawInput = document.getElementById('short_' + q.id);
            var typed = rawInput ? rawInput.value.trim() : '';
            if (rawInput) rawInput.disabled = true;
            qCorrect = isShortMatch(typed, q.correctAnswer);
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            var fbEl = document.getElementById('shortfb_' + q.id);
            if (fbEl) {
              fbEl.textContent = qCorrect
                ? ('Chính xác (+' + q.points + 'đ)')
                : ('Đáp án đúng: ' + q.correctAnswer);
              fbEl.style.color = qCorrect ? 'var(--ok)' : 'var(--bad)';
            }
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: ['Bài làm: ' + (typed || '(bỏ trống)'), 'Đáp án chuẩn: ' + q.correctAnswer],
              selectedIndex: qCorrect ? 1 : 0,
              correctIndex: 1,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          }

          if (pBtn) {
            pBtn.className = 'p-btn mono ' + (qCorrect ? 'ok' : 'bad');
          }
        });

        totalScore = Math.round(totalScore * 100) / 100;
        var pct = maxScore > 0 ? Math.round((totalScore / maxScore) * 1000) / 10 : 0;

        document.getElementById('scoreText').textContent = totalScore + ' / ' + maxScore + ' điểm';
        document.getElementById('correctText').textContent =
          'Đúng hoàn toàn ' + correctQuestions + ' / ' + flatQuestions.length + ' câu (' + pct + '%)';
        document.getElementById('resultScreen').classList.add('visible');
        document.getElementById('topSubmitBtn').style.display = 'none';
        document.getElementById('sideSubmitBtn').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }

        if (typeof window.EduSyncSubmitScore === 'function') {
          window.EduSyncSubmitScore(totalScore, maxScore, correctQuestions, flatQuestions.length, answerDetails);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'QUIZ_RESULT',
            score: totalScore,
            maxScore: maxScore,
            correctCount: correctQuestions,
            totalQuestions: flatQuestions.length,
            answerDetails: answerDetails
          }, '*');
        }
      }

      document.getElementById('topSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('sideSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('confirmYesBtn').addEventListener('click', function() { gradeAndSubmit(true); });
      document.getElementById('confirmCancelBtn').addEventListener('click', function() {
        document.getElementById('confirmBar').classList.remove('visible');
      });

      function tickTimer() {
        if (submitted) return;
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var box = document.getElementById('timerBox');
        if (durationLimit > 0) {
          var rem = Math.max(0, durationLimit - elapsed);
          box.textContent = fmtTime(rem);
          box.classList.toggle('urgent', rem <= 60);
          if (rem <= 0) gradeAndSubmit(true);
        } else {
          box.textContent = fmtTime(elapsed);
        }
      }

      renderExam();
      tickTimer();
      timerHandle = setInterval(tickTimer, 1000);
    })();
  </script>
</body>
</html>
