<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Luyện Củng Cố Kiến Thức - Bài 24: Công Suất</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .bg-cream { background-color: #fcfaf0; }
        .text-cream { color: #fcfaf0; }
    </style>
</head>
<body class="bg-indigo-950 min-h-screen text-slate-200">

    <header class="p-6 border-b border-indigo-800">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 text-indigo-950 p-2 rounded-lg font-bold text-xl flex items-center justify-center">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-cream tracking-wide uppercase">ÔN LUYỆN CỦNG CỐ KIẾN THỨC</h1>
                    <p class="text-xs text-purple-200 font-medium">Bài 24: CÔNG SUẤT <span class="opacity-75">(Vật lí 10 - Chương IV)</span></p>
                </div>
            </div>
            <div id="mode-badge" class="px-3 py-1 rounded-full bg-indigo-900 border border-indigo-700 text-xs font-semibold text-amber-400">
                Chế độ Luyện Tập
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6" id="app">
        <div id="welcome-screen" class="text-center py-12">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-500/20 text-amber-300 rounded-full text-2xl border border-amber-400/40 mb-2">
                <i class="fa-solid fa-gauge-high"></i>
            </div>
            <h2 class="text-3xl md:text-4xl font-black text-cream uppercase tracking-tight">BÀI KIỂM TRA TRẮC NGHIỆM KHÁCH QUAN</h2>
            <p class="text-purple-200 text-sm md:text-base max-w-3xl mx-auto mt-4">
                Bộ câu hỏi chuẩn hóa gồm <strong class="text-amber-300 font-bold">20 câu hỏi</strong> bám sát nội dung bài học <strong class="text-cream">Bài 24: Công suất</strong> chuẩn cấu trúc GDPT 2018.
            </p>
            <button onclick="startQuiz()" class="mt-8 px-8 py-4 bg-amber-500 hover:bg-amber-400 text-indigo-950 font-bold rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-amber-500/20">
                Bắt đầu làm bài
            </button>
        </div>

        <div id="quiz-area" class="hidden space-y-6">
            <div class="flex justify-between items-center text-sm font-semibold text-purple-300">
                <span id="question-count">Câu 1/20</span>
                <span id="level-badge" class="px-2 py-1 rounded bg-indigo-900/50">Mức: Biết</span>
            </div>
            <div id="question-text" class="text-xl md:text-2xl font-bold text-white leading-relaxed"></div>
            <div id="options-grid" class="grid md:grid-cols-2 gap-4"></div>
            <div class="flex justify-between pt-6">
                <button onclick="prevQuestion()" id="prev-btn" class="px-6 py-2 bg-indigo-800 text-purple-200 rounded-lg opacity-50 cursor-not-allowed">Câu trước</button>
                <button onclick="nextQuestion()" id="next-btn" class="px-6 py-2 bg-amber-500 text-indigo-950 font-bold rounded-lg hover:bg-amber-400">Câu tiếp theo</button>
            </div>
        </div>

        <div id="result-screen" class="hidden text-center py-12">
            <h2 class="text-3xl font-black text-cream">KẾT QUẢ BÀI KIỂM TRA</h2>
            <div class="text-6xl font-bold text-amber-400 my-6" id="score-display">0/20</div>
            <p id="feedback-text" class="text-purple-200 mb-8"></p>
            <button onclick="location.reload()" class="px-6 py-3 bg-indigo-800 text-white rounded-lg hover:bg-indigo-700">Làm lại từ đầu</button>
        </div>
    </main>

    <script>
        const rawQuestions = [
            { id: 1, level: "Biết", levelCode: "know", text: "Công suất là đại lượng đặc trưng cho:", options: ["Độ lớn của công thực hiện được", "Khả năng thực hiện công nhanh hay chậm", "Năng lượng đã bị tiêu hao", "Quãng đường vật dịch chuyển được"], correct: 1, explanation: "Công suất (tốc độ sinh công) là đại lượng đặc trưng cho sự nhanh hay chậm của việc thực hiện công." },
            { id: 2, level: "Biết", levelCode: "know", text: "Công thức tính công suất trung bình là:", options: ["\(\mathcal{P} = A \cdot t\)", "\(\mathcal{P} = \frac{A}{t}\)", "\(\mathcal{P} = \frac{t}{A}\)", "\(\mathcal{P} = F \cdot v\)"], correct: 1, explanation: "Theo định nghĩa, công suất \(\mathcal{P} = \frac{A}{t}\)." },
            { id: 3, level: "Biết", levelCode: "know", text: "Đơn vị đo công suất trong hệ SI là:", options: ["Jun (J)", "Niutơn (N)", "Oát (W)", "Kilôoát giờ (kWh)"], correct: 2, explanation: "Đơn vị đo công suất là Oát (W), với \(1 W = 1 J/s\)." },
            { id: 4, level: "Biết", levelCode: "know", text: "Kilôoát giờ (kWh) là đơn vị của đại lượng nào?", options: ["Công suất", "Công", "Lực", "Tốc độ"], correct: 1, explanation: "Kilôoát giờ (kWh) là đơn vị đo công, không phải đơn vị công suất." },
            { id: 5, level: "Biết", levelCode: "know", text: "1 Megaoát (MW) bằng bao nhiêu Oát?", options: ["\(10^2 W\)", "\(10^3 W\)", "\(10^6 W\)", "\(10^9 W\)"], correct: 2, explanation: "1 Megaoát = \(10^6\) Oát." },
            { id: 6, level: "Biết", levelCode: "know", text: "Công thức liên hệ giữa công suất, lực và tốc độ (khi chuyển động cùng hướng) là:", options: ["\(\mathcal{P} = F \cdot v\)", "\(\mathcal{P} = \frac{F}{v}\)", "\(\mathcal{P} = \frac{v}{F}\)", "\(\mathcal{P} = F \cdot s\)"], correct: 0, explanation: "Khi vật chuyển động cùng hướng với lực không đổi, \(\mathcal{P} = \frac{A}{t} = \frac{F \cdot s}{t} = F \cdot v\)." },
            { id: 7, level: "Biết", levelCode: "know", text: "Công suất tức thời được tính theo công thức:", options: ["\(\mathcal{P}_t = F \cdot v_t\)", "\(\mathcal{P}_t = \frac{A}{t}\)", "\(\mathcal{P}_t = A \cdot t\)", "\(\mathcal{P}_t = \frac{F}{v_t}\)"], correct: 0, explanation: "Công suất tức thời \(\mathcal{P}_t = F \cdot v_t\), trong đó \(v_t\) là tốc độ tức thời." },
            { id: 8, level: "Biết", levelCode: "know", text: "Một thiết bị có công suất 1 kW thực hiện công trong 1 giờ. Công thực hiện được là:", options: ["1 kJ", "1 kW", "1 kWh", "3600 J"], correct: 2, explanation: "Theo định nghĩa đơn vị, 1 kW thực hiện trong 1 giờ là 1 kWh." },
            { id: 9, level: "Hiểu", levelCode: "understand", text: "Hai người cùng nâng một vật nặng lên cao. Người A làm xong trong 10s, người B làm xong trong 20s. Kết luận nào đúng?", options: ["Người A thực hiện công lớn hơn", "Người B thực hiện công lớn hơn", "Người A có công suất lớn hơn", "Người B có công suất lớn hơn"], correct: 2, explanation: "Công thực hiện là như nhau, nhưng người A làm trong thời gian ngắn hơn nên công suất lớn hơn." },
            { id: 10, level: "Hiểu", levelCode: "understand", text: "Khi đi xe máy trên đường dốc hoặc đường có ma sát lớn, ta thường đi ở số nhỏ để làm gì?", options: ["Để tăng tốc độ xe", "Để giảm lực cản", "Để tăng lực kéo của động cơ", "Để giảm công tiêu thụ"], correct: 2, explanation: "Công suất \(\mathcal{P} = F \cdot v\). Khi cần lực kéo \(F\) lớn để lên dốc, xe cần đi ở tốc độ thấp (số nhỏ) để không vượt quá công suất giới hạn của động cơ." },
            { id: 11, level: "Hiểu", levelCode: "understand", text: "Một thang máy thực hiện công 1000 J trong 5 s. Công suất của thang máy là:", options: ["5000 W", "200 W", "50 W", "100 W"], correct: 1, explanation: "\(\mathcal{P} = \frac{1000}{5} = 200 W\)." },
            { id: 12, level: "Hiểu", levelCode: "understand", text: "Phát biểu nào sau đây là SAI?", options: ["Công suất là tốc độ sinh công", "Đơn vị của công suất là Oát (W)", "Kilôoát giờ là đơn vị đo công suất", "Công suất của một vật phụ thuộc vào lực và tốc độ"], correct: 2, explanation: "Kilôoát giờ là đơn vị đo công, không phải công suất." },
            { id: 13, level: "Hiểu", levelCode: "understand", text: "Một vận động viên nâng tạ nặng 100 kg lên cao 2m trong 2s. Công suất của vận động viên là (lấy \(g = 10 m/s^2\)):", options: ["2000 W", "1000 W", "500 W", "100 W"], correct: 1, explanation: "\(A = P \cdot h = m \cdot g \cdot h = 100 \cdot 10 \cdot 2 = 2000 J\). \(\mathcal{P} = \frac{2000}{2} = 1000 W\)." },
            { id: 14, level: "Hiểu", levelCode: "understand", text: "Động cơ của một ô tô có công suất \(50 kW\). Trong 10 phút, động cơ thực hiện được công là:", options: ["500 kJ", "30.000 kJ", "500 J", "5.000 kJ"], correct: 1, explanation: "\(A = \mathcal{P} \cdot t = 50.000 \cdot 600 = 30.000.000 J = 30.000 kJ\)." },
            { id: 15, level: "Hiểu", levelCode: "understand", text: "Một chiếc xe chuyển động đều với tốc độ \(10 m/s\), động cơ sinh ra lực kéo \(2000 N\). Công suất của xe là:", options: ["20 kW", "200 kW", "2 kW", "20.000 W"], correct: 0, explanation: "\(\mathcal{P} = F \cdot v = 2000 \cdot 10 = 20.000 W = 20 kW\)." },
            { id: 16, level: "Vận dụng", levelCode: "apply", text: "Một người kéo thùng nước 15 kg từ giếng sâu 8 m trong 10 s (chuyển động đều). Lấy \(g = 10 m/s^2\). Công suất của người kéo là:", options: ["12 W", "120 W", "1200 W", "150 W"], correct: 1, explanation: "\(F = P = 15 \cdot 10 = 150 N\). \(v = \frac{8}{10} = 0,8 m/s\). \(\mathcal{P} = F \cdot v = 150 \cdot 0,8 = 120 W\)." },
            { id: 17, level: "Vận dụng", levelCode: "apply", text: "Động cơ thang máy tác dụng lực kéo 20.000 N để thang máy đi lên 18 m trong 10 s. Công suất trung bình là:", options: ["3,6 kW", "36 kW", "1,1 kW", "11 kW"], correct: 1, explanation: "\(A = F \cdot s = 20.000 \cdot 18 = 360.000 J\). \(\mathcal{P} = \frac{360.000}{10} = 36.000 W = 36 kW\)." },
            { id: 18, level: "Vận dụng", levelCode: "apply", text: "Một ô tô 1 tấn chuyển động thẳng đều với vận tốc 54 km/h (15 m/s). Công suất 5 kW. Nếu lên dốc nghiêng 2,3 độ, công suất cần thiết là bao nhiêu để duy trì cùng vận tốc (coi lực cản không đổi, \(g=10 m/s^2\)):", options: ["Cần tăng thêm công suất", "Cần giảm công suất", "Giữ nguyên công suất", "Không thể tính được"], correct: 0, explanation: "Khi lên dốc, động cơ cần sinh thêm một phần lực để thắng thành phần trọng lực \(P \cdot \sin \alpha\), nên cần tăng công suất." },
            { id: 19, level: "VD Cao", levelCode: "high_apply", text: "Công suất trung bình của trái tim là 3 W. Trong 1 ngày (24h), tim thực hiện công bao nhiêu?", options: ["72 J", "259.200 J", "4320 J", "259.200 kJ"], correct: 1, explanation: "\(t = 24 \cdot 3600 = 86.400 s\). \(A = \mathcal{P} \cdot t = 3 \cdot 86.400 = 259.200 J\)." },
            { id: 20, level: "VD Cao", levelCode: "high_apply", text: "Nếu một người sống 70 tuổi, với công suất trung bình của tim là 3 W, công tim thực hiện là (Giả sử 1 năm có 365,25 ngày):", options: ["\(\approx 6,6 \cdot 10^9 J\)", "\(\approx 1,2 \cdot 10^8 J\)", "\(\approx 3,3 \cdot 10^9 J\)", "\(\approx 5,0 \cdot 10^7 J\)"], correct: 0, explanation: "\(A = 3 \cdot 70 \cdot 365,25 \cdot 24 \cdot 3600 \approx 6,6 \cdot 10^9 J\)." }
        ];

        let currentIdx = 0;
        let answers = new Array(rawQuestions.length).fill(null);

        function startQuiz() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = rawQuestions[currentIdx];
            document.getElementById('question-count').innerText = `Câu ${currentIdx + 1}/${rawQuestions.length}`;
            document.getElementById('level-badge').innerText = `Mức: ${q.level}`;
            document.getElementById('question-text').innerText = `${currentIdx + 1}. ${q.text}`;
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `p-4 text-left rounded-xl border-2 transition-all ${answers[currentIdx] === i ? 'border-amber-500 bg-amber-500/10' : 'border-indigo-800 hover:border-indigo-600 bg-indigo-900/30'}`;
                btn.innerHTML = opt;
                btn.onclick = () => selectAnswer(i);
                grid.appendChild(btn);
            });

            document.getElementById('prev-btn').style.opacity = currentIdx === 0 ? '0.5' : '1';
            document.getElementById('next-btn').innerText = currentIdx === rawQuestions.length - 1 ? 'Nộp bài' : 'Câu tiếp theo';
        }

        function selectAnswer(i) {
            answers[currentIdx] = i;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentIdx < rawQuestions.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion();
            }
        }

        function finishQuiz() {
            const score = answers.filter((a, i) => a === rawQuestions[i].correct).length;
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-display').innerText = `${score}/20`;
            document.getElementById('feedback-text').innerText = score >= 15 ? "Xuất sắc! Bạn đã nắm vững kiến thức bài Công suất." : "Cần cố gắng hơn! Hãy xem lại lời giải chi tiết và ôn lại bài học nhé.";
        }
    </script>
</body>
</html>
