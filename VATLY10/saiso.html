pe":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Một học sinh đo 5 lần thời gian chuyển động thu được các kết quả (tính bằng giây): $t_1 = 0{,}40$ s; $t_2 = 0{,}41$ s; $t_3 = 0{,}39$ s; $t_4 = 0{,}42$ s; $t_5 = 0{,}38$ s. Giá trị trung bình $\\overline{t}$ và sai số ngẫu nhiên trung bình $\\overline{\\Delta t}$ lần lượt là:","rawText":"Một học sinh đo 5 lần thời gian chuyển động thu được các kết quả (tính bằng giây): $t_1 = 0{,}40$ s; $t_2 = 0{,}41$ s; $t_3 = 0{,}39$ s; $t_4 = 0{,}42$ s; $t_5 = 0{,}38$ s. Giá trị trung bình $\\overline{t}$ và sai số ngẫu nhiên trung bình $\\overline{\\Delta t}$ lần lượt là:","ownImageUrl":"","optionsHtml":["$\\overline{t} = 0{,}40$ s và $\\overline{\\Delta t} = 0{,}012$ s","$\\overline{t} = 0{,}40$ s và $\\overline{\\Delta t} = 0{,}020$ s","$\\overline{t} = 0{,}41$ s và $\\overline{\\Delta t} = 0{,}010$ s","$\\overline{t} = 0{,}39$ s và $\\overline{\\Delta t} = 0{,}015$ s"],"optionsRaw":["$\\overline{t} = 0{,}40$ s và $\\overline{\\Delta t} = 0{,}012$ s","$\\overline{t} = 0{,}40$ s và $\\overline{\\Delta t} = 0{,}020$ s","$\\overline{t} = 0{,}41$ s và $\\overline{\\Delta t} = 0{,}010$ s","$\\overline{t} = 0{,}39$ s và $\\overline{\\Delta t} = 0{,}015$ s"],"correctIndex":0,"correctAnswer":"$\\overline{t} = 0{,}40$ s và $\\overline{\\Delta t} = 0{,}012$ s","subQuestions":[],"solutionHtml":"1) Giá trị trung bình: $\\overline{t} = \\frac{0{,}40 + 0{,}41 + 0{,}39 + 0{,}42 + 0{,}38}{5} = 0{,}40$ s.<br>2) Các sai số ngẫu nhiên tuyệt đối:<br>$\\Delta t_1 = |0{,}40 - 0{,}40| = 0{,}00$ s;<br>$\\Delta t_2 = |0{,}40 - 0{,}41| = 0{,}01$ s;<br>$\\Delta t_3 = |0{,}40 - 0{,}39| = 0{,}01$ s;<br>$\\Delta t_4 = |0{,}40 - 0{,}42| = 0{,}02$ s;<br>$\\Delta t_5 = |0{,}40 - 0{,}38| = 0{,}02$ s.<br>3) Sai số ngẫu nhiên trung bình: $\\overline{\\Delta t} = \\frac{0{,}00 + 0{,}01 + 0{,}01 + 0{,}02 + 0{,}02}{5} = 0{,}012$ s.","rawSolution":"1) Giá trị trung bình: $\\overline{t} = \\frac{0{,}40 + 0{,}41 + 0{,}39 + 0{,}42 + 0{,}38}{5} = 0{,}40$ s.\n2) Các sai số ngẫu nhiên tuyệt đối:\n$\\Delta t_1 = |0{,}40 - 0{,}40| = 0{,}00$ s;\n$\\Delta t_2 = |0{,}40 - 0{,}41| = 0{,}01$ s;\n$\\Delta t_3 = |0{,}40 - 0{,}39| = 0{,}01$ s;\n$\\Delta t_4 = |0{,}40 - 0{,}42| = 0{,}02$ s;\n$\\Delta t_5 = |0{,}40 - 0{,}38| = 0{,}02$ s.\n3) Sai số ngẫu nhiên trung bình: $\\overline{\\Delta t} = \\frac{0{,}00 + 0{,}01 + 0{,}01 + 0{,}02 + 0{,}02}{5} = 0{,}012$ s."}]},{"blockId":"single_a43bc36a-0274-4465-9aa1-621d34d233bc_11","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"a43bc36a-0274-4465-9aa1-621d34d233bc","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Cho hai đại lượng đo trực tiếp $B = 10{,}0 \\pm 0{,}2$ cm và $C = 4{,}0 \\pm 0{,}1$ cm. Xác định đại lượng hiệu $A = B - C$. Giá trị trung bình $\\overline{A}$ và sai số tuyệt đối $\\Delta A$ lần lượt là:","rawText":"Cho hai đại lượng đo trực tiếp $B = 10{,}0 \\pm 0{,}2$ cm và $C = 4{,}0 \\pm 0{,}1$ cm. Xác định đại lượng hiệu $A = B - C$. Giá trị trung bình $\\overline{A}$ và sai số tuyệt đối $\\Delta A$ lần lượt là:","ownImageUrl":"","optionsHtml":["$\\overline{A} = 6{,}0$ cm và $\\Delta A = 0{,}1$ cm","$\\overline{A} = 6{,}0$ cm và $\\Delta A = 0{,}3$ cm","$\\overline{A} = 14{,}0$ cm và $\\Delta A = 0{,}3$ cm","$\\overline{A} = 6{,}0$ cm và $\\Delta A = 0{,}2$ cm"],"optionsRaw":["$\\overline{A} = 6{,}0$ cm và $\\Delta A = 0{,}1$ cm","$\\overline{A} = 6{,}0$ cm và $\\Delta A = 0{,}3$ cm","$\\overline{A} = 14{,}0$ cm và $\\Delta A = 0{,}3$ cm","$\\overline{A} = 6{,}0$ cm và $\\Delta A = 0{,}2$ cm"],"correctIndex":1,"correctAnswer":"$\\overline{A} = 6{,}0$ cm và $\\Delta A = 0{,}3$ cm","subQuestions":[],"solutionHtml":"Giá trị trung bình: $\\overline{A} = \\overline{B} - \\overline{C} = 10{,}0 - 4{,}0 = 6{,}0$ cm.<br>Sai số tuyệt đối của tổng hay hiệu đều bằng TỔNG các sai số tuyệt đối: $\\Delta A = \\Delta B + \\Delta C = 0{,}2 + 0{,}1 = 0{,}3$ cm.","rawSolution":"Giá trị trung bình: $\\overline{A} = \\overline{B} - \\overline{C} = 10{,}0 - 4{,}0 = 6{,}0$ cm.\nSai số tuyệt đối của tổng hay hiệu đều bằng TỔNG các sai số tuyệt đối: $\\Delta A = \\Delta B + \\Delta C = 0{,}2 + 0{,}1 = 0{,}3$ cm."}]},{"blockId":"single_05495611-b259-4a0f-8915-e7d3fe201650_12","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"05495611-b259-4a0f-8915-e7d3fe201650","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Khi biểu diễn sai số bằng đồ thị sự phụ thuộc của đại lượng $y$ vào đại lượng $x$ (Hình 3.2 trong bài học), mỗi điểm thực nghiệm có sai số $\\pm\\Delta x$ và $\\pm\\Delta y$ được biểu diễn bằng hình gì?","rawText":"Khi biểu diễn sai số bằng đồ thị sự phụ thuộc của đại lượng $y$ vào đại lượng $x$ (Hình 3.2 trong bài học), mỗi điểm thực nghiệm có sai số $\\pm\\Delta x$ và $\\pm\\Delta y$ được biểu diễn bằng hình gì?","ownImageUrl":"","optionsHtml":["Hình tròn có bán kính bằng $\\Delta x + \\Delta y$.","Hình vuông có cạnh bằng $\\Delta x$.","Hình chữ nhật (ô bao sai số) có kích thước hai cạnh là $2\\Delta x$ và $2\\Delta y$.","Hình tam giác có đáy $2\\Delta x$ và chiều cao $2\\Delta y$."],"optionsRaw":["Hình tròn có bán kính bằng $\\Delta x + \\Delta y$.","Hình vuông có cạnh bằng $\\Delta x$.","Hình chữ nhật (ô bao sai số) có kích thước hai cạnh là $2\\Delta x$ và $2\\Delta y$.","Hình tam giác có đáy $2\\Delta x$ và chiều cao $2\\Delta y$."],"correctIndex":2,"correctAnswer":"Hình chữ nhật (ô bao sai số) có kích thước hai cạnh là $2\\Delta x$ và $2\\Delta y$.","subQuestions":[],"solutionHtml":"Theo SGK mục &#39;EM CÓ BIẾT?&#39;: Trên đồ thị, mỗi giá trị sẽ được biểu diễn bằng một điểm nằm trong ô chữ nhật có cạnh là $2\\Delta x$ và $2\\Delta y$ (gọi là ô bao sai số).","rawSolution":"Theo SGK mục 'EM CÓ BIẾT?': Trên đồ thị, mỗi giá trị sẽ được biểu diễn bằng một điểm nằm trong ô chữ nhật có cạnh là $2\\Delta x$ và $2\\Delta y$ (gọi là ô bao sai số)."}]},{"blockId":"single_13c0a41b-4eac-4278-9d47-c2e046834e7c_13","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"13c0a41b-4eac-4278-9d47-c2e046834e7c","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Tại sao để đo một đại lượng vật lý chính xác người ta cần phải tiến hành lặp lại phép đo nhiều lần?","rawText":"Tại sao để đo một đại lượng vật lý chính xác người ta cần phải tiến hành lặp lại phép đo nhiều lần?","ownImageUrl":"","optionsHtml":["Để loại bỏ hoàn toàn sai số dụng cụ.","Để giảm thiểu ảnh hưởng của sai số ngẫu nhiên và tìm được giá trị trung bình gần đúng nhất với giá trị thực.","Để giảm độ chia nhỏ nhất của dụng cụ đo.","Để chuyển từ phép đo trực tiếp thành phép đo gián tiếp."],"optionsRaw":["Để loại bỏ hoàn toàn sai số dụng cụ.","Để giảm thiểu ảnh hưởng của sai số ngẫu nhiên và tìm được giá trị trung bình gần đúng nhất với giá trị thực.","Để giảm độ chia nhỏ nhất của dụng cụ đo.","Để chuyển từ phép đo trực tiếp thành phép đo gián tiếp."],"correctIndex":1,"correctAnswer":"Để giảm thiểu ảnh hưởng của sai số ngẫu nhiên và tìm được giá trị trung bình gần đúng nhất với giá trị thực.","subQuestions":[],"solutionHtml":"Sai số ngẫu nhiên do các yếu tố ngẫu nhiên gây ra làm kết quả biến đổi khi đo lại. Lặp lại phép đo nhiều lần và lấy giá trị trung bình giúp làm giảm bớt ảnh hưởng của sai số ngẫu nhiên.","rawSolution":"Sai số ngẫu nhiên do các yếu tố ngẫu nhiên gây ra làm kết quả biến đổi khi đo lại. Lặp lại phép đo nhiều lần và lấy giá trị trung bình giúp làm giảm bớt ảnh hưởng của sai số ngẫu nhiên."}]},{"blockId":"single_15e3818d-4ab9-4239-b946-72b256a9f675_14","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"15e3818d-4ab9-4239-b946-72b256a9f675","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Một phép đo đại lượng $A$ cho giá trị trung bình $\\overline{A} = 50{,}0$ g và sai số tuyệt đối $\\Delta A = 0{,}5$ g. Sai số tỉ đối $\\delta A$ của phép đo này là:","rawText":"Một phép đo đại lượng $A$ cho giá trị trung bình $\\overline{A} = 50{,}0$ g và sai số tuyệt đối $\\Delta A = 0{,}5$ g. Sai số tỉ đối $\\delta A$ của phép đo này là:","ownImageUrl":"","optionsHtml":["$1{,}0\\%$","$0{,}1\\%$","$5{,}0\\%$","$0{,}5\\%$"],"optionsRaw":["$1{,}0\\%$","$0{,}1\\%$","$5{,}0\\%$","$0{,}5\\%$"],"correctIndex":0,"correctAnswer":"$1{,}0\\%$","subQuestions":[],"solutionHtml":"Áp dụng công thức (3.3): $\\delta A = \\frac{\\Delta A}{\\overline{A}} \\cdot 100\\% = \\frac{0{,}5}{50{,}0} \\cdot 100\\% = 1{,}0\\%$.","rawSolution":"Áp dụng công thức (3.3): $\\delta A = \\frac{\\Delta A}{\\overline{A}} \\cdot 100\\% = \\frac{0{,}5}{50{,}0} \\cdot 100\\% = 1{,}0\\%$."}]},{"blockId":"single_f914da9e-82bf-4418-b3cf-06d499825e57_15","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"f914da9e-82bf-4418-b3cf-06d499825e57","type":"mcq","level":"VD","chapterName":"","points":0.5,"textHtml":"Khi đo tốc độ chuyển động bằng công thức $v = \\frac{s}{t}$, thu được quãng đường $s = 100 \\pm 1$ cm và thời gian $t = 2{,}00 \\pm 0{,}04$ s. Sai số tỉ đối $\\delta v$ của phép đo tốc độ là bao nhiêu?","rawText":"Khi đo tốc độ chuyển động bằng công thức $v = \\frac{s}{t}$, thu được quãng đường $s = 100 \\pm 1$ cm và thời gian $t = 2{,}00 \\pm 0{,}04$ s. Sai số tỉ đối $\\delta v$ của phép đo tốc độ là bao nhiêu?","ownImageUrl":"","optionsHtml":["$1{,}0\\%$","$2{,}0\\%$","$3{,}0\\%$","$4{,}0\\%$"],"optionsRaw":["$1{,}0\\%$","$2{,}0\\%$","$3{,}0\\%$","$4{,}0\\%$"],"correctIndex":2,"correctAnswer":"$3{,}0\\%$","subQuestions":[],"solutionHtml":"1) Sai số tỉ đối của quãng đường: $\\delta s = \\frac{\\Delta s}{\\overline{s}} \\cdot 100\\% = \\frac{1}{100} \\cdot 100\\% = 1{,}0\\%$.<br>2) Sai số tỉ đối của thời gian: $\\delta t = \\frac{\\Delta t}{\\overline{t}} \\cdot 100\\% = \\frac{0{,}04}{2{,}00} \\cdot 100\\% = 2{,}0\\%$.<br>3) Vì $v = \\frac{s}{t}$ nên sai số tỉ đối $\\delta v = \\delta s + \\delta t = 1{,}0\\% + 2{,}0\\% = 3{,}0\\%$.","rawSolution":"1) Sai số tỉ đối của quãng đường: $\\delta s = \\frac{\\Delta s}{\\overline{s}} \\cdot 100\\% = \\frac{1}{100} \\cdot 100\\% = 1{,}0\\%$.\n2) Sai số tỉ đối của thời gian: $\\delta t = \\frac{\\Delta t}{\\overline{t}} \\cdot 100\\% = \\frac{0{,}04}{2{,}00} \\cdot 100\\% = 2{,}0\\%$.\n3) Vì $v = \\frac{s}{t}$ nên sai số tỉ đối $\\delta v = \\delta s + \\delta t = 1{,}0\\% + 2{,}0\\% = 3{,}0\\%$."}]},{"blockId":"single_0916c045-e50a-4534-86ce-18ac5bbdeba5_16","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"0916c045-e50a-4534-86ce-18ac5bbdeba5","type":"mcq","level":"VD","chapterName":"","points":0.5,"textHtml":"Đo quãng đường $s$ từ A đến C gồm 2 đoạn: $s_1$ (từ A đến B) và $s_2$ (từ B đến C). Kết quả đo lần lượt là $s_1 = 20{,}4 \\pm 0{,}2$ cm và $s_2 = 15{,}6 \\pm 0{,}3$ cm. Kết quả đo quãng đường $s$ được ghi đúng chuẩn là:","rawText":"Đo quãng đường $s$ từ A đến C gồm 2 đoạn: $s_1$ (từ A đến B) và $s_2$ (từ B đến C). Kết quả đo lần lượt là $s_1 = 20{,}4 \\pm 0{,}2$ cm và $s_2 = 15{,}6 \\pm 0{,}3$ cm. Kết quả đo quãng đường $s$ được ghi đúng chuẩn là:","ownImageUrl":"","optionsHtml":["$s = 36{,}0 \\pm 0{,}5$ cm","$s = 36{,}0 \\pm 0{,}1$ cm","$s = 36{,}0 \\pm 0{,}6$ cm","$s = 36{,}0 \\pm 0{,}25$ cm"],"optionsRaw":["$s = 36{,}0 \\pm 0{,}5$ cm","$s = 36{,}0 \\pm 0{,}1$ cm","$s = 36{,}0 \\pm 0{,}6$ cm","$s = 36{,}0 \\pm 0{,}25$ cm"],"correctIndex":0,"correctAnswer":"$s = 36{,}0 \\pm 0{,}5$ cm","subQuestions":[],"solutionHtml":"1) Giá trị trung bình: $\\overline{s} = \\overline{s_1} + \\overline{s_2} = 20{,}4 + 15{,}6 = 36{,}0$ cm.<br>2) Sai số tuyệt đối: $\\Delta s = \\Delta s_1 + \\Delta s_2 = 0{,}2 + 0{,}3 = 0{,}5$ cm.<br>3) Kết quả đo ghi dạng $s = \\overline{s} \\pm \\Delta s = 36{,}0 \\pm 0{,}5$ cm.","rawSolution":"1) Giá trị trung bình: $\\overline{s} = \\overline{s_1} + \\overline{s_2} = 20{,}4 + 15{,}6 = 36{,}0$ cm.\n2) Sai số tuyệt đối: $\\Delta s = \\Delta s_1 + \\Delta s_2 = 0{,}2 + 0{,}3 = 0{,}5$ cm.\n3) Kết quả đo ghi dạng $s = \\overline{s} \\pm \\Delta s = 36{,}0 \\pm 0{,}5$ cm."}]},{"blockId":"single_f390530f-a687-4081-87cd-9fcc82f1cc89_17","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"f390530f-a687-4081-87cd-9fcc82f1cc89","type":"mcq","level":"VD","chapterName":"","points":0.5,"textHtml":"Một học sinh đo tốc độ theo công thức $v = \\frac{s}{t}$. Biết giá trị trung bình $\\overline{s} = 2{,}00$ m, sai số tuyệt đối $\\Delta s = 0{,}02$ m; giá trị trung bình $\\overline{t} = 1{,}00$ s, sai số tuyệt đối $\\Delta t = 0{,}02$ s. Kết quả đo tốc độ $v$ được biểu diễn dưới dạng $\\overline{v} \\pm \\Delta v$ là:","rawText":"Một học sinh đo tốc độ theo công thức $v = \\frac{s}{t}$. Biết giá trị trung bình $\\overline{s} = 2{,}00$ m, sai số tuyệt đối $\\Delta s = 0{,}02$ m; giá trị trung bình $\\overline{t} = 1{,}00$ s, sai số tuyệt đối $\\Delta t = 0{,}02$ s. Kết quả đo tốc độ $v$ được biểu diễn dưới dạng $\\overline{v} \\pm \\Delta v$ là:","ownImageUrl":"","optionsHtml":["$v = 2{,}00 \\pm 0{,}06$ m/s","$v = 2{,}00 \\pm 0{,}04$ m/s","$v = 2{,}00 \\pm 0{,}02$ m/s","$v = 2{,}00 \\pm 0{,}08$ m/s"],"optionsRaw":["$v = 2{,}00 \\pm 0{,}06$ m/s","$v = 2{,}00 \\pm 0{,}04$ m/s","$v = 2{,}00 \\pm 0{,}02$ m/s","$v = 2{,}00 \\pm 0{,}08$ m/s"],"correctIndex":0,"correctAnswer":"$v = 2{,}00 \\pm 0{,}06$ m/s","subQuestions":[],"solutionHtml":"1) Giá trị trung bình tốc độ: $\\overline{v} = \\frac{\\overline{s}}{\\overline{t}} = \\frac{2{,}00}{1{,}00} = 2{,}00$ m/s.<br>2) Sai số tỉ đối: $\\delta s = \\frac{0{,}02}{2{,}00} \\cdot 100\\% = 1\\%$; $\\delta t = \\frac{0{,}02}{1{,}00} \\cdot 100\\% = 2\\% \\implies \\delta v = 1\\% + 2\\% = 3\\%$.<br>3) Sai số tuyệt đối: $\\Delta v = \\delta v \\cdot \\overline{v} = 3\\% \\cdot 2{,}00 = 0{,}06$ m/s.<br>4) Kết quả: $v = 2{,}00 \\pm 0{,}06$ m/s.","rawSolution":"1) Giá trị trung bình tốc độ: $\\overline{v} = \\frac{\\overline{s}}{\\overline{t}} = \\frac{2{,}00}{1{,}00} = 2{,}00$ m/s.\n2) Sai số tỉ đối: $\\delta s = \\frac{0{,}02}{2{,}00} \\cdot 100\\% = 1\\%$; $\\delta t = \\frac{0{,}02}{1{,}00} \\cdot 100\\% = 2\\% \\implies \\delta v = 1\\% + 2\\% = 3\\%$.\n3) Sai số tuyệt đối: $\\Delta v = \\delta v \\cdot \\overline{v} = 3\\% \\cdot 2{,}00 = 0{,}06$ m/s.\n4) Kết quả: $v = 2{,}00 \\pm 0{,}06$ m/s."}]},{"blockId":"single_d762bc71-69ec-4387-9002-3ca7367cf9c0_18","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"d762bc71-69ec-4387-9002-3ca7367cf9c0","type":"mcq","level":"VD","chapterName":"","points":0.5,"textHtml":"Cho đại lượng gián tiếp $A$ phụ thuộc vào hai đại lượng đo trực tiếp $B$ và $C$ theo công thức $A = B \\cdot \\sqrt{C}$. Biết kết quả đo $B = 10{,}0 \\pm 0{,}2$ và $C = 16{,}00 \\pm 0{,}32$. Sai số tỉ đối $\\delta A$ và sai số tuyệt đối $\\Delta A$ của đại lượng $A$ là:","rawText":"Cho đại lượng gián tiếp $A$ phụ thuộc vào hai đại lượng đo trực tiếp $B$ và $C$ theo công thức $A = B \\cdot \\sqrt{C}$. Biết kết quả đo $B = 10{,}0 \\pm 0{,}2$ và $C = 16{,}00 \\pm 0{,}32$. Sai số tỉ đối $\\delta A$ và sai số tuyệt đối $\\Delta A$ của đại lượng $A$ là:","ownImageUrl":"","optionsHtml":["$\\delta A = 3{,}0\\%$ và $\\Delta A = 1{,}2$","$\\delta A = 4{,}0\\%$ và $\\Delta A = 1{,}6$","$\\delta A = 2{,}5\\%$ và $\\Delta A = 1{,}0$","$\\delta A = 3{,}0\\%$ và $\\Delta A = 0{,}8$"],"optionsRaw":["$\\delta A = 3{,}0\\%$ và $\\Delta A = 1{,}2$","$\\delta A = 4{,}0\\%$ và $\\Delta A = 1{,}6$","$\\delta A = 2{,}5\\%$ và $\\Delta A = 1{,}0$","$\\delta A = 3{,}0\\%$ và $\\Delta A = 0{,}8$"],"correctIndex":0,"correctAnswer":"$\\delta A = 3{,}0\\%$ và $\\Delta A = 1{,}2$","subQuestions":[],"solutionHtml":"1) Giá trị trung bình $\\overline{A} = \\overline{B} \\cdot \\sqrt{\\overline{C}} = 10{,}0 \\cdot \\sqrt{16{,}00} = 40{,}0$.<br>2) Sai số tỉ đối các đại lượng:<br>$\\delta B = \\frac{0{,}2}{10{,}0} \\cdot 100\\% = 2{,}0\\%$.<br>$\\delta C = \\frac{0{,}32}{16{,}00} \\cdot 100\\% = 2{,}0\\%$.<br>3) Áp dụng quy tắc sai số lũy thừa: Với $A = B \\cdot \\sqrt{C}$ thì $\\delta A = \\delta B + \\frac{1}{2}\\delta C = 2{,}0\\% + \\frac{1}{2}(2{,}0\\%) = 3{,}0\\%$.<br>4) Sai số tuyệt đối: $\\Delta A = \\delta A \\cdot \\overline{A} = 3{,}0\\% \\cdot 40{,}0 = 1{,}2$.","rawSolution":"1) Giá trị trung bình $\\overline{A} = \\overline{B} \\cdot \\sqrt{\\overline{C}} = 10{,}0 \\cdot \\sqrt{16{,}00} = 40{,}0$.\n2) Sai số tỉ đối các đại lượng:\n$\\delta B = \\frac{0{,}2}{10{,}0} \\cdot 100\\% = 2{,}0\\%$.\n$\\delta C = \\frac{0{,}32}{16{,}00} \\cdot 100\\% = 2{,}0\\%$.\n3) Áp dụng quy tắc sai số lũy thừa: Với $A = B \\cdot \\sqrt{C}$ thì $\\delta A = \\delta B + \\frac{1}{2}\\delta C = 2{,}0\\% + \\frac{1}{2}(2{,}0\\%) = 3{,}0\\%$.\n4) Sai số tuyệt đối: $\\Delta A = \\delta A \\cdot \\overline{A} = 3{,}0\\% \\cdot 40{,}0 = 1{,}2$."}]},{"blockId":"single_d895976f-fc32-4805-ac2c-5d2308073ea8_19","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"d895976f-fc32-4805-ac2c-5d2308073ea8","type":"mcq","level":"VD","chapterName":"","points":0.5,"textHtml":"Học sinh tiến hành thí nghiệm đo tốc độ xe đồ chơi. Đo quãng đường thu được $\\overline{s} = 0{,}800$ m với $\\Delta s = 0{,}004$ m. Thực hiện đo thời gian 5 lần thu được các giá trị (tính bằng giây): $1{,}58; 1{,}62; 1{,}60; 1{,}59; 1{,}61$. Bỏ qua sai số dụng cụ đo thời gian ($\\Delta t_{dc} = 0$). Kết quả đo tốc độ $v = \\frac{s}{t}$ biểu diễn theo chuẩn quy định là:","rawText":"Học sinh tiến hành thí nghiệm đo tốc độ xe đồ chơi. Đo quãng đường thu được $\\overline{s} = 0{,}800$ m với $\\Delta s = 0{,}004$ m. Thực hiện đo thời gian 5 lần thu được các giá trị (tính bằng giây): $1{,}58; 1{,}62; 1{,}60; 1{,}59; 1{,}61$. Bỏ qua sai số dụng cụ đo thời gian ($\\Delta t_{dc} = 0$). Kết quả đo tốc độ $v = \\frac{s}{t}$ biểu diễn theo chuẩn quy định là:","ownImageUrl":"","optionsHtml":["$v = 0{,}500 \\pm 0{,}006$ m/s","$v = 0{,}500 \\pm 0{,}010$ m/s","$v = 0{,}500 \\pm 0{,}003$ m/s","$v = 0{,}500 \\pm 0{,}015$ m/s"],"optionsRaw":["$v = 0{,}500 \\pm 0{,}006$ m/s","$v = 0{,}500 \\pm 0{,}010$ m/s","$v = 0{,}500 \\pm 0{,}003$ m/s","$v = 0{,}500 \\pm 0{,}015$ m/s"],"correctIndex":0,"correctAnswer":"$v = 0{,}500 \\pm 0{,}006$ m/s","subQuestions":[],"solutionHtml":"1) Thời gian trung bình: $\\overline{t} = \\frac{1{,}58 + 1{,}62 + 1{,}60 + 1{,}59 + 1{,}61}{5} = 1{,}60$ s.<br>2) Sai số tuyệt đối ngẫu nhiên trung bình thời gian:<br>$\\overline{\\Delta t} = \\frac{|1{,}60-1{,}58| + |1{,}60-1{,}62| + |1{,}60-1{,}60| + |1{,}60-1{,}59| + |1{,}60-1{,}61|}{5} = \\frac{0{,}02 + 0{,}02 + 0 + 0{,}01 + 0{,}01}{5} = 0{,}012$ s.<br>3) Do $\\Delta t_{dc} = 0$ nên $\\Delta t = 0{,}012$ s.<br>4) Tốc độ trung bình: $\\overline{v} = \\frac{\\overline{s}}{\\overline{t}} = \\frac{0{,}800}{1{,}60} = 0{,}500$ m/s.<br>5) Sai số tỉ đối: $\\delta s = \\frac{0{,}004}{0{,}800} = 0{,}5\\%$; $\\delta t = \\frac{0{,}012}{1{,}60} = 0{,}75\\% \\implies \\delta v = 0{,}5\\% + 0{,}75\\% = 1{,}25\\%$.<br>6) Sai số tuyệt đối tốc độ: $\\Delta v = \\delta v \\cdot \\overline{v} = 1{,}25\\% \\cdot 0{,}500 = 0{,}00625 \\approx 0{,}006$ m/s.<br>7) Kết quả: $v = 0{,}500 \\pm 0{,}006$ m/s.","rawSolution":"1) Thời gian trung bình: $\\overline{t} = \\frac{1{,}58 + 1{,}62 + 1{,}60 + 1{,}59 + 1{,}61}{5} = 1{,}60$ s.\n2) Sai số tuyệt đối ngẫu nhiên trung bình thời gian:\n$\\overline{\\Delta t} = \\frac{|1{,}60-1{,}58| + |1{,}60-1{,}62| + |1{,}60-1{,}60| + |1{,}60-1{,}59| + |1{,}60-1{,}61|}{5} = \\frac{0{,}02 + 0{,}02 + 0 + 0{,}01 + 0{,}01}{5} = 0{,}012$ s.\n3) Do $\\Delta t_{dc} = 0$ nên $\\Delta t = 0{,}012$ s.\n4) Tốc độ trung bình: $\\overline{v} = \\frac{\\overline{s}}{\\overline{t}} = \\frac{0{,}800}{1{,}60} = 0{,}500$ m/s.\n5) Sai số tỉ đối: $\\delta s = \\frac{0{,}004}{0{,}800} = 0{,}5\\%$; $\\delta t = \\frac{0{,}012}{1{,}60} = 0{,}75\\% \\implies \\delta v = 0{,}5\\% + 0{,}75\\% = 1{,}25\\%$.\n6) Sai số tuyệt đối tốc độ: $\\Delta v = \\delta v \\cdot \\overline{v} = 1{,}25\\% \\cdot 0{,}500 = 0{,}00625 \\approx 0{,}006$ m/s.\n7) Kết quả: $v = 0{,}500 \\pm 0{,}006$ m/s."}]}]}</script>
  <script>
    (function() {
      var dataEl = document.getElementById('edusync-runtime-data');
      var EXAM = JSON.parse(dataEl.textContent || '{}');
      var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      var TF_LABELS = ['a', 'b', 'c', 'd', 'e', 'f'];

      function shuffle(arr) {
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      var blocks = EXAM.shuffleQuestions ? shuffle(EXAM.blocks || []) : (EXAM.blocks || []);
      var flatQuestions = [];
      blocks.forEach(function(block) {
        block.questions.forEach(function(q) {
          if (q.type === 'mcq' && EXAM.shuffleOptions && Array.isArray(q.optionsHtml)) {
            var tagged = q.optionsHtml.map(function(html, idx) {
              return { html: html, raw: q.optionsRaw[idx], isCorrect: idx === q.correctIndex };
            });
            var mixed = shuffle(tagged);
            q.optionsHtml = mixed.map(function(m) { return m.html; });
            q.optionsRaw = mixed.map(function(m) { return m.raw; });
            q.correctIndex = Math.max(0, mixed.findIndex(function(m) { return m.isCorrect; }));
          }
          q.displayNumber = flatQuestions.length + 1;
          flatQuestions.push(q);
        });
      });

      var userAnswers = {};
      var submitted = false;
      var durationLimit = (EXAM.durationMinutes || 0) > 0 ? EXAM.durationMinutes * 60 : 0;
      var startTime = Date.now();
      var timerHandle = null;

      function fmtTime(sec) {
        var s = Math.max(0, Math.floor(sec));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function isQuestionAnswered(q) {
        var ans = userAnswers[q.id];
        if (q.type === 'mcq') return typeof ans === 'number';
        if (q.type === 'short') return typeof ans === 'string' && ans.trim().length > 0;
        if (q.type === 'group-tf') {
          if (!ans || typeof ans !== 'object') return false;
          return q.subQuestions.some(function(sq) { return ans[sq.id] === 'True' || ans[sq.id] === 'False'; });
        }
        return false;
      }

      function updateProgress() {
        var done = flatQuestions.filter(isQuestionAnswered).length;
        document.getElementById('progressLabel').textContent = done + '/' + flatQuestions.length;
        document.getElementById('sidebarCount').textContent = 'Đã làm ' + done + '/' + flatQuestions.length;
        flatQuestions.forEach(function(q) {
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          if (!pBtn || submitted) return;
          pBtn.className = 'p-btn mono' + (isQuestionAnswered(q) ? ' done' : '');
        });
      }

      function buildQuestionEl(q) {
        var card = document.createElement('article');
        card.className = 'q-card';
        card.id = 'qcard_' + q.displayNumber;

        var header = document.createElement('div');
        header.className = 'q-header';
        var leftMeta = '<span class="q-num">Câu ' + q.displayNumber + '</span>';
        var tags = [q.level ? ('Mức ' + q.level) : '', q.points + ' đ', q.chapterName || ''].filter(Boolean).join(' · ');
        header.innerHTML = leftMeta + '<span id="qstatus_' + q.displayNumber + '" class="q-status">' + tags + '</span>';
        card.appendChild(header);

        var qTextEl = document.createElement('div');
        qTextEl.className = 'q-text';
        qTextEl.innerHTML = q.textHtml;
        card.appendChild(qTextEl);

        if (q.ownImageUrl) {
          var fig = document.createElement('div');
          fig.className = 'q-figure';
          var img = document.createElement('img');
          img.src = q.ownImageUrl;
          img.alt = 'Hình minh họa câu ' + q.displayNumber;
          fig.appendChild(img);
          card.appendChild(fig);
        }

        if (q.type === 'mcq') {
          var grid = document.createElement('div');
          grid.className = 'options-grid';
          q.optionsHtml.forEach(function(optHtml, optIdx) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.id = 'opt_' + q.id + '_' + optIdx;
            btn.innerHTML = '<span class="opt-letter mono">' + (LETTERS[optIdx] || optIdx + 1) + '</span><span style="flex:1;">' + optHtml + '</span>';
            btn.addEventListener('click', function() {
              if (submitted) return;
              userAnswers[q.id] = optIdx;
              q.optionsHtml.forEach(function(_, i2) {
                var el = document.getElementById('opt_' + q.id + '_' + i2);
                if (el) el.classList.toggle('selected', i2 === optIdx);
              });
              updateProgress();
            });
            grid.appendChild(btn);
          });
          card.appendChild(grid);
        } else if (q.type === 'group-tf') {
          var list = document.createElement('div');
          list.className = 'tf-list';
          q.subQuestions.forEach(function(sq, sIdx) {
            var row = document.createElement('div');
            row.className = 'tf-row';
            row.id = 'tfrow_' + sq.id;

            var txt = document.createElement('div');
            txt.className = 'tf-text';
            txt.innerHTML = '<strong>' + (TF_LABELS[sIdx] || (sIdx + 1)) + ')</strong> ' + sq.textHtml;
            row.appendChild(txt);

            var actions = document.createElement('div');
            actions.className = 'tf-actions';
            ['True', 'False'].forEach(function(val) {
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'tf-choice';
              b.id = 'tfbtn_' + sq.id + '_' + val;
              b.textContent = val === 'True' ? 'Đúng' : 'Sai';
              b.addEventListener('click', function() {
                if (submitted) return;
                if (!userAnswers[q.id] || typeof userAnswers[q.id] !== 'object') userAnswers[q.id] = {};
                userAnswers[q.id][sq.id] = val;
                var bt = document.getElementById('tfbtn_' + sq.id + '_True');
                var bf = document.getElementById('tfbtn_' + sq.id + '_False');
                if (bt) bt.classList.toggle('active', val === 'True');
                if (bf) bf.classList.toggle('active', val === 'False');
                updateProgress();
              });
              actions.appendChild(b);
            });
            row.appendChild(actions);
            list.appendChild(row);
          });
          card.appendChild(list);
        } else {
          var sBox = document.createElement('div');
          sBox.className = 'short-box';
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'short-input';
          inp.id = 'short_' + q.id;
          inp.placeholder = 'Nhập đáp số (vd: 2.6 hoặc 36)';
          inp.addEventListener('input', function() {
            if (submitted) return;
            userAnswers[q.id] = inp.value;
            updateProgress();
          });
          var fb = document.createElement('span');
          fb.id = 'shortfb_' + q.id;
          fb.className = 'short-feedback';
          sBox.appendChild(inp);
          sBox.appendChild(fb);
          card.appendChild(sBox);
        }

        if (q.solutionHtml) {
          var sol = document.createElement('div');
          sol.className = 'solution-box';
          sol.id = 'sol_' + q.id;
          sol.innerHTML = '<strong>Lời giải chi tiết:</strong><div style="margin-top:4px;">' + q.solutionHtml + '</div>';
          card.appendChild(sol);
        }

        return card;
      }

      function renderExam() {
        var root = document.getElementById('questionsRoot');
        var pal = document.getElementById('paletteRoot');
        root.innerHTML = '';
        pal.innerHTML = '';

        blocks.forEach(function(block) {
          if (block.contextHtml || block.sharedImageUrl) {
            var groupEl = document.createElement('section');
            groupEl.className = 'context-group';

            var head = document.createElement('div');
            head.className = 'context-header';
            var firstNum = block.questions[0].displayNumber;
            var lastNum = block.questions[block.questions.length - 1].displayNumber;
            var labelText = block.questions.length > 1
              ? 'Dữ liệu dùng chung cho Câu ' + firstNum + ' – Câu ' + lastNum
              : 'Dữ liệu đề bài (Câu ' + firstNum + ')';
            var html = '<div class="context-label">' + labelText + '</div>';
            if (block.contextHtml) {
              html += '<div class="context-body">' + block.contextHtml + '</div>';
            }
            head.innerHTML = html;
            if (block.sharedImageUrl) {
              var fig = document.createElement('div');
              fig.className = 'q-figure';
              var img = document.createElement('img');
              img.src = block.sharedImageUrl;
              img.alt = labelText;
              fig.appendChild(img);
              head.appendChild(fig);
            }
            groupEl.appendChild(head);

            var inner = document.createElement('div');
            inner.className = 'context-questions';
            block.questions.forEach(function(q) {
              inner.appendChild(buildQuestionEl(q));
            });
            groupEl.appendChild(inner);
            root.appendChild(groupEl);
          } else {
            block.questions.forEach(function(q) {
              root.appendChild(buildQuestionEl(q));
            });
          }
        });

        flatQuestions.forEach(function(q) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'p-btn mono';
          b.id = 'pbtn_' + q.displayNumber;
          b.textContent = String(q.displayNumber);
          b.addEventListener('click', function() {
            var target = document.getElementById('qcard_' + q.displayNumber);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          pal.appendChild(b);
        });

        updateProgress();
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }
      }

      function normalizeShort(val) {
        return String(val || '').trim().replace(/,/g, '.').replace(/\s+/g, '').toLowerCase();
      }

      function isShortMatch(userVal, expectedVal) {
        var u = normalizeShort(userVal);
        var e = normalizeShort(expectedVal);
        if (!u) return false;
        if (u === e) return true;
        var nu = parseFloat(u);
        var ne = parseFloat(e);
        if (!isNaN(nu) && !isNaN(ne) && String(nu) === u || !isNaN(nu) && !isNaN(ne)) {
          if (/^-?\d+(?:\.\d+)?$/.test(u) && /^-?\d+(?:\.\d+)?$/.test(e)) {
            return Math.abs(nu - ne) < 1e-6;
          }
        }
        return false;
      }

      function gradeAndSubmit(force) {
        if (submitted) return;
        var answered = flatQuestions.filter(isQuestionAnswered).length;
        if (!force && answered < flatQuestions.length) {
          document.getElementById('confirmMsg').textContent =
            'Bạn mới làm ' + answered + '/' + flatQuestions.length + ' câu. Bạn có chắc muốn nộp bài ngay?';
          document.getElementById('confirmBar').classList.add('visible');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        document.getElementById('confirmBar').classList.remove('visible');
        submitted = true;
        if (timerHandle) clearInterval(timerHandle);

        var totalScore = 0;
        var maxScore = EXAM.maxScore || 10;
        var correctQuestions = 0;
        var answerDetails = [];

        flatQuestions.forEach(function(q) {
          var qCorrect = false;
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          var stEl = document.getElementById('qstatus_' + q.displayNumber);
          var solEl = document.getElementById('sol_' + q.id);
          if (solEl) solEl.classList.add('visible');

          if (q.type === 'mcq') {
            var chosen = typeof userAnswers[q.id] === 'number' ? userAnswers[q.id] : -1;
            qCorrect = chosen === q.correctIndex;
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            q.optionsHtml.forEach(function(_, i) {
              var ob = document.getElementById('opt_' + q.id + '_' + i);
              if (!ob) return;
              ob.disabled = true;
              ob.classList.remove('selected');
              if (i === q.correctIndex) ob.classList.add('correct');
              else if (i === chosen) ob.classList.add('wrong');
            });
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: q.optionsRaw,
              selectedIndex: chosen,
              correctIndex: q.correctIndex,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          } else if (q.type === 'group-tf') {
            var tfMap = (userAnswers[q.id] && typeof userAnswers[q.id] === 'object') ? userAnswers[q.id] : {};
            var rightSubs = 0;
            q.subQuestions.forEach(function(sq, sIdx) {
              var picked = tfMap[sq.id] || '';
              var subOk = picked === sq.correctAnswer;
              if (subOk) rightSubs++;
              var row = document.getElementById('tfrow_' + sq.id);
              if (row) row.classList.add(subOk ? 'ok' : 'bad');
              ['True', 'False'].forEach(function(v) {
                var btn = document.getElementById('tfbtn_' + sq.id + '_' + v);
                if (!btn) return;
                btn.disabled = true;
                if (v === sq.correctAnswer) btn.classList.add('right-ans');
              });
              answerDetails.push({
                orderIndex: answerDetails.length,
                questionText: 'Câu ' + q.displayNumber + (TF_LABELS[sIdx] || '') + ': ' + sq.rawText,
                options: ['Đúng', 'Sai'],
                selectedIndex: picked === 'True' ? 0 : (picked === 'False' ? 1 : -1),
                correctIndex: sq.correctAnswer === 'True' ? 0 : 1,
                isCorrect: subOk,
                explanation: sIdx === q.subQuestions.length - 1 ? q.rawSolution : ''
              });
            });
            var earnedRatio = 0;
            if (q.subQuestions.length === 4) {
              earnedRatio = rightSubs === 1 ? 0.1 : rightSubs === 2 ? 0.25 : rightSubs === 3 ? 0.5 : rightSubs === 4 ? 1 : 0;
            } else if (q.subQuestions.length > 0) {
              earnedRatio = rightSubs / q.subQuestions.length;
            }
            var earned = Math.round(q.points * earnedRatio * 100) / 100;
            totalScore += earned;
            qCorrect = rightSubs === q.subQuestions.length;
            if (qCorrect) correctQuestions++;
            if (stEl) {
              stEl.textContent = 'Đúng ' + rightSubs + '/' + q.subQuestions.length + ' ý (+' + earned + 'đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
          } else {
            var rawInput = document.getElementById('short_' + q.id);
            var typed = rawInput ? rawInput.value.trim() : '';
            if (rawInput) rawInput.disabled = true;
            qCorrect = isShortMatch(typed, q.correctAnswer);
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            var fbEl = document.getElementById('shortfb_' + q.id);
            if (fbEl) {
              fbEl.textContent = qCorrect
                ? ('Chính xác (+' + q.points + 'đ)')
                : ('Đáp án đúng: ' + q.correctAnswer);
              fbEl.style.color = qCorrect ? 'var(--ok)' : 'var(--bad)';
            }
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: ['Bài làm: ' + (typed || '(bỏ trống)'), 'Đáp án chuẩn: ' + q.correctAnswer],
              selectedIndex: qCorrect ? 1 : 0,
              correctIndex: 1,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          }

          if (pBtn) {
            pBtn.className = 'p-btn mono ' + (qCorrect ? 'ok' : 'bad');
          }
        });

        totalScore = Math.round(totalScore * 100) / 100;
        var pct = maxScore > 0 ? Math.round((totalScore / maxScore) * 1000) / 10 : 0;

        document.getElementById('scoreText').textContent = totalScore + ' / ' + maxScore + ' điểm';
        document.getElementById('correctText').textContent =
          'Đúng hoàn toàn ' + correctQuestions + ' / ' + flatQuestions.length + ' câu (' + pct + '%)';
        document.getElementById('resultScreen').classList.add('visible');
        document.getElementById('topSubmitBtn').style.display = 'none';
        document.getElementById('sideSubmitBtn').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }

        if (typeof window.EduSyncSubmitScore === 'function') {
          window.EduSyncSubmitScore(totalScore, maxScore, correctQuestions, flatQuestions.length, answerDetails);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'QUIZ_RESULT',
            score: totalScore,
            maxScore: maxScore,
            correctCount: correctQuestions,
            totalQuestions: flatQuestions.length,
            answerDetails: answerDetails
          }, '*');
        }
      }

      document.getElementById('topSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('sideSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('confirmYesBtn').addEventListener('click', function() { gradeAndSubmit(true); });
      document.getElementById('confirmCancelBtn').addEventListener('click', function() {
        document.getElementById('confirmBar').classList.remove('visible');
      });

      function tickTimer() {
        if (submitted) return;
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var box = document.getElementById('timerBox');
        if (durationLimit > 0) {
          var rem = Math.max(0, durationLimit - elapsed);
          box.textContent = fmtTime(rem);
          box.classList.toggle('urgent', rem <= 60);
          if (rem <= 0) gradeAndSubmit(true);
        } else {
          box.textContent = fmtTime(elapsed);
        }
      }

      renderExam();
      tickTimer();
      timerHandle = setInterval(tickTimer, 1000);
    })();
  </script>
</body>
