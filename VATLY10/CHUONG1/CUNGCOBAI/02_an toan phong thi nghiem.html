n mạch (chập điện), sinh tia lửa điện và cháy nổ","Làm bóng đèn bị mờ đi do từ trường","Làm tăng nhiệt độ phòng thí nghiệm"],"correctIndex":1,"correctAnswer":"Các kẹp điện kim loại vô tình chạm vào nhau gây hiện tượng ngắn mạch (chập điện), sinh tia lửa điện và cháy nổ","subQuestions":[],"solutionHtml":"Nếu hai kẹp điện mang cực khác nhau chạm vào nhau sẽ gây ngắn mạch (chập mạch), dòng điện tăng đột ngột sinh nhiệt cao gây cháy nổ.","rawSolution":"Nếu hai kẹp điện mang cực khác nhau chạm vào nhau sẽ gây ngắn mạch (chập mạch), dòng điện tăng đột ngột sinh nhiệt cao gây cháy nổ."}]},{"blockId":"single_c2bfa621-2130-4096-b58d-e2617e47017b_14","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"c2bfa621-2130-4096-b58d-e2617e47017b","type":"mcq","level":"H","chapterName":"CHƯƠNG 1: MỞ ĐẦU","points":0.5,"textHtml":"Trong thí nghiệm đun nóng chất lỏng bằng đèn cồn, việc đặt chất dễ cháy (như chai cồn dự trữ, giấy) gần mạch điện hoặc nguồn nhiệt (Hình 2.7b SGK) nguy hiểm vì lý do nào?","rawText":"Trong thí nghiệm đun nóng chất lỏng bằng đèn cồn, việc đặt chất dễ cháy (như chai cồn dự trữ, giấy) gần mạch điện hoặc nguồn nhiệt (Hình 2.7b SGK) nguy hiểm vì lý do nào?","ownImageUrl":"","optionsHtml":["Tia lửa điện hoặc nhiệt độ cao dễ làm chất bắt cháy phát hỏa, gây đám cháy lớn","Làm cồn bị bay hơi mất bớt thể tích","Làm cho nguồn điện bị tụt áp","Làm cho mặt bàn bị ẩm ướt"],"optionsRaw":["Tia lửa điện hoặc nhiệt độ cao dễ làm chất bắt cháy phát hỏa, gây đám cháy lớn","Làm cồn bị bay hơi mất bớt thể tích","Làm cho nguồn điện bị tụt áp","Làm cho mặt bàn bị ẩm ướt"],"correctIndex":0,"correctAnswer":"Tia lửa điện hoặc nhiệt độ cao dễ làm chất bắt cháy phát hỏa, gây đám cháy lớn","subQuestions":[],"solutionHtml":"Để chất dễ cháy gần nguồn nhiệt/điện có nguy cơ bùng phát đám cháy nhanh chóng khi có sự cố tia lửa hoặc nhiệt độ cao tỏa ra.","rawSolution":"Để chất dễ cháy gần nguồn nhiệt/điện có nguy cơ bùng phát đám cháy nhanh chóng khi có sự cố tia lửa hoặc nhiệt độ cao tỏa ra."}]},{"blockId":"single_6d3af8cd-dd63-48a7-8148-db4059e2b4f8_15","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"6d3af8cd-dd63-48a7-8148-db4059e2b4f8","type":"mcq","level":"H","chapterName":"CHƯƠNG 1: MỞ ĐẦU","points":0.5,"textHtml":"Để đo một dòng điện một chiều chưa biết rõ giá trị xấp xỉ bằng đồng hồ đa năng hiện số, thao tác lựa chọn thang đo nào là an toàn nhất cho đồng hồ?","rawText":"Để đo một dòng điện một chiều chưa biết rõ giá trị xấp xỉ bằng đồng hồ đa năng hiện số, thao tác lựa chọn thang đo nào là an toàn nhất cho đồng hồ?","ownImageUrl":"","optionsHtml":["Chọn ngay thang đo nhỏ nhất $200\\mu\\text{A}$ để đạt độ chính xác cao nhất","Chọn thang đo $\\text{DCA}$ ở giá trị lớn nhất (ví dụ $10\\text{ A}$), sau đó giảm dần thang đo nếu tín hiệu nhỏ","Chọn thang đo điện trở $\\Omega$ để đo trước","Chọn thang đo điện áp xoay chiều $750\\text{ V AC}$"],"optionsRaw":["Chọn ngay thang đo nhỏ nhất $200\\mu\\text{A}$ để đạt độ chính xác cao nhất","Chọn thang đo $\\text{DCA}$ ở giá trị lớn nhất (ví dụ $10\\text{ A}$), sau đó giảm dần thang đo nếu tín hiệu nhỏ","Chọn thang đo điện trở $\\Omega$ để đo trước","Chọn thang đo điện áp xoay chiều $750\\text{ V AC}$"],"correctIndex":1,"correctAnswer":"Chọn thang đo $\\text{DCA}$ ở giá trị lớn nhất (ví dụ $10\\text{ A}$), sau đó giảm dần thang đo nếu tín hiệu nhỏ","subQuestions":[],"solutionHtml":"Quy tắc an toàn khi đo đại lượng chưa biết giá trị: Luôn chọn thang đo lớn nhất để tránh quá tải gây cháy đứt đồng hồ, sau đó hạ dần thang đo để đọc kết quả chính xác.","rawSolution":"Quy tắc an toàn khi đo đại lượng chưa biết giá trị: Luôn chọn thang đo lớn nhất để tránh quá tải gây cháy đứt đồng hồ, sau đó hạ dần thang đo để đọc kết quả chính xác."}]},{"blockId":"single_de1239a9-8214-4a0f-a9bc-26aa7ee52e67_16","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"de1239a9-8214-4a0f-a9bc-26aa7ee52e67","type":"mcq","level":"H","chapterName":"CHƯƠNG 1: MỞ ĐẦU","points":0.5,"textHtml":"Khi phát hiện một dây dẫn điện nối thiết bị thí nghiệm bị sờn rách, hở lớp vỏ cao su cách điện để lộ lõi đồng , học sinh cần làm gì?","rawText":"Khi phát hiện một dây dẫn điện nối thiết bị thí nghiệm bị sờn rách, hở lớp vỏ cao su cách điện để lộ lõi đồng , học sinh cần làm gì?","ownImageUrl":"","optionsHtml":["Dùng tay trần dán tạm băng dính đen và tiếp tục thí nghiệm mà không báo giáo viên","Tắt nguồn điện lập tức, báo ngay cho giáo viên hướng dẫn để thay thế dây dẫn an toàn mới","Tiếp tục cắm điện sử dụng vì lõi đồng chưa bị đứt","Đổ nước vào chỗ dây sờn để làm mát"],"optionsRaw":["Dùng tay trần dán tạm băng dính đen và tiếp tục thí nghiệm mà không báo giáo viên","Tắt nguồn điện lập tức, báo ngay cho giáo viên hướng dẫn để thay thế dây dẫn an toàn mới","Tiếp tục cắm điện sử dụng vì lõi đồng chưa bị đứt","Đổ nước vào chỗ dây sờn để làm mát"],"correctIndex":1,"correctAnswer":"Tắt nguồn điện lập tức, báo ngay cho giáo viên hướng dẫn để thay thế dây dẫn an toàn mới","subQuestions":[],"solutionHtml":"Dây điện sờn hở lõi copper tiềm ẩn nguy cơ giật điện nguy hiểm và chập cháy. Cần ngắt nguồn điện và báo giáo viên thay thế ngay.","rawSolution":"Dây điện sờn hở lõi copper tiềm ẩn nguy cơ giật điện nguy hiểm và chập cháy. Cần ngắt nguồn điện và báo giáo viên thay thế ngay."}]},{"blockId":"single_6cec643d-3c46-4fba-8384-8b31bddc0986_17","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"6cec643d-3c46-4fba-8384-8b31bddc0986","type":"mcq","level":"H","chapterName":"CHƯƠNG 1: MỞ ĐẦU","points":0.5,"textHtml":"Bộ chuyển đổi điện áp trong thí nghiệm quang hình ghi thông số: Đầu vào $\\text{Input: } 220\\text{ V AC}$, Đầu ra $\\text{Output: } 12\\text{ V DC}$. Nếu học sinh cắm nhầm bóng đèn thí nghiệm $12\\text{ V}$ trực tiếp vào ổ cắm điện lưới $220\\text{ V}$ thì sự cố nào xảy ra?","rawText":"Bộ chuyển đổi điện áp trong thí nghiệm quang hình ghi thông số: Đầu vào $\\text{Input: } 220\\text{ V AC}$, Đầu ra $\\text{Output: } 12\\text{ V DC}$. Nếu học sinh cắm nhầm bóng đèn thí nghiệm $12\\text{ V}$ trực tiếp vào ổ cắm điện lưới $220\\text{ V}$ thì sự cố nào xảy ra?","ownImageUrl":"","optionsHtml":["Bóng đèn sáng bình thường và tiết kiệm điện","Bóng đèn bị cháy nổ lập tức do hiệu điện thế đặt vào vượt quá giới hạn định mức rất nhiều lần","Bóng đèn không sáng do điện áp quá cao","Không có hiện tượng gì xảy ra"],"optionsRaw":["Bóng đèn sáng bình thường và tiết kiệm điện","Bóng đèn bị cháy nổ lập tức do hiệu điện thế đặt vào vượt quá giới hạn định mức rất nhiều lần","Bóng đèn không sáng do điện áp quá cao","Không có hiện tượng gì xảy ra"],"correctIndex":1,"correctAnswer":"Bóng đèn bị cháy nổ lập tức do hiệu điện thế đặt vào vượt quá giới hạn định mức rất nhiều lần","subQuestions":[],"solutionHtml":"Bóng đèn chỉ chịu được $12\\text{ V}$. Đưa trực tiếp hiệu điện thế $220\\text{ V}$ vào sẽ gây quá dòng đột ngột làm nổ cháy bóng đèn lập tức.","rawSolution":"Bóng đèn chỉ chịu được $12\\text{ V}$. Đưa trực tiếp hiệu điện thế $220\\text{ V}$ vào sẽ gây quá dòng đột ngột làm nổ cháy bóng đèn lập tức."}]},{"blockId":"single_1a99069f-1c8a-46da-9eaa-8213ef96eb8b_18","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"1a99069f-1c8a-46da-9eaa-8213ef96eb8b","type":"mcq","level":"H","chapterName":"CHƯƠNG 1: MỞ ĐẦU","points":0.5,"textHtml":"Trong phòng thực hành Vật lí bất ngờ xảy ra sự cố cháy do cồn đổ ra mặt bàn khi đun nước. Hành động dập lửa nào sau đây là **SAI VÀ NGUY HIỂM NHẤT**?","rawText":"Trong phòng thực hành Vật lí bất ngờ xảy ra sự cố cháy do cồn đổ ra mặt bàn khi đun nước. Hành động dập lửa nào sau đây là **SAI VÀ NGUY HIỂM NHẤT**?","ownImageUrl":"","optionsHtml":["Dùng chăn/mền ẩm phủ kín lên khu vực cồn đang cháy để cách ly oxygen","Sử dụng bình chữa cháy dạng bột xịt vào gốc lửa","Lấy một chậu nước đầy xối mạnh trực tiếp vào đám cháy cồn","Ngắt toàn bộ hệ thống điện phòng thực hành và hô khoán cứu hộ"],"optionsRaw":["Dùng chăn/mền ẩm phủ kín lên khu vực cồn đang cháy để cách ly oxygen","Sử dụng bình chữa cháy dạng bột xịt vào gốc lửa","Lấy một chậu nước đầy xối mạnh trực tiếp vào đám cháy cồn","Ngắt toàn bộ hệ thống điện phòng thực hành và hô khoán cứu hộ"],"correctIndex":2,"correctAnswer":"Lấy một chậu nước đầy xối mạnh trực tiếp vào đám cháy cồn","subQuestions":[],"solutionHtml":"SGK Mục II.3 quy định rõ: &quot;Không được sử dụng nước dập đám cháy... cồn... vì cồn nhẹ hơn nước và hòa tan/nổi trên nước, xối nước sẽ làm cồn cháy lan rộng hơn ra khắp phòng!&quot;","rawSolution":"SGK Mục II.3 quy định rõ: \"Không được sử dụng nước dập đám cháy... cồn... vì cồn nhẹ hơn nước và hòa tan/nổi trên nước, xối nước sẽ làm cồn cháy lan rộng hơn ra khắp phòng!\""}]},{"blockId":"single_7b489bf1-6d60-4149-bc9c-e6a98d187481_19","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"7b489bf1-6d60-4149-bc9c-e6a98d187481","type":"mcq","level":"H","chapterName":"CHƯƠNG 1: MỞ ĐẦU","points":0.5,"textHtml":"Khi phòng thực hành xảy ra hỏa hoạn có liên quan đến thiết bị đang cắm điện và các kim loại kiềm (như Magnesium), quy trình xử lý PCCC nào sau đây tuân thủ đúng nguyên tắc an toàn?","rawText":"Khi phòng thực hành xảy ra hỏa hoạn có liên quan đến thiết bị đang cắm điện và các kim loại kiềm (như Magnesium), quy trình xử lý PCCC nào sau đây tuân thủ đúng nguyên tắc an toàn?","ownImageUrl":"","optionsHtml":["Dùng bình khí $\\text{CO}_2$ xịt trực tiếp vào kim loại kiềm đang cháy","Dùng nước xối vào thiết bị điện đang cắm nguồn","Lập tức ngắt cầu dao điện tổng, sơ tán học sinh, di dời hóa chất dễ cháy ra xa; **không** dùng $\\text{CO}_2$ dập cháy kim loại kiềm và **không** dùng nước dập cháy điện","Đóng chặt tất cả cửa phòng thực hành và tiếp tục làm thí nghiệm"],"optionsRaw":["Dùng bình khí $\\text{CO}_2$ xịt trực tiếp vào kim loại kiềm đang cháy","Dùng nước xối vào thiết bị điện đang cắm nguồn","Lập tức ngắt cầu dao điện tổng, sơ tán học sinh, di dời hóa chất dễ cháy ra xa; **không** dùng $\\text{CO}_2$ dập cháy kim loại kiềm và **không** dùng nước dập cháy điện","Đóng chặt tất cả cửa phòng thực hành và tiếp tục làm thí nghiệm"],"correctIndex":2,"correctAnswer":"Lập tức ngắt cầu dao điện tổng, sơ tán học sinh, di dời hóa chất dễ cháy ra xa; **không** dùng $\\text{CO}_2$ dập cháy kim loại kiềm và **không** dùng nước dập cháy điện","subQuestions":[],"solutionHtml":"SGK Mục II.3 nêu rõ quy tắc PCCC: Ngắt điện tổng, sơ tán người. Tuyệt đối không dùng nước dập cháy thiết bị điện active; Không dùng bình $\\text{CO}_2$ dập cháy kim loại kiềm (Mg...) vì ở nhiệt độ cao kim loại kiềm sẽ phản ứng với $\\text{CO}_2$ sinh ra Carbon tỏa nhiệt cực dội.","rawSolution":"SGK Mục II.3 nêu rõ quy tắc PCCC: Ngắt điện tổng, sơ tán người. Tuyệt đối không dùng nước dập cháy thiết bị điện active; Không dùng bình $\\text{CO}_2$ dập cháy kim loại kiềm (Mg...) vì ở nhiệt độ cao kim loại kiềm sẽ phản ứng với $\\text{CO}_2$ sinh ra Carbon tỏa nhiệt cực dội."}]}]}</script>
  <script>
    (function() {
      var dataEl = document.getElementById('edusync-runtime-data');
      var EXAM = JSON.parse(dataEl.textContent || '{}');
      var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      var TF_LABELS = ['a', 'b', 'c', 'd', 'e', 'f'];

      function shuffle(arr) {
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      var blocks = EXAM.shuffleQuestions ? shuffle(EXAM.blocks || []) : (EXAM.blocks || []);
      var flatQuestions = [];
      blocks.forEach(function(block) {
        block.questions.forEach(function(q) {
          if (q.type === 'mcq' && EXAM.shuffleOptions && Array.isArray(q.optionsHtml)) {
            var tagged = q.optionsHtml.map(function(html, idx) {
              return { html: html, raw: q.optionsRaw[idx], isCorrect: idx === q.correctIndex };
            });
            var mixed = shuffle(tagged);
            q.optionsHtml = mixed.map(function(m) { return m.html; });
            q.optionsRaw = mixed.map(function(m) { return m.raw; });
            q.correctIndex = Math.max(0, mixed.findIndex(function(m) { return m.isCorrect; }));
          }
          q.displayNumber = flatQuestions.length + 1;
          flatQuestions.push(q);
        });
      });

      var userAnswers = {};
      var submitted = false;
      var durationLimit = (EXAM.durationMinutes || 0) > 0 ? EXAM.durationMinutes * 60 : 0;
      var startTime = Date.now();
      var timerHandle = null;

      function fmtTime(sec) {
        var s = Math.max(0, Math.floor(sec));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function isQuestionAnswered(q) {
        var ans = userAnswers[q.id];
        if (q.type === 'mcq') return typeof ans === 'number';
        if (q.type === 'short') return typeof ans === 'string' && ans.trim().length > 0;
        if (q.type === 'group-tf') {
          if (!ans || typeof ans !== 'object') return false;
          return q.subQuestions.some(function(sq) { return ans[sq.id] === 'True' || ans[sq.id] === 'False'; });
        }
        return false;
      }

      function updateProgress() {
        var done = flatQuestions.filter(isQuestionAnswered).length;
        document.getElementById('progressLabel').textContent = done + '/' + flatQuestions.length;
        document.getElementById('sidebarCount').textContent = 'Đã làm ' + done + '/' + flatQuestions.length;
        flatQuestions.forEach(function(q) {
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          if (!pBtn || submitted) return;
          pBtn.className = 'p-btn mono' + (isQuestionAnswered(q) ? ' done' : '');
        });
      }

      function buildQuestionEl(q) {
        var card = document.createElement('article');
        card.className = 'q-card';
        card.id = 'qcard_' + q.displayNumber;

        var header = document.createElement('div');
        header.className = 'q-header';
        var leftMeta = '<span class="q-num">Câu ' + q.displayNumber + '</span>';
        var tags = [q.level ? ('Mức ' + q.level) : '', q.points + ' đ', q.chapterName || ''].filter(Boolean).join(' · ');
        header.innerHTML = leftMeta + '<span id="qstatus_' + q.displayNumber + '" class="q-status">' + tags + '</span>';
        card.appendChild(header);

        var qTextEl = document.createElement('div');
        qTextEl.className = 'q-text';
        qTextEl.innerHTML = q.textHtml;
        card.appendChild(qTextEl);

        if (q.ownImageUrl) {
          var fig = document.createElement('div');
          fig.className = 'q-figure';
          var img = document.createElement('img');
          img.src = q.ownImageUrl;
          img.alt = 'Hình minh họa câu ' + q.displayNumber;
          fig.appendChild(img);
          card.appendChild(fig);
        }

        if (q.type === 'mcq') {
          var grid = document.createElement('div');
          grid.className = 'options-grid';
          q.optionsHtml.forEach(function(optHtml, optIdx) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.id = 'opt_' + q.id + '_' + optIdx;
            btn.innerHTML = '<span class="opt-letter mono">' + (LETTERS[optIdx] || optIdx + 1) + '</span><span style="flex:1;">' + optHtml + '</span>';
            btn.addEventListener('click', function() {
              if (submitted) return;
              userAnswers[q.id] = optIdx;
              q.optionsHtml.forEach(function(_, i2) {
                var el = document.getElementById('opt_' + q.id + '_' + i2);
                if (el) el.classList.toggle('selected', i2 === optIdx);
              });
              updateProgress();
            });
            grid.appendChild(btn);
          });
          card.appendChild(grid);
        } else if (q.type === 'group-tf') {
          var list = document.createElement('div');
          list.className = 'tf-list';
          q.subQuestions.forEach(function(sq, sIdx) {
            var row = document.createElement('div');
            row.className = 'tf-row';
            row.id = 'tfrow_' + sq.id;

            var txt = document.createElement('div');
            txt.className = 'tf-text';
            txt.innerHTML = '<strong>' + (TF_LABELS[sIdx] || (sIdx + 1)) + ')</strong> ' + sq.textHtml;
            row.appendChild(txt);

            var actions = document.createElement('div');
            actions.className = 'tf-actions';
            ['True', 'False'].forEach(function(val) {
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'tf-choice';
              b.id = 'tfbtn_' + sq.id + '_' + val;
              b.textContent = val === 'True' ? 'Đúng' : 'Sai';
              b.addEventListener('click', function() {
                if (submitted) return;
                if (!userAnswers[q.id] || typeof userAnswers[q.id] !== 'object') userAnswers[q.id] = {};
                userAnswers[q.id][sq.id] = val;
                var bt = document.getElementById('tfbtn_' + sq.id + '_True');
                var bf = document.getElementById('tfbtn_' + sq.id + '_False');
                if (bt) bt.classList.toggle('active', val === 'True');
                if (bf) bf.classList.toggle('active', val === 'False');
                updateProgress();
              });
              actions.appendChild(b);
            });
            row.appendChild(actions);
            list.appendChild(row);
          });
          card.appendChild(list);
        } else {
          var sBox = document.createElement('div');
          sBox.className = 'short-box';
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'short-input';
          inp.id = 'short_' + q.id;
          inp.placeholder = 'Nhập đáp số (vd: 2.6 hoặc 36)';
          inp.addEventListener('input', function() {
            if (submitted) return;
            userAnswers[q.id] = inp.value;
            updateProgress();
          });
          var fb = document.createElement('span');
          fb.id = 'shortfb_' + q.id;
          fb.className = 'short-feedback';
          sBox.appendChild(inp);
          sBox.appendChild(fb);
          card.appendChild(sBox);
        }

        if (q.solutionHtml) {
          var sol = document.createElement('div');
          sol.className = 'solution-box';
          sol.id = 'sol_' + q.id;
          sol.innerHTML = '<strong>Lời giải chi tiết:</strong><div style="margin-top:4px;">' + q.solutionHtml + '</div>';
          card.appendChild(sol);
        }

        return card;
      }

      function renderExam() {
        var root = document.getElementById('questionsRoot');
        var pal = document.getElementById('paletteRoot');
        root.innerHTML = '';
        pal.innerHTML = '';

        blocks.forEach(function(block) {
          if (block.contextHtml || block.sharedImageUrl) {
            var groupEl = document.createElement('section');
            groupEl.className = 'context-group';

            var head = document.createElement('div');
            head.className = 'context-header';
            var firstNum = block.questions[0].displayNumber;
            var lastNum = block.questions[block.questions.length - 1].displayNumber;
            var labelText = block.questions.length > 1
              ? 'Dữ liệu dùng chung cho Câu ' + firstNum + ' – Câu ' + lastNum
              : 'Dữ liệu đề bài (Câu ' + firstNum + ')';
            var html = '<div class="context-label">' + labelText + '</div>';
            if (block.contextHtml) {
              html += '<div class="context-body">' + block.contextHtml + '</div>';
            }
            head.innerHTML = html;
            if (block.sharedImageUrl) {
              var fig = document.createElement('div');
              fig.className = 'q-figure';
              var img = document.createElement('img');
              img.src = block.sharedImageUrl;
              img.alt = labelText;
              fig.appendChild(img);
              head.appendChild(fig);
            }
            groupEl.appendChild(head);

            var inner = document.createElement('div');
            inner.className = 'context-questions';
            block.questions.forEach(function(q) {
              inner.appendChild(buildQuestionEl(q));
            });
            groupEl.appendChild(inner);
            root.appendChild(groupEl);
          } else {
            block.questions.forEach(function(q) {
              root.appendChild(buildQuestionEl(q));
            });
          }
        });

        flatQuestions.forEach(function(q) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'p-btn mono';
          b.id = 'pbtn_' + q.displayNumber;
          b.textContent = String(q.displayNumber);
          b.addEventListener('click', function() {
            var target = document.getElementById('qcard_' + q.displayNumber);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          pal.appendChild(b);
        });

        updateProgress();
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }
      }

      function normalizeShort(val) {
        return String(val || '').trim().replace(/,/g, '.').replace(/\s+/g, '').toLowerCase();
      }

      function isShortMatch(userVal, expectedVal) {
        var u = normalizeShort(userVal);
        var e = normalizeShort(expectedVal);
        if (!u) return false;
        if (u === e) return true;
        var nu = parseFloat(u);
        var ne = parseFloat(e);
        if (!isNaN(nu) && !isNaN(ne) && String(nu) === u || !isNaN(nu) && !isNaN(ne)) {
          if (/^-?\d+(?:\.\d+)?$/.test(u) && /^-?\d+(?:\.\d+)?$/.test(e)) {
            return Math.abs(nu - ne) < 1e-6;
          }
        }
        return false;
      }

      function gradeAndSubmit(force) {
        if (submitted) return;
        var answered = flatQuestions.filter(isQuestionAnswered).length;
        if (!force && answered < flatQuestions.length) {
          document.getElementById('confirmMsg').textContent =
            'Bạn mới làm ' + answered + '/' + flatQuestions.length + ' câu. Bạn có chắc muốn nộp bài ngay?';
          document.getElementById('confirmBar').classList.add('visible');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        document.getElementById('confirmBar').classList.remove('visible');
        submitted = true;
        if (timerHandle) clearInterval(timerHandle);

        var totalScore = 0;
        var maxScore = EXAM.maxScore || 10;
        var correctQuestions = 0;
        var answerDetails = [];

        flatQuestions.forEach(function(q) {
          var qCorrect = false;
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          var stEl = document.getElementById('qstatus_' + q.displayNumber);
          var solEl = document.getElementById('sol_' + q.id);
          if (solEl) solEl.classList.add('visible');

          if (q.type === 'mcq') {
            var chosen = typeof userAnswers[q.id] === 'number' ? userAnswers[q.id] : -1;
            qCorrect = chosen === q.correctIndex;
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            q.optionsHtml.forEach(function(_, i) {
              var ob = document.getElementById('opt_' + q.id + '_' + i);
              if (!ob) return;
              ob.disabled = true;
              ob.classList.remove('selected');
              if (i === q.correctIndex) ob.classList.add('correct');
              else if (i === chosen) ob.classList.add('wrong');
            });
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: q.optionsRaw,
              selectedIndex: chosen,
              correctIndex: q.correctIndex,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          } else if (q.type === 'group-tf') {
            var tfMap = (userAnswers[q.id] && typeof userAnswers[q.id] === 'object') ? userAnswers[q.id] : {};
            var rightSubs = 0;
            q.subQuestions.forEach(function(sq, sIdx) {
              var picked = tfMap[sq.id] || '';
              var subOk = picked === sq.correctAnswer;
              if (subOk) rightSubs++;
              var row = document.getElementById('tfrow_' + sq.id);
              if (row) row.classList.add(subOk ? 'ok' : 'bad');
              ['True', 'False'].forEach(function(v) {
                var btn = document.getElementById('tfbtn_' + sq.id + '_' + v);
                if (!btn) return;
                btn.disabled = true;
                if (v === sq.correctAnswer) btn.classList.add('right-ans');
              });
              answerDetails.push({
                orderIndex: answerDetails.length,
                questionText: 'Câu ' + q.displayNumber + (TF_LABELS[sIdx] || '') + ': ' + sq.rawText,
                options: ['Đúng', 'Sai'],
                selectedIndex: picked === 'True' ? 0 : (picked === 'False' ? 1 : -1),
                correctIndex: sq.correctAnswer === 'True' ? 0 : 1,
                isCorrect: subOk,
                explanation: sIdx === q.subQuestions.length - 1 ? q.rawSolution : ''
              });
            });
            var earnedRatio = 0;
            if (q.subQuestions.length === 4) {
              earnedRatio = rightSubs === 1 ? 0.1 : rightSubs === 2 ? 0.25 : rightSubs === 3 ? 0.5 : rightSubs === 4 ? 1 : 0;
            } else if (q.subQuestions.length > 0) {
              earnedRatio = rightSubs / q.subQuestions.length;
            }
            var earned = Math.round(q.points * earnedRatio * 100) / 100;
            totalScore += earned;
            qCorrect = rightSubs === q.subQuestions.length;
            if (qCorrect) correctQuestions++;
            if (stEl) {
              stEl.textContent = 'Đúng ' + rightSubs + '/' + q.subQuestions.length + ' ý (+' + earned + 'đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
          } else {
            var rawInput = document.getElementById('short_' + q.id);
            var typed = rawInput ? rawInput.value.trim() : '';
            if (rawInput) rawInput.disabled = true;
            qCorrect = isShortMatch(typed, q.correctAnswer);
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            var fbEl = document.getElementById('shortfb_' + q.id);
            if (fbEl) {
              fbEl.textContent = qCorrect
                ? ('Chính xác (+' + q.points + 'đ)')
                : ('Đáp án đúng: ' + q.correctAnswer);
              fbEl.style.color = qCorrect ? 'var(--ok)' : 'var(--bad)';
            }
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: ['Bài làm: ' + (typed || '(bỏ trống)'), 'Đáp án chuẩn: ' + q.correctAnswer],
              selectedIndex: qCorrect ? 1 : 0,
              correctIndex: 1,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          }

          if (pBtn) {
            pBtn.className = 'p-btn mono ' + (qCorrect ? 'ok' : 'bad');
          }
        });

        totalScore = Math.round(totalScore * 100) / 100;
        var pct = maxScore > 0 ? Math.round((totalScore / maxScore) * 1000) / 10 : 0;

        document.getElementById('scoreText').textContent = totalScore + ' / ' + maxScore + ' điểm';
        document.getElementById('correctText').textContent =
          'Đúng hoàn toàn ' + correctQuestions + ' / ' + flatQuestions.length + ' câu (' + pct + '%)';
        document.getElementById('resultScreen').classList.add('visible');
        document.getElementById('topSubmitBtn').style.display = 'none';
        document.getElementById('sideSubmitBtn').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }

        if (typeof window.EduSyncSubmitScore === 'function') {
          window.EduSyncSubmitScore(totalScore, maxScore, correctQuestions, flatQuestions.length, answerDetails);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'QUIZ_RESULT',
            score: totalScore,
            maxScore: maxScore,
            correctCount: correctQuestions,
            totalQuestions: flatQuestions.length,
            answerDetails: answerDetails
          }, '*');
        }
      }

      document.getElementById('topSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('sideSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('confirmYesBtn').addEventListener('click', function() { gradeAndSubmit(true); });
      document.getElementById('confirmCancelBtn').addEventListener('click', function() {
        document.getElementById('confirmBar').classList.remove('visible');
      });

      function tickTimer() {
        if (submitted) return;
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var box = document.getElementById('timerBox');
        if (durationLimit > 0) {
          var rem = Math.max(0, durationLimit - elapsed);
          box.textContent = fmtTime(rem);
          box.classList.toggle('urgent', rem <= 60);
          if (rem <= 0) gradeAndSubmit(true);
        } else {
          box.textContent = fmtTime(elapsed);
        }
      }

      renderExam();
      tickTimer();
      timerHandle = setInterval(tickTimer, 1000);
    })();
  </script>
</body>
