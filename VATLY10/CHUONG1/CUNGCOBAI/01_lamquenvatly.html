    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-soft: #eff6ff;
      --ok: #047857;
      --ok-bg: #ecfdf5;
      --ok-border: #6ee7b7;
      --bad: #dc2626;
      --bad-bg: #fef2f2;
      --bad-border: #fca5a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .exam-title { font-size: 16px; font-weight: 700; margin: 0; color: var(--text); }
    .exam-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .timer-box {
      padding: 6px 12px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .timer-box.urgent {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid var(--bad-border);
    }
    .btn {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #fff; border-color: #cbd5e1; color: #334155; }
    .btn-secondary:hover { background: #f8fafc; }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }
    .main-col { display: flex; flex-direction: column; gap: 18px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .result-card {
      background: var(--ok-bg);
      border: 1px solid var(--ok-border);
      border-radius: 12px;
      padding: 20px;
      display: none;
    }
    .result-card.visible { display: block; }
    .result-score { font-size: 26px; font-weight: 700; color: var(--ok); margin: 4px 0; }
    .result-sub { font-size: 13px; color: #065f46; }
    .confirm-bar {
      display: none;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 4px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #92400e;
    }
    .confirm-bar.visible { display: flex; }
    .context-group {
      background: var(--surface);
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
    }
    .context-header {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }
    .context-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .context-body { font-size: 14px; color: #1e293b; }
    .context-questions {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #f8fafc;
    }
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      scroll-margin-top: 84px;
    }
    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 12px;
      color: var(--muted);
    }
    .q-num { font-size: 14px; font-weight: 700; color: var(--text); }
    .q-status { font-weight: 600; }
    .q-status.ok { color: var(--ok); }
    .q-status.bad { color: var(--bad); }
    .q-text { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
    .q-figure {
      margin: 12px 0;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .q-figure img { max-width: 100%; max-height: 360px; height: auto; border-radius: 4px; }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 640px) {
      .options-grid { grid-template-columns: 1fr; }
    }
    .opt-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
      color: #1e293b;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .opt-btn:hover:not(:disabled) { border-color: #94a3b8; background: #f8fafc; }
    .opt-btn.selected { border-color: var(--accent); background: var(--accent-soft); color: #1e3a8a; font-weight: 500; }
    .opt-btn.correct { border-color: var(--ok-border); background: var(--ok-bg); color: #064e3b; font-weight: 600; }
    .opt-btn.wrong { border-color: var(--bad-border); background: var(--bad-bg); color: #7f1d1d; }
    .opt-letter {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .opt-btn.selected .opt-letter { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tf-list { display: flex; flex-direction: column; gap: 10px; }
    .tf-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    .tf-row.ok { border-color: var(--ok-border); background: var(--ok-bg); }
    .tf-row.bad { border-color: var(--bad-border); background: var(--bad-bg); }
    .tf-text { font-size: 14px; flex: 1; }
    .tf-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .tf-choice {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tf-choice.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tf-choice.right-ans { border-color: var(--ok); color: var(--ok); }
    .short-box { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .short-input {
      width: 240px;
      max-width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
    }
    .short-input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .short-feedback { font-size: 13px; font-weight: 600; }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--border);
      font-size: 13px;
      color: #334155;
    }
    .solution-box.visible { display: block; }
    .sidebar {
      position: sticky;
      top: 76px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      margin: 12px 0 16px;
    }
    .p-btn {
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .p-btn.done { background: var(--accent); color: #fff; border-color: var(--accent); }
    .p-btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
    .p-btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
  </style>
</head>

    </aside>
  </div>

ng đều sử dụng máy vi tính để mô phỏng chuyển động"],"correctIndex":1,"correctAnswer":"Aristotle chỉ dựa vào quan sát và suy luận chủ quan; Galilei dùng thí nghiệm kiểm chứng dự đoán","subQuestions":[],"solutionHtml":"Aristotle dựa vào quan sát và suy luận chủ quan (&quot;vật nặng rơi nhanh hơn vật nhẹ&quot;). Galilei tiến hành thí nghiệm thực tế tại tháp nghiêng Pisa thả 2 quả cầu để kiểm chứng dự đoán, bác bỏ suy luận của Aristotle.","rawSolution":"Aristotle dựa vào quan sát và suy luận chủ quan (\"vật nặng rơi nhanh hơn vật nhẹ\"). Galilei tiến hành thí nghiệm thực tế tại tháp nghiêng Pisa thả 2 quả cầu để kiểm chứng dự đoán, bác bỏ suy luận của Aristotle."}]},{"blockId":"single_239561ee-d6c8-45ff-b8a3-ecc50afe0337_9","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"239561ee-d6c8-45ff-b8a3-ecc50afe0337","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Đơn vị áp suất Pascan ($Pa$) là đơn vị dẫn xuất. Khi quy đổi về các đơn vị cơ bản trong hệ SI, biểu thức nào sau đây là đúng?","rawText":"Đơn vị áp suất Pascan ($Pa$) là đơn vị dẫn xuất. Khi quy đổi về các đơn vị cơ bản trong hệ SI, biểu thức nào sau đây là đúng?","ownImageUrl":"","optionsHtml":["$1 Pa = 1 N/m^2 = 1 kg/(m \\cdot s^2)$","$1 Pa = 1 N \\cdot m = 1 kg \\cdot m^2/s^2$","$1 Pa = 1 J/m = 1 kg \\cdot m/s$","$1 Pa = 1 N/s = 1 kg/(m^2 \\cdot s)$"],"optionsRaw":["$1 Pa = 1 N/m^2 = 1 kg/(m \\cdot s^2)$","$1 Pa = 1 N \\cdot m = 1 kg \\cdot m^2/s^2$","$1 Pa = 1 J/m = 1 kg \\cdot m/s$","$1 Pa = 1 N/s = 1 kg/(m^2 \\cdot s)$"],"correctIndex":0,"correctAnswer":"$1 Pa = 1 N/m^2 = 1 kg/(m \\cdot s^2)$","subQuestions":[],"solutionHtml":"Áp suất = Lực / Diện tích $\\rightarrow 1 Pa = 1 N/m^2$. Vì $1 N = 1 kg \\cdot m/s^2$, thay vào ta có $1 Pa = \\frac{1 kg \\cdot m/s^2}{m^2} = 1 kg/(m \\cdot s^2)$.","rawSolution":"Áp suất = Lực / Diện tích $\\rightarrow 1 Pa = 1 N/m^2$. Vì $1 N = 1 kg \\cdot m/s^2$, thay vào ta có $1 Pa = \\frac{1 kg \\cdot m/s^2}{m^2} = 1 kg/(m \\cdot s^2)$."}]},{"blockId":"single_e859ba79-f52f-436f-95df-40cc7389a8cd_10","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"e859ba79-f52f-436f-95df-40cc7389a8cd","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Cuộc cách mạng công nghiệp lần thứ ba (những năm 70 thế kỉ XX) với đặc trưng tự động hóa sản xuất xuất phát từ thành tựu nào của Vật lí?","rawText":"Cuộc cách mạng công nghiệp lần thứ ba (những năm 70 thế kỉ XX) với đặc trưng tự động hóa sản xuất xuất phát từ thành tựu nào của Vật lí?","ownImageUrl":"","optionsHtml":["Phát minh máy hơi nước của James Watt","Phát hiện hiện tượng cảm ứng điện từ","Thành tựu nghiên cứu về điện tử, chất bán dẫn và vi mạch (IC)","Sự ra đời của trí tuệ nhân tạo (AI) và công nghệ nano"],"optionsRaw":["Phát minh máy hơi nước của James Watt","Phát hiện hiện tượng cảm ứng điện từ","Thành tựu nghiên cứu về điện tử, chất bán dẫn và vi mạch (IC)","Sự ra đời của trí tuệ nhân tạo (AI) và công nghệ nano"],"correctIndex":2,"correctAnswer":"Thành tựu nghiên cứu về điện tử, chất bán dẫn và vi mạch (IC)","subQuestions":[],"solutionHtml":"SGK khẳng định: Cuộc cách mạng công nghiệp lần thứ ba bắt đầu vào những năm 70 của thế kỉ XX với đặc trưng là tự động hóa các quá trình sản xuất nhờ có thành tựu về điện tử, chất bán dẫn và vi mạch (IC).","rawSolution":"SGK khẳng định: Cuộc cách mạng công nghiệp lần thứ ba bắt đầu vào những năm 70 của thế kỉ XX với đặc trưng là tự động hóa các quá trình sản xuất nhờ có thành tựu về điện tử, chất bán dẫn và vi mạch (IC)."}]},{"blockId":"single_03098c30-1e05-451a-8c4a-408f8ca5caf5_11","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"03098c30-1e05-451a-8c4a-408f8ca5caf5","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Thí nghiệm thả hai quả cầu kim loại nặng nhẹ khác nhau từ tháp nghiêng Pisa của Galilei nhằm mục đích trực tiếp nào?","rawText":"Thí nghiệm thả hai quả cầu kim loại nặng nhẹ khác nhau từ tháp nghiêng Pisa của Galilei nhằm mục đích trực tiếp nào?","ownImageUrl":"","optionsHtml":["Đo gia tốc trọng trường tại thành phố Pisa","Kiểm tra dự đoán &quot;Sự rơi nhanh hay chậm không phụ thuộc vào vật nặng hay nhẹ&quot; để bác bỏ ý kiến Aristotle","Xây dựng phương trình chuyển động rơi tự do","Chứng minh lực cản của không khí luôn bằng 0"],"optionsRaw":["Đo gia tốc trọng trường tại thành phố Pisa","Kiểm tra dự đoán \"Sự rơi nhanh hay chậm không phụ thuộc vào vật nặng hay nhẹ\" để bác bỏ ý kiến Aristotle","Xây dựng phương trình chuyển động rơi tự do","Chứng minh lực cản của không khí luôn bằng 0"],"correctIndex":1,"correctAnswer":"Kiểm tra dự đoán \"Sự rơi nhanh hay chậm không phụ thuộc vào vật nặng hay nhẹ\" để bác bỏ ý kiến Aristotle","subQuestions":[],"solutionHtml":"Galilei cùng học trò thả 2 quả cầu kim loại (quả to nặng gấp 10 lần quả nhỏ) nhằm kiểm tra dự đoán xem hai vật có rơi chạm đất cùng lúc hay không, qua đó bác bỏ ý kiến Aristotle.","rawSolution":"Galilei cùng học trò thả 2 quả cầu kim loại (quả to nặng gấp 10 lần quả nhỏ) nhằm kiểm tra dự đoán xem hai vật có rơi chạm đất cùng lúc hay không, qua đó bác bỏ ý kiến Aristotle."}]},{"blockId":"single_082e4242-5272-4c2f-801b-139fafb73601_12","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"082e4242-5272-4c2f-801b-139fafb73601","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Khi nghiên cứu chuyển động của ô tô chạy trên đường dài từ Hà Nội đến Đà Nẵng, việc coi ô tô là &quot;chất điểm&quot; thể hiện phương pháp nghiên cứu nào?","rawText":"Khi nghiên cứu chuyển động của ô tô chạy trên đường dài từ Hà Nội đến Đà Nẵng, việc coi ô tô là \"chất điểm\" thể hiện phương pháp nghiên cứu nào?","ownImageUrl":"","optionsHtml":["Phương pháp thực nghiệm","Phương pháp mô hình lí thuyết","Phương pháp mô hình vật chất thu nhỏ","Phương pháp quan sát triết học"],"optionsRaw":["Phương pháp thực nghiệm","Phương pháp mô hình lí thuyết","Phương pháp mô hình vật chất thu nhỏ","Phương pháp quan sát triết ể nghiên cứu sự phụ thuộc tốc độ bay hơi của nước vào nhiệt độ và gió. Thứ tự các bước thực hiện đúng quy chuẩn là:","rawText":"Một học sinh áp dụng quy trình phương pháp thực nghiệm để nghiên cứu sự phụ thuộc tốc độ bay hơi của nước vào nhiệt độ và gió. Thứ tự các bước thực hiện đúng quy chuẩn là:","ownImageUrl":"","optionsHtml":["(1) Đưa ra dự đoán $\\rightarrow$ (2) Thí nghiệm $\\rightarrow$ (3) Quan sát $\\rightarrow$ (4) Kết luận","(1) Xác định vấn đề $\\rightarrow$ (2) Quan sát, thu thập thông tin $\\rightarrow$ (3) Đưa ra dự đoán $\\rightarrow$ (4) Thí nghiệm kiểm tra $\\rightarrow$ (5) Kết luận","(1) Thí nghiệm $\\rightarrow$ (2) Thu thập thông tin $\\rightarrow$ (3) Kết luận $\\rightarrow$ (4) Dự đoán","(1) Quan sát $\\rightarrow$ (2) Kết luận $\\rightarrow$ (3) Thí nghiệm $\\rightarrow$ (4) Dự đoán"],"optionsRaw":["(1) Đưa ra dự đoán $\\rightarrow$ (2) Thí nghiệm $\\rightarrow$ (3) Quan sát $\\rightarrow$ (4) Kết luận","(1) Xác định vấn đề $\\rightarrow$ (2) Quan sát, thu thập thông tin $\\rightarrow$ (3) Đưa ra dự đoán $\\rightarrow$ (4) Thí nghiệm kiểm tra $\\rightarrow$ (5) Kết luận","(1) Thí nghiệm $\\rightarrow$ (2) Thu thập thông tin $\\rightarrow$ (3) Kết luận $\\rightarrow$ (4) Dự đoán","(1) Quan sát $\\rightarrow$ (2) Kết luận $\\rightarrow$ (3) Thí nghiệm $\\rightarrow$ (4) Dự đoán"],"correctIndex":1,"correctAnswer":"(1) Xác định vấn đề $\\rightarrow$ (2) Quan sát, thu thập thông tin $\\rightarrow$ (3) Đưa ra dự đoán $\\rightarrow$ (4) Thí nghiệm kiểm tra $\\rightarrow$ (5) Kết luận","subQuestions":[],"solutionHtml":"Quy trình thực nghiệm chuẩn gồm 5 bước: 1. Xác định vấn đề cần nghiên cứu $\\rightarrow$ 2. Quan sát, thu thập thông tin $\\rightarrow$ 3. Đưa ra dự đoán $\\rightarrow$ 4. Thí nghiệm kiểm tra dự đoán $\\rightarrow$ 5. Kết luận.","rawSolution":"Quy trình thực nghiệm chuẩn gồm 5 bước: 1. Xác định vấn đề cần nghiên cứu $\\rightarrow$ 2. Quan sát, thu thập thông tin $\\rightarrow$ 3. Đưa ra dự đoán $\\rightarrow$ 4. Thí nghiệm kiểm tra dự đoán $\\rightarrow$ 5. Kết luận."}]},{"blockId":"single_d7481979-3af5-4c35-96a6-8c3dccbecf6c_16","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"d7481979-3af5-4c35-96a6-8c3dccbecf6c","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Trong Bảng đơn vị SI, gia tốc góc có đơn vị dẫn xuất là $rad/s^2$. Công thức định nghĩa nào sau đây thể hiện đúng nguồn gốc của đơn vị dẫn xuất này?","rawText":"Trong Bảng đơn vị SI, gia tốc góc có đơn vị dẫn xuất là $rad/s^2$. Công thức định nghĩa nào sau đây thể hiện đúng nguồn gốc của đơn vị dẫn xuất này?","ownImageUrl":"","optionsHtml":["Gia tốc góc là tích tốc độ góc và thời gian: $\\alpha = \\omega \\cdot t \\rightarrow rad/s \\cdot s$","Gia tốc góc đặc trưng cho sự biến thiên tốc độ góc theo thời gian: $\\alpha = \\frac{\\Delta \\omega}{\\Delta t} \\rightarrow \\frac{rad/s}{s} = rad/s^2$","Gia tốc góc là tỉ số giữa góc quay và bình phương thời gian: $\\alpha = \\frac{\\theta}{t^2} \\rightarrow \\frac{rad}{s^2}$","Gia tốc góc là thương số giữa tốc độ và bán kính: $\\alpha = \\frac{v}{r}$"],"optionsRaw":["Gia tốc góc là tích tốc độ góc và thời gian: $\\alpha = \\omega \\cdot t \\rightarrow rad/s \\cdot s$","Gia tốc góc đặc trưng cho sự biến thiên tốc độ góc theo thời gian: $\\alpha = \\frac{\\Delta \\omega}{\\Delta t} \\rightarrow \\frac{rad/s}{s} = rad/s^2$","Gia tốc góc là tỉ số giữa góc quay và bình phương thời gian: $\\alpha = \\frac{\\theta}{t^2} \\rightarrow \\frac{rad}{s^2}$","Gia tốc góc là thương số giữa tốc độ và bán kính: $\\alpha = \\frac{v}{r}$"],"correctIndex":1,"correctAnswer":"Gia tốc góc đặc trưng cho sự biến thiên tốc độ góc theo thời gian: $\\alpha = \\frac{\\Delta \\omega}{\\Delta t} \\rightarrow \\frac{rad/s}{s} = rad/s^2$","subQuestions":[],"solutionHtml":"Gia tốc góc $\\alpha$ đo độ biến thiên của tốc độ góc $\\omega$ (đơn vị $rad/s$) trong một khoảng thời gian $\\Delta t$ (đơn vị $s$). Do đó đơn vị dẫn xuất của nó là $\\frac{rad/s}{s} = rad/s^2$.","rawSolution":"Gia tốc góc $\\alpha$ đo độ biến thiên của tốc độ góc $\\omega$ (đơn vị $rad/s$) trong một khoảng thời gian $\\Delta t$ (đơn vị $s$). Do đó đơn vị dẫn xuất của nó là $\\frac{rad/s}{s} = rad/s^2$."}]},{"blockId":"single_271012d2-0399-4c53-a8c9-4eddc9429312_17","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"271012d2-0399-4c53-a8c9-4eddc9429312","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Để tính khối lượng riêng của một khối kim loại hình hộp chữ nhật, người ta dùng thước đo các cạnh $a, b, c$ tính thể tích $V = a \\cdot b \\cdot c$, dùng cân đo khối lượng $m$, rồi tính $\\rho = \\frac{m}{V}$. Học sinh này đã phối hợp các yếu tố nào?","rawText":"Để tính khối lượng riêng của một khối kim loại hình hộp chữ nhật, người ta dùng thước đo các cạnh $a, b, c$ tính thể tích $V = a \\cdot b \\cdot c$, dùng cân đo khối lượng $m$, rồi tính $\\rho = \\frac{m}{V}$. Học sinh này đã phối hợp các yếu tố nào?","ownImageUrl":"","optionsHtml":["Mô hình vật chất thu nhỏ và đơn vị Áp suất ($Pa$)","Mô hình toán học (công thức tính $V$ và $\\rho$) phối hợp các đơn vị cơ bản ($kg$, $m$) để xác định đơn vị dẫn xuất khối lượng riêng ($kg/m^3$)","Phương pháp thực nghiệm Galileo kết hợp đơn vị Lực ($N$)","Mô hình lí thuyết tia sáng kết hợp đơn vị Tần số ($Hz$)"],"optionsRaw":["Mô hình vật chất thu nhỏ và đơn vị Áp suất ($Pa$)","Mô hình toán học (công thức tính $V$ và $\\rho$) phối hợp các đơn vị cơ bản ($kg$, $m$) để xác định đơn vị dẫn xuất khối lượng riêng ($kg/m^3$)","Phương pháp thực nghiệm Galileo kết hợp đơn vị Lực ($N$)","Mô hình lí thuyết tia sáng kết hợp đơn vị Tần số ($Hz$)"],"correctIndex":1,"correctAnswer":"Mô hình toán học (công thức tính $V$ và $\\rho$) phối hợp các đơn vị cơ bản ($kg$, $m$) để xác định đơn vị dẫn xuất khối lượng riêng ($kg/m^3$)","subQuestions":[],"solutionHtml":"Các công thức $V = a \\cdot b \\cdot c$ và $\\rho = \\frac{m}{V}$ chính là mô hình toán học. Độ dài (m) và khối lượng (kg) là đơn vị cơ bản trong hệ SI, phối hợp lại tạo nên đơn vị dẫn xuất khối lượng riêng $kg/m^3$.","rawSolution":"Các công thức $V = a \\cdot b \\cdot c$ và $\\rho = \\frac{m}{V}$ chính là mô hình toán học. Độ dài (m) và khối lượng (kg) là đơn vị cơ bản trong hệ SI, phối hợp lại tạo nên đơn vị dẫn xuất khối lượng riêng $kg/m^3$."}]},{"blockId":"single_7288baef-81c0-4d4b-9201-dae00e0af4d4_18","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"7288baef-81c0-4d4b-9201-dae00e0af4d4","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Phương trình $d = v \\cdot t$ là mô hình toán học của chuyển động thẳng đều. Hãy phân tích giới hạn áp dụng của mô hình này khi áp dụng cho giao thông thực tế và đề xuất hướng điều chỉnh mô hình.","rawText":"Phương trình $d = v \\cdot t$ là mô hình toán học của chuyển động thẳng đều. Hãy phân tích giới hạn áp dụng của mô hình này khi áp dụng cho giao thông thực tế và đề xuất hướng điều chỉnh mô hình.","ownImageUrl":"","optionsHtml":["Mô hình áp dụng tuyệt đối chính xác cho mọi loại phương tiện trong mọi hoàn cảnh","Trong thực tế giao thông ô tô phải dừng đèn đỏ, đường đông nên vận tốc $v$ biến đổi liên tục. Mô hình $d = v \\cdot t$ là lý tưởng hóa, cần điều chỉnh dùng vận tốc trung bình $v_{tb}$ hoặc chia nhỏ thành các giai đoạn biến đổi","Mô hình này hoàn toàn sai và không có bất kỳ giá trị khoa học nào trong thực tế","Cần thay thế mô hình toán học này bằng mô hình vật chất thu nhỏ"],"optionsRaw":["Mô hình áp dụng tuyệt đối chính xác cho mọi loại phương tiện trong mọi hoàn cảnh","Trong thực tế giao thông ô tô phải dừng đèn đỏ, đường đông nên vận tốc $v$ biến đổi liên tục. Mô hình $d = v \\cdot t$ là lý tưởng hóa, cần điều chỉnh dùng vận tốc trung bình $v_{tb}$ hoặc chia nhỏ thành các giai đoạn biến đổi","Mô hình này hoàn toàn sai và không có bất kỳ giá trị khoa học nào trong thực tế","Cần thay thế mô hình toán học này bằng mô hình vật chất thu nhỏ"],"correctIndex":1,"correctAnswer":"Trong thực tế giao thông ô tô phải dừng đèn đỏ, đường đông nên vận tốc $v$ biến đổi liên tục. Mô hình $d = v \\cdot t$ là lý tưởng hóa, cần điều chỉnh dùng vận tốc trung bình $v_{tb}$ hoặc chia nhỏ thành các giai đoạn biến đổi","subQuestions":[],"solutionHtml":"Mô hình toán học $d = v \\cdot t$ dựa trên giả thuyết lý tưởng vận tốc không đổi. Thực tế giao thông có chướng ngại vật, đèn đỏ khiến vận tốc biến đổi liên tục. Do đó cần bước 4 trong phương pháp mô hình: &quot;Điều chỉnh mô hình&quot; bằng cách sử dụng vận tốc trung bình hoặc chia nhỏ từng đoạn chuyển động.","rawSolution":"Mô hình toán học $d = v \\cdot t$ dựa trên giả thuyết lý tưởng vận tốc không đổi. Thực tế giao thông có chướng ngại vật, đèn đỏ khiến vận tốc biến đổi liên tục. Do đó cần bước 4 trong phương pháp mô hình: \"Điều chỉnh mô hình\" bằng cách sử dụng vận tốc trung bình hoặc chia nhỏ từng đoạn chuyển động."}]},{"blockId":"single_e760ba6c-4a65-4e44-8d5b-0409939379ba_19","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"e760ba6c-4a65-4e44-8d5b-0409939379ba","type":"mcq","level":"H","chapterName":"","points":0.5,"textHtml":"Thành tựu Vật lí hạt nhân vừa mang lại nguồn năng lượng điện hạt nhân dồi dào, vừa tiềm ẩn nguy cơ thảm họa rò rỉ phóng xạ và nguy cơ chiến tranh (bom nguyên tử). Bài học quan trọng nhất về vai trò xã hội của Vật lí là gì?","rawText":"Thành tựu Vật lí hạt nhân vừa mang lại nguồn năng lượng điện hạt nhân dồi dào, vừa tiềm ẩn nguy cơ thảm họa rò rỉ phóng xạ và nguy cơ chiến tranh (bom nguyên tử). Bài học quan trọng nhất về vai trò xã hội của Vật lí là gì?","ownImageUrl":"","optionsHtml":["Cấm hoàn toàn tất cả các nghiên cứu Vật lí hiện đại để đảm bảo an toàn tuyệt đối","Thành tựu Vật lí là công cụ khoa học, việc ứng dụng phải tuân thủ đạo đức, pháp luật và sử dụng đúng mục đích hòa bình nhằm bảo vệ môi trường và hệ sinh thái","Chỉ nghiên cứu Vật lí cổ điển, dừng hẳn nghiên cứu công nghệ vi mạch và hạt nhân","Mọi ứng dụng khoa học công nghệ không gây ảnh hưởng gì đến môi trường tự nhiên"],"optionsRaw":["Cấm hoàn toàn tất cả các nghiên cứu Vật lí hiện đại để đảm bảo an toàn tuyệt đối","Thành tựu Vật lí là công cụ khoa học, việc ứng dụng phải tuân thủ đạo đức, pháp luật và sử dụng đúng mục đích hòa bình nhằm bảo vệ môi trường và hệ sinh thái","Chỉ nghiên cứu Vật lí cổ điển, dừng hẳn nghiên cứu công nghệ vi mạch và hạt nhân","Mọi ứng dụng khoa học công nghệ không gây ảnh hưởng gì đến môi trường tự nhiên"],"correctIndex":1,"correctAnswer":"Thành tựu Vật lí là công cụ khoa học, việc ứng dụng phải tuân thủ đạo đức, pháp luật và sử dụng đúng mục đích hòa bình nhằm bảo vệ môi trường và hệ sinh thái","subQuestions":[],"solutionHtml":"Việc ứng dụng các thành tựu của Vật lí vào công nghệ mang lại lợi ích to lớn nhưng cũng có thể làm ô nhiễm môi trường, hủy hoại hệ sinh thái nếu không được sử dụng đúng mục đích. Con người cần phải có đạo đức khoa học và ý thức bảo vệ trái đất.","rawSolution":"Việc ứng dụng các thành tựu của Vật lí vào công nghệ mang lại lợi ích to lớn nhưng cũng có thể làm ô nhiễm môi trường, hủy hoại hệ sinh thái nếu không được sử dụng đúng mục đích. Con người cần phải có đạo đức khoa học và ý thức bảo vệ trái đất."}]}]}</script>
  <script>
    (function() {
      var dataEl = document.getElementById('edusync-runtime-data');
      var EXAM = JSON.parse(dataEl.textContent || '{}');
      var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      var TF_LABELS = ['a', 'b', 'c', 'd', 'e', 'f'];

      function shuffle(arr) {
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      var blocks = EXAM.shuffleQuestions ? shuffle(EXAM.blocks || []) : (EXAM.blocks || []);
      var flatQuestions = [];
      blocks.forEach(function(block) {
        block.questions.forEach(function(q) {
          if (q.type === 'mcq' && EXAM.shuffleOptions && Array.isArray(q.optionsHtml)) {
            var tagged = q.optionsHtml.map(function(html, idx) {
              return { html: html, raw: q.optionsRaw[idx], isCorrect: idx === q.correctIndex };
            });
            var mixed = shuffle(tagged);
            q.optionsHtml = mixed.map(function(m) { return m.html; });
            q.optionsRaw = mixed.map(function(m) { return m.raw; });
            q.correctIndex = Math.max(0, mixed.findIndex(function(m) { return m.isCorrect; }));
          }
          q.displayNumber = flatQuestions.length + 1;
          flatQuestions.push(q);
        });
      });

      var userAnswers = {};
      var submitted = false;
      var durationLimit = (EXAM.durationMinutes || 0) > 0 ? EXAM.durationMinutes * 60 : 0;
      var startTime = Date.now();
      var timerHandle = null;

      function fmtTime(sec) {
        var s = Math.max(0, Math.floor(sec));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function isQuestionAnswered(q) {
        var ans = userAnswers[q.id];
        if (q.type === 'mcq') return typeof ans === 'number';
        if (q.type === 'short') return typeof ans === 'string' && ans.trim().length > 0;
        if (q.type === 'group-tf') {
          if (!ans || typeof ans !== 'object') return false;
          return q.subQuestions.some(function(sq) { return ans[sq.id] === 'True' || ans[sq.id] === 'False'; });
        }
        return false;
      }

      function updateProgress() {
        var done = flatQuestions.filter(isQuestionAnswered).length;
        document.getElementById('progressLabel').textContent = done + '/' + flatQuestions.length;
        document.getElementById('sidebarCount').textContent = 'Đã làm ' + done + '/' + flatQuestions.length;
        flatQuestions.forEach(function(q) {
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          if (!pBtn || submitted) return;
          pBtn.className = 'p-btn mono' + (isQuestionAnswered(q) ? ' done' : '');
        });
      }

      function buildQuestionEl(q) {
        var card = document.createElement('article');
        card.className = 'q-card';
        card.id = 'qcard_' + q.displayNumber;

        var header = document.createElement('div');
        header.className = 'q-header';
        var leftMeta = '<span class="q-num">Câu ' + q.displayNumber + '</span>';
        var tags = [q.level ? ('Mức ' + q.level) : '', q.points + ' đ', q.chapterName || ''].filter(Boolean).join(' · ');
        header.innerHTML = leftMeta + '<span id="qstatus_' + q.displayNumber + '" class="q-status">' + tags + '</span>';
        card.appendChild(header);

        var qTextEl = document.createElement('div');
        qTextEl.className = 'q-text';
        qTextEl.innerHTML = q.textHtml;
        card.appendChild(qTextEl);

        if (q.ownImageUrl) {
          var fig = document.createElement('div');
          fig.className = 'q-figure';
          var img = document.createElement('img');
          img.src = q.ownImageUrl;
          img.alt = 'Hình minh họa câu ' + q.displayNumber;
          fig.appendChild(img);
          card.appendChild(fig);
        }

        if (q.type === 'mcq') {
          var grid = document.createElement('div');
          grid.className = 'options-grid';
          q.optionsHtml.forEach(function(optHtml, optIdx) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.id = 'opt_' + q.id + '_' + optIdx;
            btn.innerHTML = '<span class="opt-letter mono">' + (LETTERS[optIdx] || optIdx + 1) + '</span><span style="flex:1;">' + optHtml + '</span>';
            btn.addEventListener('click', function() {
              if (submitted) return;
              userAnswers[q.id] = optIdx;
              q.optionsHtml.forEach(function(_, i2) {
                var el = document.getElementById('opt_' + q.id + '_' + i2);
                if (el) el.classList.toggle('selected', i2 === optIdx);
              });
              updateProgress();
            });
            grid.appendChild(btn);
          });
          card.appendChild(grid);
        } else if (q.type === 'group-tf') {
          var list = document.createElement('div');
          list.className = 'tf-list';
          q.subQuestions.forEach(function(sq, sIdx) {
            var row = document.createElement('div');
            row.className = 'tf-row';
            row.id = 'tfrow_' + sq.id;

            var txt = document.createElement('div');
            txt.className = 'tf-text';
            txt.innerHTML = '<strong>' + (TF_LABELS[sIdx] || (sIdx + 1)) + ')</strong> ' + sq.textHtml;
            row.appendChild(txt);

            var actions = document.createElement('div');
            actions.className = 'tf-actions';
            ['True', 'False'].forEach(function(val) {
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'tf-choice';
              b.id = 'tfbtn_' + sq.id + '_' + val;
              b.textContent = val === 'True' ? 'Đúng' : 'Sai';
              b.addEventListener('click', function() {
                if (submitted) return;
                if (!userAnswers[q.id] || typeof userAnswers[q.id] !== 'object') userAnswers[q.id] = {};
                userAnswers[q.id][sq.id] = val;
                var bt = document.getElementById('tfbtn_' + sq.id + '_True');
                var bf = document.getElementById('tfbtn_' + sq.id + '_False');
                if (bt) bt.classList.toggle('active', val === 'True');
                if (bf) bf.classList.toggle('active', val === 'False');
                updateProgress();
              });
              actions.appendChild(b);
            });
            row.appendChild(actions);
            list.appendChild(row);
          });
          card.appendChild(list);
        } else {
          var sBox = document.createElement('div');
          sBox.className = 'short-box';
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'short-input';
          inp.id = 'short_' + q.id;
          inp.placeholder = 'Nhập đáp số (vd: 2.6 hoặc 36)';
          inp.addEventListener('input', function() {
            if (submitted) return;
            userAnswers[q.id] = inp.value;
            updateProgress();
          });
          var fb = document.createElement('span');
          fb.id = 'shortfb_' + q.id;
          fb.className = 'short-feedback';
          sBox.appendChild(inp);
          sBox.appendChild(fb);
          card.appendChild(sBox);
        }

        if (q.solutionHtml) {
          var sol = document.createElement('div');
          sol.className = 'solution-box';
          sol.id = 'sol_' + q.id;
          sol.innerHTML = '<strong>Lời giải chi tiết:</strong><div style="margin-top:4px;">' + q.solutionHtml + '</div>';
          card.appendChild(sol);
        }

        return card;
      }

      function renderExam() {
        var root = document.getElementById('questionsRoot');
        var pal = document.getElementById('paletteRoot');
        root.innerHTML = '';
        pal.innerHTML = '';

        blocks.forEach(function(block) {
          if (block.contextHtml || block.sharedImageUrl) {
            var groupEl = document.createElement('section');
            groupEl.className = 'context-group';

            var head = document.createElement('div');
            head.className = 'context-header';
            var firstNum = block.questions[0].displayNumber;
            var lastNum = block.questions[block.questions.length - 1].displayNumber;
            var labelText = block.questions.length > 1
              ? 'Dữ liệu dùng chung cho Câu ' + firstNum + ' – Câu ' + lastNum
              : 'Dữ liệu đề bài (Câu ' + firstNum + ')';
            var html = '<div class="context-label">' + labelText + '</div>';
            if (block.contextHtml) {
              html += '<div class="context-body">' + block.contextHtml + '</div>';
            }
            head.innerHTML = html;
            if (block.sharedImageUrl) {
              var fig = document.createElement('div');
              fig.className = 'q-figure';
              var img = document.createElement('img');
              img.src = block.sharedImageUrl;
              img.alt = labelText;
              fig.appendChild(img);
              head.appendChild(fig);
            }
            groupEl.appendChild(head);

            var inner = document.createElement('div');
            inner.className = 'context-questions';
            block.questions.forEach(function(q) {
              inner.appendChild(buildQuestionEl(q));
            });
            groupEl.appendChild(inner);
            root.appendChild(groupEl);
          } else {
            block.questions.forEach(function(q) {
              root.appendChild(buildQuestionEl(q));
            });
          }
        });

        flatQuestions.forEach(function(q) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'p-btn mono';
          b.id = 'pbtn_' + q.displayNumber;
          b.textContent = String(q.displayNumber);
          b.addEventListener('click', function() {
            var target = document.getElementById('qcard_' + q.displayNumber);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          pal.appendChild(b);
        });

        updateProgress();
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }
      }

      function normalizeShort(val) {
        return String(val || '').trim().replace(/,/g, '.').replace(/\s+/g, '').toLowerCase();
      }

      function isShortMatch(userVal, expectedVal) {
        var u = normalizeShort(userVal);
        var e = normalizeShort(expectedVal);
        if (!u) return false;
        if (u === e) return true;
        var nu = parseFloat(u);
        var ne = parseFloat(e);
        if (!isNaN(nu) && !isNaN(ne) && String(nu) === u || !isNaN(nu) && !isNaN(ne)) {
          if (/^-?\d+(?:\.\d+)?$/.test(u) && /^-?\d+(?:\.\d+)?$/.test(e)) {
            return Math.abs(nu - ne) < 1e-6;
          }
        }
        return false;
      }

      function gradeAndSubmit(force) {
        if (submitted) return;
        var answered = flatQuestions.filter(isQuestionAnswered).length;
        if (!force && answered < flatQuestions.length) {
          document.getElementById('confirmMsg').textContent =
            'Bạn mới làm ' + answered + '/' + flatQuestions.length + ' câu. Bạn có chắc muốn nộp bài ngay?';
          document.getElementById('confirmBar').classList.add('visible');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        document.getElementById('confirmBar').classList.remove('visible');
        submitted = true;
        if (timerHandle) clearInterval(timerHandle);

        var totalScore = 0;
        var maxScore = EXAM.maxScore || 10;
        var correctQuestions = 0;
        var answerDetails = [];

        flatQuestions.forEach(function(q) {
          var qCorrect = false;
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          var stEl = document.getElementById('qstatus_' + q.displayNumber);
          var solEl = document.getElementById('sol_' + q.id);
          if (solEl) solEl.classList.add('visible');

          if (q.type === 'mcq') {
            var chosen = typeof userAnswers[q.id] === 'number' ? userAnswers[q.id] : -1;
            qCorrect = chosen === q.correctIndex;
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            q.optionsHtml.forEach(function(_, i) {
              var ob = document.getElementById('opt_' + q.id + '_' + i);
              if (!ob) return;
              ob.disabled = true;
              ob.classList.remove('selected');
              if (i === q.correctIndex) ob.classList.add('correct');
              else if (i === chosen) ob.classList.add('wrong');
            });
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: q.optionsRaw,
              selectedIndex: chosen,
              correctIndex: q.correctIndex,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          } else if (q.type === 'group-tf') {
            var tfMap = (userAnswers[q.id] && typeof userAnswers[q.id] === 'object') ? userAnswers[q.id] : {};
            var rightSubs = 0;
            q.subQuestions.forEach(function(sq, sIdx) {
              var picked = tfMap[sq.id] || '';
              var subOk = picked === sq.correctAnswer;
              if (subOk) rightSubs++;
              var row = document.getElementById('tfrow_' + sq.id);
              if (row) row.classList.add(subOk ? 'ok' : 'bad');
              ['True', 'False'].forEach(function(v) {
                var btn = document.getElementById('tfbtn_' + sq.id + '_' + v);
                if (!btn) return;
                btn.disabled = true;
                if (v === sq.correctAnswer) btn.classList.add('right-ans');
              });
              answerDetails.push({
                orderIndex: answerDetails.length,
                questionText: 'Câu ' + q.displayNumber + (TF_LABELS[sIdx] || '') + ': ' + sq.rawText,
                options: ['Đúng', 'Sai'],
                selectedIndex: picked === 'True' ? 0 : (picked === 'False' ? 1 : -1),
                correctIndex: sq.correctAnswer === 'True' ? 0 : 1,
                isCorrect: subOk,
                explanation: sIdx === q.subQuestions.length - 1 ? q.rawSolution : ''
              });
            });
            var earnedRatio = 0;
            if (q.subQuestions.length === 4) {
              earnedRatio = rightSubs === 1 ? 0.1 : rightSubs === 2 ? 0.25 : rightSubs === 3 ? 0.5 : rightSubs === 4 ? 1 : 0;
            } else if (q.subQuestions.length > 0) {
              earnedRatio = rightSubs / q.subQuestions.length;
            }
            var earned = Math.round(q.points * earnedRatio * 100) / 100;
            totalScore += earned;
            qCorrect = rightSubs === q.subQuestions.length;
            if (qCorrect) correctQuestions++;
            if (stEl) {
              stEl.textContent = 'Đúng ' + rightSubs + '/' + q.subQuestions.length + ' ý (+' + earned + 'đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
          } else {
            var rawInput = document.getElementById('short_' + q.id);
            var typed = rawInput ? rawInput.value.trim() : '';
            if (rawInput) rawInput.disabled = true;
            qCorrect = isShortMatch(typed, q.correctAnswer);
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            var fbEl = document.getElementById('shortfb_' + q.id);
            if (fbEl) {
              fbEl.textContent = qCorrect
                ? ('Chính xác (+' + q.points + 'đ)')
                : ('Đáp án đúng: ' + q.correctAnswer);
              fbEl.style.color = qCorrect ? 'var(--ok)' : 'var(--bad)';
            }
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: ['Bài làm: ' + (typed || '(bỏ trống)'), 'Đáp án chuẩn: ' + q.correctAnswer],
              selectedIndex: qCorrect ? 1 : 0,
              correctIndex: 1,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          }

          if (pBtn) {
            pBtn.className = 'p-btn mono ' + (qCorrect ? 'ok' : 'bad');
          }
        });

        totalScore = Math.round(totalScore * 100) / 100;
        var pct = maxScore > 0 ? Math.round((totalScore / maxScore) * 1000) / 10 : 0;

        document.getElementById('scoreText').textContent = totalScore + ' / ' + maxScore + ' điểm';
        document.getElementById('correctText').textContent =
          'Đúng hoàn toàn ' + correctQuestions + ' / ' + flatQuestions.length + ' câu (' + pct + '%)';
        document.getElementById('resultScreen').classList.add('visible');
        document.getElementById('topSubmitBtn').style.display = 'none';
        document.getElementById('sideSubmitBtn').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }

        if (typeof window.EduSyncSubmitScore === 'function') {
          window.EduSyncSubmitScore(totalScore, maxScore, correctQuestions, flatQuestions.length, answerDetails);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'QUIZ_RESULT',
            score: totalScore,
            maxScore: maxScore,
            correctCount: correctQuestions,
            totalQuestions: flatQuestions.length,
            answerDetails: answerDetails
          }, '*');
        }
      }

      document.getElementById('topSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('sideSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('confirmYesBtn').addEventListener('click', function() { gradeAndSubmit(true); });
      document.getElementById('confirmCancelBtn').addEventListener('click', function() {
        document.getElementById('confirmBar').classList.remove('visible');
      });

      function tickTimer() {
        if (submitted) return;
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var box = document.getElementById('timerBox');
        if (durationLimit > 0) {
          var rem = Math.max(0, durationLimit - elapsed);
          box.textContent = fmtTime(rem);
          box.classList.toggle('urgent', rem <= 60);
          if (rem <= 0) gradeAndSubmit(true);
        } else {
          box.textContent = fmtTime(elapsed);
        }
      }

      renderExam();
      tickTimer();
      timerHandle = setInterval(tickTimer, 1000);
    })();
  </script>
