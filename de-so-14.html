    :root {

      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-soft: #eff6ff;
      --ok: #047857;
      --ok-bg: #ecfdf5;
      --ok-border: #6ee7b7;
      --bad: #dc2626;
      --bad-bg: #fef2f2;
      --bad-border: #fca5a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;

      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .exam-title { font-size: 16px; font-weight: 700; margin: 0; color: var(--text); }
    .exam-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .timer-box {
      padding: 6px 12px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .timer-box.urgent {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid var(--bad-border);
    }
    .btn {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #fff; border-color: #cbd5e1; color: #334155; }
    .btn-secondary:hover { background: #f8fafc; }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }
    .main-col { display: flex; flex-direction: column; gap: 18px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .result-card {
      background: var(--ok-bg);
      border: 1px solid var(--ok-border);
      border-radius: 12px;
      padding: 20px;
      display: none;
    }
    .result-card.visible { display: block; }
    .result-score { font-size: 26px; font-weight: 700; color: var(--ok); margin: 4px 0; }
    .result-sub { font-size: 13px; color: #065f46; }
    .confirm-bar {
      display: none;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 4px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #92400e;
    }
    .confirm-bar.visible { display: flex; }
    .context-group {
      background: var(--surface);
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
    }
    .context-header {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }
    .context-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .context-body { font-size: 14px; color: #1e293b; }
    .context-questions {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #f8fafc;
    }
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      scroll-margin-top: 84px;
    }
    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 12px;
      color: var(--muted);
    }
    .q-num { font-size: 14px; font-weight: 700; color: var(--text); }
    .q-status { font-weight: 600; }
    .q-status.ok { color: var(--ok); }
    .q-status.bad { color: var(--bad); }
    .q-text { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
    .q-figure {
      margin: 12px 0;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .q-figure img { max-width: 100%; max-height: 360px; height: auto; border-radius: 4px; }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 640px) {
      .options-grid { grid-template-columns: 1fr; }
    }
    .opt-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
      color: #1e293b;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .opt-btn:hover:not(:disabled) { border-color: #94a3b8; background: #f8fafc; }

    .opt-letter {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .opt-btn.selected .opt-letter { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tf-list { display: flex; flex-direction: column; gap: 10px; }
    .tf-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    .tf-row.ok { border-color: var(--ok-border); background: var(--ok-bg); }
    .tf-row.bad { border-color: var(--bad-border); background: var(--bad-bg); }
    .tf-text { font-size: 14px; flex: 1; }
    .tf-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .tf-choice {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tf-choice.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tf-choice.right-ans { border-color: var(--ok); color: var(--ok); }
    .short-box { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .short-input {
      width: 240px;
      max-width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
    }
    .short-input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .short-feedback { font-size: 13px; font-weight: 600; }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--border);
      font-size: 13px;
      color: #334155;
    }
    .solution-box.visible { display: block; }
    .sidebar {
      position: sticky;
      top: 76px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      margin: 12px 0 16px;
    }
    .p-btn {
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .p-btn.done { background: var(--accent); color: #fff; border-color: var(--accent); }
    .p-btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
    .p-btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
  </style>
</head>

      "context": "Hình bên dưới là sơ đồ bố trí thí nghiệm đo nhiệt dung riêng c của chất lỏng X.\nLần 1: Đổ 200 g chất lỏng X vào nhiệt lượng kế. Sau 42 s thì thấy nhiệt độ của chất lỏng X tăng thêm $5^0 C$. Ghi lại số liệu, sau đó đổ chất lỏng ra và để nhiệt lượng kế nguội về nhiệt độ ban đầu.\nLần 2: Tiến hành thí nghiệm tương tự với 250 g dầu có nhiệt dung riêng là 2026 J/(kg.K). Sau 50 s, nhiệt độ của dầu tăng thêm $10^0 C$.\nBỏ qua nhiệt lượng mà nhiệt lượng kế và đũa khuấy thu vào, đồng thời bỏ qua sự trao đổi nhiệt với môi trường. Trong suốt quá trình làm thí nghiệm, số chỉ của vôn kế và ampe kế không thay đổi..",

dGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"c04d4ea5-b0d3-43aa-a122-2b70bf60ee22","type":"mcq","level":"B","chapterName":"chương 2: vật lý chất khí","points":0.25,"textHtml":"Đối với một lượng khí lí tưởng chứa $N$ phân tử trong thể tích $V$, khối lượng mỗi phân tử là $m$. Áp suất $p$ của khí được tính theo động học phân tử là","rawText":"Đối với một lượng khí lí tưởng chứa $N$ phân tử trong thể tích $V$, khối lượng mỗi phân tử là $m$. Áp suất $p$ của khí được tính theo động học phân tử là","ownImageUrl":"","optionsHtml":["$p = \\frac{1}{3} \\frac{N}{V} m \\overline{v^2}$.","$p = \\frac{2}{3} \\frac{N}{V} m \\overline{v^2}$.","$p = \\frac{1}{2} \\frac{N}{V} m \\overline{v^2}$.","$p = 3 \\frac{N}{V} m \\overline{v^2}$."],"optionsRaw":["$p = \\frac{1}{3} \\frac{N}{V} m \\overline{v^2}$.","$p = \\frac{2}{3} \\frac{N}{V} m \\overline{v^2}$.","$p = \\frac{1}{2} \\frac{N}{V} m \\overline{v^2}$.","$p = 3 \\frac{N}{V} m \\overline{v^2}$."],"correctIndex":0,"correctAnswer":"$p = \\frac{1}{3} \\frac{N}{V} m \\overline{v^2}$.","subQuestions":[],"solutionHtml":"Công thức cơ bản của thuyết động học phân tử khí lí tưởng: $p = \\frac{1}{3} \\frac{N}{V} m \\overline{v^2}$.","rawSolution":"Công thức cơ bản của thuyết động học phân tử khí lí tưởng: $p = \\frac{1}{3} \\frac{N}{V} m \\overline{v^2}$."}]},{"blockId":"single_3133deca-f02f-4980-875d-e66f181c705c_4","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"3133deca-f02f-4980-875d-e66f181c705c","type":"mcq","level":"H","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Một bình chứa bằng đồng có khối lượng $300\\text{ g}$, chứa $1{,}5\\text{ kg}$ nước ở $20^\\circ\\text{C}$. Biết nhiệt dung riêng của đồng và của nước lần lượt là $380\\text{ J/(kg}\\cdot\\text{K)}$ và $4200\\text{ J/(kg}\\cdot\\text{K)}$. Bỏ qua sự trao đổi nhiệt với môi trường xung quanh. Nhiệt lượng cần cung cấp để đun nóng bình đồng và nước bên trong từ $20^\\circ\\text{C}$ đến khi bắt đầu sôi ở $100^\\circ\\text{C}$ bằng","rawText":"Một bình chứa bằng đồng có khối lượng $300\\text{ g}$, chứa $1{,}5\\text{ kg}$ nước ở $20^\\circ\\text{C}$. Biết nhiệt dung riêng của đồng và của nước lần lượt là $380\\text{ J/(kg}\\cdot\\text{K)}$ và $4200\\text{ J/(kg}\\cdot\\text{K)}$. Bỏ qua sự trao đổi nhiệt với môi trường xung quanh. Nhiệt lượng cần cung cấp để đun nóng bình đồng và nước bên trong từ $20^\\circ\\text{C}$ đến khi bắt đầu sôi ở $100^\\circ\\text{C}$ bằng","ownImageUrl":"","optionsHtml":["513,12 kJ.","504,00 kJ.","9,12 kJ.","650,20 kJ."],"optionsRaw":["513,12 kJ.","504,00 kJ.","9,12 kJ.","650,20 kJ."],"correctIndex":0,"correctAnswer":"513,12 kJ.","subQuestions":[],"solutionHtml":"$Q = (m_{đ} c_{đ} + m_{n} c_{n})\\Delta T = (0{,}3 \\times 380 + 1{,}5 \\times 4200) \\times (100 - 20) = (114 + 6300) \\times 80 = 6414 \\times 80 = 513120\\text{ J} = 513{,}12\\text{ kJ}$.","rawSolution":"$Q = (m_{đ} c_{đ} + m_{n} c_{n})\\Delta T = (0{,}3 \\times 380 + 1{,}5 \\times 4200) \\times (100 - 20) = (114 + 6300) \\times 80 = 6414 \\times 80 = 513120\\text{ J} = 513{,}12\\text{ kJ}$."}]},{"blockId":"single_53b59f3e-dd82-4ce7-9ffc-9e4c36a3ceb7_5","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"53b59f3e-dd82-4ce7-9ffc-9e4c36a3ceb7","type":"mcq","level":"VD","chapterName":"chương 2: vật lý chất khí","points":0.25,"textHtml":"Hai bình kín chứa cùng một loại khí lí tưởng nối với nhau bằng một ống dẫn nhỏ có khóa, thể tích ống không đáng kể. Ban đầu khóa đóng, bình thứ nhất có thể tích $4\\text{ lít}$, chứa khí ở áp suất $3\\cdot 10^5\\text{ Pa}$; bình thứ hai có thể tích $1\\text{ lít}$, chứa khí ở áp suất $10^5\\text{ Pa}$. Nhiệt độ khí trong hai bình bằng nhau và không đổi. Khi mở khóa để hai bình thông nhau, áp suất của hệ khi cân bằng là","rawText":"Hai bình kín chứa cùng một loại khí lí tưởng nối với nhau bằng một ống dẫn nhỏ có khóa, thể tích ống không đáng kể. Ban đầu khóa đóng, bình thứ nhất có thể tích $4\\text{ lít}$, chứa khí ở áp suất $3\\cdot 10^5\\text{ Pa}$; bình thứ hai có thể tích $1\\text{ lít}$, chứa khí ở áp suất $10^5\\text{ Pa}$. Nhiệt độ khí trong hai bình bằng nhau và không đổi. Khi mở khóa để hai bình thông nhau, áp suất của hệ khi cân bằng là","ownImageUrl":"","optionsHtml":["$2{,}6\\cdot 10^5\\text{ Pa}$.","$2{,}0\\cdot 10^5\\text{ Pa}$.","$1{,}5\\cdot 10^5\\text{ Pa}$.","$2{,}4\\cdot 10^5\\text{ Pa}$."],"optionsRaw":["$2{,}6\\cdot 10^5\\text{ Pa}$.","$2{,}0\\cdot 10^5\\text{ Pa}$.","$1{,}5\\cdot 10^5\\text{ Pa}$.","$2{,}4\\cdot 10^5\\text{ Pa}$."],"correctIndex":0,"correctAnswer":"$2{,}6\\cdot 10^5\\text{ Pa}$.","subQuestions":[],"solutionHtml":"Áp dụng định luật Đẳng nhiệt (Boyle-Mariotte): $p_1 V_1 + p_2 V_2 = p(V_1 + V_2) \\Rightarrow 3\\cdot 10^5 \\times 4 + 10^5 \\times 1 = p(4 + 1) \\Rightarrow 13\\cdot 10^5 = 5p \\Rightarrow p = 2{,}6\\cdot 10^5\\text{ Pa}$.","rawSolution":"Áp dụng định luật Đẳng nhiệt (Boyle-Mariotte): $p_1 V_1 + p_2 V_2 = p(V_1 + V_2) \\Rightarrow 3\\cdot 10^5 \\times 4 + 10^5 \\times 1 = p(4 + 1) \\Rightarrow 13\\cdot 10^5 = 5p \\Rightarrow p = 2{,}6\\cdot 10^5\\text{ Pa}$."}]},{"blockId":"single_728af5b0-fe1f-450c-9257-1b6871d2a901_6","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"728af5b0-fe1f-450c-9257-1b6871d2a901","type":"mcq","level":"VD","chapterName":"chương 2: vật lý chất khí","points":0.25,"textHtml":"Một quả bóng thám không chứa khí ở áp suất $1\\text{ atm}$ và nhiệt độ $37^{\\circ}\\text{C}$ có bán kính là R. Khi bóng bay ở tầng khí quyển có áp suất $0{,}03\\text{ atm}$ và nhiệt độ $-50^{\\circ}\\text{C}$, bán kính của bóng lúc này là $10\\text{ m}$. Coi áp suất và nhiệt độ khí trong quả bóng bằng áp suất và nhiệt độ bên ngoài. Giá trị của R là","rawText":"Một quả bóng thám không chứa khí ở áp suất $1\\text{ atm}$ và nhiệt độ $37^{\\circ}\\text{C}$ có bán kính là R. Khi bóng bay ở tầng khí quyển có áp suất $0{,}03\\text{ atm}$ và nhiệt độ $-50^{\\circ}\\text{C}$, bán kính của bóng lúc này là $10\\text{ m}$. Coi áp suất và nhiệt độ khí trong quả bóng bằng áp suất và nhiệt độ bên ngoài. Giá trị của R là","ownImageUrl":"","optionsHtml":["4,17 m.","3,47 m.","6,46 m.","5,0 m."],"optionsRaw":["4,17 m.","3,47 m.","6,46 m.","5,0 m."],"correctIndex":1,"correctAnswer":"3,47 m.","subQuestions":[],"solutionHtml":"Phương trình trạng thái khí lý tưởng: $\\frac{p_1 V_1}{T_1} = \\frac{p_2 V_2}{T_2}$. Thể tích hình cầu $V = \\frac{4}{3}\\pi R^3$. Suy ra $\\frac{p_1 R_1^3}{T_1} = \\frac{p_2 R_2^3}{T_2} \\Rightarrow \\frac{1 \\cdot R^3}{310} = \\frac{0{,}03 \\cdot 10^3}{223} \\Rightarrow R^3 \\approx 41{,}7 \\Rightarrow R \\approx 3{,}47\\text{ m}$.","rawSolution":"Phương trình trạng thái khí lý tưởng: $\\frac{p_1 V_1}{T_1} = \\frac{p_2 V_2}{T_2}$. Thể tích hình cầu $V = \\frac{4}{3}\\pi R^3$. Suy ra $\\frac{p_1 R_1^3}{T_1} = \\frac{p_2 R_2^3}{T_2} \\Rightarrow \\frac{1 \\cdot R^3}{310} = \\frac{0{,}03 \\cdot 10^3}{223} \\Rightarrow R^3 \\approx 41{,}7 \\Rightarrow R \\approx 3{,}47\\text{ m}$."}]},{"blockId":"single_2ac21342-22cf-4b14-a0b9-ef81227b91af_7","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"2ac21342-22cf-4b14-a0b9-ef81227b91af","type":"mcq","level":"H","chapterName":"chương 2: vật lý chất khí","points":0.25,"textHtml":"Nén đẳng nhiệt một lượng khí lí tưởng xác định từ thể tích 9 lít xuống còn 4 lít. Áp suất của khối khí sau khi nén tăng bao nhiêu lần so với ban đầu?","rawText":"Nén đẳng nhiệt một lượng khí lí tưởng xác định từ thể tích 9 lít xuống còn 4 lít. Áp suất của khối khí sau khi nén tăng bao nhiêu lần so với ban đầu?","ownImageUrl":"","optionsHtml":["4,40.","1,40.","2,25.","2,50."],"optionsRaw":["4,40.","1,40.","2,25.","2,50."],"correctIndex":2,"correctAnswer":"2,25.","subQuestions":[],"solutionHtml":"Theo định luật Boyle: $p_1V_1 = p_2V_2 \\Rightarrow \\frac{p_2}{p_1} = \\frac{V_1}{V_2} = \\frac{9}{4} = 2{,}25$.","rawSolution":"Theo định luật Boyle: $p_1V_1 = p_2V_2 \\Rightarrow \\frac{p_2}{p_1} = \\frac{V_1}{V_2} = \\frac{9}{4} = 2{,}25$."}]},{"blockId":"single_850f4baf-a830-4d4e-935b-e2d501150ef4_8","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"850f4baf-a830-4d4e-935b-e2d501150ef4","type":"mcq","level":"H","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Một vật có nhiệt độ là $t^{\\circ}\\text{C}$. Nếu đo nhiệt độ của vật đó bằng thang Fahrenheit, người ta thấy kết quả đo được có giá trị bằng hai lần t. Giá trị của t là","rawText":"Một vật có nhiệt độ là $t^{\\circ}\\text{C}$. Nếu đo nhiệt độ của vật đó bằng thang Fahrenheit, người ta thấy kết quả đo được có giá trị bằng hai lần t. Giá trị của t là","ownImageUrl":"","optionsHtml":["$160^{\\circ}\\text{C}$.","$260^{\\circ}\\text{C}$.","$0^{\\circ}\\text{C}$.","$100^{\\circ}\\text{C}$."],"optionsRaw":["$160^{\\circ}\\text{C}$.","$260^{\\circ}\\text{C}$.","$0^{\\circ}\\text{C}$.","$100^{\\circ}\\text{C}$."],"correctIndex":0,"correctAnswer":"$160^{\\circ}\\text{C}$.","subQuestions":[],"solutionHtml":"Công thức đổi từ độ C sang độ F: $t_F = 1{,}8t + 32$. Theo đề $t_F = 2t \\Rightarrow 2t = 1{,}8t + 32 \\Rightarrow 0{,}2t = 32 \\Rightarrow t = 160^{\\circ}\\text{C}$.","rawSolution":"Công thức đổi từ độ C sang độ F: $t_F = 1{,}8t + 32$. Theo đề $t_F = 2t \\Rightarrow 2t = 1{,}8t + 32 \\Rightarrow 0{,}2t = 32 \\Rightarrow t = 160^{\\circ}\\text{C}$."}]},{"blockId":"single_994d8e21-d8e8-4533-aa9d-8ffa39206b20_9","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"994d8e21-d8e8-4533-aa9d-8ffa39206b20","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Hai vật tiếp xúc với nhau sẽ không có sự truyền nhiệt nếu chúng có cùng","rawText":"Hai vật tiếp xúc với nhau sẽ không có sự truyền nhiệt nếu chúng có cùng","ownImageUrl":"","optionsHtml":["nhiệt độ.","nhiệt dung riêng.","thể tích.","nội năng."],"optionsRaw":["nhiệt độ.","nhiệt dung riêng.","thể tích.","nội năng."],"correctIndex":0,"correctAnswer":"nhiệt độ.","subQuestions":[],"solutionHtml":"Sự truyền nhiệt chỉ xảy ra tự phát giữa hai vật có nhiệt độ khác nhau. Khi hai vật cùng nhiệt độ, chúng ở trạng thái cân bằng nhiệt nên không có sự truyền nhiệt.","rawSolution":"Sự truyền nhiệt chỉ xảy ra tự phát giữa hai vật có nhiệt độ khác nhau. Khi hai vật cùng nhiệt độ, chúng ở trạng thái cân bằng nhiệt nên không có sự truyền nhiệt."}]},{"blockId":"single_1934f597-28e3-4b3a-92be-35bdf7a7fa25_10","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"1934f597-28e3-4b3a-92be-35bdf7a7fa25","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Đơn vị đo nhiệt độ trong hệ đo lường SI là","rawText":"Đơn vị đo nhiệt độ trong hệ đo lường SI là","ownImageUrl":"","optionsHtml":["Celsius.","Fahrenheit.","Rankine.","Kelvin."],"optionsRaw":["Celsius.","Fahrenheit.","Rankine.","Kelvin."],"correctIndex":3,"correctAnswer":"Kelvin.","subQuestions":[],"solutionHtml":"Trong hệ đo lường quốc tế SI, đơn vị cơ bản của nhiệt độ nhiệt động lực học là Kelvin (kí hiệu: $\\text{K}$).","rawSolution":"Trong hệ đo lường quốc tế SI, đơn vị cơ bản của nhiệt độ nhiệt động lực học là Kelvin (kí hiệu: $\\text{K}$)."}]},{"blockId":"single_84e57776-1479-461b-b179-10fb06c7debd_11","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"84e57776-1479-461b-b179-10fb06c7debd","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Điều nào sau đây là sai khi nói về sự sôi?","rawText":"Điều nào sau đây là sai khi nói về sự sôi?","ownImageUrl":"","optionsHtml":["Trong quá trình sôi, nhiệt độ của chất lỏng không đổi.","Tại nhiệt độ sôi, có sự chuyển từ thể lỏng sang thể khí.","Nhiệt hoá hơi riêng tỉ lệ nghịch với khối lượng chất lỏng đã biến thành hơi.","Đơn vị của nhiệt hoá hơi riêng là J/kg."],"optionsRaw":["Trong quá trình sôi, nhiệt độ của chất lỏng không đổi.","Tại nhiệt độ sôi, có sự chuyển từ thể lỏng sang thể khí.","Nhiệt hoá hơi riêng tỉ lệ nghịch với khối lượng chất lỏng đã biến thành hơi.","Đơn vị của nhiệt hoá hơi riêng là J/kg."],"correctIndex":2,"correctAnswer":"Nhiệt hoá hơi riêng tỉ lệ nghịch với khối lượng chất lỏng đã biến thành hơi.","subQuestions":[],"solutionHtml":"Nhiệt hóa hơi riêng $L$ chỉ phụ thuộc vào bản chất của chất lỏng và nhiệt độ (áp suất), không phụ thuộc vào khối lượng chất lỏng.","rawSolution":"Nhiệt hóa hơi riêng $L$ chỉ phụ thuộc vào bản chất của chất lỏng và nhiệt độ (áp suất), không phụ thuộc vào khối lượng chất lỏng."}]},{"blockId":"single_19b89c57-32a0-4e08-a9ff-36cc9365fb7e_12","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"19b89c57-32a0-4e08-a9ff-36cc9365fb7e","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Phát biểu nào sau đây là đúng khi nói về cấu trúc của chất lỏng?","rawText":"Phát biểu nào sau đây là đúng khi nói về cấu trúc của chất lỏng?","ownImageUrl":"","optionsHtml":["Trong chất lỏng các phân tử chuyển động hỗn loạn về mọi phía chiếm không gian bình chứa.","Trong chất lỏng các phân tử dao động quanh vị trí cân bằng có thể dịch chuyển.","Trong chất lỏng các phân tử rất xa nhau và lực tương tác phân tử rất yếu.","Trong chất lỏng các phân tử sắp xếp có trật tự và dao động quanh vị trí cân bằng xác định."],"optionsRaw":["Trong chất lỏng các phân tử chuyển động hỗn loạn về mọi phía chiếm không gian bình chứa.","Trong chất lỏng các phân tử dao động quanh vị trí cân bằng có thể dịch chuyển.","Trong chất lỏng các phân tử rất xa nhau và lực tương tác phân tử rất yếu.","Trong chất lỏng các phân tử sắp xếp có trật tự và dao động quanh vị trí cân bằng xác định."],"correctIndex":1,"correctAnswer":"Trong chất lỏng các phân tử dao động quanh vị trí cân bằng có thể dịch chuyển.","subQuestions":[],"solutionHtml":"Ở thể lỏng, các phân tử ở gần nhau, dao động quanh các vị trí cân bằng luôn luôn thay đổi (dịch chuyển được).","rawSolution":"Ở thể lỏng, các phân tử ở gần nhau, dao động quanh các vị trí cân bằng luôn luôn thay đổi (dịch chuyển được)."}]},{"blockId":"single_417a1c5d-1c30-4f0f-8e29-e9e90432c7db_13","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"417a1c5d-1c30-4f0f-8e29-e9e90432c7db","type":"mcq","level":"H","chapterName":"ltđh 2027","points":0.25,"textHtml":"Đồ thị nào sau đây biểu diễn mối quan hệ giữa khối lượng nước còn lại trong bình nhiệt lượng kế và thời gian của quá trình hoá hơi của nước?","rawText":"Đồ thị nào sau đây biểu diễn mối quan hệ giữa khối lượng nước còn lại trong bình nhiệt lượng kế và thời gian của quá trình hoá hơi của nước?","ownImageUrl":"https://buelyuxsztnhrwinrldp.supabase.co/storage/v1/object/public/quiz-images/719d0dba-7e3c-462b-958a-bb0146835adc.png","optionsHtml":["Đồ thị (1).","Đồ thị (4).","Đồ thị (2).","Đồ thị (3)."],"optionsRaw":["Đồ thị (1).","Đồ thị (4).","Đồ thị (2).","Đồ thị (3)."],"correctIndex":3,"correctAnswer":"Đồ thị (3).","subQuestions":[],"solutionHtml":"Trong quá trình hóa hơi đều đặn, khối lượng nước bay hơi tỉ lệ thuận với thời gian $\\Delta m = \\frac{P}{L}\\tau$, nên khối lượng nước còn lại $m = m_0 - \\frac{P}{L}\\tau$ giảm tuyến tính theo thời gian (đồ thị 3).","rawSolution":"Trong quá trình hóa hơi đều đặn, khối lượng nước bay hơi tỉ lệ thuận với thời gian $\\Delta m = \\frac{P}{L}\\tau$, nên khối lượng nước còn lại $m = m_0 - \\frac{P}{L}\\tau$ giảm tuyến tính theo thời gian (đồ thị 3)."}]},{"blockId":"single_56e1bf84-5b8d-43d1-9a28-013b9fa7bd20_14","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"56e1bf84-5b8d-43d1-9a28-013b9fa7bd20","type":"mcq","level":"H","chapterName":"ltđh 2027","points":0.25,"textHtml":"Với cùng một chất, quá trình chuyển thể nào sẽ làm giảm lực tương tác giữa các phân tử nhiều nhất?","rawText":"Với cùng một chất, quá trình chuyển thể nào sẽ làm giảm lực tương tác giữa các phân tử nhiều nhất?","ownImageUrl":"","optionsHtml":["Đông đặc.","Nóng chảy.","Hóa hơi.","Thăng hoa."],"optionsRaw":["Đông đặc.","Nóng chảy.","Hóa hơi.","Thăng hoa."],"correctIndex":3,"correctAnswer":"Thăng hoa.","subQuestions":[],"solutionHtml":"Sự thăng hoa là quá trình chuyển trực tiếp từ thể rắn (lực tương tác rất mạnh) sang thể khí (lực tương tác rất yếu), do đó làm giảm lực tương tác giữa các phân tử nhiều nhất.","rawSolution":"Sự thăng hoa là quá trình chuyển trực tiếp từ thể rắn (lực tương tác rất mạnh) sang thể khí (lực tương tác rất yếu), do đó làm giảm lực tương tác giữa các phân tử nhiều nhất."}]},{"blockId":"single_deea72fd-2f38-4dcb-8059-9b894de568ba_15","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"deea72fd-2f38-4dcb-8059-9b894de568ba","type":"mcq","level":"H","chapterName":"ltđh 2027","points":0.25,"textHtml":"Vào những ngày mùa đông lạnh, một học sinh thực hiện việc xoa nhanh hai lòng bàn tay vào nhau trong một khoảng thời gian ngắn và cảm thấy tay ấm lên. Chọn kết luận đúng?","rawText":"Vào những ngày mùa đông lạnh, một học sinh thực hiện việc xoa nhanh hai lòng bàn tay vào nhau trong một khoảng thời gian ngắn và cảm thấy tay ấm lên. Chọn kết luận đúng?","ownImageUrl":"","optionsHtml":["Bàn tay đã nhận nhiệt lượng từ cơ thể và ấm lên.","Nội năng của bàn tay tăng lên do nhận công.","Khi áp lòng bàn tay vào mặt, có sự truyền nhiệt lượng từ mặt vào bàn tay.","Nội năng của bàn tay tăng lên do thực hiện công."],"optionsRaw":["Bàn tay đã nhận nhiệt lượng từ cơ thể và ấm lên.","Nội năng của bàn tay tăng lên do nhận công.","Khi áp lòng bàn tay vào mặt, có sự truyền nhiệt lượng từ mặt vào bàn tay.","Nội năng của bàn tay tăng lên do thực hiện công."],"correctIndex":3,"correctAnswer":"Nội năng của bàn tay tăng lên do thực hiện công.","subQuestions":[],"solutionHtml":"Việc xoa hai bàn tay vào nhau tạo ra lực ma sát; cơ thể thực hiện công thắng lực ma sát làm nội năng của da bàn tay tăng lên.","rawSolution":"Việc xoa hai bàn tay vào nhau tạo ra lực ma sát; cơ thể thực hiện công thắng lực ma sát làm nội năng của da bàn tay tăng lên."}]},{"blockId":"group_352e2d6b-ca2e-4045-9382-4e02f451a4e5_16","isSharedGroup":true,"contextHtml":"Một kĩ sư dùng bộ đun công suất $1200\\text{ W}$ để làm nóng $2{,}5\\text{ kg}$ một chất rắn Y từ nhiệt độ ban đầu $20^\\circ\\text{C}$. Đồ thị biểu diễn nhiệt độ theo thời gian cho thấy chất Y bắt đầu nóng chảy ở $110^\\circ\\text{C}$ và quá trình nóng chảy diễn ra trong khoảng thời gian từ phút thứ $4$ đến phút thứ $14$.  Bỏ qua sự thất thoát nhiệt.","sharedImageUrl":"https://buelyuxsztnhrwinrldp.supabase.co/storage/v1/object/public/quiz-images/b78bc8ce-f5c8-4996-b081-559384a4bc11.png","questions":[{"id":"352e2d6b-ca2e-4045-9382-4e02f451a4e5","type":"mcq","level":"B","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Nhiệt độ nóng chảy của chất Y là","rawText":"Nhiệt độ nóng chảy của chất Y là","ownImageUrl":"","optionsHtml":["$20^\\circ\\text{C}$.","$110^\\circ\\text{C}$.","$150^\\circ\\text{C}$.","$80^\\circ\\text{C}$."],"optionsRaw":["$20^\\circ\\text{C}$.","$110^\\circ\\text{C}$.","$150^\\circ\\text{C}$.","$80^\\circ\\text{C}$."],"correctIndex":1,"correctAnswer":"$110^\\circ\\text{C}$.","subQuestions":[],"solutionHtml":"Đoạn nằm ngang trên đồ thị ứng với nhiệt độ không đổi $110^\\circ\\text{C}$ là quá trình nóng chảy.","rawSolution":"Đoạn nằm ngang trên đồ thị ứng với nhiệt độ không đổi $110^\\circ\\text{C}$ là quá trình nóng chảy."},{"id":"8089450e-c021-4605-a8d0-1526d55af878","type":"mcq","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Nhiệt nóng chảy riêng của chất Y xấp xỉ bằng bao nhiêu?","rawText":"Nhiệt nóng chảy riêng của chất Y xấp xỉ bằng bao nhiêu?","ownImageUrl":"","optionsHtml":["$288\\text{ kJ/kg}$.","$144\\text{ kJ/kg}$.","$288\\text{ J/kg}$.","$720\\text{ kJ/kg}$."],"optionsRaw":["$288\\text{ kJ/kg}$.","$144\\text{ kJ/kg}$.","$288\\text{ J/kg}$.","$720\\text{ kJ/kg}$."],"correctIndex":0,"correctAnswer":"$288\\text{ kJ/kg}$.","subQuestions":[],"solutionHtml":"Thời gian nóng chảy $\\Delta t = 14 - 4 = 10\\text{ phút} = 600\\text{ s}$. Nhiệt lượng cung cấp $Q = P \\cdot \\Delta t = 1200 \\cdot 600 = 720000\\text{ J}$. Nhiệt nóng chảy riêng $\\lambda = \\frac{Q}{m} = \\frac{720000}{2{,}5} = 288000\\text{ J/kg} = 288\\text{ kJ/kg}$.","rawSolution":"Thời gian nóng chảy $\\Delta t = 14 - 4 = 10\\text{ phút} = 600\\text{ s}$. Nhiệt lượng cung cấp $Q = P \\cdot \\Delta t = 1200 \\cdot 600 = 720000\\text{ J}$. Nhiệt nóng chảy riêng $\\lambda = \\frac{Q}{m} = \\frac{720000}{2{,}5} = 288000\\text{ J/kg} = 288\\text{ kJ/kg}$."}]},{"blockId":"single_d98917c0-268e-4b7c-9830-a85ced538eed_18","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"d98917c0-268e-4b7c-9830-a85ced538eed","type":"group-tf","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":1,"textHtml":"Một học sinh tiến hành thí nghiệm xác định nhiệt nóng chảy riêng của nước đá với một nhiệt lượng kế có bộ phận nung công suất 25 W cùng với cân và cốc hứng nước chảy ra từ nhiệt lượng kế. Tiến hành như sau:<br>Bước 1: Cho lượng nước đá đang tan vào nhiệt lượng kế. Dùng cốc hứng nước chảy ra từ nhiệt lượng kế trong thời gian t = 5 phút thì thu được khối lượng nước trong cốc là m = 4 g.<br>Bước 2: Bật nguồn để bộ phận nung cấp nhiệt cũng trong thời gian t = 5 phút. Sau đó học sinh ghi nhận tổng lượng nước trong cốc là M = 31 g. Biết rằng sau khi hoàn tất thí nghiệm thì đá vẫn còn trong cốc.","rawText":"Một học sinh tiến hành thí nghiệm xác định nhiệt nóng chảy riêng của nước đá với một nhiệt lượng kế có bộ phận nung công suất 25 W cùng với cân và cốc hứng nước chảy ra từ nhiệt lượng kế. Tiến hành như sau:\nBước 1: Cho lượng nước đá đang tan vào nhiệt lượng kế. Dùng cốc hứng nước chảy ra từ nhiệt lượng kế trong thời gian t = 5 phút thì thu được khối lượng nước trong cốc là m = 4 g.\nBước 2: Bật nguồn để bộ phận nung cấp nhiệt cũng trong thời gian t = 5 phút. Sau đó học sinh ghi nhận tổng lượng nước trong cốc là M = 31 g. Biết rằng sau khi hoàn tất thí nghiệm thì đá vẫn còn trong cốc.","ownImageUrl":"https://buelyuxsztnhrwinrldp.supabase.co/storage/v1/object/public/quiz-images/bf886ce4-1612-422b-87a5-913f2d8db829.png","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"6e204406-993f-4f7a-8bae-d5354b6f0e62","level":"B","textHtml":"Do trao đổi nhiệt với môi trường, nhiệt độ của hệ tăng dần ở bước 1.","rawText":"Do trao đổi nhiệt với môi trường, nhiệt độ của hệ tăng dần ở bước 1.","correctAnswer":"False"},{"id":"d8febb74-15d1-4355-815a-a86bbe5ad36a","level":"H","textHtml":"Lượng nước tan chỉ do tác dụng của dây nung sau bước 2 là 27 g.","rawText":"Lượng nước tan chỉ do tác dụng của dây nung sau bước 2 là 27 g.","correctAnswer":"True"},{"id":"daa20978-666d-4c9b-90b9-7a1525353ee5","level":"H","textHtml":"Nhiệt nóng chảy riêng tính được gần bằng 326,1 J/g.","rawText":"Nhiệt nóng chảy riêng tính được gần bằng 326,1 J/g.","correctAnswer":"True"},{"id":"8a6022b9-25b0-47a3-af23-5420d54c05f3","level":"VD","textHtml":"Nếu tiếp tục đun 2 phút nữa, lượng nước trong cốc sẽ là $m&#39; = 36$ g.","rawText":"Nếu tiếp tục đun 2 phút nữa, lượng nước trong cốc sẽ là $m' = 36$ g.","correctAnswer":"False"}],"solutionHtml":"Đá tan do môi trường : $P_{mt}.t = m1.\\lambda$<br><br>Đá tan do dây nung : $P.t = m2.\\lambda$ <br><br>a) Sai: Trong quá trình chuyển thể (đá tan), nhiệt độ của hệ được giữ cố định ở $0^\\circ$ C.<br>b) Đúng: $m_{nung} = M - m_1-m_1 = 31 - 4 - 4 = 23$ g.<br>c) Sai: $\\lambda = \\frac{P \\cdot t}{m_{nung}} = \\frac{25 \\cdot 300}{23} \\approx 326,1$ J/g.<br><br>d) Sai:  m1 sau 2 phút : $m_1&#39;=m_1.2/5=8/5g, m_2 = 2/5. 23=46/5$ <br><br> Sau 2 phút đun thêm, tổng lượng nước thu được là $31 + 54/5 = 41,8$ g.","rawSolution":"Đá tan do môi trường : $P_{mt}.t = m1.\\lambda$<br>\nĐá tan do dây nung : $P.t = m2.\\lambda$ <br>\na) Sai: Trong quá trình chuyển thể (đá tan), nhiệt độ của hệ được giữ cố định ở $0^\\circ$ C.<br>b) Đúng: $m_{nung} = M - m_1-m_1 = 31 - 4 - 4 = 23$ g.<br>c) Sai: $\\lambda = \\frac{P \\cdot t}{m_{nung}} = \\frac{25 \\cdot 300}{23} \\approx 326,1$ J/g.<br>\nd) Sai:  m1 sau 2 phút : $m_1'=m_1.2/5=8/5g, m_2 = 2/5. 23=46/5$ <br>\n Sau 2 phút đun thêm, tổng lượng nước thu được là $31 + 54/5 = 41,8$ g."}]},{"blockId":"single_dc675794-77b1-4ae5-8ae9-9374e2e83d11_19","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"dc675794-77b1-4ae5-8ae9-9374e2e83d11","type":"group-tf","level":"VD","chapterName":"chương 2: vật lý chất khí","points":1,"textHtml":"Cho lượng khí lý tưởng trong xi lanh nằm ngang. Pít-tông nhẹ đường kính $6$ cm, $F_{ms} = 35$ N, $p_0 = 101325$ Pa. Dãn nở đẩy pít-tông ra $30$ cm rồi dừng, sau đó nguội bớt làm pít-tông co vào $25$ cm rồi dừng.","rawText":"Cho lượng khí lý tưởng trong xi lanh nằm ngang. Pít-tông nhẹ đường kính $6$ cm, $F_{ms} = 35$ N, $p_0 = 101325$ Pa. Dãn nở đẩy pít-tông ra $30$ cm rồi dừng, sau đó nguội bớt làm pít-tông co vào $25$ cm rồi dừng.","ownImageUrl":"https://buelyuxsztnhrwinrldp.supabase.co/storage/v1/object/public/quiz-images/feee1d5f-a82a-4ace-88ba-f44be3e156eb.png","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"4985e9e4-0075-43e7-a1f1-9cd04bf41bc1","level":"H","textHtml":"Áp suất khí trong xi lanh khi pít tông bắt đầu chuyển động là khoảng 117760 Pa.","rawText":"Áp suất khí trong xi lanh khi pít tông bắt đầu chuyển động là khoảng 117760 Pa.","correctAnswer":"False"},{"id":"63a46b63-f6fd-47c1-8b4c-e633008e7103","level":"H","textHtml":"Công mà khối khí thực hiện trong quá trình dãn nở xấp xỉ 96 J.","rawText":"Công mà khối khí thực hiện trong quá trình dãn nở xấp xỉ 96 J.","correctAnswer":"True"},{"id":"b8897468-a3e7-4e0b-a8ed-07d9ec855ef1","level":"H","textHtml":"Áp suất khí bên trong xi lanh khi pít tông bắt đầu chuyển động vào trong là khoảng 88770 Pa.","rawText":"Áp suất khí bên trong xi lanh khi pít tông bắt đầu chuyển động vào trong là khoảng 88770 Pa.","correctAnswer":"False"},{"id":"a8e1ac1d-78fa-4d80-9069-43968f6d7852","level":"VD","textHtml":"Công mà khối khí nhận vào trong quá trình co lại xấp xỉ 62,8 J.","rawText":"Công mà khối khí nhận vào trong quá trình co lại xấp xỉ 62,8 J.","correctAnswer":"True"}],"solutionHtml":"a) Sai: $p_1 = p_0 + \\frac{F_{ms}}{S} \\approx 113705Pa$ <br>b) Đúng: $A_{dãn} =  (p_0 S + F_{ms})\\Delta x_1 \\approx 96,4 J \\approx 96 J.$<br>c) Sai: $p_2 = p_0 - \\frac{F_{ms}}{S} \\approx 88945$ Pa.<br>d) Đúng: $A_{co} = p_2 \\cdot S \\cdot \\Delta x_2 =(p_0+\\frac{F_{ms}}{S}).S.\\Delta x_2 \\approx 62,8J$","rawSolution":"a) Sai: $p_1 = p_0 + \\frac{F_{ms}}{S} \\approx 113705Pa$ \nb) Đúng: $A_{dãn} =  (p_0 S + F_{ms})\\Delta x_1 \\approx 96,4 J \\approx 96 J.$\nc) Sai: $p_2 = p_0 - \\frac{F_{ms}}{S} \\approx 88945$ Pa.\nd) Đúng: $A_{co} = p_2 \\cdot S \\cdot \\Delta x_2 =(p_0+\\frac{F_{ms}}{S}).S.\\Delta x_2 \\approx 62,8J$"}]},{"blockId":"single_e40fdb2c-6db1-4473-9468-b34f38b0e6ad_20","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"e40fdb2c-6db1-4473-9468-b34f38b0e6ad","type":"group-tf","level":"VD","chapterName":"chương 2: vật lý chất khí","points":1,"textHtml":"Một lượng khí lí tưởng chứa trong xilanh thẳng đứng kín phía dưới, đậy bằng pít-tông nhẹ khối lượng $m = 200$ g, diện tích $S = 10\\ {cm}^2$. Ban đầu chiều cao cột khí là $h_1 = 15$ cm ở nhiệt độ $27^\\circ C$ ($300$ K). Áp suất khí quyển là $p_0 = 10^5$ Pa. Lấy $g = 10 {m/s}^2$. Đun nóng từ từ khí trong xilanh lên đến $87^\\circ C$ .","rawText":"Một lượng khí lí tưởng chứa trong xilanh thẳng đứng kín phía dưới, đậy bằng pít-tông nhẹ khối lượng $m = 200$ g, diện tích $S = 10\\ {cm}^2$. Ban đầu chiều cao cột khí là $h_1 = 15$ cm ở nhiệt độ $27^\\circ C$ ($300$ K). Áp suất khí quyển là $p_0 = 10^5$ Pa. Lấy $g = 10 {m/s}^2$. Đun nóng từ từ khí trong xilanh lên đến $87^\\circ C$ .","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"28ef9262-54e7-4ad4-9b26-d3cb4d2c0d5d","level":"H","textHtml":"Áp suất của khối khí trong xilanh giữ không đổi và có giá trị bằng $102000$ Pa.","rawText":"Áp suất của khối khí trong xilanh giữ không đổi và có giá trị bằng $102000$ Pa.","correctAnswer":"True"},{"id":"8f00f1d5-0ce1-41d2-9c29-c8fda7f91909","level":"B","textHtml":"Quá trình biến đổi trạng thái của khối khí là quá trình đẳng áp.","rawText":"Quá trình biến đổi trạng thái của khối khí là quá trình đẳng áp.","correctAnswer":"True"},{"id":"60932c89-b79c-46ab-ba0e-5cd436a3d962","level":"VD","textHtml":"Chiều cao cột khí trong xilanh sau khi đun nóng là 18 cm.","rawText":"Chiều cao cột khí trong xilanh sau khi đun nóng là 18 cm.","correctAnswer":"True"},{"id":"99b00196-5193-4628-abb7-9ae008471d0b","level":"H","textHtml":"Đồ thị biểu diễn quá trình này trong hệ tọa độ p - V là đường thẳng song song với trục áp suất p.","rawText":"Đồ thị biểu diễn quá trình này trong hệ tọa độ p - V là đường thẳng song song với trục áp suất p.","correctAnswer":"False"}],"solutionHtml":"a) $p = p_0 + \\frac{mg}{S} = 10^5 + \\frac{0,2 \\times 10}{10^{-3}} = 102000$ Pa. <br>b) Pít-tông di chuyển tự do nên $p$ hằng số (đẳng áp). <br>c) Đẳng áp: $\\frac{V_1}{T_1} = \\frac{V_2}{T_2} \\Rightarrow \\frac{h_1}{T_1} = \\frac{h_2}{T_2} \\Rightarrow h_2 = 15 \\times \\frac{360}{300} = 18$ cm. <br>d) Trong hệ $(p,V)$, đường đẳng áp là đường thẳng vuông góc trục p (song song trục V).","rawSolution":"a) $p = p_0 + \\frac{mg}{S} = 10^5 + \\frac{0,2 \\times 10}{10^{-3}} = 102000$ Pa. \nb) Pít-tông di chuyển tự do nên $p$ hằng số (đẳng áp). \nc) Đẳng áp: $\\frac{V_1}{T_1} = \\frac{V_2}{T_2} \\Rightarrow \\frac{h_1}{T_1} = \\frac{h_2}{T_2} \\Rightarrow h_2 = 15 \\times \\frac{360}{300} = 18$ cm. \nd) Trong hệ $(p,V)$, đường đẳng áp là đường thẳng vuông góc trục p (song song trục V)."}]},{"blockId":"single_30f3740b-8a49-44e3-a07c-b275653d8578_21","isSharedGroup":false,"contextHtml":"","sharedImageUrl":"","questions":[{"id":"30f3740b-8a49-44e3-a07c-b275653d8578","type":"group-tf","level":"H","chapterName":"chương 2: vật lý chất khí","points":1,"textHtml":"Một khối khí Helium xem là lý tưởng đựng trong bình kín có thể tích 2 lít ở nhiệt độ $27^\\circ$ C. Áp suất trong bình là $10^5$ Pa. Sau đó người ta tăng nhiệt độ khối khí lên $127^\\circ$ C. Cho biết khối lượng mol của Helium là 4 g/mol. Cho biết công thức tính nội năng của khối khí lý tưởng trong trường hợp này là $U = \\frac{3}{2} nRT$, trong đó $n, T$ lần lượt là số mol và nhiệt độ tuyệt đối của khối khí.","rawText":"Một khối khí Helium xem là lý tưởng đựng trong bình kín có thể tích 2 lít ở nhiệt độ $27^\\circ$ C. Áp suất trong bình là $10^5$ Pa. Sau đó người ta tăng nhiệt độ khối khí lên $127^\\circ$ C. Cho biết khối lượng mol của Helium là 4 g/mol. Cho biết công thức tính nội năng của khối khí lý tưởng trong trường hợp này là $U = \\frac{3}{2} nRT$, trong đó $n, T$ lần lượt là số mol và nhiệt độ tuyệt đối của khối khí.","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"","subQuestions":[{"id":"2922acd2-4f2a-4fbc-a959-c8b5addd5c1b","level":"H","textHtml":"Giá trị căn bậc hai của trung bình của bình phương tốc độ của các nguyên tử ở trạng thái đầu là 1579 m/s.","rawText":"Giá trị căn bậc hai của trung bình của bình phương tốc độ của các nguyên tử ở trạng thái đầu là 1579 m/s.","correctAnswer":"False"},{"id":"d185a527-3ecc-4e09-8f23-3fb9ccb219bc","level":"H","textHtml":"Nội năng của khí ở đầu quá trình là 300 J.","rawText":"Nội năng của khí ở đầu quá trình là 300 J.","correctAnswer":"True"},{"id":"abb12e5b-2979-46d2-a714-2f0feffa3736","level":"H","textHtml":"Nội năng của khí ở cuối quá trình là 400 J.","rawText":"Nội năng của khí ở cuối quá trình là 400 J.","correctAnswer":"True"},{"id":"d3e09ce0-e2c8-436c-8001-b6a851d98f83","level":"H","textHtml":"Nhiệt lượng cung cấp để tăng nhiệt độ của khí là 80 J.","rawText":"Nhiệt lượng cung cấp để tăng nhiệt độ của khí là 80 J.","correctAnswer":"False"}],"solutionHtml":"- a) Sai. Vì tốc độ căn quân phương $v_{rms} = \\sqrt{\\frac{3RT}{M}} = 1367$ m/s.<br>- b) Đúng. Vì $U_1 = \\frac{3}{2} nRT_1 = \\frac{3}{2} p_1 V = 300$ J.<br>- c) Đúng. Vì $U_2 = \\frac{3}{2} nRT_2 = U_1 \\cdot \\frac{T_2}{T_1} = 400$ J.<br>- d) Sai. Vì bình kín là quá trình đẳng tích ($A = 0$), nhiệt lượng cung cấp $Q = \\Delta U = U_2 - U_1 = 100$ J.","rawSolution":"- a) Sai. Vì tốc độ căn quân phương $v_{rms} = \\sqrt{\\frac{3RT}{M}} = 1367$ m/s.\n- b) Đúng. Vì $U_1 = \\frac{3}{2} nRT_1 = \\frac{3}{2} p_1 V = 300$ J.\n- c) Đúng. Vì $U_2 = \\frac{3}{2} nRT_2 = U_1 \\cdot \\frac{T_2}{T_1} = 400$ J.\n- d) Sai. Vì bình kín là quá trình đẳng tích ($A = 0$), nhiệt lượng cung cấp $Q = \\Delta U = U_2 - U_1 = 100$ J."}]},{"blockId":"group_7088c124-7914-4ddd-94cb-4cdda7bc8bc0_22","isSharedGroup":true,"contextHtml":"Đưa một khối thép có khối lượng 10 kg và nhiệt độ $25^\\circ$ C vào trong một lò nung điện có công suất 5 kW và nung đến khi khối thép nóng chảy hoàn toàn. Cho nhiệt độ nóng chảy của thép là $1500^\\circ C$. Cho nhiệt dung riêng và nhiệt nóng chảy riêng của thép lần lượt là 460 J/(kg.K) và $2,5 \\cdot 10^5$ J/kg. Biết rằng 87% điện năng tiêu thụ của lò nung chuyển thành nhiệt năng làm nóng khối thép.","sharedImageUrl":"","questions":[{"id":"7088c124-7914-4ddd-94cb-4cdda7bc8bc0","type":"short","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Nhiệt lượng tối thiểu mà khối thép đã nhận vào là bao nhiêu kWh? Làm tròn kết quả đến chữ số hàng phần chục.","rawText":"Nhiệt lượng tối thiểu mà khối thép đã nhận vào là bao nhiêu kWh? Làm tròn kết quả đến chữ số hàng phần chục.","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"2.6","subQuestions":[],"solutionHtml":"- Nhiệt lượng khối thép nhận vào: <br>$Q = mc(t_2 - t_1) + m\\lambda = 9285000 J \\approx 2,6 kWh.$","rawSolution":"- Nhiệt lượng khối thép nhận vào: \n$Q = mc(t_2 - t_1) + m\\lambda = 9285000 J \\approx 2,6 kWh.$"},{"id":"ec2fbfbe-5429-4081-91fa-2ec177eaf2d0","type":"short","level":"VD","chapterName":"Chương 1: vật lý nhiệt","points":0.25,"textHtml":"Thời gian sử dụng lò nung tối thiểu là bao nhiêu phút? Làm tròn kết quả đến chữ số hàng đơn vị.","rawText":"Thời gian sử dụng lò nung tối thiểu là bao nhiêu phút? Làm tròn kết quả đến chữ số hàng đơn vị.","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"36","subQuestions":[],"solutionHtml":"- Thời gian sử dụng lò: $t = \\frac{Q}{H \\cdot P} = 2134,5 s \\approx 36$ phút.<br>- Đáp số: 36.","rawSolution":"- Thời gian sử dụng lò: $t = \\frac{Q}{H \\cdot P} = 2134,5 s \\approx 36$ phút.\n- Đáp số: 36."}]},{"blockId":"group_74bd9fb0-7b61-4ba3-8a9d-3e340ed2992c_24","isSharedGroup":true,"contextHtml":"Một chiếc lốp xe ô tô có thể tích xem như không đổi là 75 lít, được bơm căng không khí. Cho nhiệt độ môi trường bên ngoài là $27^\\circ$ C, áp suất khí quyển bằng 1 atm (101325 Pa), và khối lượng mol của không khí là 29 g/mol. Biết rằng, trước khi bơm thì áp suất và nhiệt độ lốp bằng áp suất và nhiệt độ của khí quyển. Ngay khi bơm xong, áp suất khí bên trong lốp xe cao hơn áp suất bên ngoài 2,4 atm và nhiệt độ khí cao hơn $13^\\circ$ C so với bên ngoài.","sharedImageUrl":"","questions":[{"id":"74bd9fb0-7b61-4ba3-8a9d-3e340ed2992c","type":"short","level":"VD","chapterName":"chương 2: vật lý chất khí","points":0.25,"textHtml":"Thể tích của không khí ngoài môi trường đã được sử dụng để bơm vào trong lốp xe là bao nhiêu lít? Làm tròn kết quả đến hàng đơn vị.","rawText":"Thể tích của không khí ngoài môi trường đã được sử dụng để bơm vào trong lốp xe là bao nhiêu lít? Làm tròn kết quả đến hàng đơn vị.","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"169","subQuestions":[],"solutionHtml":"Cách 1: <br>- Thể tích không khí môi trường được bơm vào: $V_{ngoài} = V \\left(\\frac{p_2 T_1}{p_1 T_2} - 1\\right) = 75 \\left(\\frac{3,4 \\cdot 300}{1 \\cdot 313} - 1\\right) \\approx 169$ lít.<br>Cách 2:<br>Số mol khí bên ngoài : $n_0 = \\frac{p_0.V_0}{RT_0}$<br>Số mol có sẵn ban đầu : $n_1=\\frac{p_0.V}{RT_0}$<br>Số mol lúc sau khi bơm : $n = \\frac{p.V}{RT}$<br>Ta có : $n = n_0+n_1 \\Rightarrow \\frac{pV}{T}=\\frac{p_0V_0+p_0V}{T_0} \\Rightarrow V_0 = 169$ lít","rawSolution":"Cách 1: \n- Thể tích không khí môi trường được bơm vào: $V_{ngoài} = V \\left(\\frac{p_2 T_1}{p_1 T_2} - 1\\right) = 75 \\left(\\frac{3,4 \\cdot 300}{1 \\cdot 313} - 1\\right) \\approx 169$ lít.\nCách 2:\nSố mol khí bên ngoài : $n_0 = \\frac{p_0.V_0}{RT_0}$\nSố mol có sẵn ban đầu : $n_1=\\frac{p_0.V}{RT_0}$\nSố mol lúc sau khi bơm : $n = \\frac{p.V}{RT}$\nTa có : $n = n_0+n_1 \\Rightarrow \\frac{pV}{T}=\\frac{p_0V_0+p_0V}{T_0} \\Rightarrow V_0 = 169$ lít"},{"id":"325e0447-14fc-47bd-a22b-5819fa0cabed","type":"short","level":"H","chapterName":"chương 2: vật lý chất khí","points":0.25,"textHtml":"Tổng khối lượng không khí bên trong lốp xe sau khi bơm là bao nhiêu gam? Làm tròn kết quả đến chữ số hàng đơn vị.","rawText":"Tổng khối lượng không khí bên trong lốp xe sau khi bơm là bao nhiêu gam? Làm tròn kết quả đến chữ số hàng đơn vị.","ownImageUrl":"","optionsHtml":[],"optionsRaw":[],"correctIndex":0,"correctAnswer":"288","subQuestions":[],"solutionHtml":"- Khối lượng khí trong lốp: <br>$m = \\frac{p_2 V}{R T_2} M = \\frac{344505 \\cdot 0,075}{8,314 \\cdot 313} \\cdot 29 \\approx 288$ g.","rawSolution":"- Khối lượng khí trong lốp: \n$m = \\frac{p_2 V}{R T_2} M = \\frac{344505 \\cdot 0,075}{8,314 \\cdot 313} \\cdot 29 \\approx 288$ g."}]},{"blockId":"group_590525cc-2182-4636-866c-4dde5f59535a_26","isSharedGroup":true,"contextHtml":"Hình bên dưới là sơ đồ bố trí thí nghiệm đo nhiệt dung riêng c của chất lỏng X.<br>Lần 1: Đổ 200 g chất lỏng X vào nhiệt lượng kế. Sau 42 s thì thấy nhiệt độ của chất lỏng X tăng thêm $5^0 C$. Ghi lại số liệu, sau đó đổ chất lỏng ra và để nhiệt lượng kế nguội về nhiệt độ ban đầu.<br>Lần 2: Tiến hành thí nghiệm tương tự với 250 g dầu có nhiệt dung riêng là 2026 J/(kg.K). Sau 50 s, nhiệt độ của dầu tăng thêm $10^0 C$.<br>Bỏ qua nhiệt lượng mà nhiệt lượng kế và đũa khuấy thu vào, đồng thời bỏ qua sự trao đổi nhiệt với môi trường. Trong suốt quá trình làm thí nghiệm, số chỉ của vôn kế v         var m = Math.floor(s / 60);
        var r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function isQuestionAnswered(q) {
        var ans = userAnswers[q.id];
        if (q.type === 'mcq') return typeof ans === 'number';
        if (q.type === 'short') return typeof ans === 'string' && ans.trim().length > 0;
        if (q.type === 'group-tf') {
          if (!ans || typeof ans !== 'object') return false;
          return q.subQuestions.some(function(sq) { return ans[sq.id] === 'True' || ans[sq.id] === 'False'; });
        }
        return false;
      }

      function updateProgress() {
        var done = flatQuestions.filter(isQuestionAnswered).length;
        document.getElementById('progressLabel').textContent = done + '/' + flatQuestions.length;
        document.getElementById('sidebarCount').textContent = 'Đã làm ' + done + '/' + flatQuestions.length;
        flatQuestions.forEach(function(q) {
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          if (!pBtn || submitted) return;
          pBtn.className = 'p-btn mono' + (isQuestionAnswered(q) ? ' done' : '');
        });
      }

      function buildQuestionEl(q) {
        var card = document.createElement('article');
        card.className = 'q-card';
        card.id = 'qcard_' + q.displayNumber;

        var header = document.createElement('div');
        header.className = 'q-header';
        var leftMeta = '<span class="q-num">Câu ' + q.displayNumber + '</span>';
        var tags = [q.level ? ('Mức ' + q.level) : '', q.points + ' đ', q.chapterName || ''].filter(Boolean).join(' · ');
        header.innerHTML = leftMeta + '<span id="qstatus_' + q.displayNumber + '" class="q-status">' + tags + '</span>';
        card.appendChild(header);

        var qTextEl = document.createElement('div');
        qTextEl.className = 'q-text';
        qTextEl.innerHTML = q.textHtml;
        card.appendChild(qTextEl);

        if (q.ownImageUrl) {
          var fig = document.createElement('div');
          fig.className = 'q-figure';
          var img = document.createElement('img');
          img.src = q.ownImageUrl;
          img.alt = 'Hình minh họa câu ' + q.displayNumber;
          fig.appendChild(img);
          card.appendChild(fig);
        }

        if (q.type === 'mcq') {
          var grid = document.createElement('div');
          grid.className = 'options-grid';
          q.optionsHtml.forEach(function(optHtml, optIdx) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.id = 'opt_' + q.id + '_' + optIdx;
            btn.innerHTML = '<span class="opt-letter mono">' + (LETTERS[optIdx] || optIdx + 1) + '</span><span style="flex:1;">' + optHtml + '</span>';
            btn.addEventListener('click', function() {
              if (submitted) return;
              userAnswers[q.id] = optIdx;
              q.optionsHtml.forEach(function(_, i2) {
                var el = document.getElementById('opt_' + q.id + '_' + i2);
                if (el) el.classList.toggle('selected', i2 === optIdx);
              });
              updateProgress();
            });
            grid.appendChild(btn);
          });
          card.appendChild(grid);
        } else if (q.type === 'group-tf') {
          var list = document.createElement('div');
          list.className = 'tf-list';
          q.subQuestions.forEach(function(sq, sIdx) {
            var row = document.createElement('div');
            row.className = 'tf-row';
            row.id = 'tfrow_' + sq.id;

            var txt = document.createElement('div');
            txt.className = 'tf-text';
            txt.innerHTML = '<strong>' + (TF_LABELS[sIdx] || (sIdx + 1)) + ')</strong> ' + sq.textHtml;
            row.appendChild(txt);

            var actions = document.createElement('div');
            actions.className = 'tf-actions';
            ['True', 'False'].forEach(function(val) {
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'tf-choice';
              b.id = 'tfbtn_' + sq.id + '_' + val;
              b.textContent = val === 'True' ? 'Đúng' : 'Sai';
              b.addEventListener('click', function() {
                if (submitted) return;
                if (!userAnswers[q.id] || typeof userAnswers[q.id] !== 'object') userAnswers[q.id] = {};
                userAnswers[q.id][sq.id] = val;
                var bt = document.getElementById('tfbtn_' + sq.id + '_True');
                var bf = document.getElementById('tfbtn_' + sq.id + '_False');
                if (bt) bt.classList.toggle('active', val === 'True');
                if (bf) bf.classList.toggle('active', val === 'False');
                updateProgress();
              });
              actions.appendChild(b);
            });
            row.appendChild(actions);
            list.appendChild(row);
          });
          card.appendChild(list);
        } else {
          var sBox = document.createElement('div');
          sBox.className = 'short-box';
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'short-input';
          inp.id = 'short_' + q.id;
          inp.placeholder = 'Nhập đáp số (vd: 2.6 hoặc 36)';
          inp.addEventListener('input', function() {
            if (submitted) return;
            userAnswers[q.id] = inp.value;
            updateProgress();
          });
          var fb = document.createElement('span');
          fb.id = 'shortfb_' + q.id;
          fb.className = 'short-feedback';
          sBox.appendChild(inp);
          sBox.appendChild(fb);
          card.appendChild(sBox);
        }

        if (q.solutionHtml) {
          var sol = document.createElement('div');
          sol.className = 'solution-box';
          sol.id = 'sol_' + q.id;
          sol.innerHTML = '<strong>Lời giải chi tiết:</strong><div style="margin-top:4px;">' + q.solutionHtml + '</div>';
          card.appendChild(sol);
        }

        return card;
      }

      function renderExam() {
        var root = document.getElementById('questionsRoot');
        var pal = document.getElementById('paletteRoot');
        root.innerHTML = '';
        pal.innerHTML = '';

        blocks.forEach(function(block) {
          if (block.contextHtml || block.sharedImageUrl) {
            var groupEl = document.createElement('section');
            groupEl.className = 'context-group';

            var head = document.createElement('div');
            head.className = 'context-header';
            var firstNum = block.questions[0].displayNumber;
            var lastNum = block.questions[block.questions.length - 1].displayNumber;
            var labelText = block.questions.length > 1
              ? 'Dữ liệu dùng chung cho Câu ' + firstNum + ' – Câu ' + lastNum
              : 'Dữ liệu đề bài (Câu ' + firstNum + ')';
            var html = '<div class="context-label">' + labelText + '</div>';
            if (block.contextHtml) {
              html += '<div class="context-body">' + block.contextHtml + '</div>';
            }
            head.innerHTML = html;
            if (block.sharedImageUrl) {
              var fig = document.createElement('div');
              fig.className = 'q-figure';
              var img = document.createElement('img');
              img.src = block.sharedImageUrl;
              img.alt = labelText;
              fig.appendChild(img);
              head.appendChild(fig);
            }
            groupEl.appendChild(head);

            var inner = document.createElement('div');
            inner.className = 'context-questions';
            block.questions.forEach(function(q) {
              inner.appendChild(buildQuestionEl(q));
            });
            groupEl.appendChild(inner);
            root.appendChild(groupEl);
          } else {
            block.questions.forEach(function(q) {
              root.appendChild(buildQuestionEl(q));
            });
          }
        });

        flatQuestions.forEach(function(q) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'p-btn mono';
          b.id = 'pbtn_' + q.displayNumber;
          b.textContent = String(q.displayNumber);
          b.addEventListener('click', function() {
            var target = document.getElementById('qcard_' + q.displayNumber);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          pal.appendChild(b);
        });

        updateProgress();
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }
      }

      function normalizeShort(val) {
        return String(val || '').trim().replace(/,/g, '.').replace(/\s+/g, '').toLowerCase();
      }

      function isShortMatch(userVal, expectedVal) {
        var u = normalizeShort(userVal);
        var e = normalizeShort(expectedVal);
        if (!u) return false;
        if (u === e) return true;
        var nu = parseFloat(u);
        var ne = parseFloat(e);
        if (!isNaN(nu) && !isNaN(ne) && String(nu) === u || !isNaN(nu) && !isNaN(ne)) {
          if (/^-?\d+(?:\.\d+)?$/.test(u) && /^-?\d+(?:\.\d+)?$/.test(e)) {
            return Math.abs(nu - ne) < 1e-6;
          }
        }
        return false;
      }

      function gradeAndSubmit(force) {
        if (submitted) return;
        var answered = flatQuestions.filter(isQuestionAnswered).length;
        if (!force && answered < flatQuestions.length) {
          document.getElementById('confirmMsg').textContent =
            'Bạn mới làm ' + answered + '/' + flatQuestions.length + ' câu. Bạn có chắc muốn nộp bài ngay?';
          document.getElementById('confirmBar').classList.add('visible');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        document.getElementById('confirmBar').classList.remove('visible');
        submitted = true;
        if (timerHandle) clearInterval(timerHandle);

        var totalScore = 0;
        var maxScore = EXAM.maxScore || 10;
        var correctQuestions = 0;
        var answerDetails = [];

        flatQuestions.forEach(function(q) {
          var qCorrect = false;
          var pBtn = document.getElementById('pbtn_' + q.displayNumber);
          var stEl = document.getElementById('qstatus_' + q.displayNumber);
          var solEl = document.getElementById('sol_' + q.id);
          if (solEl) solEl.classList.add('visible');

          if (q.type === 'mcq') {
            var chosen = typeof userAnswers[q.id] === 'number' ? userAnswers[q.id] : -1;
            qCorrect = chosen === q.correctIndex;
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            q.optionsHtml.forEach(function(_, i) {
              var ob = document.getElementById('opt_' + q.id + '_' + i);
              if (!ob) return;
              ob.disabled = true;
              ob.classList.remove('selected');
              if (i === q.correctIndex) ob.classList.add('correct');
              else if (i === chosen) ob.classList.add('wrong');
            });
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: q.optionsRaw,
              selectedIndex: chosen,
              correctIndex: q.correctIndex,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          } else if (q.type === 'group-tf') {
            var tfMap = (userAnswers[q.id] && typeof userAnswers[q.id] === 'object') ? userAnswers[q.id] : {};
            var rightSubs = 0;
            q.subQuestions.forEach(function(sq, sIdx) {
              var picked = tfMap[sq.id] || '';
              var subOk = picked === sq.correctAnswer;
              if (subOk) rightSubs++;
              var row = document.getElementById('tfrow_' + sq.id);
              if (row) row.classList.add(subOk ? 'ok' : 'bad');
              ['True', 'False'].forEach(function(v) {
                var btn = document.getElementById('tfbtn_' + sq.id + '_' + v);
                if (!btn) return;
                btn.disabled = true;
                if (v === sq.correctAnswer) btn.classList.add('right-ans');
              });
              answerDetails.push({
                orderIndex: answerDetails.length,
                questionText: 'Câu ' + q.displayNumber + (TF_LABELS[sIdx] || '') + ': ' + sq.rawText,
                options: ['Đúng', 'Sai'],
                selectedIndex: picked === 'True' ? 0 : (picked === 'False' ? 1 : -1),
                correctIndex: sq.correctAnswer === 'True' ? 0 : 1,
                isCorrect: subOk,
                explanation: sIdx === q.subQuestions.length - 1 ? q.rawSolution : ''
              });
            });
            var earnedRatio = 0;
            if (q.subQuestions.length === 4) {
              earnedRatio = rightSubs === 1 ? 0.1 : rightSubs === 2 ? 0.25 : rightSubs === 3 ? 0.5 : rightSubs === 4 ? 1 : 0;
            } else if (q.subQuestions.length > 0) {
              earnedRatio = rightSubs / q.subQuestions.length;
            }
            var earned = Math.round(q.points * earnedRatio * 100) / 100;
            totalScore += earned;
            qCorrect = rightSubs === q.subQuestions.length;
            if (qCorrect) correctQuestions++;
            if (stEl) {
              stEl.textContent = 'Đúng ' + rightSubs + '/' + q.subQuestions.length + ' ý (+' + earned + 'đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
          } else {
            var rawInput = document.getElementById('short_' + q.id);
            var typed = rawInput ? rawInput.value.trim() : '';
            if (rawInput) rawInput.disabled = true;
            qCorrect = isShortMatch(typed, q.correctAnswer);
            if (qCorrect) {
              totalScore += q.points;
              correctQuestions++;
            }
            var fbEl = document.getElementById('shortfb_' + q.id);
            if (fbEl) {
              fbEl.textContent = qCorrect
                ? ('Chính xác (+' + q.points + 'đ)')
                : ('Đáp án đúng: ' + q.correctAnswer);
              fbEl.style.color = qCorrect ? 'var(--ok)' : 'var(--bad)';
            }
            if (stEl) {
              stEl.textContent = qCorrect ? ('Đúng (+' + q.points + 'đ)') : 'Sai (0đ)';
              stEl.className = 'q-status ' + (qCorrect ? 'ok' : 'bad');
            }
            answerDetails.push({
              orderIndex: answerDetails.length,
              questionText: 'Câu ' + q.displayNumber + ': ' + q.rawText,
              options: ['Bài làm: ' + (typed || '(bỏ trống)'), 'Đáp án chuẩn: ' + q.correctAnswer],
              selectedIndex: qCorrect ? 1 : 0,
              correctIndex: 1,
              isCorrect: qCorrect,
              explanation: q.rawSolution
            });
          }

          if (pBtn) {
            pBtn.className = 'p-btn mono ' + (qCorrect ? 'ok' : 'bad');
          }
        });

        totalScore = Math.round(totalScore * 100) / 100;
        var pct = maxScore > 0 ? Math.round((totalScore / maxScore) * 1000) / 10 : 0;

        document.getElementById('scoreText').textContent = totalScore + ' / ' + maxScore + ' điểm';
        document.getElementById('correctText').textContent =
          'Đúng hoàn toàn ' + correctQuestions + ' / ' + flatQuestions.length + ' câu (' + pct + '%)';
        document.getElementById('resultScreen').classList.add('visible');
        document.getElementById('topSubmitBtn').style.display = 'none';
        document.getElementById('sideSubmitBtn').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(function() {});
        }

        if (typeof window.EduSyncSubmitScore === 'function') {
          window.EduSyncSubmitScore(totalScore, maxScore, correctQuestions, flatQuestions.length, answerDetails);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'QUIZ_RESULT',
            score: totalScore,
            maxScore: maxScore,
            correctCount: correctQuestions,
            totalQuestions: flatQuestions.length,
            answerDetails: answerDetails
          }, '*');
        }
      }

      document.getElementById('topSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('sideSubmitBtn').addEventListener('click', function() { gradeAndSubmit(false); });
      document.getElementById('confirmYesBtn').addEventListener('click', function() { gradeAndSubmit(true); });
      document.getElementById('confirmCancelBtn').addEventListener('click', function() {
        document.getElementById('confirmBar').classList.remove('visible');
      });

      function tickTimer() {
        if (submitted) return;
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var box = document.getElementById('timerBox');
        if (durationLimit > 0) {
          var rem = Math.max(0, durationLimit - elapsed);
          box.textContent = fmtTime(rem);
          box.classList.toggle('urgent', rem <= 60);
          if (rem <= 0) gradeAndSubmit(true);
        } else {
          box.textContent = fmtTime(elapsed);
        }
      }

      renderExam();
      tickTimer();
      timerHandle = setInterval(tickTimer, 1000);
    })();
  </script>
</body>
